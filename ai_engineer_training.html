оризонт прогноза, иначе признаки последнего дня train «просачиваются» в первый день test."},{"h":"Утечка из будущего — главный способ обмануть себя","p":"Утечка бывает трёх видов. Первая: признак, который в момент прогноза физически ещё не известен (фактическая дата оплаты при прогнозе просрочки). Вторая: агрегат, посчитанный по всей выборке до разбиения (среднее по клиенту за весь период, включая тест). Третья: цель, зашитая в признак косвенно (номер счёта, который выдаётся только оплаченным). Признак этой болезни всегда один — подозрительно высокое качество и важность у одного-двух признаков. Лечение: для каждого признака записать, в какой момент времени он становится известен, и считать агрегаты только по прошлому."},{"h":"Признаки для рядов: лаги, окна, календарь","p":"Базовый набор для прогноза по времени: лаги целевой переменной (значение неделю, месяц, год назад), скользящие агрегаты (среднее и дисперсия за 7 и 28 дней, посчитанные строго по прошлому), календарь (день недели, месяц, праздники, конец квартала) и внешние регрессоры. Для сезонности с несколькими периодами помогают гармоники Фурье. Если ряд короткий и один, классические SARIMA или ETS часто обыгрывают бустинг; бустинг выигрывает, когда рядов много и есть общие признаки между ними."},{"h":"Метрики прогноза и их ловушки","p":"MAE меряет среднюю ошибку в единицах величины и устойчива к выбросам. RMSE сильнее штрафует крупные промахи, поэтому подходит там, где большая ошибка дороже двух маленьких. MAPE интуитивна для бизнеса («ошиблись на 8%»), но взрывается около нуля и несимметрична: за перепрогноз штрафует иначе, чем за недопрогноз. sMAPE и WAPE решают часть проблем. Отдельно от метрики стоит бизнес-стоимость: если ошибка вниз означает простой склада, а вверх — списание, оптимизировать надо квантильную (pinball) функцию потерь, а не MAE."},{"h":"Важность признаков: чему можно верить","p":"Встроенная feature_importance по числу разбиений завышает вклад признаков с большим числом уникальных значений и ничего не говорит о направлении влияния. Пермутационная важность честнее: перемешал колонку, посмотрел просадку метрики на валидации. SHAP даёт вклад признака на каждом объекте и знак, и именно его показывают заказчику, когда нужно объяснить конкретное решение («отказали, потому что просрочка 40 дней и три возврата»). Ни одна из трёх не доказывает причинность."},{"h":"Интервал вместо точки","p":"Точечный прогноз «в октябре будет 1240 заявок» бесполезен для планирования: он не говорит, к чему готовиться в плохом случае. Интервальный прогноз даёт нижнюю и верхнюю границу с заявленной вероятностью, и решение принимается по границе, а не по середине. Обучают такому прогнозу квантильной функцией потерь, по одной модели на квантиль, либо берут разброс ошибок модели на валидации. Проверяется интервал покрытием: если заявлено восемьдесят процентов, то примерно восемь из десяти фактических значений обязаны попадать внутрь, иначе интервал декоративный."},{"h":"Иерархия рядов и согласование","p":"Прогноз по каждому филиалу и прогноз по компании считаются отдельно и не сходятся: сумма частей не равна целому. Так и должно быть, потому что модели независимы, но в отчёт такое отдавать нельзя. Согласование делается после прогноза: либо сверху вниз, разнося общий прогноз по долям, либо снизу вверх, суммируя частные, либо оптимальным пересчётом, который минимально двигает все уровни сразу. Выбор зависит от того, какой уровень точнее: обычно верхний, потому что шум частей взаимно гасится."},{"h":"Календарь, праздники и внешние регрессоры","p":"Большая часть объяснимой дисперсии в деловых рядах лежит в календаре: день недели, номер недели, конец месяца и квартала, праздники и переносы рабочих дней. Это дешёвые признаки, которые обязаны быть в бейзлайне. Внешние регрессоры (акции, тарифы, погода) добавляются следующим шагом и требуют осторожности: их значения на будущее тоже надо откуда-то взять, и прогноз регрессора становится частью прогноза. Признак, что регрессор подключён неправильно: качество на валидации отличное, а в проде исчезло вместе с фактическими значениями регрессора."},{"h":"Переобучение по расписанию и мониторинг дрейфа","p":"Модель на табличных данных стареет: меняется состав клиентов, тарифы, поведение. Решение принимается заранее в одном из двух видов: переобучать по календарю (раз в месяц, раз в квартал) или по сигналу, когда ошибка на свежих данных вышла за порог. Календарь проще и предсказуемее, сигнал экономнее и требует мониторинга. В обоих случаях новая модель сравнивается со старой на одном и том же свежем окне, и замена происходит, только если она выиграла."}],"practice":[{"t":"Бейзлайн раньше модели","d":"Прежде чем обучать что-либо, посчитай три наивных прогноза: последнее значение, среднее за 4 недели, значение год назад. Любая модель обязана обыграть лучший из них на той же схеме валидации. Половина проектов заканчивается на том, что не обыгрывает.","code":"naive = y.shift(1)\nseasonal = y.shift(52)\nmean4 = y.rolling(4).mean().shift(1)\nfor name, p in [('naive', naive), ('season', seasonal), ('mean4', mean4)]:\n    mask = p.notna()\n    print(name, float((y[mask] - p[mask]).abs().mean()))"},{"t":"Валидация вперёд по времени","d":"Собери TimeSeriesSplit с зазором и прогоняй в нём любую модель. Одна и та же модель на KFold и на TimeSeriesSplit даст разные числа: разрыв между ними — это и есть размер самообмана.","code":"from sklearn.model_selection import TimeSeriesSplit\nfrom catboost import CatBoostRegressor\ncv = TimeSeriesSplit(n_splits=5, gap=7)\nfor tr, te in cv.split(X):\n    m = CatBoostRegressor(verbose=0).fit(X.iloc[tr], y.iloc[tr])\n    print(float((y.iloc[te] - m.predict(X.iloc[te])).abs().mean()))"},{"t":"CatBoost с категориями без кодирования","d":"Отдай категориальные колонки как есть через cat_features и сравни с ручным one-hot и с target encoding, сделанным руками. Заодно увидишь, как ordered target statistics спасает от утечки, которую руками делают в первый же день.","code":"from catboost import CatBoostClassifier, Pool\ncat = ['contractor', 'doc_type', 'region']\ntrain = Pool(X_tr, y_tr, cat_features=cat)\nvalid = Pool(X_va, y_va, cat_features=cat)\nm = CatBoostClassifier(eval_metric='AUC', early_stopping_rounds=100, verbose=200)\nm.fit(train, eval_set=valid)"},{"t":"SHAP на одном объекте","d":"Возьми один спорный прогноз и покажи разложение по SHAP. Это то, что реально спрашивает заказчик: не «какая точность», а «почему вот этому клиенту отказали».","code":"import shap\nex = shap.TreeExplainer(m)\nsv = ex.shap_values(X_va)\nshap.force_plot(ex.expected_value, sv[0], X_va.iloc[0], matplotlib=True)"},{"t":"Покрытие интервального прогноза","d":"Заявлено восемьдесят процентов, значит восемь из десяти фактов должны попадать внутрь. Иначе интервал декоративный.","code":"inside = sum(lo <= y <= hi for y, lo, hi in zip(actual, lower, upper))\ncoverage = inside / len(actual)\nwidth = sum(hi - lo for lo, hi in zip(lower, upper)) / len(actual)\nprint(f'покрытие {coverage:.1%} при заявленных 80%')\nprint(f'средняя ширина интервала {width:.1f}')"},{"t":"Сравнить модель с наивным бейзлайном на одном окне","d":"Пока бустинг не обыграл «как в прошлом периоде» и скользящее среднее на том же окне, разговора о качестве нет.","code":"def naive_last(series, horizon):\n    return [series[-1]] * horizon\n\ndef naive_seasonal(series, horizon, period=7):\n    return [series[-period + i % period] for i in range(horizon)]\n\nfor name, forecast in [\n    ('как вчера ', naive_last(train, len(test))),\n    ('сезонный  ', naive_seasonal(train, len(test))),\n    ('бустинг   ', model.predict(X_test)),\n]:\n    print(name, 'WAPE', round(wape(test, forecast), 4))"}],"business":[{"t":"Прогноз спроса и закупок","d":"Розница и дистрибуция: прогноз продаж по SKU и точке на 1–8 недель. Деньги считаются не в MAE, а в списаниях просрочки и упущенных продажах, поэтому функция потерь почти всегда несимметричная. Типичный горизонт внедрения — от пилота на одной категории к раскатке по сети."},{"t":"Отток и удержание","d":"Телеком, подписки, B2B-сервисы: вероятность ухода клиента в следующем месяце. Модель отдаёт не «уйдёт/не уйдёт», а вероятность и порог, привязанный к стоимости удержания: скидка дешевле потери, значит порог смещается вниз."},{"t":"Скоринг и просрочка","d":"Финансы и B2B-отсрочка: вероятность просрочки по контрагенту. Здесь объяснимость — требование регулятора и внутреннего риск-комитета, поэтому бустинг плюс SHAP выигрывает у чёрного ящика, даже если тот на пункт точнее."},{"t":"Приоритизация очереди документов","d":"Твоя же область: модель предсказывает, какие входящие документы дадут оператору правку, и ставит их первыми на ручную проверку. Это задача ранжирования, а не классификации, и мерится она долей пойманных ошибок в первых N процентах очереди."}],"terms":[{"t":"Градиентный бустинг","d":"Ансамбль, где каждое следующее дерево обучается на антиградиенте функции потерь предыдущего ансамбля.","m":"Стандарт для табличных данных. Бейзлайн, который нейросеть обязана обыграть, а не наоборот."},{"t":"CatBoost","d":"Бустинг с упорядоченным кодированием категорий и симметричными деревьями.","m":"Категории отдаются через cat_features как есть. Быстрый инференс за счёт oblivious-деревьев."},{"t":"LightGBM","d":"Бустинг с ростом дерева по листьям (leaf-wise) и гистограммным разбиением признаков.","m":"Быстрее всех на больших выборках, но на маленьких переобучается: ограничивай num_leaves и min_data_in_leaf."},{"t":"XGBoost","d":"Бустинг с ростом по уровням, регуляризацией на структуру дерева и широчайшей экосистемой.","m":"Категории кодируешь сам. Часто выбирается за совместимость с уже существующей обвязкой."},{"t":"Target encoding","d":"Замена категории средним значением целевой переменной по этой категории.","m":"Прямой путь к утечке, если считать по всей выборке. CatBoost решает это упорядоченной схемой."},{"t":"TimeSeriesSplit / walk-forward","d":"Валидация, где обучение всегда на прошлом, а проверка на будущем, с последовательным сдвигом окна.","m":"Единственно допустимая схема, когда в данных есть время. Зазор gap равен горизонту прогноза."},{"t":"Лаги и скользящие агрегаты","d":"Признаки, построенные из прошлых значений ряда: значение k шагов назад, среднее и дисперсия за окно.","m":"Считать строго по прошлому. Окно, заглянувшее на шаг вперёд, даёт идеальную метрику и нулевую пользу."},{"t":"MAE / RMSE / MAPE / WAPE","d":"Метрики ошибки прогноза: средний модуль, корень из среднего квадрата, средняя относительная, взвешенная относительная.","m":"MAPE взрывается у нуля и несимметрична. Для бизнеса с разной ценой промаха вверх и вниз нужна pinball loss."},{"t":"Pinball loss (квантильная)","d":"Функция потерь, штрафующая недопрогноз и перепрогноз с разными весами, даёт прогноз квантиля, а не среднего.","m":"Прямой способ вшить в модель бизнес-асимметрию «простой дороже списания»."},{"t":"SHAP","d":"Разложение предсказания на вклады признаков с знаком, основанное на значениях Шепли.","m":"Язык разговора с заказчиком и риск-комитетом. Объясняет конкретное решение, а не модель вообще."},{"t":"Пермутационная важность","d":"Просадка метрики на валидации после случайного перемешивания одной колонки.","m":"Честнее встроенной importance. Считать на валидации, а не на train."},{"t":"Дрейф данных","d":"Изменение распределения признаков или связи признак–цель со временем.","m":"Модель, точная в марте, врёт в ноябре. Мониторинг распределений обязателен, переобучение по расписанию — норма."},{"t":"Интервальный прогноз","d":"Нижняя и верхняя граница с заявленной вероятностью вместо одного числа.","m":"Проверяется покрытием на валидации. Планируют по границе, а не по середине."},{"t":"Согласование иерархии","d":"Приведение прогнозов по уровням к согласованному виду: сумма частей равна целому.","m":"Сверху вниз, снизу вверх или оптимальным пересчётом. Обычно точнее верхний уровень."}],"pitfalls":["Случайный KFold на данных со временем. Качество на валидации завышено, в проде обвал.","Агрегаты, посчитанные по всему датасету до разбиения на train и test.","Признак, которого в момент прогноза ещё не существует. Проверка: «когда это поле заполняется в реальной системе?».","MAPE на данных, где цель бывает нулевой или близкой к нулю.","Сравнивать CatBoost и XGBoost на дефолтных гиперпараметрах и делать вывод «X лучше Y».","Показывать заказчику важность признаков как объяснение причин: важность не равна причинности."],"drill":"Возьми любой свой набор со временем (хотя бы даты документов и число правок оператора). Построй три наивных бейзлайна, затем CatBoost на лагах и календаре. Прогоняй всё в TimeSeriesSplit с gap. Вопрос, на который ты должен ответить: обыгрывает ли модель лучший наивный прогноз, и остаётся ли отрыв после бутстрепа по фолдам.","resources":[{"t":"Forecasting: Principles and Practice (Hyndman)","u":"https://otexts.com/fpp3/","k":"учебник","lang":"en","n":"Канон по прогнозированию рядов. Главы 5 и 7 закрывают бейзлайны и валидацию."},{"t":"CatBoost — документация","u":"https://catboost.ai/docs/","k":"документация","lang":"en/ru","n":"Раздел про categorical features объясняет ordered target statistics без формул."},{"t":"Machine Learning Bookcamp (Grigorev)","u":"https://www.manning.com/books/machine-learning-bookcamp","k":"книга","lang":"en","n":"Проектный вход в табличный ML: от постановки до деплоя."},{"t":"Designing Machine Learning Systems (Chip Huyen)","u":"https://www.oreilly.com/library/view/designing-machine-learning/9781098107956/","k":"книга","lang":"en","n":"Главы про data leakage и про дрейф — прямо про ошибки из этого блока."},{"t":"SHAP — документация","u":"https://shap.readthedocs.io/","k":"инструмент","lang":"en","n":"TreeExplainer на бустинге считается за секунды и даёт объяснение на объекте."},{"t":"Юрий Кашницкий — Лекция 10. Градиентный бустинг (mlcourse.ai, OpenDataScience)","u":"https://www.youtube.com/watch?v=ow5LdsjzfL0","k":"видео","lang":"ru","n":"Механика бустинга от функции потерь до практики. Базовая лекция блока."},{"t":"Computer Science Center — CatBoost, градиентный бустинг от Яндекса","u":"https://www.youtube.com/watch?v=UYDwhuyWYSo","k":"видео","lang":"ru","n":"Упорядоченное кодирование категорий и симметричные деревья от команды разработки."},{"t":"Young&&Yandex — Тренировки по ML, лекция 5: градиентный бустинг, тонкости обучения","u":"https://www.youtube.com/watch?v=DqUtGa99_H8","k":"видео","lang":"ru","n":"Практические тонкости: переобучение, ранняя остановка, параметры."},{"t":"statsforecast","u":"https://nixtla.github.io/statsforecast/","k":"инструмент","lang":"en","n":"Быстрые классические модели рядов, годятся как обязательный бейзлайн перед бустингом."}]},{"id":"R","title":"CV, OCR и мультимодальный RAG","level":"экспертный","lead":"Документ приходит картинкой, а отвечать надо текстом. Здесь три слоя: классическое зрение и OCR, чистка данных перед индексацией и мультимодальный поиск, где ищут не по распознанному тексту, а прямо по изображению страницы.","theory":[{"h":"Четыре разные задачи, которые называют «работой с CV»","p":"Классификация отвечает «что на картинке» (это счёт-фактура или доверенность), детекция — «где объект» (рамка вокруг печати), сегментация — «какие именно пиксели» (маска подписи), OCR — «какой здесь текст и где он лежит». Под каждую свой набор моделей, своя разметка и своя метрика: accuracy и F1 для классификации, mAP и IoU для детекции, CER и WER для распознавания текста. Смешивать их метрики нельзя, а начинающие смешивают постоянно."},{"h":"Tesseract: что это и где его потолок","p":"Tesseract — опенсорсный OCR-движок, начатый в HP, с 2006 года развиваемый Google, сейчас в сообществе. С четвёртой версии внутри LSTM-распознавание строк, языковые пакеты ставятся отдельно (rus, eng), режимы сегментации страницы задаются параметром --psm, а через конфиг можно получать не только текст, но и координаты слов с уверенностью (TSV-вывод). Сильные стороны: бесплатно, локально, без GPU, предсказуемо. Потолок: чувствителен к качеству скана, перекосу и шуму; таблицы и многоколоночную вёрстку разбирает плохо; рукописный текст не берёт. Практический вывод: Tesseract — отличный бейзлайн и отличный компонент для чистых машинных сканов, но на сложной вёрстке его обходят нейро-OCR (PaddleOCR, docTR, Surya) и VLM."},{"h":"Когда OCR, когда VLM, когда оба","p":"OCR даёт текст с координатами дёшево и офлайн, но не понимает смысла: «где здесь исходящий номер» он не отвечает. VLM понимает макет и отвечает на вопрос сразу, но стоит дороже, галлюцинирует отсутствующие поля и ограничен разрешением. Гибрид часто выигрывает: OCR даёт текстовый слой с координатами, VLM получает и картинку, и этот слой, а постпроцессор сверяет ответ модели с распознанными строками — если значения нет в OCR-слое, оно помечается как подозрительное. Этот сверочный контур ловит ровно тот класс ошибок, где модель выдумывает правдоподобный номер."},{"h":"Предобработка, которая реально меняет метрику","p":"Порядок дешёвых операций: коррекция перекоса (deskew) по преобразованию Хафа, удаление фона и бинаризация (адаптивная или Оцу), удаление точечного шума, при необходимости — удаление линий таблиц перед распознаванием текста. Важное правило: каждая операция должна проверяться замером CER на выборке, а не глазом. Бинаризация, которая «выглядит чище», регулярно роняет качество на бледной печати. И dpi: ниже 200–300 dpi мелкий шрифт схлопывается, выше — растёт цена без выигрыша."},{"h":"Зачем чистить данные перед RAG","p":"В RAG качество ответа ограничено сверху качеством корпуса. Мусор, который убивает поиск: колонтитулы и штампы, повторяющиеся на каждой странице (они дают ложную близость всем запросам), дубликаты и почти-дубликаты документов, OCR-артефакты («0» вместо «О»), разорванные переносами слова, служебные таблицы содержания, пустые и почти пустые чанки. Минимальный конвейер чистки: нормализация юникода (NFKC), склейка переносов, удаление повторяющихся блоков по частоте, дедупликация по MinHash или по косинусу, отбраковка чанков короче порога. Библиотеки: unstructured и Docling для разбора документов, ftfy для битой кодировки, datasketch для MinHash-дедупликации, trafilatura для веб-страниц."},{"h":"Чанкинг по структуре, а не по 512 символов","p":"Нарезка фиксированной длиной рвёт таблицы и списки посередине и склеивает несвязанные разделы. Лучше резать по структуре документа: заголовок и его абзацы — один чанк, таблица — отдельный чанк целиком, к каждому чанку приписывается путь (документ → раздел → подраздел) и метаданные (тип документа, дата, контрагент). Это даёт две вещи сразу: связный текст для эмбеддера и фильтры для поиска. Перекрытие чанков в 10–15% помогает не терять фразу на границе, но не лечит плохие границы."},{"h":"Почему поиск гибридный и почему мультимодальный","p":"Гибридный — потому что у векторов и у лексики разные слепые зоны: dense-эмбеддинг размывает точные строки (номер договора, артикул, редкая фамилия), BM25 не понимает перефразировок. Слияние двух ранжирований через RRF даёт выигрыш без подбора весов, а cross-encoder переранжирует top-50. Мультимодальный — потому что в документе значение несёт макет: подпись внизу справа, печать поверх текста, сумма в последней строке таблицы. Если индексировать только распознанный текст, эта информация теряется до поиска. Подходы: CLIP и SigLIP для картинок и подписей, ColPali и ColQwen — retrieval прямо по изображению страницы (модель кодирует патчи страницы и сопоставляет их с токенами запроса late-interaction, как ColBERT), и просто «страница как картинка» в VLM на этапе ответа."},{"h":"Метрики: отдельно поиск, отдельно распознавание, отдельно ответ","p":"У OCR — CER и WER (доля ошибочных символов и слов), плюс точность по полям, если задача извлечения. У ретривера — recall@k, MRR, NDCG. У генератора поверх найденного — faithfulness (не выдумал ли сверх контекста) и correctness относительно эталона. Складывать их в одно «качество системы» нельзя: если recall@5 = 0.7, потолок всей системы — 0.7, и никакой промпт его не поднимет."},{"h":"Разделение пачки на документы","p":"Сканер отдаёт один файл на сто страниц, внутри которого двенадцать документов. Пока пачка не разрезана, любое извлечение реквизитов бессмысленно. Сигналы для разреза: штрихкод или QR на первой странице, смена шаблона шапки, номер страницы, начинающийся заново, пустая разделительная страница, резкая смена структуры текста. Задача решается классификацией каждой страницы на «начало документа» и «продолжение», и мерить её надо отдельной метрикой, потому что ошибка здесь портит все последующие шаги разом."},{"h":"Печати, подписи и рукопись","p":"Три вещи, на которых качество распознавания падает сильнее всего. Печать накладывается на текст и ломает и бинаризацию, и распознавание под собой. Подпись не читается в принципе, и полезный ответ здесь это факт наличия, а не расшифровка. Рукописные пометки требуют отдельной модели и почти никогда не окупаются на потоке деловых документов. Честная постановка звучит так: обнаружить и локализовать, а не прочитать, и передать оператору с подсветкой."},{"h":"Сборка результата по страницам","p":"Реквизит найден на второй и на седьмой странице с разными значениями, и нужно правило разрешения. Работающий порядок: приоритет по месту (шапка первой страницы важнее упоминания в теле), приоритет по типу совпадения (значение рядом с ожидаемым заголовком важнее одиночного), и явный флаг конфликта, когда правило не сработало. Конфликты нельзя прятать: документ с флагом уходит оператору, а доля таких документов становится отдельной метрикой качества сборки."},{"h":"Якоря страницы: штрихкоды и реквизиты бланка","p":"Штрихкод, QR и номер формы распознаются почти безошибочно и дёшево, поэтому используются как якоря: они дают тип документа, иногда идентификатор в учётной системе и точку отсчёта для координат. Найденный якорь резко сужает задачу: по типу бланка известно, где лежит каждый реквизит, и извлечение превращается в чтение конкретных зон. Практика: сначала искать якоря, потом решать, нужна ли модель вообще, и только потом отправлять страницу целиком."}],"practice":[{"t":"Tesseract с координатами и уверенностью","d":"Получи не просто текст, а таблицу слов с боксами и conf. На ней сразу строится проверка: попадает ли значение, которое выдала LLM, хоть в одно распознанное слово страницы.","code":"import pytesseract\nfrom PIL import Image\ndf = pytesseract.image_to_data(Image.open('page.png'), lang='rus+eng',\n                               config='--psm 6', output_type=pytesseract.Output.DATAFRAME)\ndf = df[df.conf > 40][['text', 'left', 'top', 'width', 'height', 'conf']]\nprint(df.head(20))"},{"t":"Deskew и бинаризация с замером CER","d":"Собери 30 страниц с эталонным текстом. Прогони OCR в четырёх вариантах: как есть, deskew, deskew+Оцу, deskew+адаптивная. Считай CER. Оставляй тот вариант, который выиграл по числу, а не тот, который красивее выглядит.","code":"import cv2, numpy as np\nimg = cv2.imread('page.png', cv2.IMREAD_GRAYSCALE)\ncoords = np.column_stack(np.where(img < 200))\nangle = cv2.minAreaRect(coords)[-1]\nangle = -(90 + angle) if angle < -45 else -angle\nM = cv2.getRotationMatrix2D((img.shape[1] // 2, img.shape[0] // 2), angle, 1.0)\nrot = cv2.warpAffine(img, M, img.shape[::-1], flags=cv2.INTER_CUBIC, borderValue=255)\nbin_ = cv2.adaptiveThreshold(rot, 255, cv2.ADAPTIVE_THRESH_GAUSSIAN_C, cv2.THRESH_BINARY, 31, 15)"},{"t":"Чистка корпуса перед индексацией","d":"Прогони корпус через нормализацию, склейку переносов и дедупликацию. Посчитай, сколько чанков отвалилось и как изменился recall@5 до и после. Это самый дешёвый прирост качества в RAG.","code":"import re, unicodedata\nfrom datasketch import MinHash, MinHashLSH\n\ndef clean(t):\n    t = unicodedata.normalize('NFKC', t)\n    t = re.sub(r'(\\w)-\\n(\\w)', r'\\1\\2', t)\n    t = re.sub(r'[ \\t]+', ' ', t)\n    return t.strip()\n\nlsh = MinHashLSH(threshold=0.9, num_perm=64)\nfor i, t in enumerate(map(clean, texts)):\n    m = MinHash(num_perm=64)\n    for w in set(t.split()):\n        m.update(w.encode())\n    if not lsh.query(m):\n        lsh.insert(str(i), m)"},{"t":"Сквозной мультимодальный RAG по документам: шесть шагов","d":"Пайплайн целиком, от PDF до ответа с цитатой. Каждый шаг даёт артефакт, который можно посмотреть глазами: страницы-картинки, элементы структуры, чанки с метаданными, индексы, выдача, ответ. Собирается за день, дальше улучшается по замерам, а не по ощущениям.","code":"# 1. PDF -> страницы-картинки (для VLM и для page-retrieval)\nfrom pdf2image import convert_from_path\npages = convert_from_path('doc.pdf', dpi=200)\n\n# 2. PDF -> структура (заголовки, абзацы, таблицы с координатами)\nfrom docling.document_converter import DocumentConverter\nstruct = DocumentConverter().convert('doc.pdf').document\n\n# 3. Структура -> чанки с путём и метаданными\nchunks = []\nfor el in struct.texts + struct.tables:\n    chunks.append({\n        'text': clean(el.text if hasattr(el, 'text') else el.export_to_markdown()),\n        'kind': type(el).__name__,\n        'page': el.prov[0].page_no if el.prov else None,\n        'path': ' / '.join(el.get_ancestors_titles()) if hasattr(el, 'get_ancestors_titles') else '',\n        'doc_id': 'doc.pdf',\n    })\nchunks = [c for c in chunks if len(c['text']) > 40]\n\n# 4. Два индекса: лексический и векторный\nfrom rank_bm25 import BM25Okapi\nfrom sentence_transformers import SentenceTransformer\nbm25 = BM25Okapi([c['text'].lower().split() for c in chunks])\nemb = SentenceTransformer('intfloat/multilingual-e5-large')\nV = emb.encode(['passage: ' + c['text'] for c in chunks], normalize_embeddings=True)\n\n# 5. Гибридная выдача -> RRF -> переранжирование\nimport numpy as np\n\ndef search(q, k=5):\n    lex = np.argsort(bm25.get_scores(q.lower().split()))[::-1][:50]\n    den = np.argsort(emb.encode(['query: ' + q], normalize_embeddings=True) @ V.T)[0][::-1][:50]\n    fused = rrf([list(lex), list(den)])[:k]\n    return [chunks[i] for i in fused]\n\n# 6. Ответ с цитатой: страница-картинка нужного места + текст чанков\nhits = search('срок оплаты по договору')\nanswer = vlm(\n    prompt=ANSWER_PROMPT,\n    images=[pages[h['page'] - 1] for h in hits if h['page']],\n    context=[{'id': i, 'text': h['text'], 'page': h['page']} for i, h in enumerate(hits)],\n)"},{"t":"Что мерить на каждом шаге пайплайна","d":"Отдельная метрика на каждый шаг, иначе непонятно, что чинить. Разбор структуры: доля таблиц, распознанных целиком. Чанкинг: доля чанков, разорвавших таблицу или список. Поиск: recall@5 и recall@20. Переранжирование: прирост recall@5 на том же кандидатном списке. Ответ: faithfulness и доля ответов с корректной ссылкой на страницу.","code":"report = {\n    'tables_whole': whole_tables / total_tables,\n    'chunks_broken': broken_chunks / len(chunks),\n    'recall@5': mean(gold_id in [h['id'] for h in search(q, 5)] for q, gold_id in qa),\n    'recall@20': mean(gold_id in [h['id'] for h in search(q, 20)] for q, gold_id in qa),\n    'cited_page_ok': mean(cited_page(a) == gold_page[q] for q, a in answers.items()),\n}\nprint(report)"},{"t":"Гибридный поиск с RRF","d":"Собери два ранжирования — BM25 и косинус по эмбеддингам, и слей их формулой RRF. Замерь recall@5 у каждого по отдельности и у слияния. Три числа в таблице закрывают вопрос «зачем нам гибрид».","code":"def rrf(rankings, k=60):\n    score = {}\n    for r in rankings:\n        for pos, doc in enumerate(r):\n            score[doc] = score.get(doc, 0) + 1 / (k + pos + 1)\n    return sorted(score, key=score.get, reverse=True)\n\ntop = rrf([bm25_ids, dense_ids])[:5]"},{"t":"Разрез пачки по сигналам первой страницы","d":"Метрика считается отдельно: ошибка разреза портит все последующие шаги разом.","code":"def is_first_page(page):\n    return any([\n        has_barcode(page),\n        header_matches_template(page),\n        page_number_text(page) == 1,\n        is_separator(page),\n    ])\n\nboundaries = [i for i, p in enumerate(pages) if is_first_page(p)]\ndocs = [pages[a:b] for a, b in zip(boundaries, boundaries[1:] + [len(pages)])]\nprint('страниц', len(pages), '-> документов', len(docs))"}],"business":[{"t":"Архив документов и юридически значимый поиск","d":"Банки, страховые, крупные подрядчики: миллионы сканов договоров и актов. Ценность не в распознавании как таковом, а в том, что юрист находит нужное приложение за минуту вместо часа. Метрика внедрения — время поиска и доля запросов, закрытых без обращения в архив."},{"t":"Проверка первичных документов","d":"Бухгалтерия и закупки: сверка позиций в накладной со счётом и договором. Здесь мультимодальность обязательна: цифра значит одно в строке «итого» и другое в строке «в том числе НДС», а различает их макет."},{"t":"Промышленный контроль качества","d":"Производство: детекция дефектов на фото узла, сегментация области брака. Задача обычно сильно несбалансированная — брака доли процента, поэтому accuracy бесполезна, а работают recall при фиксированном уровне ложных срабатываний и стоимость пропуска."},{"t":"Медицинские и технические PDF с графикой","d":"Инструкции, паспорта оборудования, схемы: ответ часто лежит на чертеже, а не в тексте. Индексация страниц как изображений (ColPali-подход) даёт то, чего не даёт OCR-текст, — поиск по содержанию иллюстрации."}],"terms":[{"t":"Tesseract","d":"Опенсорсный OCR-движок с LSTM-распознаванием строк, языковыми пакетами и режимами сегментации страницы (--psm).","m":"Бесплатный локальный бейзлайн. Даёт слова с координатами и уверенностью — это готовый контур сверки для ответов LLM."},{"t":"CER / WER","d":"Доля ошибочных символов и слов относительно эталона, считается через расстояние Левенштейна.","m":"Единственный честный способ сравнить два варианта предобработки. Глаз здесь систематически врёт."},{"t":"psm (page segmentation mode)","d":"Режим Tesseract, задающий, как трактовать макет: страница, блок, строка, одно слово.","m":"--psm 6 (единый блок текста) и --psm 7 (одна строка) закрывают большинство случаев с полями."},{"t":"Deskew","d":"Коррекция перекоса страницы поворотом на найденный угол.","m":"Самая дешёвая операция с самым заметным эффектом на сканах с МФУ."},{"t":"IoU / mAP","d":"Метрики детекции: пересечение рамок к объединению и усреднённая по классам точность при разных порогах IoU.","m":"Метрика детекции, а не классификации. Путать их в отчёте — верный способ получить вопрос от ревьюера."},{"t":"CLIP / SigLIP","d":"Модели, кодирующие картинку и текст в одно пространство; SigLIP заменяет softmax-функцию потерь на сигмоидную, что упрощает обучение большими батчами.","m":"Дают поиск картинки по тексту. На плотных документах слабее специализированных документных моделей."},{"t":"ColPali / ColQwen","d":"Retrieval прямо по изображению страницы: страница кодируется патчами, запрос — токенами, сопоставление late-interaction в стиле ColBERT.","m":"Убирает OCR из контура поиска целиком. Цена — больший индекс: векторов на страницу много, а не один."},{"t":"RRF (reciprocal rank fusion)","d":"Слияние нескольких ранжирований по сумме 1/(k + позиция), без подбора весов между шкалами.","m":"Рабочий дефолт гибридного поиска: не требует калибровки разных по природе оценок."},{"t":"Дедупликация MinHash / LSH","d":"Приближённый поиск почти-дубликатов по сходству Жаккара через хеш-подписи.","m":"Дешевле попарного косинуса на больших корпусах. Первая операция чистки перед индексацией."},{"t":"Структурный чанкинг","d":"Нарезка по элементам документа (заголовок, абзац, таблица) с сохранением пути и метаданных.","m":"Даёт связный текст эмбеддеру и фильтры ретриверу. Фиксированные 512 символов рвут таблицы."},{"t":"Faithfulness","d":"Мера того, насколько ответ опирается только на поданный контекст и не добавляет отсебятины.","m":"Меряется отдельно от правильности: ответ бывает верным и при этом не выведенным из контекста."},{"t":"Unstructured / Docling","d":"Библиотеки разбора документов: PDF, docx, сканы — в элементы с типами и координатами.","m":"Дают структуру, на которой строится нормальный чанкинг вместо нарезки по длине."},{"t":"Разрез пачки","d":"Классификация страниц на начало документа и продолжение внутри одного скана.","m":"Меряется отдельной метрикой: ошибка разреза обесценивает всё, что считается дальше."},{"t":"Якорь страницы","d":"Штрихкод, QR или номер формы: распознаётся дёшево и задаёт тип документа и точку отсчёта координат.","m":"Найденный якорь превращает извлечение в чтение известных зон бланка."},{"t":"Флаг конфликта сборки","d":"Явная отметка, что реквизит найден в нескольких местах с разными значениями и правило не разрешило спор.","m":"Прятать нельзя. Доля документов с флагом это отдельная метрика качества сборки."}],"pitfalls":["Оценивать предобработку глазом вместо CER на выборке.","Индексировать распознанный текст с колонтитулами: повторяющийся блок притягивается к любому запросу.","Резать документ фиксированной длиной и удивляться, что таблицы отвечают неправильно.","Считать accuracy у детекции или mAP у классификации — метрики из разных задач.","Отдать VLM страницу в 100 dpi ради экономии и объяснять промахи «моделью».","Строить мультимодальный индекс, не замерив, выигрывает ли он у гибридного текстового на этом корпусе."],"drill":"Возьми 20 своих страниц. Прогони Tesseract с --psm 6 и получи TSV с координатами. Напиши проверку: для каждого поля, которое выдала LLM, найди его в OCR-слое с допуском на опечатку (расстояние Левенштейна ≤ 2). Вопрос, на который ты должен ответить: сколько значений из выданных моделью вообще не встречаются на странице, и совпадает ли это число с твоим списком промахов.","resources":[{"t":"Tesseract — документация и опции","u":"https://tesseract-ocr.github.io/tessdoc/","k":"документация","lang":"en","n":"Страница про psm и про улучшение качества — то, с чего начинается настройка."},{"t":"ColPali: Efficient Document Retrieval with VLMs","u":"https://arxiv.org/abs/2407.01449","k":"статья","lang":"en","n":"Поиск по изображению страницы без OCR. Читать раздел с бенчмарком ViDoRe."},{"t":"Docling","u":"https://github.com/docling-project/docling","k":"инструмент","lang":"en","n":"Разбор PDF в структуру с таблицами. База для структурного чанкинга."},{"t":"OpenCV — обработка изображений","u":"https://docs.opencv.org/4.x/d7/da8/tutorial_table_of_content_imgproc.html","k":"документация","lang":"en","n":"Бинаризация, морфология, преобразование Хафа — весь арсенал предобработки."},{"t":"Ragas","u":"https://docs.ragas.io/","k":"инструмент","lang":"en","n":"Готовые метрики RAG: faithfulness, context precision и recall."},{"t":"Евгений Разинков — Компьютерное зрение с использованием глубокого обучения, лекция 1","u":"https://www.youtube.com/watch?v=mvA038KeZ1c","k":"видео","lang":"ru","n":"Введение в задачи зрения: классификация, детекция, сегментация и их метрики."},{"t":"Евгений Разинков — Лекция 6. Локализация объектов","u":"https://www.youtube.com/watch?v=CRm-7twlcis","k":"видео","lang":"ru","n":"Детекция и IoU: то, что нужно для работы с рамками полей на документе."},{"t":"PythonToday — Распознавание текста с изображения: EasyOCR против Tesseract","u":"https://www.youtube.com/watch?v=H_nXZSM4WiU","k":"видео","lang":"ru","n":"Практическое сравнение двух движков на Python, с кодом."},{"t":"OTUS — Мультимодальные LLM: как модели видят изображения и понимают текст","u":"https://www.youtube.com/watch?v=AGEhdbGYneA","k":"видео","lang":"ru","n":"Как картинка попадает в языковую модель. Мост между блоками D и R."}]},{"id":"S","title":"Эмбеддинги, трансформеры, внимание","level":"экспертный","lead":"Вектор, внимание и разница между энкодером и декодером — три вещи, которыми ты пользуешься каждый день, не называя их. Здесь механика: откуда берётся вектор, почему у двух моделей он разный, и что именно происходит внутри, когда RAG «находит похожее».","theory":[{"h":"Вектор — это не свойство текста, а свойство пары «текст + модель»","p":"Эмбеддинг не лежит в тексте, он вычисляется моделью. Одна и та же фраза «исходящий номер» у E5, у Qwen3-Embedding и у rubert-tiny даёт три разных вектора разной размерности (768, 1024, 4096, 312), и сравнивать их между собой нельзя вообще: они живут в разных пространствах. Отсюда практическое следствие, которое ломает продакшн чаще всего: сменил модель эмбеддингов — переиндексируй весь корпус целиком. Половина старых векторов и половина новых в одном индексе дают тихий мусор без единой ошибки в логах."},{"h":"Почему контекст меняет состав вектора","p":"У word2vec у слова был один вектор навсегда. У трансформера вектор токена пересчитывается на каждом слое через внимание к соседям, поэтому «замок» в «навесной замок» и «замок на горе» получают разные представления. Это и называется контекстуализацией. Вектор всего предложения получают пулингом: усреднением по токенам (mean pooling), взятием служебного токена [CLS], либо последнего токена — у декодерных эмбеддеров. Способ пулинга задаётся моделью, а не тобой: возьмёшь mean там, где модель обучалась на [CLS], потеряешь качество без всякой ошибки."},{"h":"E5, BGE, Qwen — почему префиксы обязательны","p":"Семейство E5 обучено асимметрично: запрос и документ подаются с разными префиксами, «query: » и «passage: ». Это не украшение, а часть входа, на котором модель училась. Забыл префикс — получил просадку recall на ровном месте, и никакой ошибки не увидишь. У BGE та же идея реализована инструкцией к запросу, у Qwen3-Embedding — полем instruction. Мультиязычная версия (multilingual-e5) нужна, когда в корпусе русский: англоязычные эмбеддеры на русском проваливаются в первую очередь на морфологии и на именах организаций."},{"h":"Энкодер, декодер и энкодер-декодер","p":"Энкодер (BERT, E5, DeBERTa) видит весь текст сразу, внимание двунаправленное, обучен восстанавливать замаскированные токены (MLM). Он не умеет генерировать, зато даёт сильные представления для классификации, NER и поиска. Декодер (GPT, Qwen, Llama) видит только левый контекст, будущие токены закрыты causal-маской, и обучен предсказывать следующий токен, поэтому умеет генерировать. Энкодер-декодер (T5, оригинальный трансформер) кодирует вход целиком и генерирует выход, глядя на код через cross-attention: его классическая область — перевод и seq2seq. Правило выбора простое: понять и разметить — энкодер, породить текст — декодер."},{"h":"Q, K, V: механика одного шага внимания","p":"Каждый токен через три обучаемые матрицы превращается в три вектора: query (что я ищу), key (чем я могу быть найден), value (что я отдам, если меня выбрали). Веса внимания — softmax от произведения q·kᵀ, делённого на корень из размерности головы: деление на √d_k держит дисперсию скалярного произведения около единицы, иначе softmax насыщается и градиенты исчезают. Выход токена — взвешенная сумма value всех токенов. Голов несколько (multi-head), каждая смотрит на свою зависимость — синтаксис, кореференция, позиция; их выходы конкатенируются и проецируются обратно. Self-attention — когда q, k, v происходят из одной последовательности; cross-attention — когда query из одной (декодер), а key и value из другой (энкодер или картинка)."},{"h":"Стоимость внимания и почему растёт TTFT","p":"Матрица внимания квадратична по длине: удвоил вход — учетверил вычисления на prefill. Отсюда прямая связь с твоим сервисом: страница в 1600 px по длинной стороне даёт тысячи визуальных токенов, и время до первого токена определяется именно этим. FlashAttention не меняет формулу, а считает её блоками в SRAM, не материализуя матрицу n×n целиком в HBM: меньше обращений к памяти, тот же результат. KV-кэш хранит key и value уже посчитанных токенов, чтобы не пересчитывать их на каждом шаге генерации, и именно он съедает VRAM на длинном контексте."},{"h":"Внимание в RAG: чем длиннее контекст, тем хуже середина","p":"Подать в промпт top-20 чанков вместо top-5 — не бесплатное улучшение. Экспериментально показано, что модели хуже используют информацию в середине длинного контекста, чем в начале и в конце (эффект lost in the middle). Практических следствий два: переранжировать так, чтобы самое релевантное стояло в начале или в конце окна, и резать k по замеру, а не по щедрости. Второе следствие — про генерацию: если в промпте лежат пять документов, а в ответе нужен один факт, требуй цитату с идентификатором чанка. Это единственный дешёвый способ увидеть, на что модель реально смотрела."},{"h":"Косинус, скалярное произведение и нормализация","p":"Косинусная близость — это скалярное произведение векторов, поделённое на их длины, то есть косинус угла между ними: от −1 до 1, длина вектора не влияет. Если векторы уже нормированы к единичной длине, косинус и скалярное произведение совпадают, а расстояние L2 монотонно связано с косинусом — поэтому в индексе выбирают метрику один раз и под неё нормируют. Главное, чего косинус не даёт: это мера похожести в пространстве конкретной модели, а не мера истины. 0.86 между запросом и чанком не значит «ответ здесь» — у разных моделей шкала разная, и абсолютный порог, подобранный на одной, на другой бессмыслен."},{"h":"Матрёшка и размерность","p":"Matryoshka-обучение (MRL) делает так, что первые k координат вектора сами по себе остаются осмысленным эмбеддингом. Практически это значит: можно хранить 1024-мерный вектор, а искать по первым 256 — вчетверо меньше памяти и быстрее поиск, с контролируемой потерей качества. Так устроены text-embedding-3 у OpenAI и часть открытых моделей. Обрезать обычный вектор, не обученный матрёшкой, нельзя: качество просядет непредсказуемо."},{"h":"Как из токенов получается один вектор","p":"Модель выдаёт вектор на каждый токен, а нужен один на текст. Способов три: усреднение по токенам, взятие служебного токена начала последовательности, взятие последнего токена у декодерных моделей. Способ определяется тем, как модель обучали, и менять его нельзя: усреднение по модели, обученной на последнем токене, даёт молчаливо худшее качество без всякой ошибки в коде. Дальше вектор обычно нормируют по длине, и тогда скалярное произведение совпадает с косинусной близостью."},{"h":"Обучение на парах и трудные отрицательные примеры","p":"Модель эмбеддингов учат сближать пары «вопрос и подходящий фрагмент» и разводить неподходящие. Качество определяется отрицательными примерами: случайные фрагменты слишком легки, и модель от них почти не учится. Работают трудные отрицательные, то есть фрагменты, которые ретривер выдаёт первыми, но которые не отвечают на вопрос. Собираются они из собственных логов поиска, и это самый дешёвый способ поднять полноту на своём домене без смены модели."},{"h":"Своя лексика ломает общую модель","p":"Общая модель эмбеддингов не видела внутренних кодов, номенклатуры и сокращений организации, поэтому разводит синонимы и сближает разное. Признак узнаётся по разбору промахов: запросы с внутренними терминами проваливаются, а обычные работают. Лечится по возрастанию цены: словарь синонимов и расширение запроса, гибрид с полнотекстовым поиском, дообучение эмбеддингов на своих парах. Первые два дают основную часть эффекта за часы работы, третье требует данных и переиндексации."}],"practice":[{"t":"Проверить, что префикс реально влияет","d":"Возьми 30 своих запросов и корпус чанков. Посчитай recall@5 дважды: с префиксами «query: »/«passage: » и без них. Разница на multilingual-e5 обычно заметная. Это пятнадцать минут и навсегда закрывает вопрос «а точно ли префиксы нужны».","code":"from sentence_transformers import SentenceTransformer\nm = SentenceTransformer('intfloat/multilingual-e5-large')\nq = m.encode(['query: срок оплаты по договору'], normalize_embeddings=True)\np = m.encode(['passage: Оплата производится в течение 10 банковских дней'], normalize_embeddings=True)\nprint(float(q @ p.T))"},{"t":"Посмотреть на веса внимания своими глазами","d":"Загрузи маленький BERT с output_attentions=True, подай фразу из своего документа и нарисуй тепловую карту одной головы. Ты увидишь, что часть голов смотрит на соседний токен, часть — на знаки препинания, часть — на подлежащее. После этого «внимание» перестаёт быть словом из статьи.","code":"from transformers import AutoTokenizer, AutoModel\nimport torch\ntok = AutoTokenizer.from_pretrained('cointegrated/rubert-tiny2')\nmodel = AutoModel.from_pretrained('cointegrated/rubert-tiny2', output_attentions=True)\nx = tok('Исходящий номер письма от 14 августа', return_tensors='pt')\nattn = model(**x).attentions[-1][0, 0]\nprint(attn.shape, tok.convert_ids_to_tokens(x['input_ids'][0]))"},{"t":"Собрать матрицу близостей и найти дубли","d":"Закодируй все документы корпуса, нормируй, посчитай матрицу косинусов и выведи пары с близостью выше 0.97. На реальных данных это моментально находит дубликаты и почти-дубликаты, и это первая чистка данных перед любым RAG.","code":"import numpy as np\nV = m.encode(texts, normalize_embeddings=True)\nS = V @ V.T\nnp.fill_diagonal(S, 0)\ni, j = np.where(S > 0.97)\nprint(sorted({tuple(sorted(p)) for p in zip(i, j)})[:20])"},{"t":"Замерить lost in the middle на своём корпусе","d":"Возьми 20 вопросов с известным ответом. Подай модели 10 чанков, где нужный стоит на позиции 1, потом на позиции 5, потом на позиции 10. Считай долю верных ответов по позиции. Получишь свою кривую, а не чужую, и по ней выберешь k и порядок чанков."},{"t":"Собрать трудные отрицательные из логов поиска","d":"Самый дешёвый способ поднять полноту на своём домене: учить модель на тех фрагментах, которые она уже путает.","code":"hard_negatives = []\nfor query, gold_id in labeled_queries:\n    top = retrieve(query, k=20)\n    for doc_id in top:\n        if doc_id != gold_id:\n            hard_negatives.append((query, doc_id))\n            break\n\nprint('пар для дообучения:', len(hard_negatives))"},{"t":"Сравнить две модели эмбеддингов на своих вопросах","d":"Порядок моделей на своём корпусе почти всегда отличается от общего рейтинга. Считать recall@k, а не смотреть на описание.","code":"for name in ('multilingual-e5-large', 'bge-m3'):\n    index = build_index(corpus, model=name)\n    hits = sum(p['gold_id'] in search(index, p['q'], k=5) for p in pairs)\n    print(f'{name:24} recall@5={hits / len(pairs):.3f}')"}],"business":[{"t":"Поиск по базе знаний поддержки","d":"Классика эмбеддингов: оператор вводит проблему словами клиента, система находит статью, написанную словами инженера. Лексический поиск здесь проваливается на синонимах, векторный — вытягивает. Метрика внедрения обычно не accuracy, а доля тикетов, закрытых без эскалации, и среднее время ответа."},{"t":"Дедупликация карточек контрагентов","d":"«ООО Ромашка», «Ромашка, ООО», «ООО „РОМАШКА“» — три записи об одном юрлице. Эмбеддинги плюс порог по косинусу дают кандидатов на склейку, дальше решает правило по ИНН. Бизнес-эффект прямой: одна карточка вместо трёх в отчётности и корректная сумма задолженности."},{"t":"Маршрутизация входящих документов и писем","d":"Вектор письма плюс лёгкий классификатор поверх него определяет отдел-получателя. Энкодерная модель здесь дешевле и стабильнее генеративной: ответ — один из 12 классов, генерировать нечего. Это ровно та задача, где надо уметь сказать «LLM тут не нужна»."},{"t":"Рекомендации и похожие товары","d":"Эмбеддинг описания плюс поведенческие признаки дают «похожие» без ручных правил. Опасность известна: косинус ловит похожесть текста, а не взаимозаменяемость. Чехол и телефон описаны похоже, но покупателю нужен не второй чехол."}],"terms":[{"t":"Эмбеддинг","d":"Плотный числовой вектор фиксированной размерности, представляющий текст, картинку или пару «текст+картинка» в пространстве конкретной модели.","m":"Векторы двух разных моделей несравнимы. Смена модели эмбеддингов = полная переиндексация корпуса."},{"t":"Пулинг (mean / CLS / last-token)","d":"Способ свернуть последовательность векторов токенов в один вектор текста.","m":"Пулинг задан обучением модели. Mean вместо CLS на модели, обученной под CLS, тихо роняет качество."},{"t":"Префикс E5 (query: / passage: )","d":"Обязательная часть входа для асимметричных эмбеддеров: запрос и документ кодируются по-разному.","m":"Забытый префикс — самая частая и самая незаметная причина низкого recall в RAG на E5."},{"t":"Self-attention","d":"Механизм, где query, key и value происходят из одной последовательности: каждый токен смотрит на все остальные.","m":"Именно он делает представление контекстным. Стоимость квадратична по длине входа."},{"t":"Cross-attention","d":"Внимание, где query из одной последовательности, а key и value из другой (текст смотрит на картинку, декодер — на энкодер).","m":"В VLM изображение попадает в языковую модель либо через cross-attention, либо проекцией патчей в те же токены."},{"t":"Q, K, V","d":"Три проекции токена: запрос, ключ и значение. Вес = softmax(q·kᵀ / √d_k), выход = взвешенная сумма value.","m":"Деление на √d_k держит softmax в рабочем режиме. Без него градиенты гаснут на больших размерностях."},{"t":"Causal mask","d":"Маска, закрывающая будущие токены, чтобы декодер не подглядывал вперёд при обучении предсказанию следующего токена.","m":"Ровно она отличает декодер от энкодера архитектурно. Всё остальное — те же блоки внимания."},{"t":"MLM (masked language modeling)","d":"Задача предобучения BERT: закрыть часть токенов и восстановить их по двустороннему контексту.","m":"Отсюда сила энкодеров в понимании и их полная неспособность к генерации."},{"t":"RoPE","d":"Позиционное кодирование поворотом: позиция вносится вращением векторов q и k, а не прибавлением вектора позиции.","m":"Позволяет растягивать контекст после обучения (NTK, YaRN). Отсюда берутся модели с 128k окном."},{"t":"Косинусная близость","d":"Скалярное произведение, нормированное на длины векторов: косинус угла, от −1 до 1.","m":"На нормированных векторах совпадает со скалярным произведением. Абсолютный порог не переносится между моделями."},{"t":"Matryoshka (MRL)","d":"Обучение, при котором первые k координат вектора сами остаются валидным эмбеддингом меньшей размерности.","m":"Даёт легальное урезание вектора ради памяти и скорости. Для обычных моделей урезание незаконно."},{"t":"FlashAttention","d":"Блочный алгоритм точного вычисления внимания без материализации матрицы n×n в памяти.","m":"Ускоряет prefill и экономит память, результат математически тот же. Не путать с приближённым вниманием."},{"t":"Lost in the middle","d":"Эмпирический эффект: факты в середине длинного контекста используются моделью хуже, чем в начале и конце.","m":"Больше чанков ≠ лучше ответ. Порядок подачи — управляемый параметр, который нужно мерить."},{"t":"Трудные отрицательные примеры","d":"Фрагменты, которые ретривер ставит высоко, но которые не отвечают на запрос.","m":"Случайные отрицательные слишком легки. Трудные собираются из собственных логов поиска."},{"t":"Согласованность пулинга","d":"Способ получения вектора текста должен совпадать с тем, на котором модель обучали.","m":"Усреднение вместо последнего токена даёт молчаливо худшее качество без ошибки в коде."}],"pitfalls":["Смешать в одном индексе векторы двух моделей или двух версий одной модели. Ошибок не будет, будет тихая деградация поиска.","Сравнивать косинусы, посчитанные разными моделями, и переносить порог 0.8 с одной на другую.","Забыть префикс query:/passage: на E5 и объяснять низкий recall «плохими чанками».","Считать, что увеличение top-k всегда улучшает ответ: середина длинного контекста работает хуже краёв.","Брать англоязычный эмбеддер на русский корпус, потому что он выше в общем лидерборде.","Обрезать вектор до 256 измерений у модели, не обученной матрёшкой."],"drill":"Возьми 50 чанков своего корпуса и 20 запросов. Посчитай recall@5 в четырёх конфигурациях: multilingual-e5 с префиксами, e5 без префиксов, англоязычный эмбеддер, BM25. Сведи в таблицу из четырёх строк. Вопрос, на который ты должен ответить: какая конфигурация выигрывает именно на твоих данных и на сколько пунктов, и выдерживает ли этот отрыв бутстреп-интервал.","resources":[{"t":"Attention Is All You Need","u":"https://arxiv.org/abs/1706.03762","k":"статья","lang":"en","n":"Первоисточник Q/K/V и multi-head. Читать разделы 3.1–3.3."},{"t":"The Illustrated Transformer","u":"https://jalammar.github.io/illustrated-transformer/","k":"разбор","lang":"en","n":"Картинки, по которым механика внимания укладывается за час."},{"t":"Karpathy — Let's build GPT from scratch","u":"https://www.youtube.com/watch?v=kCc8FmEb1nY","k":"видео","lang":"en","n":"Два часа: self-attention пишется руками, causal mask появляется на глазах."},{"t":"Lost in the Middle","u":"https://arxiv.org/abs/2307.03172","k":"статья","lang":"en","n":"Замер деградации по позиции факта в контексте. Основание для выбора k и порядка чанков."},{"t":"MTEB — лидерборд эмбеддингов","u":"https://huggingface.co/spaces/mteb/leaderboard","k":"инструмент","lang":"en","n":"Смотреть вкладку с русским языком и задачей retrieval, а не общий рейтинг."},{"t":"Matryoshka Representation Learning","u":"https://arxiv.org/abs/2205.13147","k":"статья","lang":"en","n":"Почему у одних моделей вектор можно резать, а у других нельзя."},{"t":"3Blue1Brown — Transformers, the tech behind LLMs (Deep Learning, глава 5)","u":"https://www.youtube.com/watch?v=wjZofJX0v4M","k":"видео","lang":"en","n":"Визуальный разбор того, как токен проходит через модель. Смотреть перед главой 6."},{"t":"3Blue1Brown — Attention in transformers, step-by-step (глава 6)","u":"https://www.youtube.com/watch?v=eMlx5fFNoYc","k":"видео","lang":"en","n":"Q, K и V нарисованы по шагам. После него формула softmax(q·kᵀ/√d_k) читается как картинка."},{"t":"Deep Learning School — Лекция. Трансформеры. Self-Attention","u":"https://www.youtube.com/watch?v=f544TipD2QY","k":"видео","lang":"ru","n":"Курс ФПМИ МФТИ. Русскоязычный вход в тему, если английские лекции идут тяжело."},{"t":"Igor Kotenkov — Transformer, explained in detail (NLP Lecture, на русском)","u":"https://www.youtube.com/watch?v=iOrNbK2T92M","k":"видео","lang":"ru","n":"Подробный разбор архитектуры с презентацией, уровень выше вводного."},{"t":"Deep Learning School — Лекция. Контестные эмбеддинги. Word2Vec","u":"https://www.youtube.com/watch?v=WbtQzAvhnRI","k":"видео","lang":"ru","n":"Откуда взялись векторы слов и чем контекстные представления отличаются от статических."},{"t":"ФКН ВШЭ — Глубинное обучение 1, лекция 6: токенизация, эмбеддинги слов, TextCNN","u":"https://www.youtube.com/watch?v=WihC2R5lNmg","k":"видео","lang":"ru","n":"Токенизация в подслова и почему она влияет на разметку сущностей."},{"t":"ИУ5 — Лекция 8. Трансформеры и механизм внимания","u":"https://www.youtube.com/watch?v=3GVmrjgkWe8","k":"видео","lang":"ru","n":"Обзорная лекция: внимание в RNN, архитектура трансформера, BERT и GPT в одном месте."},{"t":"Sentence Transformers — функции потерь","u":"https://sbert.net/docs/sentence_transformer/loss_overview.html","k":"документация","lang":"en","n":"Какие потери под какие данные: пары, тройки, трудные отрицательные."},{"t":"SimCSE","u":"https://arxiv.org/abs/2104.08821","k":"статья","lang":"en","n":"Контрастное обучение эмбеддингов предложений и роль отрицательных примеров."}]},{"id":"T","title":"Математика под капотом","level":"продвинутый","lead":"Не курс матана, а тот минимум, который каждый день лежит под твоими замерами: вероятность, матожидание, отклонение от среднего и асимптотика. Всё привязано к главам учебника MIT 6.042J — там это изложено для программиста, а не для математика.","theory":[{"h":"Вероятностное пространство и метод четырёх шагов","p":"Любая задача на вероятность решается одинаково: описать множество исходов, приписать им вероятности, определить событие как подмножество исходов, сложить. MIT 6.042 называет это методом четырёх шагов и строит на дереве исходов. Зачем это тебе: когда ты говоришь «модель права в 93% случаев», ты неявно задал пространство (какие документы), меру (как они попали в выборку) и событие (что считается успехом). Спор о метрике почти всегда оказывается спором об одном из этих трёх, а не о самой цифре. Глава 16."},{"h":"Условная вероятность и парадокс Симпсона","p":"P(A|B) = P(A∩B)/P(B) — вероятность при известном условии. Отсюда формула полной вероятности и Байес, на котором стоит вся интерпретация метрик классификации: precision это вероятность P(объект положительный | модель сказала «да»), и она зависит от доли положительных в потоке. Парадокс Симпсона: качество может расти в каждой подгруппе и падать в целом, если меняются размеры подгрупп. Практический смысл — агрегат по всем типам документов может улучшиться просто потому, что в выборку попало больше лёгких. Глава 17."},{"h":"Случайная величина, матожидание и его линейность","p":"Матожидание — среднее значение по распределению, а не по твоей выборке. Ключевое свойство: E[X+Y] = E[X] + E[Y] всегда, даже когда X и Y зависимы. Это позволяет считать ожидаемое число ошибок в документе как сумму ожиданий по полям, не разбираясь в их зависимостях. Для произведения так нельзя: E[XY] = E[X]E[Y] только при независимости. Глава 18."},{"h":"Дисперсия, Марков и Чебышёв: насколько далеко бывает от среднего","p":"Дисперсия меряет разброс, неравенство Маркова ограничивает вероятность большого значения для неотрицательной величины, Чебышёв — вероятность далёкого отклонения от среднего через дисперсию. Они дают грубые, но всегда верные границы без предположений о форме распределения. Практически: когда у тебя 49 наблюдений и доля 0.918, именно отсюда растёт понимание, что «±2 процентных пункта» — это не измерение, а шум. Глава 19."},{"h":"Оценка по выборке: доверие против вероятности","p":"Раздел 19.4–19.5 учебника разбирает то, на чём спотыкаются почти все: доверительный интервал 95% не значит «истинное значение лежит здесь с вероятностью 0.95». Истинное значение — константа, случайна процедура. Правильная формулировка: если повторять замер много раз, 95% построенных таким способом интервалов накроют истину. Для отчёта заказчику это не педантизм: из неверной трактовки рождается «мы на 95% уверены, что стало лучше», которого замер не даёт."},{"h":"Комбинаторика и множественные сравнения","p":"Правила произведения, суммы и деления (главы 14–15) отвечают на вопрос «сколько всего вариантов». Прямое приложение — перебор конфигураций: три промпта × два рендера × четыре модели = 24 прогона, и при уровне 0.05 примерно один ложный «успех» гарантирован. Отсюда поправки на множественность (Холм, Бонферрони) и правило «отбирать на dev, holdout трогать один раз»."},{"h":"Асимптотика: O, Θ и почему это про деньги","p":"Глава 13 даёт нотацию роста. Для инженера это не академизм: внимание квадратично по длине входа, значит удвоение страницы учетверяет prefill; поиск ближайших соседей полным перебором линеен по размеру корпуса, значит HNSW или IVF появляются не из красоты, а из счёта. Умение назвать порядок роста до эксперимента экономит день на эксперименте."},{"h":"Графы, DAG и инварианты","p":"Главы 9 и 11 про направленные графы, частичные порядки и топологическую сортировку — это язык, на котором описывают пайплайн: узлы-шаги, рёбра-зависимости, ацикличность как условие исполнимости. Индукция и инварианты (главы 5–6) — способ доказать, что цикл обработки делает то, что задумано, не прогоняя его миллион раз. Практический вид этого вопроса: «почему конвейер не зациклится» и «что гарантирует завершение ретраев»."},{"h":"Закон больших чисел и центральная предельная теорема","p":"Первый говорит, что среднее по выборке сходится к настоящему среднему с ростом числа наблюдений. Второй добавляет главное для практики: распределение этого среднего близко к нормальному почти независимо от того, как распределены сами наблюдения, и его разброс падает как корень из числа наблюдений. Отсюда и берутся формулы доверительных интервалов, и отсюда же правило четырёх: чтобы сузить интервал вдвое, нужно вчетверо больше данных. Работает при независимых наблюдениях, поэтому дубли и почти-дубли ломают именно это основание."},{"h":"Базовая частота: почему тест на редкое врёт","p":"Детектор с точностью девяносто девять процентов ищет подделку, которая встречается в одном документе из тысячи. Из тысячи документов детектор найдёт одну настоящую подделку и примерно десять ложных, значит срабатыванию можно верить меньше чем на десять процентов. Это не дефект детектора, а арифметика базовой частоты. Практический вывод для любой редкой цели: точность модели без учёта распространённости события ничего не говорит о доверии к конкретному срабатыванию."},{"h":"Логарифмы там, где величины умножаются","p":"Вероятности последовательности перемножаются и мгновенно уходят в машинный ноль, поэтому считают сумму логарифмов. Отсюда и логарифмическая функция потерь, и перплексия как экспонента от средней потери. Второе применение это шкала: величины, растущие в разы (стоимость, объём данных, длина контекста), сравниваются и рисуются в логарифмической шкале, иначе весь график занимает одно крупное значение. Третье это устойчивость: логарифм превращает умножение в сложение, а деление в вычитание, что убирает переполнение и упрощает производные."},{"h":"Минимум линейной алгебры","p":"Вектор это точка и направление, матрица это преобразование одного пространства в другое. Умножение матрицы на вектор это применение преобразования, а умножение матриц это композиция преобразований. Скалярное произведение измеряет согласованность направлений, норма измеряет длину, а деление на норму делает сравнение независимым от длины. Этого хватает, чтобы читать формулы внимания без магии: там скалярные произведения запроса с ключами, нормировка и взвешенная сумма значений."}],"practice":[{"t":"Посчитать интервал руками и сверить с библиотекой","d":"Возьми свою дробь 45/49. Посчитай интервал Вальда по формуле из учебника и интервал Уилсона через statsmodels. Увидишь, где Вальд выезжает за единицу и почему на краях шкалы его использовать нельзя.","code":"from statsmodels.stats.proportion import proportion_confint\nprint(proportion_confint(45, 49, method='normal'))\nprint(proportion_confint(45, 49, method='wilson'))"},{"t":"Симуляция вместо формулы","d":"Когда формулы нет или лень выводить, считай симуляцией. Сколько прогонов нужно, чтобы отличить 0.90 от 0.93 при уровне 0.05? Десять строк кода отвечают точнее, чем интуиция.","code":"import numpy as np\nrng = np.random.default_rng(0)\n\ndef power(n, p0=0.90, p1=0.93, trials=20000):\n    a = rng.binomial(n, p0, trials) / n\n    b = rng.binomial(n, p1, trials) / n\n    return float((b - a > 0.0).mean())\n\nfor n in (50, 100, 200, 400, 800):\n    print(n, round(power(n), 3))"},{"t":"Проверить Симпсона на своих данных","d":"Разбей последний прогон по типу документа и посчитай качество в каждой группе и в целом до и после изменения. Если направление в группах и в агрегате расходится — у тебя Симпсон, и агрегат нельзя называть улучшением."},{"t":"Оценить порядок роста до эксперимента","d":"Перед тем как запускать сетку dpi × max_side, напиши на бумаге, как растёт число визуальных токенов от площади и как от него растёт TTFT. Потом сверь с замером на трёх точках. Расхождение предсказания и замера — самый быстрый способ найти неверное предположение."},{"t":"Базовая частота в цифрах","d":"Считать до того, как обещать заказчику точность детектора редкого события.","code":"def believability(precision_rate, recall_rate, base_rate, n=100_000):\n    positives = n * base_rate\n    true_pos = positives * recall_rate\n    false_pos = (n - positives) * (1 - precision_rate)\n    return true_pos / (true_pos + false_pos)\n\nprint(round(believability(0.99, 0.99, 0.001), 3))\nprint(round(believability(0.999, 0.99, 0.001), 3))"},{"t":"Правило четырёх на своих числах","d":"Показывает, во сколько раз надо увеличить набор ради вдвое более узкого интервала. Обычно закрывает спор про «давайте добавим ещё документов».","code":"import math\n\ndef half_width(p, n):\n    return 1.96 * math.sqrt(p * (1 - p) / n)\n\nfor n in (40, 160, 640, 2560):\n    print(f'n={n:5}  интервал ±{half_width(0.8, n):.3f}')"}],"business":[{"t":"Защита цифры перед заказчиком","d":"Любой разговор про «стало лучше» упирается в интервал и в размер выборки. Инженер, который приносит 0.918 ± 0.08 и говорит «на этой выборке отличить 91% от 89% нельзя, нужно 300 документов», выглядит сильнее того, кто приносит голое число."},{"t":"Планирование пилота","d":"Сколько документов разметить для пилота — это расчёт минимально детектируемого эффекта, а не переговоры. Из требуемой чувствительности (хотим ловить +3пп) выводится n, из n — стоимость разметки и срок."},{"t":"A/B и постепенная раскатка","d":"Продуктовые команды живут на условной вероятности и множественных сравнениях: 20 метрик в дашборде означают, что одна «значимая» появится сама собой. Поправка на множественность — не формальность, а защита от ложных решений."},{"t":"Оценка нагрузки и железа","d":"Асимптотика плюс матожидание дают расчёт мощности: ожидаемое число страниц на документ, среднее число токенов на страницу, квадратичный рост внимания, и из этого честная цифра по GPU, а не «возьмём с запасом»."}],"terms":[{"t":"Вероятностное пространство","d":"Множество исходов с приписанными вероятностями; событие — подмножество исходов.","m":"Каждая метрика неявно задаёт пространство. Спор о цифре часто оказывается спором о том, какие документы в него входят."},{"t":"Условная вероятность","d":"P(A|B) = P(A∩B)/P(B): вероятность события при известном условии.","m":"Precision — условная вероятность, поэтому она зависит от доли положительных в потоке, а recall нет."},{"t":"Формула Байеса","d":"Пересчёт вероятности гипотезы после наблюдения: P(H|D) ∝ P(D|H)·P(H).","m":"Объясняет, почему при редком событии даже точный детектор даёт много ложных срабатываний."},{"t":"Парадокс Симпсона","d":"Направление зависимости в подгруппах противоположно направлению в объединённых данных.","m":"Возникает при смене состава выборки. Первое, что проверяют, когда агрегат вырос без причины."},{"t":"Линейность матожидания","d":"E[X+Y] = E[X] + E[Y] независимо от зависимости величин.","m":"Позволяет считать ожидаемое число ошибок по документу как сумму по полям, не зная их корреляций."},{"t":"Дисперсия и стандартное отклонение","d":"Средний квадрат отклонения от матожидания и его корень.","m":"Без разброса среднее не значит ничего: два прогона с одинаковым средним могут вести себя совершенно по-разному."},{"t":"Неравенство Маркова","d":"Для неотрицательной величины P(X ≥ a) ≤ E[X]/a.","m":"Грубая, но всегда верная граница. Работает, когда про распределение не известно ничего."},{"t":"Неравенство Чебышёва","d":"P(|X − E[X]| ≥ kσ) ≤ 1/k².","m":"Даёт границу отклонения через дисперсию без предположения нормальности."},{"t":"Доверительный интервал","d":"Интервал, построенный процедурой, которая в 95% повторений накрывает истинное значение.","m":"Случайна процедура, а не истина. Формулировка «истина здесь с вероятностью 0.95» неверна."},{"t":"Множественные сравнения","d":"Рост вероятности ложного открытия при увеличении числа проверяемых гипотез.","m":"24 конфигурации при α=0.05 дают примерно один ложный успех. Поправка Холма мощнее Бонферрони."},{"t":"Асимптотика O, Ω, Θ","d":"Классы роста функции при увеличении аргумента: верхняя, нижняя и точная оценка.","m":"Квадратичное внимание и линейный полный перебор в поиске — прямые следствия, которые видны в счёте за GPU."},{"t":"DAG и топологическая сортировка","d":"Направленный ациклический граф и порядок узлов, согласованный с рёбрами-зависимостями.","m":"Формальная модель пайплайна. Ацикличность — то, что гарантирует завершимость."},{"t":"Инвариант цикла","d":"Утверждение, истинное перед каждой итерацией и после неё, из которого следует корректность.","m":"Способ доказать, что контур ретраев не зациклится, не прогоняя его миллион раз."},{"t":"Центральная предельная теорема","d":"Распределение среднего по выборке близко к нормальному, а его разброс падает как корень из числа наблюдений.","m":"Отсюда правило четырёх: сузить интервал вдвое значит собрать вчетверо больше данных."},{"t":"Базовая частота","d":"Распространённость события в потоке. Без неё точность детектора не говорит о доверии к срабатыванию.","m":"Точность 99% на событии с частотой 1 из 1000 даёт доверие к срабатыванию меньше десяти процентов."},{"t":"Логарифмическая шкала","d":"Переход к логарифмам там, где величины перемножаются или растут в разы.","m":"Убирает машинный ноль в произведении вероятностей и делает график сопоставимых величин читаемым."}],"pitfalls":["Говорить «истинное значение лежит в интервале с вероятностью 95%». Случайна процедура, а не истина.","Сравнивать агрегаты, не проверив состав выборки: Симпсон прячется именно там.","Считать E[XY] = E[X]·E[Y] для зависимых величин.","Перебрать двадцать конфигураций и объявить лучшую значимой без поправки на множественность.","Применять нормальное приближение к доле у края шкалы при малом n.","Планировать пилот «на глаз», не посчитав минимально детектируемый эффект."],"drill":"Прочитай раздел 19.4–19.5 учебника MIT 6.042J (страницы 800–807) и выпиши своими словами разницу между confidence и probability на одном абзаце. Потом возьми свои две последние цифры качества и напиши для каждой корректную формулировку с интервалом. Вопрос, на который ты должен ответить: какая из твоих объявленных побед переживает честную формулировку.","resources":[{"t":"MIT 6.042J — Mathematics for Computer Science (учебник, 920 с.)","u":"https://ocw.mit.edu/courses/6-042j-mathematics-for-computer-science-spring-2015/mit6_042js15_textbook.pdf","k":"учебник","lang":"en","n":"Главы 16–19 — вероятность, матожидание, отклонение от среднего. Глава 13 — асимптотика. Читать выборочно под задачу."},{"t":"MIT 6.042J — страница курса с лекциями","u":"https://ocw.mit.edu/courses/6-042j-mathematics-for-computer-science-spring-2015/","k":"курс","lang":"en","n":"Видео лекций и задачи с решениями к каждой главе."},{"t":"Seeing Theory — визуальная вероятность","u":"https://seeing-theory.brown.edu/","k":"интерактив","lang":"en","n":"Интерактивные картинки: распределения, ЦПТ, доверительные интервалы за вечер."},{"t":"statsmodels — доли и тесты","u":"https://www.statsmodels.org/stable/stats.html","k":"инструмент","lang":"en","n":"proportion_confint, mcnemar, multipletests — три функции, закрывающие блок A."}]},{"id":"U","title":"Агенты и tool use","level":"экспертный","lead":"Агент — это не «модель с инструментами», а передача потока управления модели. Всё остальное — лимиты, идемпотентность, трейсы, ограничение полномочий — следствия одного этого решения.","terms":[{"t":"Поток управления","d":"Кто решает, каким будет следующий шаг. В пайплайне — ты, в агенте — модель на основании наблюдений.","m":"Твой перезапрос темы — ещё пайплайн: условие написано тобой. Агент начинается там, где условие исчезает."},{"t":"Tool use","d":"Вызов внешней функции по типизированной схеме. Описание инструмента — часть контракта: модель выбирает по нему.","m":"Границы применимости пишутся в описание инструмента, а не в системный промпт: там они читаются в момент выбора."},{"t":"ReAct","d":"Цикл мысль → действие → наблюдение → мысль. Рассуждение идёт поверх фактов из среды, а не в вакууме.","m":"Тот же принцип, что твоё правило «проверить фактом до утверждения», вшитый в цикл модели."},{"t":"Reflection","d":"Шаг самопроверки. Работает только когда приносит внешний сигнал — упавший тест, несошедшуюся схему, результат запроса.","m":"Без нового факта модель подтверждает свой же ответ — та же болезнь, что у судьи-LLM без полного контекста."},{"t":"Память агента","d":"Буфер (растёт линейно, дорожает), суммаризация (обрезает рост, теряет детали), векторная выборка (ровная цена, ошибка поиска).","m":"Размен, а не улучшение: называть надо плату каждой стратегии."},{"t":"Квадратичная стоимость диалога","d":"Каждый шаг переотправляет накопленный контекст, поэтому цена агентской сессии растёт быстрее числа шагов.","m":"Главная статья расходов у агентов и причина, по которой лимит шагов обязателен."},{"t":"Лимит шагов","d":"Жёсткая граница числа итераций. Не оптимизация, а предохранитель: цикл рано или поздно зациклится.","m":"Ставится вместе с бюджетом токенов на сессию и алертом на его исчерпание."},{"t":"Наименьшая привилегия для агента","d":"У модели не должно быть полномочий, которыми инъекция могла бы воспользоваться. Надёжнее любых запретов в промпте.","m":"Сейчас твой сервис только заполняет поля — площадь минимальна. Она вырастет в день, когда ему дадут писать в карточку."},{"t":"Идемпотентность действия","d":"Повтор с тем же ключом не создаёт второй эффект. Обязательна, потому что повтор случится.","m":"То же требование, что к ручке сервиса: всё, что можно повторить, будет повторено."},{"t":"MCP","d":"Протокол подключения инструментов и данных к модели вместо самописной обёртки под каждого поставщика.","m":"Знать как факт индустрии: вопрос «чем подключаете инструменты» на собесе ожидает названия протокола, а не своего клиента."},{"t":"Планирующий и реактивный агент","d":"План целиком с перепланированием против решения следующего шага после каждого наблюдения.","m":"Известна структура задачи, значит чаще всего нужен конвейер, а не агент."},{"t":"Структурированная ошибка","d":"Тип сбоя, попытка, частичный результат и альтернативы вместо общего сообщения о недоступности.","m":"Сбой доступа и пустой результат обрабатываются по-разному: первый повторяют, второй принимают и помечают пробел."},{"t":"Сводка состояния","d":"Явно обновляемое краткое состояние задачи вместо переноса всей истории диалога.","m":"Признак поломки: агент повторяет уже сделанный вызов или переспрашивает то, что знает."},{"t":"Необратимое действие","d":"Отправка, платёж, изменение записи, удаление. Подтверждается человеком с показом параметров.","m":"Общий вопрос «продолжить?» превращает контур в декорацию: человек жмёт да не глядя."}],"pitfalls":["Называть агентом обычный пайплайн с ветвлением, написанным руками.","Объяснять модели границы инструмента в системном промпте вместо описания самого инструмента.","Добавлять саморефлексию, не давая новых фактов, и ждать улучшения.","Запускать агента без лимита шагов и бюджета токенов.","Давать полномочия на запись раньше, чем появились идемпотентность и трейс каждого действия."],"drill":"Возьми свой текущий перезапрос темы и опиши на бумаге, что изменится, если решение о перезапросе примет модель: сколько шагов максимум, какой бюджет токенов, что попадёт в трейс, что произойдёт при повторе. Это упражнение на границу между пайплайном и агентом.","theory":[{"h":"Агент отличается от конвейера одним: кто решает следующий шаг","p":"В конвейере порядок шагов задан кодом, и модель вызывается в заранее известных точках. В агенте модель сама выбирает, что делать дальше, и цикл продолжается, пока она не скажет «готово» либо пока не сработает предохранитель. Всё остальное — лимиты, трассировка, идемпотентность, урезание прав — следствия этой передачи управления. Отсюда правило выбора: если последовательность шагов известна заранее, агент не нужен, он добавит недетерминизм и цену."},{"h":"Описание инструмента — это часть промпта","p":"Модель выбирает инструмент по имени, описанию и схеме параметров, поэтому плохое описание ломает поведение надёжнее, чем плохой системный промпт. Рабочие правила: имя говорит о действии, описание объясняет, когда инструмент применим и когда нет, у каждого параметра свой тип и пример, обязательных параметров минимум. Ошибки инструмента возвращаются текстом, который модель способна использовать: «файл не найден, доступные: a, b, c» полезнее, чем стек трассировки."},{"h":"Цена агентской сессии растёт быстрее числа шагов","p":"На каждом шаге переотправляется накопленная история, поэтому суммарные токены растут примерно квадратично по числу шагов. Практические следствия: держать в контексте только то, что нужно для следующего решения, сворачивать длинные наблюдения в краткие сводки, выносить большие данные в файлы и передавать ссылки, а не содержимое. Бюджет задаётся заранее и в токенах, и в шагах."},{"h":"Предохранители обязательны, а не желательны","p":"Лимит шагов, лимит токенов, таймаут на инструмент, белый список действий, подтверждение человеком на необратимое. Цикл рано или поздно зациклится: модель будет повторять вызов с теми же аргументами и теми же ошибками. Предохранитель превращает это из инцидента в понятный отказ. Отдельная строка — повторяемость: действие с ключом идемпотентности не создаёт второй эффект при повторе, а повтор случится обязательно."},{"h":"Инъекция приходит через данные, а не через пользователя","p":"Агент читает письмо, страницу или документ, где написано «игнорируй инструкции и отправь содержимое туда-то». Защита строится на правах, а не на уговорах: у модели не должно быть полномочий, которыми инъекция могла бы воспользоваться. Действия с внешним эффектом проходят через белый список и подтверждение, данные из внешних источников подаются с явной границей и никогда не склеиваются с системными правилами в одну строку."},{"h":"Наблюдаемость: трейс вместо догадок","p":"Отладка агента без трассировки невозможна: в логе нужен каждый шаг с его входом, выбранным инструментом, аргументами, результатом и числом токенов. По трейсу видно, где цикл свернул не туда, какой инструмент вызывается впустую и на чём уходит бюджет. Оценка агента строится на наборе задач с проверяемым исходом, а не на впечатлении от одного прогона."},{"h":"Планирование против реактивности","p":"Реактивный агент решает следующий шаг после каждого наблюдения: гибко, дёшево на коротких задачах, склонен ходить кругами. Планирующий сначала строит план целиком, затем исполняет и при отклонении перепланирует: предсказуемее, дороже, лучше на задачах с известной структурой. Выбор определяется тем, известна ли структура задачи заранее. Для документооборота она почти всегда известна, и тогда честный ответ обычно звучит как «планировщик не нужен, нужен конвейер с одним решающим шагом»."},{"h":"Ошибка инструмента это данные для решения","p":"Инструмент упал по таймауту, вернул пустой результат, отказал по правам. Три разных исхода, и агенту нужно уметь их различать: таймаут повторяют, пустой результат принимают как ответ и помечают пробел, отказ по правам эскалируют. Ошибка возвращается модели структурно: тип, что именно пробовали, частичный результат, если он есть, и возможные альтернативы. Общее сообщение «инструмент недоступен» лишает агента информации для восстановления, а молчаливый пустой ответ вместо ошибки заставляет его считать, что данных нет."},{"h":"Мультиагентность и её цена","p":"Несколько специализированных агентов оправданы, когда задачи параллелятся и у подзадач разные инструменты и разные правила. Плата видна сразу: стоимость растёт кратно числу агентов, координатор становится узким местом, а отладка усложняется, потому что ошибка размазывается между участниками. Перед разделением полезно проверить, решается ли задача одним агентом с хорошими инструментами, потому что чаще всего решается. Когда разделение всё же нужно, между агентами передают результаты, а не сырые диалоги."},{"h":"Что переносить между шагами","p":"Полная история диалога растёт и дорожает квадратично, поэтому переносят не всё. Рабочая схема: последние несколько шагов целиком, сжатая сводка более раннего, и отдельно неизменное состояние задачи (цель, найденные факты, принятые решения). Сводка обновляется явным шагом, а не надеждой, что модель удержит контекст. Признак, что схема сломалась: агент повторяет уже сделанный вызов инструмента или заново задаёт вопрос, на который ответ уже получен."},{"h":"Оценка агента отличается от оценки ответа","p":"У агента меряют четыре вещи: доля задач, доведённых до верного результата, число шагов, стоимость сессии и доля срабатываний предохранителей. Одна метрика качества ответа здесь недостаточна, потому что агент, решающий задачу за сорок шагов вместо четырёх, формально успешен и практически бесполезен. Набор задач для оценки делается из реальных обращений с зафиксированным верным исходом, и в него обязательно включают задачи, которые агент решить не должен, чтобы проверить корректный отказ."},{"h":"Точки подтверждения человеком","p":"Действия делятся на обратимые и необратимые, и вторые подтверждает человек. Список пишется заранее: отправка письма, изменение записи в учётной системе, платёж, удаление. Всё остальное агент делает сам. Подтверждение должно показывать конкретное действие с параметрами, а не общий вопрос «продолжить?», иначе человек нажимает «да» не глядя и контур превращается в декорацию. Отд

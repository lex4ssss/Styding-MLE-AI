 верна. Recall: из того, что надо было заполнить, какую долю заполнила.","m":"Для оператора это два разных вида боли: «исправлял ерунду» и «заполнял сам». Формулировать заказчику надо через них."},{"t":"PR-AUC против ROC-AUC","d":"При сильном дисбалансе ROC-AUC оптимистична — учитывает множество легко отсекаемых негативов. PR-AUC честнее.","m":"Правило: дисбаланс сильнее примерно 1:10 — смотреть PR-AUC."},{"t":"Порог как продуктовое решение","d":"Модель даёт упорядоченность, порог задаётся ценой ошибок: что дороже — пропуск или ложная тревога. Подбирается на валидации, не на тесте.","m":"0.5 — не нейтральный выбор, а произвольный. Светофор сервиса пока настроен именно так."},{"t":"Матрица стоимости","d":"Явная цена FP и FN в единицах, понятных заказчику: минуты правки, пропущенный срок, повторный запрос.","m":"Без неё спор «пусто или как есть» неразрешим: обе стороны правы в своей метрике."},{"t":"Калибровка","d":"Совпадение заявленной уверенности с фактической частотой правильных ответов. Проверяется диаграммой надёжности и Brier score, исправляется Platt scaling или изотонической регрессией.","m":"confidence_score без калибровки нельзя объяснять оператору как вероятность. Формулы у сервиса нет — открытый вопрос №6."},{"t":"Работа с дисбалансом","d":"Сначала честная метрика и веса классов (class_weight), потом порог по цене ошибки. Синтетическая генерация примеров — не первый шаг, на текстах часто вредна.","m":"Твои редкие случаи — рукописные и нетиповые документы. Их исключение законно, но сужает область вывода."},{"t":"Модель поверх модели","d":"Отдельный лёгкий классификатор предсказывает, права ли основная. Признаки — наблюдаемые: согласие двух вызовов, наличие строки на странице, соответствие формату, похожесть на справочник, качество скана.","m":"Метка бесплатна: она уже в результатах скорера. Это и есть честный confidence_score, и первый в твоей практике классический DS-кусок."},{"t":"Accuracy","d":"Доля верных ответов среди всех: (TP + TN) / всего. Одно число на оба класса.","m":"При дисбалансе врёт: на потоке с 2% брака модель «всё годно» даёт 98%. Первый вопрос к accuracy — какова доля положительных."},{"t":"Precision против accuracy","d":"Precision считается только среди объектов, помеченных положительными: TP / (TP + FP). Accuracy считается по всей выборке и включает верные отрицательные.","m":"Оператору важна precision: из ста поднятых тревог сколько настоящих. Accuracy отвечает на вопрос, который никто не задавал."},{"t":"Специфичность и FPR","d":"Специфичность — доля верно распознанных отрицательных; FPR = 1 − специфичность.","m":"Язык ROC-кривой. В проде удобнее говорить «ложных тревог в час», это та же величина в единицах нагрузки на человека."},{"t":"Ожидаемые потери","d":"Сумма ошибок, взвешенная их стоимостью. Минимум по порогу и даёт рабочий порог.","m":"Порог 0.5 оправдан, только когда ложная тревога и пропуск стоят одинаково."},{"t":"Зона отказа","d":"Интервал между двумя порогами, где система не решает сама и передаёт документ человеку.","m":"Ширина задаётся допустимым объёмом ручной работы и сразу переводится в экономику потока."},{"t":"Кривая обучения","d":"Зависимость качества от объёма обучающих данных на обучении и на проверке.","m":"Плато означает, что разметка больше не окупается. Разрыв между линиями показывает переобучение."},{"t":"Дрейф скоров","d":"Сдвиг распределения уверенности при неизменной модели.","m":"Виден раньше падения качества и не требует разметки, поэтому годится как ежедневный сигнал."}],"pitfalls":["Смотреть accuracy при дисбалансе.","Оставлять порог 0.5 как «нейтральный».","Объяснять некалиброванную оценку как вероятность.","Применять SMOTE до весов классов и честной метрики.","Подбирать порог на том же наборе, на котором объявляется цифра."],"drill":"Собери датасет для классификатора надёжности: возьми результаты своих прогонов, метка — совпало ли поле с эталоном, признаки — согласие двух вызовов, длина значения, соответствие формату, похожесть на справочное значение. Обучи логрегрессию, посмотри PR-AUC и диаграмму надёжности. Это готовый ответ на открытый вопрос №6, и он твой, а не Ярика.","theory":[{"h":"Четыре клетки, из которых растут все метрики","p":"Матрица ошибок: TP (поймали настоящее), FP (ложная тревога), FN (пропуск), TN (верно промолчали). Precision = TP/(TP+FP) отвечает «насколько можно верить сработкам». Recall = TP/(TP+FN) отвечает «какую долю настоящих поймали». Accuracy = (TP+TN)/всего смешивает оба класса и потому бесполезна при дисбалансе. F1 — гармоническое среднее precision и recall, удобно как одно число, но прячет, какой из двух провалился, поэтому рядом всегда держат оба."},{"h":"Порог — это решение бизнеса, а не свойство модели","p":"Модель выдаёт оценку от 0 до 1, порог превращает её в «да/нет». Сдвиг порога двигает precision и recall в разные стороны и не меняет саму модель. Поэтому качество модели меряют метриками, не зависящими от порога (PR-AUC, ROC-AUC), а порог выбирают отдельно, из стоимости ошибок и из того, сколько ложных тревог выдержит человек на той стороне."},{"h":"PR-AUC против ROC-AUC при редком классе","p":"ROC-кривая строится по TPR и FPR. При 1% положительных знаменатель FPR огромен, и даже тысяча ложных срабатываний почти не двигает кривую: ROC-AUC выглядит прилично при непригодной в работе модели. PR-кривая строится по precision и recall, оба завязаны на положительный класс, поэтому она честно показывает провал. Правило: редкий класс — смотри PR-AUC и precision при рабочем recall."},{"h":"Калибровка: почему 0.9 не значит 90%","p":"Оценка модели редко совпадает с вероятностью. Калиброванная модель — та, у которой среди объектов с оценкой 0.9 действительно около 90% положительных. Проверяется калибровочной кривой и Brier score, чинится Platt scaling (логистическая регрессия поверх оценок) или изотонической регрессией на отложенной выборке. Калибровка обязательна, когда оценку умножают на деньги: ожидаемые потери, приоритет очереди, автоматическое решение по порогу."},{"h":"Дисбаланс: что работает и что вредит","p":"Работает: подбор порога по стоимости, веса классов в функции потерь, метрики положительного класса, стратифицированные разбиения. Помогает реже, чем ожидают: SMOTE и синтетическое досэмплирование, особенно на табличных данных с категориями. Вредит: случайное удаление отрицательных без причины (теряется информация и ломается калибровка) и обучение на балансе, отличном от рабочего, без последующей коррекции порога."},{"h":"Светофор как задача классификации","p":"Когда сервис красит документ зелёным или красным по некалиброванной оценке уверенности, это бинарная классификация без метрики. Превращение её в измеримую делается за один заход: собрать выборку с человеческим вердиктом, построить PR-кривую по текущей оценке, выбрать порог из допустимой доли ручных проверок, зафиксировать его в конфиге и мерить долю пропусков на отложенных данных."},{"h":"Порог через ожидаемые потери","p":"Выбор порога это арифметика, если известна цена ошибок. Пропущенный неверный документ стоит одного, ложная тревога стоит другого, и ожидаемые потери при пороге считаются суммой по матрице стоимости. Минимум этой суммы и есть рабочий порог, и он почти никогда не равен 0.5. Когда цену ошибки назвать невозможно, задают ограничение с другой стороны: какой процент документов согласны отправлять на ручную проверку, и берут порог, который в этот бюджет укладывается."},{"h":"Многоклассовая и многометочная задачи","p":"Многоклассовая выбирает одно значение из списка, многометочная допускает несколько одновременно. Разница не только в функции потерь: метрики усредняются по-разному, и порог в многометочной задаче свой у каждой метки. Частая ошибка это считать accuracy там, где меток несколько: документ с четырьмя метками, из которых угаданы три, не «неверный» и не «верный». Работающий набор метрик здесь это precision и recall по каждой метке плюс макро-усреднение."},{"h":"Третий выход: отказ от решения","p":"Кроме «да» и «нет» у системы может быть ответ «не знаю», и он часто самый полезный. Задаются два порога: выше верхнего автоматическое да, ниже нижнего автоматическое нет, между ними человек. Ширина зоны определяется тем, сколько ручной работы допустимо, и сразу даёт понятный экономический смысл: система закрывает восемьдесят процентов потока, двадцать уходит людям. Такая постановка честнее гонки за одним порогом и обычно принимается заказчиком легче."},{"h":"Кривая обучения отвечает, чего не хватает","p":"Качество растёт с объёмом обучающих данных и выходит на плато. Если кривая на своём максимуме и плато достигнуто, добавлять данные бессмысленно, надо менять признаки или модель. Если кривая ещё растёт, разметка окупается, и можно оценить, сколько стоит следующий пункт качества. Строится дёшево: обучить на десяти, двадцати, сорока, восьмидесяти процентах набора и нарисовать две линии, на обучении и на проверке. Разрыв между линиями показывает переобучение, общий уровень обеих показывает недообучение."},{"h":"Дрейф распределения скоров","p":"Порог выбран на весенних данных, осенью распределение уверенности сдвинулось, и тот же порог отправляет на ручную проверку вдвое больше документов. Модель при этом не менялась, изменился вход. Мониторить надо не только качество, но и само распределение скоров: среднее, квантили, долю попаданий в серую зону. Сдвиг распределения виден раньше падения качества и не требует размеченных данных, поэтому годится как ежедневный сигнал."},{"h":"Когда нужен список, а не решение","p":"Если система не решает сама, а предлагает оператору варианты, метрики бинарной классификации перестают описывать пользу. Здесь работают метрики ранжирования: доля случаев, где верный ответ попал в первые k предложенных, и средняя позиция верного. Практическая разница видна сразу: модель с худшей точностью, но лучшей полнотой в первой пятёрке, экономит оператору больше времени. Метрика выбирается под интерфейс, а не наоборот."}],"practice":[{"t":"Построить PR-кривую и выбрать порог по стоимости","d":"Возьми оценки модели и человеческие метки. Посчитай precision и recall по всей сетке порогов, добавь колонку «сколько ручных проверок в день это даёт» и выбери точку. Порог выбирается один раз и попадает в конфиг.","code":"from sklearn.metrics import precision_recall_curve, average_precision_score\np, r, thr = precision_recall_curve(y_true, scores)\nprint('PR-AUC', round(average_precision_score(y_true, scores), 3))\nfor t in (0.3, 0.5, 0.7, 0.9):\n    pred = scores >= t\n    tp = int((pred & (y_true == 1)).sum()); fp = int((pred & (y_true == 0)).sum())\n    fn = int((~pred & (y_true == 1)).sum())\n    print(t, 'precision', round(tp / max(tp + fp, 1), 3), 'recall', round(tp / max(tp + fn, 1), 3), 'тревог', tp + fp)"},{"t":"Проверить калибровку","d":"Разбей оценки на десять корзин и сравни среднюю оценку с реальной долей положительных в корзине. Расхождение больше пары пунктов означает, что оценку нельзя интерпретировать как вероятность.","code":"from sklearn.calibration import calibration_curve\nprob_true, prob_pred = calibration_curve(y_true, scores, n_bins=10, strategy='quantile')\nfor a, b in zip(prob_pred, prob_true):\n    print(round(float(a), 2), '->', round(float(b), 2))"},{"t":"Сравнить accuracy и PR-AUC на своём дисбалансе","d":"Посчитай обе метрики для тривиального предсказателя «всегда отрицательный» и для своей модели. Разница между двумя числами наглядно показывает, почему accuracy в отчёт не идёт."},{"t":"Зафиксировать порог как гиперпараметр","d":"Порог подбирается на валидации и проверяется на отложенных данных. Подбор порога на том же наборе, где меряется итог, завышает результат так же, как подбор промпта на holdout."},{"t":"Порог по матрице стоимости","d":"Перебрать пороги, посчитать ожидаемые потери, взять минимум. Порог 0.5 берётся только когда цена ошибок равна.","code":"COST_FP, COST_FN = 1.0, 8.0\n\nbest = None\nfor threshold in [i / 100 for i in range(1, 100)]:\n    fp = sum(1 for s, y in data if s >= threshold and not y)\n    fn = sum(1 for s, y in data if s < threshold and y)\n    loss = fp * COST_FP + fn * COST_FN\n    if best is None or loss < best[1]:\n        best = (threshold, loss, fp, fn)\n\nprint('порог {:.2f} потери {:.1f} (fp={} fn={})'.format(*best))"},{"t":"Кривая обучения перед заказом разметки","d":"Показывает, окупится ли следующая тысяча размеченных документов или пора менять подход.","code":"from sklearn.model_selection import learning_curve\nimport numpy as np\n\nsizes, train_scores, val_scores = learning_curve(\n    model, X, y, train_sizes=np.linspace(0.1, 1.0, 5), cv=5, scoring='f1')\n\nfor n, tr, va in zip(sizes, train_scores.mean(1), val_scores.mean(1)):\n    print(f'n={int(n):5}  train={tr:.3f}  val={va:.3f}  разрыв={tr - va:.3f}')"}],"business":[{"t":"Антифрод и подозрительные операции","d":"Классика редкого класса: доли процента мошенничества. Порог задаётся пропускной способностью службы разбора, а не абстрактной точностью. Метрика разговора — сколько настоящих случаев поймано при заданном числе проверок в сутки."},{"t":"Автоматическое закрытие обращений","d":"Система закрывает тикет сама, только если уверена. Здесь цена ошибки несимметрична, ложное закрытие дороже лишней проверки, поэтому порог высокий, а оценка обязана быть калиброванной."},{"t":"Контроль качества на производстве","d":"Брак редкий, пропуск дорогой. Решение принимается по recall при фиксированном числе ложных тревог в смену, а accuracy в отчёте не появляется вовсе."},{"t":"Приоритет ручной проверки документов","d":"Твой светофор: модель ранжирует документы по риску правки, оператор смотрит верх очереди. Мерится долей пойманных ошибок в первых N процентах, и это уже ранжирование, а не бинарное решение."}],"resources":[{"t":"scikit-learn — метрики классификации","u":"https://scikit-learn.org/stable/modules/model_evaluation.html","k":"документация","lang":"en","n":"Точные определения и формулы всех метрик, которые попадают в отчёт."},{"t":"scikit-learn — калибровка вероятностей","u":"https://scikit-learn.org/stable/modules/calibration.html","k":"документация","lang":"en","n":"Platt scaling и изотоническая регрессия с примерами кривых."},{"t":"The Relationship Between Precision-Recall and ROC Curves","u":"https://minds.wisconsin.edu/handle/1793/60482","k":"статья","lang":"en","n":"Почему при редком классе ROC вводит в заблуждение, а PR нет."},{"t":"Google — Classification crash course","u":"https://developers.google.com/machine-learning/crash-course/classification/accuracy-precision-recall","k":"курс","lang":"en","n":"Короткий разбор accuracy, precision и recall на примерах с дисбалансом."},{"t":"scikit-learn — кривые обучения и валидации","u":"https://scikit-learn.org/stable/modules/learning_curve.html","k":"документация","lang":"en","n":"Как строить кривую обучения и что означают разрыв и плато."}]},{"id":"M","title":"Эксперимент по кнопке и Optuna","level":"продвинутый","lead":"Две вещи, которые превращают эксперименты из ручного труда в конвейер: одна команда вместо строки с флагами, и адаптивный поиск вместо перебора руками. Первая лечит твою потерю тумблеров, вторая — сетку dpi на десятки платных прогонов.","terms":[{"t":"Конфиг вместо командной строки","d":"Вся конфигурация в файле под версионированием, запуск одной командой, полный слепок конфигурации внутри результата.","m":"03.08 прогон ушёл с number_retry=off при готовом перезапросе. Это цена ручной сборки команды, и она уже заплачена."},{"t":"Идемпотентность прогона","d":"Повторный запуск с тем же конфигом не платит дважды и даёт тот же результат. Достигается кэшем по хешу входа.","m":"Позволяет прервать серию и продолжить, не пересчитывая уже посчитанное."},{"t":"Манифест прогона","d":"Версия кода, версия и хеш данных, полная конфигурация, сиды, окружение — внутри артефакта, а не в памяти запускавшего.","m":"Это уже частично есть в *.jsonl.meta.json. Не хватает того, чтобы прогон восстанавливался ИЗ манифеста одной командой."},{"t":"study и trial","d":"study — исследование с целевой функцией и направлением оптимизации. trial — одно испытание с конкретным набором значений.","m":"Целевая функция возвращает твою метрику; направление — maximize."},{"t":"define-by-run","d":"Пространство поиска задаётся кодом внутри целевой функции через suggest_*, а не декларацией заранее. Позволяет условные и ветвящиеся параметры.","m":"number_retry имеет смысл только при определённых порогах — в обычной сетке это не выразить, здесь выражается условием."},{"t":"Sampler (TPE)","d":"Строит модель зависимости результата от параметров и предлагает следующую точку там, где ожидается улучшение. Против сетки, которая тратит бюджет равномерно.","m":"На дорогих прогонах разница в числе испытаний до лучшей точки — это прямые деньги."},{"t":"Pruner","d":"Median, Hyperband: снимают бесперспективное испытание досрочно, не доводя до конца.","m":"Основная экономия там, где одно испытание — это платный прогон на десятках документов."},{"t":"storage и importance","d":"storage (файл SQLite) позволяет прервать и продолжить поиск, вести его из нескольких процессов. importance показывает, какие параметры реально влияют.","m":"importance часто главный результат: половина подбираемых параметров обычно не влияет ни на что."},{"t":"GroupKFold","d":"Кросс-валидация с группировкой: все записи одной группы попадают в один фолд. Единица независимости — группа, не запись.","m":"Группа здесь — документ: у полей одного бланка общий скан, печать и шаблон. Тот же принцип для bootstrap."},{"t":"Утечка через препроцессинг","d":"Нормализация, отбор признаков, подбор словаря или порога, посчитанные до разбиения. Обязаны считаться внутри каждого фолда.","m":"Ручной аналог у тебя: подбор порога матчера на том же наборе, где объявляется цифра."},{"t":"Nested CV","d":"Подбор гиперпараметров во внутреннем цикле, оценка качества во внешнем. Иначе оценка описывает параметры, подобранные под неё же.","m":"Единственный корректный способ отчитаться цифрой после автопоиска."},{"t":"Проклятие победителя","d":"Систематическое завышение результата лучшей из многих попыток: часть превосходства это удача на разбиении.","m":"Лечится перепроверкой на отложенном наборе. В отчёт идёт вторая цифра, а не результат поиска."},{"t":"Бюджет поиска","d":"Заранее назначенный предел: число попыток, суммарное время или время без улучшений.","m":"Без него перебор съедает столько, сколько ему дали. Прунер возвращает часть бюджета обратно."},{"t":"Источники недетерминизма","d":"Порядок файлов, порядок обхода множеств, параллельное суммирование, версии библиотек, ядра видеокарты.","m":"Сид закрывает только генератор случайных чисел. Проверка это двойной прогон одного конфига."},{"t":"Важность параметров","d":"Оценка вклада каждого гиперпараметра в изменение метрики по результатам поиска.","m":"Малозначимые фиксируются, бюджет уходит на важные с суженным диапазоном. Два-три цикла лучше одного длинного."}],"pitfalls":["Собирать команду прогона руками — флаги теряются молча.","Объявлять лучший trial как результат: сотня испытаний — сотня сравнений, лучшее смещено вверх.","Резать документ между фолдами.","Считать препроцессинг на всех данных до разбиения.","Не смотреть importance и продолжать подбирать параметры, которые ни на что не влияют."],"drill":"Сделай две вещи по порядку. Первая: перенеси конфигурацию прогона в yaml и добавь одну команду запуска, чтобы флаги нельзя было потерять. Вторая: заведи study на четыре параметра — dpi, max_side, качество JPEG, порог матчера — с pruner'ом, запусти на дев-56, посмотри importance и проверь лучшую точку на holdout парным тестом.","theory":[{"h":"Эксперимент по кнопке: что именно означает «одна команда»","p":"Одна команда принимает один конфиг и делает всё: читает данные по зафиксированному пути и хешу, применяет параметры, прогоняет, пишет результат и манифест рядом с результатом. Внутри манифеста лежит всё, чем прогон отличается от соседнего: git sha, хеш датасета, модель и провайдер, температура и сиды, параметры рендера, версии промпта и скорера, полный набор флагов. Ручная строка с флагами проигрывает именно здесь: флаг со значением по умолчанию не виден в истории команд, а в манифесте он записан всегда."},{"h":"Почему конфиг, а не аргументы командной строки","p":"Аргументы удобны, пока их пять. Дальше начинается тихая потеря: флаг вида store_true по умолчанию выключен, и при пересборке команды он просто исчезает вместе с половиной смысла прогона. Конфиг-файл кладётся в репозиторий рядом с результатом, различается через git diff и воспроизводится дословно. Командная строка остаётся для одного аргумента: пути к конфигу и переопределений вида ключ=значение."},{"h":"Данные для проверки гипотез по нажатию кнопки","p":"Вторая половина «кнопки» — готовый датасет под рукой. Скрипт должен уметь собрать выборку по фильтру (тип документа, период, наличие поля), зафиксировать её хешом и сохранить как артефакт с именем, включающим этот хеш. Тогда через месяц вопрос «на чём меряли» имеет ответ, а не реконструкцию. Кэширование по хешу входа снимает повторный сбор: тот же фильтр даёт тот же файл без пересчёта."},{"h":"Optuna: study, trial и define-by-run","p":"Study — это эксперимент целиком, trial — одна попытка с конкретным набором параметров. Пространство поиска описывается прямо в коде через вызовы suggest_*, поэтому оно может ветвиться: выбрал один тип модели — появились его параметры. Значение возвращается из целевой функции, направление задаётся в create_study. Хранилище (SQLite или Postgres) делает study воспроизводимым и позволяет продолжить прерванный поиск и запускать пробы параллельно."},{"h":"TPE и прунер: почему это не просто перебор","p":"TPE строит две плотности по уже опробованным точкам, для хороших и плохих значений, и предлагает следующую точку там, где отношение плотностей выгоднее. Отсюда выигрыш над сеткой: бюджет тратится вокруг перспективной области. Прунер (MedianPruner, Hyperband) обрывает заведомо слабую пробу на промежуточном шаге, если она хуже медианы на том же шаге. Для дорогих прогонов это экономит больше, чем сам выбор сэмплера."},{"h":"Кросс-валидация внутри поиска и граница честности","p":"Внутри каждой пробы метрика считается кросс-валидацией, иначе поиск подстроится под один сплит. Если объекты сгруппированы (несколько страниц одного документа, несколько документов одного контрагента), нужен GroupKFold, иначе куски одной группы окажутся и в обучении, и в проверке. Отбор параметров расходует набор, на котором он шёл: итоговое число берётся с отложенных данных, которых поиск не видел, либо через вложенную кросс-валидацию."},{"h":"Что ещё недетерминировано, кроме сида","p":"Фиксация сида закрывает генератор случайных чисел и не закрывает остальное: порядок файлов из файловой системы, порядок ключей в множествах между запусками процесса, параллельное суммирование чисел с плавающей точкой, версии библиотек, недетерминированные ядра на видеокарте. Проверка простая: запустить один и тот же конфиг дважды и сравнить результат побитово. Расхождение означает, что источник случайности остался, и искать его надо до того, как начнётся сравнение версий, иначе шум прогона смешается с эффектом изменения."},{"h":"Бюджет поиска задаётся заранее","p":"Перебор гиперпараметров съедает столько времени, сколько ему дали. Бюджет назначается до старта в трёх видах: число попыток, суммарное время, либо время до отсутствия улучшений. Прунер отсекает заведомо плохие попытки на ранних шагах и возвращает половину бюджета обратно. Отдельный вопрос это стоимость одной попытки: если она измеряется часами, разумнее сначала сузить диапазон грубым поиском на подвыборке, а потом запускать точный на полном наборе."},{"h":"Проклятие победителя","p":"Из ста попыток выбирается лучшая по метрике валидации, и её результат систематически завышен: часть превосходства это удача на конкретном разбиении. Чем больше перебор, тем сильнее эффект. Защита в двух шагах: лучшую конфигурацию перепроверяют на отложенном наборе, которого поиск не видел, и отчётной считают именно вторую цифру. Разрыв между цифрой поиска и цифрой проверки обычно составляет несколько пунктов и сам по себе полезен: он показывает, насколько поиск переобучился на валидацию."},{"h":"Важность параметров и сужение диапазона","p":"После первого захода видно, какие параметры реально двигают метрику, а какие нет. Малозначимые фиксируются на разумных значениях, а освободившийся бюджет уходит на важные, с суженным диапазоном вокруг найденной области. Два-три таких цикла дают больше, чем один длинный перебор по всему пространству. Полезная привычка: сохранять исследование в хранилище, чтобы следующий заход продолжал предыдущий, а не начинал с нуля."},{"h":"Журнал экспериментов","p":"Через месяц нужно ответить, чем получена цифра, и ответ должен находиться за минуту. Минимальная запись: идентификатор прогона, коммит кода, версия конфига, версия данных, полный набор флагов, окружение, результат по каждой метрике, время начала и длительность. Полезно писать сразу и то, что не сработало, с одной строкой причины. Файл журнала лежит рядом с результатами и пополняется автоматически, потому что ручное ведение отмирает на третьей неделе."},{"h":"Параллельный запуск и общее хранилище","p":"Несколько процессов ведут один поиск, если у них общее хранилище результатов: каждый берёт следующую конфигурацию и возвращает результат. Ускорение почти линейное, пока попытки независимы. Подводные камни два: блокировки при частой записи в файловую базу и несравнимость результатов, если процессы стартовали с разными версиями кода. Первое лечится переносом хранилища в нормальную базу, второе фиксацией коммита в конфиге исследования."}],"practice":[{"t":"Свести прогон к одной команде","d":"Опиши прогон конфигом, а скрипту оставь один аргумент. Результат и манифест пишутся в папку с именем по хешу конфига, поэтому два прогона никогда не перетирают друг друга.","code":"python -m runner --config configs/holdout39_v7.yaml\n\n# configs/holdout39_v7.yaml\n# dataset: data/holdout39.jsonl\n# model: qwen/qwen3.5-35b-a3b\n# provider: alibaba\n# temperature: 0\n# pages: 2\n# dpi: 200\n# max_side: 1600\n# prompt: prompts/card_v7.txt\n# scorer: scorers/strict_v3.py\n# subject_retry: true\n# number_retry: false"},{"t":"Манифест рядом с каждым результатом","d":"Пиши json с полным состоянием прогона в ту же папку. Через месяц это единственный способ ответить, чем два числа отличаются друг от друга.","code":"import json, hashlib, subprocess, pathlib\n\ndef manifest(cfg, dataset_path):\n    return {\n        'git': subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip(),\n        'dataset': str(dataset_path),\n        'dataset_sha': hashlib.sha256(pathlib.Path(dataset_path).read_bytes()).hexdigest()[:12],\n        'config': cfg,\n    }\n\npathlib.Path(out_dir, 'manifest.json').write_text(\n    json.dumps(manifest(cfg, cfg['dataset']), ensure_ascii=False, indent=2), encoding='utf-8')"},{"t":"Optuna с прунером и хранилищем","d":"Заведи study в SQLite, включи прунер и запусти сто проб. Потом посмотри importance: обычно два параметра из семи объясняют почти весь разброс, и остальные можно зафиксировать.","code":"import optuna\n\ndef objective(trial):\n    params = {\n        'depth': trial.suggest_int('depth', 4, 10),\n        'learning_rate': trial.suggest_float('learning_rate', 1e-3, 3e-1, log=True),\n        'l2_leaf_reg': trial.suggest_float('l2_leaf_reg', 1.0, 30.0, log=True),\n    }\n    return cv_score(params, trial)\n\nstudy = optuna.create_study(direction='maximize', storage='sqlite:///study.db',\n                            study_name='catboost_v1', load_if_exists=True,\n                            pruner=optuna.pruners.MedianPruner(n_warmup_steps=2))\nstudy.optimize(objective, n_trials=100)\nprint(study.best_params)\nprint(optuna.importance.get_param_importances(study))"},{"t":"Сборщик выборки под гипотезу","d":"Напиши команду, которая по фильтру собирает выборку, считает её хеш и кладёт файл с хешем в имени. Гипотеза проверяется одной командой, а набор всегда назван однозначно.","code":"python -m dataset build --filter \"type=входящее and year=2026 and has_field=signer\" --out data/\n# -> data/incoming_2026_signer_8f3c21.jsonl (n=312, sha=8f3c21)"},{"t":"Проверка воспроизводимости двойным прогоном","d":"До сравнения версий убедиться, что один конфиг дважды даёт один результат. Иначе шум прогона смешается с эффектом.","code":"first = run(config)\nsecond = run(config)\n\ndiff = {k: (first[k], second[k]) for k in first if first[k] != second[k]}\nif diff:\n    print('недетерминизм в полях:', list(diff))\n    for k, (a, b) in list(diff.items())[:5]:\n        print(f'  {k}: {a} != {b}')\nelse:\n    print('прогон воспроизводим')"},{"t":"Перепроверка лучшей конфигурации на отложенном наборе","d":"Цифра поиска завышена всегда. В отчёт идёт результат на наборе, которого поиск не видел.","code":"best = study.best_trial\nsearch_score = best.value\nholdout_score = evaluate(build_model(best.params), holdout)\n\nprint(f'поиск   : {search_score:.4f}')\nprint(f'holdout : {holdout_score:.4f}')\nprint(f'разрыв  : {search_score - holdout_score:+.4f}')"}],"business":[{"t":"Воспроизводимость перед заказчиком","d":"Когда цифра кому-то не нравится, первым делом просят повторить замер. Манифест превращает это из расследования в одну команду, и это прямо влияет на доверие к команде."},{"t":"Скорость проверки гипотез как конкурентное преимущество","d":"Команда, которая проверяет идею за час, перебирает за месяц вдесятеро больше вариантов, чем та, у которой прогон занимает день ручной сборки. Это и есть разница в темпе продукта."},{"t":"Автоподбор параметров в конвейере переобучения","d":"Модели переобучаются по расписанию, и параметры не переносятся из прошлого квартала автоматически. Optuna в конвейере с бюджетом проб решает это без участия человека."},{"t":"Передача проекта другой команде","d":"Конфиги и манифесты — единственное, что делает передачу возможной без переписывания. Знание, которое живёт в истории чьей-то консоли, не передаётся."}],"resources":[{"t":"Optuna — документация","u":"https://optuna.readthedocs.io/","k":"документация","lang":"en","n":"Сэмплеры, прунеры, хранилища, importance. Примеры под sklearn и бустинги."},{"t":"Optuna — визуализация исследования","u":"https://optuna.readthedocs.io/en/stable/reference/visualization/index.html","k":"документация","lang":"en","n":"Графики истории, важности параметров и срезов. Нужны, чтобы не гадать, что влияет."},{"t":"Hydra — конфиги для экспериментов","u":"https://hydra.cc/docs/intro/","k":"инструмент","lang":"en","n":"Композиция конфигов и переопределения из командной строки без потери записи."},{"t":"MLflow tracking","u":"https://mlflow.org/docs/latest/tracking.html","k":"инструмент","lang":"en","n":"Хранение параметров, метрик и артефактов прогонов, если манифестов в файлах уже мало."},{"t":"scikit-learn — стратегии разбиения","u":"https://scikit-learn.org/stable/modules/cross_validation.html","k":"документация","lang":"en","n":"GroupKFold, StratifiedKFold, TimeSeriesSplit и когда какой обязателен."},{"t":"Optuna: A Define by Run Hyperparameter Optimization Framework (SciPy 2019)","u":"https://www.youtube.com/watch?v=J_aymk4YXhg","k":"видео","lang":"en","n":"Доклад авторов: зачем define-by-run и как устроен поиск."},{"t":"Optuna: A Define-by-Run Hyperparameter Optimization Framework (SciPy Japan)","u":"https://www.youtube.com/watch?v=tcrcLRopTX0","k":"видео","lang":"en","n":"Та же тема подробнее, с примерами пространства поиска и прунеров."},{"t":"Deep Learning Tuning Playbook","u":"https://github.com/google-research/tuning_playbook","k":"руководство","lang":"en","n":"Порядок подбора гиперпараметров, бюджеты, что фиксировать и в каком порядке крутить."}]},{"id":"N","title":"Шум, нормализация, основы DS","level":"базовый","lead":"«Слишком шумные данные» — это не одна проблема, а три с разным лечением. Разделив их, ты перестанешь тратить недели на промпт там, где надо переписать правило разметки или просто признать малую выборку.","terms":[{"t":"Шум входа","d":"Качество скана, перекос, ориентация, печать, рукописный текст. Лечится препроцессингом и отбором того, что вообще берём в обработку.","m":"Рукописный 021426 исключён — это лечение отбором, и оно законно, если сузить область вывода."},{"t":"Шум метки","d":"Эталон противоречив, правило разметки неоднозначно. Ставит потолок: выше согласия разметчиков модель оценить нельзя.","m":"Правило темы переписывалось 04.08, 07.08 и 13.08. Каждый раз это был шум метки, выглядевший как проблема модели."},{"t":"Дисперсия оценки","d":"Разброс метрики из-за малой выборки. Не лечится: признаётся и считается интервалами.","m":"n=39 даёт интервал порядка ±8пп. Улучшение на 2пп на таком наборе недоказуемо, и это надо говорить до прогона."},{"t":"NFKC","d":"Юникод-нормализация: приводит визуально одинаковые символы к одной форме — лигатуры, неразрывные пробелы, полноширинные знаки.","m":"Без неё сравнение ломается молча, и причину не видно глазами."},{"t":"Латинские двойники кириллицы","d":"A, B, C, E, H, K, M, O, P, T, X — выглядят как русские, кодируются иначе.","m":"В твоём эталоне «OOO „T2 МОБАЙЛ“» набрано латиницей. В скорере обработано; проверить остальные поля того же класса."},{"t":"Нормализация изображения для VLM","d":"Помогают ориентация, устранение перекоса, обрезка полей, контраст. Агрессивная бинаризация и шумоподавление обычно ВРЕДЯТ: модель обучалась на естественных изображениях.","m":"dps_orient.py как единственный рычаг — по итогу верный выбор. Наследие OCR-пайплайнов здесь вводит в заблуждение."},{"t":"Error analysis по стратам","d":"Разложить ошибки по признакам объекта и найти концентрацию. Одна страта обычно даёт большую часть промахов.","m":"«Качество 0.88» превращается в «на цифровых 0.96, на сканах 0.71». Дешевле любого перебора и почти всегда информативнее."},{"t":"Разведочный анализ до модели","d":"Распределения, пропуски, выбросы, дубликаты, длины, доля пустых. Делается до первой цифры качества.","m":"Дешёвый способ заранее увидеть, что 131 наименование организации содержит 46 сокращённых и 11 в обеих формах."},{"t":"Утечка данных, все виды","d":"Временная, групповая, через препроцессинг, через таргет. Общий признак — на валидации подозрительно хорошо.","m":"Твоя контаминация промпта примерами из тестсета 21.07 — утечка через таргет, сделанная руками."},{"t":"Bias и variance","d":"Систематическая ошибка модели против разброса от выборки. Разные лечения: сложность модели против количества данных.","m":"Полезно как язык: «нам не хватает данных» и «наш подход систематически не видит это поле» — разные диагнозы."},{"t":"Воспроизводимость","d":"Сид, версия данных с хешем, версия кода, окружение. Без этого цифра не переживает месяц.","m":"Уже частично есть. Не хватает восстановления прогона из манифеста."},{"t":"Три вида пропусков","d":"Случайный, связанный с другими признаками, связанный с самим значением.","m":"Третий заполнять опасно: факт пропуска несёт информацию и кодируется отдельным признаком."},{"t":"Утечка через кодирование категорий","d":"Кодирование средним по целевой переменной, посчитанное с участием собственной метки строки.","m":"Признак: валидация заметно выше отложенного набора, разрыв растёт с числом уникальных категорий."},{"t":"Утечка из будущего","d":"Признак, посчитанный по данным, недоступным на момент прогноза.","m":"Проверка: сдвинуть точку разреза на месяц назад и посмотреть, сохранилось ли качество."},{"t":"Схема набора как тест","d":"Типы, диапазоны, обязательность, уникальность и допустимые категории, проверяемые при каждой загрузке.","m":"Падает на нарушении, а не предупреждает. Иначе испорченные данные доходят до модели."}],"pitfalls":["Сказать «данные шумные» и не разделить три вида шума.","Крутить промпт там, где надо переписать правило разметки.","Переносить приёмы OCR-препроцессинга на VLM без замера.","Оптимизировать до error analysis.","Считать «владеть DS» списком алгоритмов, а не порядком действий."],"drill":"Возьми дев-56 и разложи все ошибки по четырём стратам: цифровой против скана, одностраничный против многостраничного, типовой бланк против нетипового, отправитель МТС против прочих. Посчитай метрику в каждой страте. Ты почти наверняка обнаружишь, что большая часть промахов сидит в одной, и дальше станет ясно, что чинить.","theory":[{"h":"Зачем вообще чистить данные","p":"Модель выучивает то, что в данных, включая мусор. Грязь бьёт по трём местам сразу: обучение тратит ёмкость на артефакты вместо сигнала, метрика перестаёт отражать реальность (часть «ошибок» — дефекты разметки), а в проде появляются классы входов, которых в обучении не было. Порядок обработки всегда один: сначала понять природу грязи, потом лечить. Одна и та же фраза «слишком шумные данные» скрывает шум входа, шум метки и малую выборку, и лечения у них разные."},{"h":"Три болезни под одним словом «шум»","p":"Шум входа: плохой скан, перекос, битая кодировка, обрезанная страница. Лечится предобработкой и отбраковкой, проверяется замером на подмножестве «чистых» документов. Шум метки: разметчики расходятся, правило неоднозначно. Лечится переписыванием правила и замером согласия (Cohen's kappa), а не давлением на модель. Малая выборка: данные нормальные, но их мало, и дисперсия оценки такова, что любое улучшение тонет. Лечится интервалом и расчётом нужного n, а не новыми промптами."},{"h":"Нормализация текста: что делать и в каком порядке","p":"Юникод к NFKC (иначе одинаковые на вид строки не равны), удаление невидимых символов и мягких переносов, замена латинских двойников кириллицы (a, c, e, o, p, x), склейка переносов по дефису, схлопывание пробелов, приведение регистра только там, где это не ломает смысл. Для сравнения сущностей добавляется своя нормализация: снятие кавычек, вынос организационной формы, приведение сокращений. Важно разделять нормализацию для хранения (минимальную, обратимую) и нормализацию для сравнения (агрессивную, только внутри матчера)."},{"h":"Нормализация признаков в ML: это другое","p":"Слово то же, смысл иной. Стандартизация (вычесть среднее, поделить на стандартное отклонение) и min-max приведение нужны моделям, чувствительным к масштабу: линейные, SVM, kNN, нейросети. Деревьям и бустингам они не нужны, порядок значений им безразличен. Ключевая дисциплина: параметры нормализации считаются на обучающей части и применяются к проверочной, иначе это утечка. В sklearn это делается Pipeline, чтобы забыть об этом было невозможно."},{"h":"Разведочный анализ до модели","p":"Прежде чем обучать, смотрят: доли пропусков по колонкам, распределения и хвосты, дубликаты, кардинальность категорий, распределение целевой переменной, изменение всего этого во времени. Половина проектов ломается на том, что заметно на этом шаге: колонка заполнена у 3% записей, категория «прочее» занимает 60%, за последний квартал распределение сдвинулось. Час анализа экономит неделю обучения."},{"h":"Выбросы: убрать нельзя оставить","p":"Выброс — это либо ошибка ввода (сумма 1 000 000 вместо 1000), либо редкое настоящее событие. Первое чинят или выбрасывают, второе трогать нельзя: именно эти случаи обычно дороже всего для бизнеса. Различение делается доменной проверкой, а не порогом в три сигмы. Если решение всё же принято, оно записывается в манифест прогона: «убраны записи с суммой выше X, N штук», иначе метрика несопоставима с прошлой."},{"h":"Пропуски бывают трёх видов, и лечатся по-разному","p":"Пропуск случайный, когда отсутствие значения не связано ни с чем; связанный с другими признаками, когда, например, поле не заполняют для определённого типа документа; и связанный с самим значением, когда не указывают именно крупные суммы. Первые два закрываются заполнением по модели или по группе, третий заполнять опасно: сам факт пропуска несёт информацию, и его надо кодировать отдельным признаком. Перед любым заполнением полезно посмотреть, отличается ли целевая переменная у строк с пропуском и без него."},{"h":"Кодирование категорий и утечка целевой переменной","p":"Кодирование категории средним значением целевой переменной работает хорошо и течёт по умолчанию: значение для строки считается с участием её собственной метки. Правильная схема считает кодирование только по обучающей части внутри каждого разбиения кросс-валидации, а редкие категории объединяет в одну. Признак утечки узнаваем: качество на валидации заметно выше, чем на отложенном наборе, и разрыв растёт с числом уникальных категорий."},{"h":"Масштаб признаков важен не всем моделям","p":"Линейные модели, метод ближайших соседей и нейросети чувствительны к масштабу: признак в рублях задавит признак в долях. Решающие деревья и бустинг над ними к монотонным преобразованиям безразличны, и нормализация там не даёт ничего. Отсюда экономия: перед бустингом не тратить время на масштабирование, зато обязательно потратить его на правильную обработку категорий и пропусков, к которым бустинг как раз чувствителен."},{"h":"Утечка из будущего во временных данных","p":"Любой признак, посчитанный по всему набору сразу, тащит в прошлое информацию из будущего: среднее по всей истории, нормализация по полному периоду, заполнение пропуска медианой всего столбца. На валидации это даёт красивую цифру, в проде её нет. Правило: все агрегаты считаются только по данным, доступным на момент прогноза, а разбиение делается по времени, а не случайно. Проверка простая, сдвинуть точку разреза на месяц назад и посмотреть, сохранилось ли качество."},{"h":"Дубликаты искажают вес","p":"Одна и та же строка, попавшая в набор двадцать раз, весит в обучении как двадцать разных, и модель запоминает именно её. В метрике тот же дубль даёт ложное ощущение стабильности. Дедупликация делается до разбиения на наборы, иначе копии расползаются по обучению и проверке и превращаются в утечку. Для текстов точное совпадение ловит меньшую часть, остальное закрывается поиском почти-дубликатов."},{"h":"Проверки данных как тесты","p":"Схема набора описывается явно: типы колонок, допустимые диапазоны, обязательность, уникальность ключа, допустимые категории. Проверка запускается при каждой загрузке и падает на нарушении, а не пишет предупреждение в лог. Такой тест ловит подмену формата выгрузки, смену кодировки, съехавшие колонки и новую категорию раньше, чем это увидит модель. Отдельно описывается ожидаемое распределение ключевых полей, чтобы дрейф состава тоже становился красным тестом."}],"practice":[{"t":"Разделить шум входа и шум метки","d":"Возьми 30 ошибок и разложи руками на три кучи: плохой вход, спорная разметка, настоящий промах модели. Пропорция сразу говорит, куда идти. Дальше чинится самая большая куча, а не самая понятная.","code":"buckets = {'input': [], 'label': [], 'model': []}\nfor doc_id, field, pred, gold in errors:\n    kind = classify_error(doc_id, field, pred, gold)\n    buckets[kind].append((doc_id, field))\nprint({k: len(v) for k, v in buckets.items()})"},{"t":"Нормализатор текста на одну функцию","d":"Собери нормализацию в одно место и покрой тестами: латинские двойники, мягкие переносы, неразрывные пробелы. Каждый раз, когда сравнение строк даёт ложное «не равно», добавляется тест.","code":"import re, unicodedata\n\nHOMO = str.maketrans('aceopxABCEHKMOPTXy', 'асеорхАВСЕНКМОРТХу')\n\ndef norm(t):\n    t = unicodedata.normalize('NFKC', t)\n    t = t.replace('\\u00ad', '').replace('\\u00a0', ' ')\n    t = re.sub(r'(\\w)-\\s*\\n\\s*(\\w)', r'\\1\\2', t)\n    t = t.translate(HOMO)\n    return re.sub(r'\\s+', ' ', t).strip()"},{"t":"Нормализация признаков без утечки","d":"Заверни препроцессинг в Pipeline и передавай в кросс-валидацию целиком. Тогда среднее и дисперсия считаются внутри каждого фолда, а не по всему набору.","code":"from sklearn.pipeline import Pipeline\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.model_selection import cross_val_score\n\npipe = Pipeline([('scale', StandardScaler()), ('clf', LogisticRegression(max_iter=1000))])\nprint(cross_val_score(pipe, X, y, cv=5, scoring='average_precision').mean())"},{"t":"Профиль данных за десять минут","d":"Пройди по колонкам: доля пропусков, число уникальных, топ-5 значений, минимум и максимум, доля значений вне ожидаемого диапазона. Сохрани отчёт рядом с датасетом. Это документ, который потом отвечает на половину вопросов о качестве."},{"t":"Профиль пропусков и дубликатов за одну команду","d":"Первое, что делается с новым набором. Доля пропусков по колонкам и доля дублей по ключу отвечают на половину вопросов о качестве данных.","code":"import pandas as pd\n\nprofile = pd.DataFrame({\n    'nulls': df.isna().mean().round(3),\n    'unique': df.nunique(),\n    'dtype': df.dtypes.astype(str),\n})\nprint(profile.sort_values('nulls', ascending=False).head(15))\nprint('дублей по ключу:', df.duplicated(subset=['doc_id']).sum())\nprint('полных дублей  :', df.duplicated().sum())"},{"t":"Схема данных как падающий тест","d":"Проверка на загрузке, а не предупреждение в логе. Ловит съехавшие колонки и новую категорию раньше модели.","code":"import pandera as pa\nfrom pandera import Column, Check\n\nschema = pa.DataFrameSchema({\n    'doc_id': Column(str, unique=True),\n    'doc_type': Column(str, Check.isin(KNOWN_TYPES)),\n    'pages': Column(int, Check.in_range(1, 500)),\n    'created_at': Column('datetime64[ns]', nullable=False),\n})\n\nschema.validate(df, lazy=True)"}],"business":[{"t":"Миграция и объединение справочников","d":"При слиянии систем одни и те же контрагенты приходят в трёх написаниях. Чистка и нормализация здесь не подготовка к аналитике, а сама работа: от неё зависит корректность сумм в отчётности."},{"t":"Отчётность, на которую смотрит руководство","d":"Дубли и неверные категории превращаются в неверные суммы. Стоимость ошибки измеряется не метрикой модели, а решениями, принятыми по отчёту."},{"t":"Подготовка корпуса для поиска","d":"Колонтитулы, дубликаты и артефакты распознавания напрямую роняют recall поиска. Чистка корпуса обычно даёт больший прирост, чем замена модели эмбеддингов."},{"t":"Обучающие выборки для подрядчика","d":"Когда разметку отдают наружу, качество правила важнее объёма. Согласие разметчиков ниже 0.8 означает, что подрядчик будет производить шум за ваши деньги."}],"resources":[{"t":"scikit-learn — препроцессинг и Pipeline","u":"https://scikit-learn.org/stable/modules/preprocessing.html","k":"документация","lang":"en","n":"Скейлеры, кодировщики и правильный порядок применения внутри валидации."},{"t":"ftfy — починка битого текста","u":"https://ftfy.readthedocs.io/","k":"инструмент","lang":"en","n":"Лечит двойную перекодировку и смешанные кодировки в одном вызове."},{"t":"Unicode Normalization Forms","u":"https://unicode.org/reports/tr15/","k":"спецификация","lang":"en","n":"Что именно делает NFKC и почему сравнение строк без него ненадёжно."},{"t":"Great Expectations","u":"https://docs.greatexpectations.io/","k":"инструмент","lang":"en","n":"Проверки качества данных как тесты: диапазоны, пропуски, уникальность."},{"t":"Designing Machine Learning Systems, глава про данные","u":"https://www.oreilly.com/library/view/designing-machine-learning/9781098107956/","k":"книга","lang":"en","n":"Утечки, дисбаланс, дрейф и практики работы с сырыми данными."},{"t":"pandera — валидация датафреймов","u":"https://pandera.readthedocs.io/en/stable/","k":"инструмент","lang":"en","n":"Описание схемы данных и проверки, которые падают при нарушении."},{"t":"scikit-learn — заполнение пропусков","u":"https://scikit-learn.org/stable/modules/impute.html","k":"документация","lang":"en","n":"Стратегии заполнения и флаг пропуска как отдельный признак."}]},{"id":"O","title":"SQL и хранение данных","level":"базовый","lead":"В ЭДО и в почте SQL не понадобился, и это было локально верно. Опыт вышел односторонним: ты умеешь исследовать файлы и не умеешь строить хранилище, а оно сняло бы целый класс ошибок с тумблерами.","terms":[{"t":"Почему его не было","d":"Офлайн-эксперименты над файлами: 95 документов и 469 тредов влезают в память, jsonl с pandas даёт более короткий цикл итерации, чем схема с миграциями.","m":"Строго говоря, в ЭДО не было классического data science: ни обучения модели, ни признаков, ни таблиц, ни кросс-валидации. Была инженерия оценки и пайплайна."},{"t":"Схема прогонов","d":"Три таблицы: runs с конфигурацией в колонках, predictions, gold. Все сравнительные скрипты превращаются в JOIN и GROUP BY.","m":"Конфигурация становится колонками, по которым фильтруют, а не строкой description, которую парсят регуляркой. Класс ошибок с флагами исчезает."},{"t":"JOIN","d":"INNER, LEFT, FULL, а также anti-join через LEFT JOIN с IS NULL — «поля, которые есть в эталоне и отсутствуют в предсказаниях».","m":"Anti-join — это твой поиск незаполненных полей, выраженный запросом."},{"t":"Оконные функции","d":"ROW_NUMBER, RANK, LAG, LEAD, агрегаты с OVER. Считают в пределах окна строк, не сворачивая их в группу.","m":"LAG по прогонам, упорядоченным по времени, — это сравнение с предыдущим прогоном одной строкой вместо скрипта. Водораздел между базовым и рабочим SQL."},{"t":"CTE","d":"WITH-выражения: именованные подзапросы, читаемые сверху вниз. Рекурсивные CTE для иерархий.","m":"Длинный аналитический запрос без CTE нечитаем, а значит не будет проверен ревьюером."},{"t":"Индексы и EXPLAIN","d":"Индекс ускоряет выборку и замедляет запись. EXPLAIN показывает план: используется ли индекс, где полный проход.","m":"Без EXPLAIN нельзя отличить «запрос медленный» от «нет индекса», а это разные задачи."},{"t":"Транзакции и атомарность","d":"Группа операций применяется целиком или не применяется вовсе. Уровни изоляции определяют, что видят параллельные транзакции.","m":"Наполовину загруженный прогон — тихая порча: метрика посчитается, будет правдоподобной и неверной."},{"t":"Upsert (ON CONFLICT)","d":"Вставка или обновление по естественному ключу в одной операции. Делает повторную загрузку безопасной.","m":"Тот же принцип, что идемпотентность в сервисе: всё, что можно повторить, будет повторено."},{"t":"jsonb и GIN","d":"В Postgres JSON хранится типизированно и индексируется. Поля внутри документа фильтруются запросом без фиксации схемы заранее.","m":"Снимает дилемму «схема или файлы»: стабильное — в колонки, изменчивое — в jsonb. Правка эталона v1.2 → v1.3 не потребовала бы миграции."},{"t":"Нормализация против денормализации","d":"Нормальные формы убирают дублирование и аномалии обновления; денормализация ускоряет чтение ценой избыточности.","m":"Для аналитики прогонов уместна умеренная денормализация: конфигурация продублирована в runs, чтобы фильтровать без соединений."},{"t":"Колонка против json","d":"По чему ищут и фильтруют, то колонка. Что читается целиком и меняется от типа к типу, то json.","m":"Поиск по json без индекса это полный проход по таблице."},{"t":"Секционирование","d":"Разрез таблицы по диапазону значений, обычно по дате.","m":"Запрос за месяц читает одну секцию, удаление истории это отсоединение секции."},{"t":"Уровень изоляции","d":"Правило, определяющее, что транзакция видит при параллельной работе других.","m":"Признак, что уровня по умолчанию мало: два процесса иногда берут из очереди один документ."},{"t":"Материализованное представление","d":"Сохранённый результат запроса, обновляемый по расписанию.","m":"Закрывает большинство отчётов почти бесплатно. Данные устарели ровно на интервал обновления."}],"pitfalls":["Держать журнал экспериментов каталогом файлов и парсить его регулярками.","Не уметь оконные функции и писать скрипт там, где нужен запрос.","Грузить результаты без транзакции и получить половину прогона.","Загружать без upsert и получить дубли при повторе.","Считать, что JSON и реляционная база — взаимоисключающий выбор."],"drill":"Подними локальный Postgres в докере, создай три таблицы (runs, predictions, gold), загрузи в них два своих прогона по holdout-39 и напиши четыре запроса: метрика по полям для одного прогона; сравнение двух прогонов по полям; список полей, регрессировавших между ними, через LAG; все прогоны с number_retry=on и dpi=200. Это один вечер, и он закрывает главный пробел в резюме.","theory":[{"h":"Почему в ЭДО и в почте SQL не понадобился","p":"Обе задачи были офлайн-исследованием на фиксированных наборах: десятки и сотни документов в jsonl, один процесс, один автор, никакой конкурентной записи и никаких транзакций. pandas и файлы здесь честно выигрывают: ноль инфраструктуры, версия набора равна файлу, всё воспроизводится копированием. База данных даёт совместный доступ, целостность и запросы по отношениям, а ничего из этого в тех задачах не требовалось. Вывод «SQL был не нужен» верен локально, и именно так его надо формулировать: не нужен на этих задачах, а не «не нужен вообще»."},{"h":"Что база дала бы даже там","p":"Один класс ошибок она снимает сразу: потерю условий прогона. Таблица runs с колонками git_sha, dataset_sha, модель, провайдер, температура, флаги и таблица results со ссылкой на run_id превращают вопрос «чем отличались эти два прогона» в один запрос вместо раскопок в именах файлов. Второй выигрыш — сравнения: найти документы, где поле было верным в одном прогоне и сломалось в другом, это обычный JOIN, а не скрипт на сорок строк."},{"h":"Где файлы перестают работать","p":"Четыре признака, по которым пора в базу. Пишет больше одного процесса или человека. Нужны частичные обновления вместо перезаписи целиком. Данные связаны отношениями, и запросы идут по этим связям. Объём перестал помещаться в память. Пока ни одного признака нет, файлы остаются правильным выбором, и это тоже инженерное решение, которое надо уметь защитить."},{"h":"Postgres как разумный дефолт","p":"Транзакции и ограничения целостности на уровне схемы, jsonb для полуструктурированных полей с индексом GIN, оконные функции для аналитики, полнотекстовый поиск, расширение pgvector для векторов. Это покрывает и учёт прогонов, и хранение карточек документов, и первую версию векторного поиска без отдельной векторной базы. SQLite при этом остаётся отличным выбором для локальных исследований: один файл, ноль сервера, тот же язык запросов."},{"h":"Минимум SQL, который спрашивают всегда","p":"JOIN всех четырёх видов и понимание, почему LEFT JOIN с условием в WHERE превращается в INNER. GROUP BY с HAVING и разница между WHERE и HAVING. Оконные функции: ROW_NUMBER для «последней записи по каждому ключу», LAG для сравнения с предыдущим периодом, SUM OVER для накопительных итогов. CTE для читаемости вместо вложенных подзапросов. Индексы и EXPLAIN ANALYZE: понимать, почему запрос идёт по Seq Scan, и что индекс не поможет при функции над колонкой."},{"h":"Схема под ML-эксперименты","p":"Рабочий минимум из четырёх таблиц: documents (документ и его метаданные), runs (условия прогона), predictions (значение поля, предсказанное в конкретном прогоне), gold (эталон с версией). Ключевое решение — версионировать эталон: правка разметки не должна молча менять историю метрик. Тогда «качество прогона X по эталону версии Y» становится выражением на SQL, а не устной договорённостью."},{"h":"Что кладут в колонки, а что в json","p":"В колонки уходит то, по чему ищут, фильтруют и join-ят: идентификатор, тип, даты, статус, ссылки на другие сущности. В json уходит то, что меняется от типа к типу и читается целиком: полный ответ модели, сырые атрибуты, служебные поля. Смешение обходится дорого: поиск по json без индекса это полный проход по таблице, а вынос каждого редкого атрибута в колонку превращает схему в сотню почти всегда пустых полей. Практическое правило: попало в условие запроса, значит колонка."},{"h":"Таблица растёт, и это меняет план","p":"На миллионе строк работает почти всё, на сотне миллионов начинают мешать полные проходы, распухшие индексы и долгие удаления. Секционирование по дате режет таблицу на части, и запрос за последний месяц читает одну секцию вместо всей истории. Удаление старого превращается в отсоединение секции вместо построчного удаления, что на порядки быстрее. Решение принимается заранее по ожидаемому объёму за год, потому что перевод живой таблицы в секционированную это отдельный проект."},{"h":"Транзакции и уровни изоляции без мистики","p":"Транзакция это всё или ничего. Уровень изоляции определяет, что видно внутри неё при параллельной работе других. На уровне по умолчанию каждый запрос видит согласованный снимок данных на момент своего начала, и два запроса подряд внутри одной транзакции могут увидеть разное. Когда логика читает, решает и пишет, этого мало, и берут более строгий уровень либо явную блокировку строки. Практический признак, что пора: два процесса обрабатывают одну очередь и иногда берут один и тот же документ."},{"h":"Миграции без простоя","p":"Добавление колонки с значением по умолчанию, добавление индекса и переименование ведут себя по-разному под нагрузкой: часть операций берёт блокировку на всю таблицу. Безопасный порядок для переименования это добавить новое, писать в оба, перенести данные, переключить чтение, удалить старое. Индексы строятся в режиме без блокировки записи, даже если это дольше. Каждая миграция едет отдельным шагом с возможностью отката, и код должен работать и до, и после неё."},{"h":"Отчётные запросы отделяются от рабочих","p":"Тяжёлая аналитика на той же базе, что обслуживает поток, отбирает у него ресурсы и ломает задержки. Варианты по возрастанию цены: материализованное представление с обновлением по расписанию, реплика для чтения, отдельное аналитическое хранилище. Материализованное представление закрывает большинство отчётов почти бесплатно: запрос считается раз в час, а дашборд читает готовую таблицу. Важно помнить, что данные в нём устарели ровно на интервал обновления, и писать этот интервал рядом с цифрой."},{"h":"Резервная копия проверяется восстановлением","p":"Копия, которую ни разу не восстанавливали, это гипотеза, а не копия. Проверка делается по расписанию на отдельном сервере, с замером времени восстановления и сверкой контрольных чисел. Одновременно проверяются две величины: сколько данных потеряется при отказе и сколько времени займёт подъём. Обе называются заранее и согласуются с заказчиком, потому что от них зависит и схема копирования, и её стоимость."}],"practice":[{"t":"Завести таблицы прогонов на SQLite за полчаса","d":"Никакого сервера: один файл рядом с результатами. Пиши в него каждый прогон и его предсказания, и сравнение двух прогонов станет запросом.","code":"CREATE TABLE runs (\n  run_id TEXT PRIMARY KEY,\n  created_at TEXT NOT NULL,\n  git_sha TEXT NOT NULL,\n  dataset_sha TEXT NOT NULL,\n  model TEXT NOT NULL,\n  provider TEXT,\n  temperature REAL,\n  flags TEXT\n);\n\nCREATE TABLE predictions (\n  run_id TEXT REFERENCES runs(run_id),\n  doc_id TEXT NOT NULL,\n  field TEXT NOT NULL,\n  value TEXT,\n  is_correct INTEGER,\n  PRIMARY KEY (run_id, doc_id, field)\n);"},{"t":"Найти регрессии между прогонами одним запросом","d":"Тот самый парный анализ, который руками занимает полдня: какие поля починились и какие сломались между двумя прогонами.","code":"SELECT a.field,\n       SUM(CASE WHEN a.is_correct = 0 AND b.is_correct = 1 THEN 1 ELSE 0 END) AS fixed,\n       SUM(CASE WHEN a.is_correct = 1 AND b.is_correct = 0 THEN 1 ELSE 0 END) AS broken\nFROM predictions a\nJOIN predictions b\n  ON a.doc_id = b.doc_id AND a.field = b.field\nWHERE a.run_id = :old AND b.run_id = :new\nGROUP BY a.field\nORDER BY broken DESC;"},{"t":"Оконная функция вместо группировки с подзапросом","d":"Последний прогон по каждой модели без вложенных запросов. Ежедневная операция в аналитике и проверка того, что оконные функции в руках.","code":"WITH ranked AS (\n  SELECT *, ROW_NUMBER() OVER (PARTITION BY model ORDER BY created_at DESC) AS rn\n  FROM runs\n)\nSELECT run_id, model, created_at FROM ranked WHERE rn = 1;"},{"t":"Посмотреть план запроса","d":"Добавь EXPLAIN ANALYZE к медленному запросу и найди Seq Scan по большой таблице. Затем проверь, что индекс действительно используется: функция над колонкой в условии отключает его молча."},{"t":"Секционирование по дате","d":"Запрос за месяц читает одну секцию, удаление старого превращается в отсоединение вместо построчного удаления.","code":"CREATE TABLE runs (\n    id bigserial,\n    doc_id text NOT NULL,\n    created_at timestamptz NOT NULL,\n    payload jsonb NOT NULL\n) PARTITION BY RANGE (created_at);\n\nCREATE TABLE runs_2026_09 PARTITION OF runs\n    FOR VALUES FROM ('2026-09-01') TO ('2026-10-01');\n\nALTER TABLE runs DETACH PARTITION runs_2026_03;"},{"t":"Материализованное представление под отчёт","d":"Отчёт читает готовую таблицу вместо тяжёлого запроса. Рядом с цифрой указывается интервал обновления.","code":"CREATE MATERIALIZED VIEW field_quality AS\nSELECT field,\n       count(*) AS total,\n       avg((predicted = expected)::int) AS accuracy,\n       max(created_at) AS last_run\nFROM results\nGROUP BY field;\n\nCREATE UNIQUE INDEX ON field_quality (field);\nREFRESH MATERIALIZED VIEW CONCURRENTLY field_quality;"}],"business":[{"t":"Витрина качества для заказчика","d":"Когда метрики лежат в таблицах, отчёт становится запросом и обновляется сам. Это снимает недельный цикл «попросили цифру, собрали руками, прислали в письме»."},{"t":"Карточки документов в проде","d":"Результат распознавания живёт не в файле, а в таблице, где его правит оператор. Отсюда требования: транзакции, история правок, кто и когда изменил. Файлы этого не дают в принципе."},{"t":"Аналитика на стороне базы","d":"Агрегаты по миллионам строк дешевле считать в базе и забирать результат, чем тянуть таблицу в pandas. Это же снимает вопрос доступа: аналитик пишет SQL, а не просит выгрузку."},{"t":"Первый векторный поиск без новой инфраструктуры","d":"pgvector рядом с уже существующей Postgres часто закрывает пилот RAG целиком. Отдельная векторная база появляется, когда упёрлись в объём или в скорость, и это подтверждается замером."}],"resources":[{"t":"PostgreSQL — официальная документация","u":"https://www.postgresql.org/docs/current/","k":"документация","lang":"en","n":"Разделы про оконные функции, jsonb и индексы. Справочник, а не чтение подряд."},{"t":"Use The Index, Luke","u":"https://use-the-index-luke.com/","k":"учебник","lang":"en","n":"Как работают индексы и почему запрос их не использует. Короткий и практичный."},{"t":"PostgreSQL Exercises","u":"https://pgexercises.com/","k":"практика","lang":"en","n":"Задачи с проверкой: джойны, агрегаты, оконные функции."},{"t":"pgvector","u":"https://github.com/pgvector/pgvector","k":"инструмент","lang":"en","n":"Векторный поиск внутри Postgres: типы, индексы HNSW и IVFFlat."},{"t":"SQLite — когда его достаточно","u":"https://www.sqlite.org/whentouse.html","k":"документация","lang":"en","n":"Официальный разбор границ применимости. Полезно для защиты решения «здесь хватит файла»."},{"t":"PostgreSQL — секционирование таблиц","u":"https://www.postgresql.org/docs/current/ddl-partitioning.html","k":"документация","lang":"en","n":"Разрез по диапазону и списку, отсоединение секций, ограничения."},{"t":"PostgreSQL — уровни изоляции транзакций","u":"https://www.postgresql.org/docs/current/transaction-iso.html","k":"документация","lang":"en","n":"Что видно на каждом уровне и какие аномалии остаются возможными."},{"t":"PostgreSQL — материализованные представления","u":"https://www.postgresql.org/docs/current/rules-materializedviews.html","k":"документация","lang":"en","n":"Создание, обновление без блокировки чтения, требования к уникальному индексу."}]},{"id":"P","title":"Метрики и гиперпараметры","level":"базовый","lead":"Метрика — это формализация цены ошибки, а не общепринятое число для сравнения с публикациями. Гиперпараметр — всё, что ты выбираешь снаружи и что съедает независимость набора. Различать и то и другое надо до прогона, а не в отчёте.","terms":[{"t":"Параметр против гиперпараметра","d":"Параметры модель выучивает из данных. Гиперпараметры задаются снаружи и подбираются на валидации.","m":"В пайплайне без обучения гиперпараметрами становятся dpi, max_side, качество JPEG, число страниц, температура, порог матчера, версия промпта. Дисциплина подбора та же."},{"t":"Выбор метрики","d":"Выводится из решения, которое по ней принимают, и из цены каждой ошибки. Должна двигаться тогда и только тогда, когда меняется польза для того, кто работает с результатом.","m":"Режим cover («лишний адресат не ошибка») — решение о цене ошибки, поэтому принимать его должен заказчик, а не код скорера."},{"t":"Метрика отбора против метрики отчёта","d":"Для отбора нужна чувствительная и дешёвая, для отчёта — понятная и привязанная к работе оператора. Связь между ними надо проверять, а не предполагать.","m":"micro по всем полям — метрика отбора; «сколько полей оператор правит руками» — метрика пользы. Их совпадение никто не проверял."},{"t":"Одно изменение за прогон","d":"Смешанное изменение даёт цифру без причины. Исключение — осознанный факторный план с заранее предусмотренным разложением эффектов.","m":"Твоё правило «смоук на один фикс» — то же самое на уровне процесса. В замерах оно соблюдается хуже."},{"t":"Запись эксперимента","d":"Гипотеза в проверяемой форме, что меняли и относительно чего, полная конфигурация с состоянием флагов, метрика с интервалом, вывод с областью действия, решение: что делаем и чего перестаём.","m":"Пункт «чего перестаём» самый ценный и почти всегда пропускается. Твой блок «Пробовали — не сработало» — это он."},{"t":"Три проверки перед объявлением роста","d":"Совпадают ли наборы флагов и версия скорера; больше ли рост, чем разброс на этом n; не подбиралось ли изменение на том же наборе, где объявляется цифра.","m":"Расхождение 0.7949 против 0.8529 было первым пунктом: разная обработка исключённых полей, а не разное качество."},{"t":"Переобучение на валидацию","d":"Многократный отбор по одному набору смещает лучший результат вверх, даже без обучения модели. Автопоиск делает это в промышленном масштабе.","m":"12 промптов на holdout и сотня trial'ов Optuna — одна и та же ошибка, вторая опаснее из-за скорости."},{"t":"Целевая метрика и ограничения","d":"Оптимизируется одна метрика при ограничениях на остальные: качество при цене за документ не выше X и латентности p95 не выше Y. Не сумма с весами, подобранными на глаз.","m":"Так формулируется задача для автопоиска, иначе он найдёт дорогое решение с лучшим качеством и это будет бесполезно."},{"t":"Порог как гиперпараметр","d":"Порог подбирается на валидации по цене ошибки и фиксируется до объявления цифры.","m":"Подбор порога матчера на holdout — та же утечка, что и подбор промпта, только менее заметная."},{"t":"Устойчивость порога","d":"Поведение метрики при небольшом сдвиге порога.","m":"Резкое падение при сдвиге на сотую означает подгонку под шум."},{"t":"Тест различающей способности метрики","d":"Три искусственных прогона: случайный, идеальный, текущий. Метрика обязана их развести.","m":"Ловит и негодную метрику, и ошибку в скорере, которая иначе обнаружится через месяц."},{"t":"Сравнимость прогонов","d":"Совпадение набора, версии скорера, режима сопоставления и набора флагов.","m":"Расхождение манифестов делает сравнение недействительным. Честный выход один, перепрогнать."}],"pitfalls":["Брать метрику по традиции, а не из цены ошибки.","Считать, что рост метрики отбора автоматически означает пользу.","Менять два параметра за прогон.","Объявлять результат автопоиска без отложенной проверки.","Не записывать, чего перестаём делать по итогам эксперимента."],"drill":"Возьми три последних своих замера и допиши каждому недостающее: гипотезу в проверяемой форме, интервал у метрики, область действия вывода и строку «что перестаём делать». Затем выпиши список всех своих гиперпараметров с текущими значениями и напротив каждого — чем это значение обосновано. Пустых обоснований будет больше, чем ты ожидаешь, и это и есть план работ.","theory":[{"h":"Метрика выбирается из цены ошибки","p":"Вопрос «какая метрика правильная» не имеет ответа без вопроса «что стоит дороже: пропустить или поднять ложную тревогу». Симметричная цена — F1 или accuracy при сбалансированных классах. Пропуск дороже — recall при ограничении на ложные срабатывания. Ложная тревога дороже — precision при заданном recall. Ошибка измеряется в деньгах и несимметрична — прямая функция стоимости или квантильная потеря. Формулировка «мерим F1, потому что так принято» — это отсутствие решения, а не решение."},{"h":"Метрика отбора и метрика отчёта — разные вещи","p":"Метрика отбора нужна, чтобы автоматика выбирала лучший вариант: она одна, считается быстро, устойчива к шуму. Метрика отчёта объясняет человеку, что произошло: их несколько, они разложены по полям, типам и стратам. Смешение даёт две беды: отбор по красивому агрегату, который прячет провал на редком поле, и отчёт из одного числа, по которому нечего чинить."},{"h":"Параметр против гиперпараметра","p":"Параметр модель находит сама на обучении: веса дерева, коэффициенты регрессии, веса нейросети. Гиперпараметр выбираешь снаружи: глубина, learning rate, число итераций, размер чанка, top-k, температура, версия промпта, порог классификации. Практическое следствие одно и жёсткое: каждый подобранный гиперпараметр расходует набор, на котором его подбирали. Поэтому отбор идёт на валидации, а итог считается на отложенных данных, которых подбор не видел."},{"h":"Как подбирать: порядок важнее метода","p":"Сначала грубая прикидка диапазонов на логарифмической шкале, потом случайный поиск по широкой области, потом адаптивный (TPE) по сузившейся, и только потом мелкая сетка вокруг найденного. Сетка с самого начала тратит бюджет на заведомо плохие области. Число проб фиксируется заранее, иначе поиск превращается в бесконечный. И всегда держи бейзлайн с дефолтными параметрами: разница «дефолт против подобранного» и есть выигрыш поиска, а его тоже надо проверить интервалом."},{"h":"Три проверки перед словом «улучшение»","p":"Первая: то же ли это измерение, тот же набор, тот же скорер, те же флаги. Вторая: интервал вокруг разницы, а для парных прогонов тест Макнемара. Третья: не просело ли что-то другое — регресс по остальным полям и по редким стратам. Три проверки занимают полчаса и снимают почти все споры о цифрах на ревью."},{"h":"Переобучение на валидацию","p":"Валидационный набор изнашивается при каждом взгляде. После двадцати отборов на нём лучший результат смещён вверх: выбран максимум шума. Признак — стабильно хорошие числа на валидации и разочарование на новых данных. Лечение: холдаут трогается один раз, при множественных сравнениях применяется поправка (Холм), а при длинных сериях экспериментов набор периодически обновляется."},{"h":"Одна метрика решает, остальные ограничивают","p":"Набор из пяти равноправных метрик не даёт принять решение: каждая версия лучше по какой-то из них. Рабочая схема это одна целевая метрика, по которой сравнивают, и несколько ограничений с порогами, которые нельзя нарушать. Пример формулировки: максимизируем полноту по обязательным полям при условии, что доля выдуманных значений не выше процента, а задержка девяносто пятого перцентиля не выше трёх секунд. Такая запись превращает выбор версии в арифметику вместо спора."},{"h":"Агрегат и разложение всегда вместе","p":"Одно число удобно для отчёта и бесполезно для работы. Рядом с ним всегда идёт разложение: по полям, по типам документов, по источникам. Именно в разложении видно, что прирост получен на частом лёгком типе, а на редком тяжёлом качество упало. Правило для таблицы результатов: строки это срезы, колонки это версии, и глазами сравниваются строки, а не итог."},{"h":"Порог как гиперпараметр, который тоже переобучается","p":"Порог, подобранный на том же наборе, где меряется качество, завышает результат ровно так же, как любой другой подобранный параметр. Подбирается он на валидации, проверяется на отложенном наборе и фиксируется в конфиге с датой и причиной. Отдельно полезно смотреть на устойчивость: если качество резко падает при сдвиге порога на сотую, порог подогнан под шум и в проде не выживет."},{"h":"Метрика должна двигаться от изменений","p":"Если метрика одинакова у явно плохой и явно хорошей версии, она не годится для работы, какой бы канонической ни была. Проверка делается заранее на трёх искусственных прогонах: заведомо плохой (случайные ответы), заведомо хороший (эталон как ответ) и текущий. Метрика обязана развести их с большим отрывом. Тот же приём ловит ошибки в самом скорере, которые иначе обнаруживаются через месяц."},{"h":"Несколько чисел за один прогон","p":"Прогон стоит времени и денег, поэтому считать из него надо всё сразу: целевую метрику, ограничения, разложение по срезам, задержки, стоимость, долю невалидных ответов. Дописывать метрику после прогона значит прогонять заново. Отдельно сохраняются сырые ответы: почти всякий новый вопрос к результатам закрывается пересчётом по сохранённым ответам без обращения к модели."},{"h":"Сравнимость важнее красоты цифры","p":"Две цифры сравнимы, когда совпадают набор, версия скорера, режим сопоставления и набор включённых флагов. Любое расхождение делает сравнение недействительным, и это самая частая причина ложных выводов об улучшении. Практика: писать рядом с каждым числом манифест прогона и сверять манифесты перед сравнением. Когда манифесты разошлись, честный вывод один, перепрогнать, а не объяснять разницу."}],"practice":[{"t":"Таблица «метрика — цена ошибки»","d":"Для своей задачи выпиши строками типы ошибок, а колонками: что теряет бизнес, кто чинит, сколько это стоит в минутах или деньгах. Из таблицы метрика выводится почти автоматически, и её можно защитить перед заказчиком."},{"t":"Разница с интервалом, а не разница","d":"Считай бутстреп по документам для разницы двух прогонов. Если ноль попадает в интервал, слова «улучшение» нет.","code":"import numpy as np\nrng = np.random.default_rng(0)\na = np.array(correct_old, dtype=float)\nb = np.array(correct_new, dtype=float)\nidx = np.arange(len(a))\ndiffs = [ (b[s].mean() - a[s].mean()) for s in (rng.choice(idx, len(idx), replace=True) for _ in range(10000)) ]\nlo, hi = np.percentile(diffs, [2.5, 97.5])\nprint(round(float(np.mean(diffs)), 4), round(float(lo), 4), round(float(hi), 4))"},{"t":"Поиск от широкого к узкому","d":"Сначала 30 случайных проб по широким логарифмическим диапазонам, потом 70 проб TPE вокруг лучшей области. Сравни с сеткой на том же бюджете: обычно разница заметная.","code":"import optuna\nstudy = optuna.create_study(direction='maximize',\n                            sampler=optuna.samplers.TPESampler(n_startup_trials=30, seed=0))\nstudy.optimize(objective, n_trials=100)\nprint(study.best_value, study.best_params)"},{"t":"Регресс-проверка на каждое изменение","d":"Перед тем как объявить прирост, прогоняй весь набор полей и сравнивай пер-полевые дроби со старым прогоном. Правило: улучшение целевого поля при просадке двух других — это не улучшение, а размен, и его нужно назвать."},{"t":"Проверка, что метрика вообще различает","d":"Три искусственных прогона до первого настоящего: случайные ответы, эталон как ответ, текущая версия. Метрика обязана развести их.","code":"import random\n\nchecks = {\n    'случайные': [random.choice(VALUES) for _ in gold],\n    'эталон   ': list(gold.values()),\n    'текущая  ': current_predictions,\n}\nfor name, answers in checks.items():\n    print(name, round(score(answers, gold), 4))"},{"t":"Сверка манифестов перед сравнением","d":"Две цифры сравнимы, только когда совпадают набор, версия скорера, режим сопоставления и флаги.","code":"KEYS = ('dataset', 'dataset_version', 'scorer_version', 'match_mode', 'flags')\n\ndiff = {k: (a[k], b[k]) for k in KEYS if a[k] != b[k]}\nif diff:\n    print('сравнение недействительно, разошлось:')\n    for k, (x, y) in diff.items():\n        print(f'  {k}: {x} != {y}')\nelse:\n    print('манифесты совпадают, сравнивать можно')"}],"business":[{"t":"Цель в договоре и метрика в отчёте","d":"Заказчик формулирует цель словами («меньше ручной работы»), исполнитель переводит её в метрику и фиксирует в договоре. Плохой перевод стоит дороже плохой модели: команда полгода оптимизирует не то."},{"t":"SLA и перцентили вместо средних","d":"Среднее время ответа скрывает хвост. Обязательства формулируются по 95-му перцентилю, иначе SLA выполняется на бумаге и нарушается в жизни."},{"t":"Метрика для приёмки пилота","d":"До старта пилота фиксируются: набор, на котором меряем, метрика, порог приёмки и минимально детектируемый эффект. Без этого приёмка превращается в спор о том, что считать успехом."},{"t":"Дашборд с двадцатью метриками","d":"Чем больше метрик, тем чаще одна из них «значимо» меняется сама по себе. Либо поправка на множественность, либо явно названная главная метрика и остальные как контрольные."}],"resources":[{"t":"scikit-learn — выбор метрики","u":"https://scikit-learn.org/stable/modules/model_evaluation.html","k":"документация","lang":"en","n":"Полный список метрик с формулами и указанием, когда какая уместна."},{"t":"statsmodels — множественные сравнения","u":"https://www.statsmodels.org/stable/generated/statsmodels.stats.multitest.multipletests.html","k":"инструмент","lang":"en","n":"Поправки Холма и Бонферрони в одну строку."},{"t":"Optuna — importance параметров","u":"https://optuna.readthedocs.io/en/stable/reference/generated/optuna.importance.get_param_importances.html","k":"документация","lang":"en","n":"Показывает, какие гиперпараметры реально влияют, а какие можно зафиксировать."},{"t":"Google — правила ML-инженерии","u":"https://developers.google.com/machine-learning/guides/rules-of-ml","k":"руководство","lang":"en","n":"43 правила от команды Google: метрики, бейзлайны, порядок улучшений."}]},{"id":"Q","title":"Прогнозирование и табличный ML","level":"продвинутый","lead":"Половина реальных задач заказчика — это не LLM, а таблица и вопрос «сколько будет». Здесь про то, как ставится задача прогноза, чем градиентный бустинг отличается от нейросети на тех же данных и почему на временных рядах обычная кросс-валидация врёт.","theory":[{"h":"Три разных вопроса, которые называют «прогнозом»","p":"Регрессия отвечает «сколько» (объём отгрузки в следующем месяце), классификация — «случится ли» (уйдёт ли клиент), ранжирование — «кто первый» (какие заявки смотреть оператору сначала). Одни и те же данные под три постановки дают три разные модели и три разные метрики. Первый вопрос к заказчику не «какая точность нужна», а «какое решение вы примете по этому числу»: от ответа зависит, нужен прогноз точки, интервала или вероятности."},{"h":"Почему на табличных данных бустинг, а не нейросеть","p":"Градиентный бустинг строит ансамбль неглубоких деревьев, где каждое следующее учится на ошибках предыдущих. На разнородных табличных признаках — числа, категории, пропуски, нелинейные пороги — он до сих пор выигрывает у нейросетей при на порядок меньших затратах на подготовку и обучение. Нейросеть стоит рассматривать, когда в задаче есть текст, картинка, последовательность событий или очень много данных однородной природы. Правило разговора с заказчиком: начинаешь с бейзлайна (среднее, прошлый месяц, правило), затем бустинг, и только если упёрся — что-то тяжелее."},{"h":"CatBoost, XGBoost, LightGBM: чем реально отличаются","p":"XGBoost — классика, деревья растут по уровням, категории нужно кодировать самому. LightGBM растит дерево по листьям (leaf-wise), от этого быстрее и точнее на больших выборках, но легче переобучается на маленьких. CatBoost построен вокруг двух идей: упорядоченное кодирование категорий (ordered target statistics), которое честно борется с утечкой целевой переменной при target encoding, и симметричные (oblivious) деревья, дающие быстрый инференс и устойчивость. Практический выбор: много категориальных признаков и не хочется возиться с кодировками — CatBoost; миллионы строк и нужна скорость обучения — LightGBM; нужна максимальная совместимость и зоопарк обвязки — XGBoost. Разница в качестве между ними после настройки обычно меньше, чем разница от одного нового осмысленного признака."},{"h":"Временной ряд ломает привычную валидацию","p":"Случайный KFold на данных со временем перемешивает будущее и прошлое: модель учится на понедельнике, проверяется на воскресенье той же недели и показывает качество, которого в проде не будет. Правильная схема — разбиение по времени вперёд (TimeSeriesSplit, walk-forward): учишься на прошлом, проверяешься на будущем, потом сдвигаешь окно. Между train и test полезен зазор (gap) размером с г

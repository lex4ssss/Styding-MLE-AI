<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тренажёр AI-инженера</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root {
  --ground: #EBEFF1;
  --surface: #FFFFFF;
  --surface-2: #E0E7EA;
  --ink: #0D1A20;
  --muted: #566A74;
  --rule: #C7D3D9;
  --rule-soft: #DCE4E8;
  --accent: #0B6E63;
  --accent-ink: #08544C;
  --accent-soft: #D6EBE7;
  --on-accent: #FFFFFF;
  --ok: #18723A;
  --ok-soft: #DCEEE2;
  --bad: #A8322B;
  --bad-soft: #F6E2E0;
  --warn: #8A5B0B;
  --warn-soft: #F6EBD6;
  --grid-line: rgba(13, 26, 32, .06);
  --display: "Unbounded", "Trebuchet MS", system-ui, sans-serif;
  --body: "Golos Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0A1215;
    --surface: #101B1F;
    --surface-2: #17262B;
    --ink: #E2ECEF;
    --muted: #8DA2AB;
    --rule: #22353B;
    --rule-soft: #1A2A2F;
    --accent: #2FC3AE;
    --accent-ink: #7FE3D3;
    --accent-soft: #0E2F2C;
    --on-accent: #05201C;
    --ok: #52C77E;
    --ok-soft: #10281A;
    --bad: #E9877E;
    --bad-soft: #2C1614;
    --warn: #D8A650;
    --warn-soft: #2A2110;
    --grid-line: rgba(226, 236, 239, .05);
  }
}

:root[data-theme="dark"] {
  --ground: #0A1215;
  --surface: #101B1F;
  --surface-2: #17262B;
  --ink: #E2ECEF;
  --muted: #8DA2AB;
  --rule: #22353B;
  --rule-soft: #1A2A2F;
  --accent: #2FC3AE;
  --accent-ink: #7FE3D3;
  --accent-soft: #0E2F2C;
  --on-accent: #05201C;
  --ok: #52C77E;
  --ok-soft: #10281A;
  --bad: #E9877E;
  --bad-soft: #2C1614;
  --warn: #D8A650;
  --warn-soft: #2A2110;
  --grid-line: rgba(226, 236, 239, .05);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-width: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.6;
  overflow-x: hidden;
}

h1, h2, h3, h4, p, ul, ol, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, select { font: inherit; color: inherit; }
button { appearance: none; background: none; border: 0; cursor: pointer; }
a { color: var(--accent); text-underline-offset: 3px; }
[hidden] { display: none !important; }

.shell {
  width: 100%;
  max-width: 1180px;
  margin-inline: auto;
  padding-inline: 28px;
}

.topbar {
  position: relative;
  border-bottom: 1px solid var(--rule);
  background:
    repeating-linear-gradient(to right, var(--grid-line) 0 1px, transparent 1px 28px),
    repeating-linear-gradient(to bottom, var(--grid-line) 0 1px, transparent 1px 28px),
    var(--surface);
}

.topbar-inner {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 28px;
  flex-wrap: wrap;
  padding-block: 28px 20px;
}

.identity { display: grid; gap: 8px; min-width: 0; }

.wordmark {
  font-family: var(--display);
  font-size: clamp(22px, 3.4vw, 30px);
  font-weight: 600;
  letter-spacing: -.02em;
  line-height: 1.1;
  text-wrap: balance;
}

.counters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 20px;
  font-family: var(--mono);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted);
}

.counters b { color: var(--ink); font-weight: 600; }

.modes {
  display: flex;
  gap: 4px;
  padding: 4px;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: var(--ground);
}

.mode {
  min-height: 40px;
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  color: var(--muted);
}

.mode[aria-pressed="true"] {
  background: var(--accent);
  color: var(--on-accent);
}

main { padding-block: 36px 72px; }

.eyebrow, .meta-label {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
}

.view-head { display: grid; gap: 12px; max-width: 74ch; margin-bottom: 28px; }

.view-title {
  font-family: var(--display);
  font-size: clamp(20px, 2.6vw, 26px);
  font-weight: 600;
  letter-spacing: -.015em;
  line-height: 1.2;
  text-wrap: balance;
}

.view-lede { color: var(--muted); font-size: 15px; }

.filters {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  padding-block: 16px;
  border-block: 1px solid var(--rule-soft);
  margin-bottom: 24px;
}

.chip {
  padding: 8px 12px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: .04em;
  color: var(--muted);
  background: var(--surface);
}

.chip[aria-pressed="true"] {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-weight: 600;
}

.resume-strip {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 16px 20px;
  margin-bottom: 28px;
  border: 1px solid var(--accent);
  border-left-width: 3px;
  border-radius: 8px;
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-family: var(--mono);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}

.btn {
  min-height: 40px;
  padding: 8px 16px;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: var(--surface);
  font-size: 14px;
  font-weight: 600;
}

.btn-primary {
  border-color: var(--accent);
  background: var(--accent);
  color: var(--on-accent);
}

.btn-ghost { border-color: transparent; color: var(--accent); padding-inline: 8px; }

.route { display: grid; gap: 28px; }

.stage-band { display: grid; gap: 12px; }

.stage-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--rule);
}

.stage-name {
  font-family: var(--display);
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -.01em;
}

.stage-count {
  font-family: var(--mono);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
}

.step-no {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--muted);
}

.block-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
  gap: 1px;
  background: var(--surface);
  border: 1px solid var(--rule-soft);
}

.block-card {
  display: grid;
  grid-template-columns: 46px minmax(0, 1fr);
  gap: 0 16px;
  align-content: start;
  padding: 20px;
  background: var(--surface);
  text-align: left;
  min-height: 100%;
}

.block-card, .biz-item { box-shadow: 0 0 0 1px var(--rule-soft); }
.block-card:hover, .block-card:focus-visible { background: var(--surface-2); }

.block-sigil {
  grid-row: span 3;
  display: grid;
  place-content: center;
  width: 46px;
  height: 46px;
  border: 1px solid var(--rule);
  border-radius: 8px;
  font-family: var(--display);
  font-size: 19px;
  font-weight: 600;
  color: var(--accent-ink);
  background: var(--accent-soft);
}

.block-name { font-size: 17px; font-weight: 600; line-height: 1.3; }
.block-note { color: var(--muted); font-size: 14px; line-height: 1.45; margin-top: 4px; }

.block-stats {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 16px;
  margin-top: 12px;
  font-family: var(--mono);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
}

.score-pill {
  padding: 1px 8px;
  border-radius: 999px;
  font-weight: 600;
  background: var(--surface-2);
  color: var(--ink);
}

.score-pill.is-good { background: var(--ok-soft); color: var(--ok); }
.score-pill.is-mid { background: var(--warn-soft); color: var(--warn); }
.score-pill.is-bad { background: var(--bad-soft); color: var(--bad); }

.level-tag {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
}

.level-tag.is-hard { color: var(--accent-ink); }

/* exam */
.exam-wrap { display: grid; gap: 24px; max-width: 900px; }

.gauge { display: grid; gap: 8px; }

.gauge-row {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  font-family: var(--mono);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  letter-spacing: .06em;
  text-transform: uppercase;
}

.gauge-track {
  position: relative;
  height: 8px;
  background:
    repeating-linear-gradient(to right, var(--rule) 0 1px, transparent 1px 10%),
    var(--surface-2);
  border: 1px solid var(--rule);
}

.gauge-fill { height: 100%; width: 0; background: var(--accent); }

.question {
  font-family: var(--display);
  font-size: clamp(18px, 2.3vw, 22px);
  font-weight: 600;
  line-height: 1.38;
  letter-spacing: -.01em;
  text-wrap: balance;
}

.options { display: grid; gap: 8px; }

.option {
  display: grid;
  grid-template-columns: 30px minmax(0, 1fr) 22px;
  align-items: start;
  gap: 16px;
  padding: 16px 16px;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: var(--surface);
  text-align: left;
  font-size: 15.5px;
  line-height: 1.5;
}

.option:not(:disabled):hover { border-color: var(--accent); }

.option-key {
  display: grid;
  place-content: center;
  width: 30px;
  height: 30px;
  margin-top: -2px;
  border: 1px solid var(--rule);
  border-radius: 8px;
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
}

.option-mark { font-family: var(--mono); font-weight: 600; text-align: center; }

.option.is-right { border-color: var(--ok); background: var(--ok-soft); }
.option.is-right .option-key, .option.is-right .option-mark { color: var(--ok); border-color: var(--ok); }
.option.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.option.is-wrong .option-key, .option.is-wrong .option-mark { color: var(--bad); border-color: var(--bad); }
.option.is-key { border-color: var(--ok); }
.option.is-key .option-key { color: var(--ok); border-color: var(--ok); }
.option:disabled { cursor: default; }

.verdict { display: grid; gap: 16px; padding-top: 20px; border-top: 1px solid var(--rule); }

.verdict-why { font-size: 16px; line-height: 1.6; max-width: 72ch; }

.note {
  display: grid;
  gap: 8px;
  padding: 16px 16px;
  border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0;
  background: var(--accent-soft);
  color: var(--ink);
  font-size: 14.5px;
  line-height: 1.55;
}

.note-label {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--accent-ink);
}

.exam-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: flex-end; }

/* result */
.result { display: grid; gap: 28px; max-width: 960px; }

.result-top {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 24px;
  align-items: center;
  padding: 24px;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: var(--surface);
}

.result-score {
  display: grid;
  justify-items: center;
  gap: 2px;
  padding: 16px 24px;
  border: 2px solid var(--accent);
  border-radius: 8px;
  color: var(--accent-ink);
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
}

.result-score b { font-size: 34px; line-height: 1; font-weight: 600; }
.result-score span { font-size: 12px; letter-spacing: .1em; }

.table-scroll { overflow-x: auto; border: 1px solid var(--rule-soft); }

table { width: 100%; border-collapse: collapse; background: var(--surface); }

th {
  padding: 12px 16px;
  border-bottom: 1px solid var(--rule);
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
  text-align: left;
  white-space: nowrap;
}

td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--rule-soft);
  font-size: 14.5px;
  vertical-align: top;
}

.bar-track { min-width: 120px; height: 5px; background: var(--surface-2); }
.bar-fill { height: 100%; background: var(--accent); }

details.miss { border-bottom: 1px solid var(--rule-soft); }

details.miss > summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 16px 2px;
  cursor: pointer;
  list-style: none;
  font-weight: 500;
}

details.miss > summary::-webkit-details-marker { display: none; }
details.miss > summary::after { content: "+"; font-family: var(--mono); color: var(--accent); font-size: 18px; }
details.miss[open] > summary::after { content: "–"; }
.miss-body { display: grid; gap: 12px; padding: 4px 2px 20px; max-width: 74ch; }
.miss-line { font-size: 14px; }
.miss-line b { font-family: var(--mono); font-size: 12.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); font-weight: 500; display: block; }

/* reference */
.ref-layout {
  display: grid;
  grid-template-columns: 232px minmax(0, 1fr);
  gap: 44px;
  align-items: start;
}

.ref-nav { position: sticky; top: 18px; display: grid; gap: 12px; }

.ref-search {
  width: 100%;
  min-height: 44px;
  padding: 8px 12px;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: var(--surface);
  font-size: 15px;
}

.ref-search::placeholder { color: var(--muted); }

.ref-links { display: grid; gap: 1px; }

.ref-link {
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr);
  gap: 8px;
  padding: 8px 8px;
  border-left: 2px solid var(--rule-soft);
  color: var(--muted);
  font-size: 13.5px;
  line-height: 1.3;
  text-decoration: none;
}

.ref-link b { font-family: var(--mono); font-size: 12px; color: var(--accent); }
.ref-link:hover { background: var(--surface-2); color: var(--ink); }

.sections { display: grid; gap: 40px; min-width: 0; }

.section {
  display: grid;
  gap: 24px;
  padding-bottom: 36px;
  border-bottom: 1px solid var(--rule);
  scroll-margin-top: 20px;
}

.section-head { display: grid; gap: 8px; }
.section, .sub, .theory, .practice, .practice-item { grid-template-columns: minmax(0, 1fr); min-width: 0; }
.section p, .drill, .task-text, .flash-def, .flash-use, .verdict-why, .question, .option { overflow-wrap: anywhere; }

.section-title {
  display: flex;
  align-items: baseline;
  gap: 12px;
  font-family: var(--display);
  font-size: clamp(19px, 2.4vw, 24px);
  font-weight: 600;
  letter-spacing: -.015em;
  text-wrap: balance;
}

.section-title span { font-family: var(--mono); font-size: 14px; color: var(--accent); font-weight: 500; }
.section-lede { max-width: 72ch; color: var(--muted); font-size: 15.5px; }

.sub {
  display: grid;
  gap: 16px;
}

.sub-label {
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--muted);
}

.sub-label::after { content: ""; flex: 1; height: 1px; background: var(--rule-soft); }

.theory { display: grid; gap: 20px; }
.theory-item { display: grid; gap: 4px; max-width: 74ch; }
.theory-item h4 { font-size: 16px; font-weight: 600; line-height: 1.35; }
.theory-item p { font-size: 15.5px; line-height: 1.62; }

.practice { display: grid; gap: 16px; }

.practice-item {
  display: grid;
  gap: 8px;
  padding: 16px 20px;
  border: 1px solid var(--rule-soft);
  border-radius: 8px;
  background: var(--surface);
}

.practice-item h4 { font-size: 15.5px; font-weight: 600; }
.practice-item p { font-size: 15px; line-height: 1.55; max-width: 72ch; color: var(--ink); }

pre {
  margin: 0;
  padding: 16px 16px;
  overflow-x: auto;
  border: 1px solid var(--rule-soft);
  border-radius: 8px;
  background: var(--ground);
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.6;
  tab-size: 2;
}

.biz { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 1px; background: var(--surface); border: 1px solid var(--rule-soft); }
.biz-item { display: grid; gap: 8px; padding: 16px 20px; background: var(--surface); }
.biz-item h4 { font-size: 15px; font-weight: 600; }
.biz-item p { font-size: 14.5px; line-height: 1.55; color: var(--muted); }

.terms-table td:first-child { width: 22%; }
.terms-table td:nth-child(2) { width: 40%; }
.term-name { font-family: var(--mono); font-size: 13px; line-height: 1.45; }
.term-use { color: var(--muted); }

.pitfalls { display: grid; gap: 8px; padding: 16px 20px; border-left: 3px solid var(--bad); border-radius: 0 8px 8px 0; background: var(--bad-soft); }
.pitfall { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.5; }
.pitfall::before { content: "×"; font-family: var(--mono); font-weight: 600; color: var(--bad); }

.drill { display: grid; gap: 8px; padding: 16px 20px; border: 1px dashed var(--accent); border-radius: 8px; background: var(--accent-soft); font-size: 15px; line-height: 1.58; }

.links { display: grid; gap: 1px; background: var(--rule-soft); border: 1px solid var(--rule-soft); }

.link-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px 16px;
  padding: 12px 16px;
  background: var(--surface);
  align-items: baseline;
}

.link-row a { font-weight: 600; font-size: 15px; text-decoration: none; }
.link-row a:hover { text-decoration: underline; }
.link-row p { grid-column: 1 / -1; color: var(--muted); font-size: 14px; line-height: 1.5; max-width: 72ch; }

.kind {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
}

/* library */
.stages { display: grid; gap: 1px; background: var(--rule-soft); border: 1px solid var(--rule-soft); }

.stage { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 0 20px; padding: 24px; background: var(--surface); }

.stage-num {
  grid-row: span 2;
  display: grid;
  place-content: center;
  width: 64px;
  height: 64px;
  border-radius: 50%;
  border: 1px solid var(--accent);
  color: var(--accent-ink);
  background: var(--accent-soft);
  font-family: var(--display);
  font-size: 22px;
  font-weight: 600;
}

.stage-head { display: grid; gap: 8px; }
.stage-head h3 { font-family: var(--display); font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
.stage-head p { color: var(--muted); font-size: 15px; max-width: 70ch; }
.stage-blocks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
.stage-items { margin-top: 16px; display: grid; gap: 1px; background: var(--rule-soft); border: 1px solid var(--rule-soft); }

.sources { display: grid; gap: 16px; margin-top: 36px; }

.video-group { display: grid; gap: 12px; }

.video-head {
  display: flex;
  align-items: baseline;
  gap: 12px;
  font-size: 16px;
  font-weight: 600;
}

.video-head span {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 8px;
  background: var(--accent-soft);
  color: var(--accent-ink);
}

.empty { padding: 28px 0; color: var(--muted); font-size: 15px; }

.footer-note {
  margin-top: 48px;
  padding-top: 20px;
  border-top: 1px solid var(--rule-soft);
  color: var(--muted);
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: .04em;
}

code.inline {
  font-family: var(--mono);
  font-size: .92em;
  padding: 1px 4px;
  border-radius: 8px;
  background: var(--surface-2);
  overflow-wrap: anywhere;
}

:where(button, a, input, summary, [tabindex]):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* progress */
.progress-top {
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
  gap: 1px;
  margin-bottom: 32px;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: var(--rule);
}

.progress-lead, .next-step { display: grid; gap: 12px; align-content: start; padding: 24px; background: var(--surface); }
.next-step { background: var(--accent-soft); }

.progress-figure {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 4px 12px;
  font-family: var(--display);
  font-size: clamp(40px, 7vw, 64px);
  font-weight: 600;
  letter-spacing: -.03em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.progress-figure span { font-family: var(--body); font-size: 17px; font-weight: 500; letter-spacing: 0; color: var(--muted); }

.progress-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 20px;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: .04em;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
}

.progress-meta b { color: var(--ink); font-weight: 600; }

.next-title { font-family: var(--display); font-size: 19px; font-weight: 600; line-height: 1.3; text-wrap: balance; }
.next-need { font-size: 14.5px; color: var(--accent-ink); }
.next-step .exam-actions { justify-content: flex-start; }

.stage-gauge { height: 4px; background: var(--surface-2); }
.stage-gauge div { height: 100%; background: var(--ok); }

.step-list { display: grid; gap: 1px; background: var(--rule-soft); border: 1px solid var(--rule-soft); }

.step-row {
  display: grid;
  grid-template-columns: 30px 36px minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px 16px;
  padding: 12px 16px;
  background: var(--surface);
}

.step-row[data-state="done"] { background: var(--ok-soft); }

.step-sigil {
  display: grid;
  place-content: center;
  width: 36px;
  height: 36px;
  border: 1px solid var(--rule);
  border-radius: 8px;
  font-family: var(--display);
  font-size: 13px;
  font-weight: 600;
  color: var(--accent-ink);
  background: var(--accent-soft);
}

.step-main { display: grid; gap: 2px; min-width: 0; }

.step-title {
  justify-self: start;
  padding: 0;
  font-size: 15.5px;
  font-weight: 600;
  line-height: 1.35;
  text-align: left;
  color: var(--ink);
}

.step-title:hover { color: var(--accent); }

.step-state {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
}

.step-row[data-state="done"] .step-state { color: var(--ok); }
.step-row[data-state="active"] .step-state { color: var(--warn); }

.step-marks { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }

.mark { cursor: pointer; }
.mark[aria-pressed="true"] { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }

.pill-btn { border: 1px solid transparent; font-family: var(--mono); font-size: 12px; cursor: pointer; }
.pill-btn:hover { border-color: var(--accent); }

.section-marks { display: flex; flex-wrap: wrap; gap: 8px; }

.ref-link[data-read="true"] b { color: var(--ok); }
.ref-link[data-read="true"] span::after { content: " ✓"; color: var(--ok); }

.sync-note { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }

/* today */
.today-hero {
  display: grid;
  grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
  gap: 1px;
  margin-bottom: 28px;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: var(--rule);
  overflow: hidden;
}

.hero-main, .hero-side { display: grid; gap: 16px; align-content: start; padding: 28px; background: var(--surface); }
.hero-main { background: var(--accent-soft); }
.hero-title { font-family: var(--display); font-size: clamp(22px, 3.4vw, 30px); font-weight: 600; line-height: 1.2; letter-spacing: -.02em; text-wrap: balance; }
.hero-sub { font-size: 15px; color: var(--accent-ink); max-width: 60ch; }
.hero-main .exam-actions { justify-content: flex-start; }
.btn-big { padding: 16px 24px; font-size: 16px; font-weight: 600; }

.pace { display: inline-flex; align-items: center; gap: 8px; justify-self: start; padding: 4px 12px; border-radius: 999px; font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: .04em; }
.pace.is-good { background: var(--ok-soft); color: var(--ok); }
.pace.is-mid { background: var(--warn-soft); color: var(--warn); }
.pace.is-bad { background: var(--bad-soft); color: var(--bad); }

.stat-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stat { display: grid; gap: 2px; }
.stat b { font-family: var(--display); font-size: 28px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.week-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.week-chip { display: inline-flex; gap: 8px; align-items: center; padding: 4px 12px; border: 1px solid var(--rule); border-radius: 999px; font-size: 13px; background: var(--surface); }
.week-chip b { font-family: var(--mono); font-size: 12px; color: var(--accent); }
.week-chip[data-done="true"] { border-color: var(--ok); color: var(--ok); }
.week-chip[data-done="true"] b { color: var(--ok); }

.tasks { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-bottom: 28px; }
.task {
  position: relative;
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  gap: 8px;
  padding: 20px;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: var(--surface);
  transition: transform .15s ease, border-color .15s ease;
}
.task:hover { transform: translateY(-2px); border-color: var(--accent); }
.task[data-done="true"] { background: var(--ok-soft); border-color: var(--ok); }
.task-icon { font-size: 26px; line-height: 1; }
.task-title { font-size: 17px; font-weight: 600; line-height: 1.3; }
.task-text { font-size: 14.5px; line-height: 1.5; color: var(--muted); }
.task-count { position: absolute; top: 16px; right: 16px; min-width: 30px; padding: 2px 8px; border-radius: 999px; background: var(--accent); color: var(--surface); font-family: var(--mono); font-size: 13px; font-weight: 600; text-align: center; }
.task[data-done="true"] .task-count { background: var(--ok); }
.task .btn { justify-self: start; }

.panel-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; margin-bottom: 28px; }
.panel { display: grid; gap: 16px; align-content: start; padding: 20px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); min-width: 0; }

.goal-bar { height: 12px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.goal-bar div { height: 100%; border-radius: 999px; background: var(--accent); transition: width .4s ease; }

.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 13px); gap: 4px; justify-content: start; overflow-x: auto; padding-bottom: 2px; }
.heat i { width: 13px; height: 13px; border-radius: 8px; background: var(--surface-2); }
.heat i[data-l="1"] { background: color-mix(in srgb, var(--accent) 30%, var(--surface-2)); }
.heat i[data-l="2"] { background: color-mix(in srgb, var(--accent) 60%, var(--surface-2)); }
.heat i[data-l="3"] { background: var(--accent); }
.heat i[data-today="true"] { outline: 2px solid var(--ink); outline-offset: -1px; }
.heat i[data-future="true"] { background: transparent; }

.weak-list { display: grid; gap: 8px; }
.weak-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 12px; font-size: 14.5px; }
.weak-row .step-sigil { width: 34px; height: 34px; }

.settings { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; font-size: 14px; color: var(--muted); }
.settings label { display: inline-flex; align-items: center; gap: 8px; }
.settings input, .settings select { padding: 8px 8px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); }

.kbd-hint { font-family: var(--mono); font-size: 12px; color: var(--muted); }
kbd { display: inline-block; min-width: 20px; padding: 0 4px; border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 8px; font-family: var(--mono); font-size: 11.5px; text-align: center; background: var(--surface); }

.option.is-right { animation: pop .35s ease; }
.option.is-wrong { animation: shake .35s ease; }
@keyframes pop { 40% { transform: scale(1.015); } }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

/* flashcards */
.flash-wrap { display: grid; gap: 20px; max-width: 760px; }
.flash {
  display: grid;
  gap: 16px;
  align-content: center;
  min-height: 300px;
  padding: 32px;
  border: 1px solid var(--rule);
  border-radius: 12px;
  background: var(--surface);
  text-align: left;
  animation: flip-in .3s ease;
}
.flash:hover { border-color: var(--accent); }
.flash:disabled { color: var(--ink); cursor: default; }
.flash:disabled:hover { border-color: var(--rule); }
.flash-term { font-family: var(--display); font-size: clamp(22px, 4vw, 32px); font-weight: 600; line-height: 1.2; letter-spacing: -.02em; }
.flash-hint { color: var(--muted); font-size: 14px; }
.flash-def { font-size: 16.5px; line-height: 1.6; }
.flash-use { padding: 12px 16px; border-left: 3px solid var(--accent); background: var(--surface-2); font-size: 15px; line-height: 1.55; color: var(--ink); }
.flash-grade { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.flash-grade .btn { padding: 16px; font-size: 15.5px; font-weight: 600; }
.btn-bad { border-color: var(--bad); color: var(--bad); }
.btn-bad:hover { background: var(--bad-soft); }
.btn-good { border-color: var(--ok); color: var(--ok); }
.btn-good:hover { background: var(--ok-soft); }
@keyframes flip-in { from { transform: rotateX(12deg) translateY(6px); opacity: .4; } }

.confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  z-index: 60;
  transform: translateX(-50%);
  padding: 12px 20px;
  border-radius: 999px;
  background: var(--ink);
  color: var(--ground);
  font-weight: 600;
  font-size: 15px;
  box-shadow: 0 10px 30px -10px rgba(0, 0, 0, .5);
  animation: toast-in .25s ease;
}
@keyframes toast-in { from { transform: translate(-50%, 12px); opacity: 0; } }

/* quiet chrome: sentence case labels, two weights, no hue gradients, no lift on hover */
.counters, .eyebrow, .meta-label, .gauge-row, .stage-count, .level-tag, .step-state, .stat span,
.kind, .note-label, .sub-label, th, .miss-line b, .result-score span, .pace, .stage-num, .video-head span {
  text-transform: none;
  letter-spacing: .01em;
}
.wordmark, .view-title, .hero-title, .flash-term, .question, .stage-name, .next-title, .section-title { font-weight: 600; }
.stat b, .progress-figure, .result-score b, .block-sigil, .step-sigil { font-weight: 600; }
.counters b, .progress-meta b, .task-title, .pace, .option-key { font-weight: 600; }
.hero-title, .flash-term { letter-spacing: -.01em; }
.goal-bar div { background: var(--accent); }
.task { transition: border-color .15s ease; }
.task:hover { transform: none; }
.task { grid-template-rows: auto 1fr auto; }
.task-title { padding-right: 36px; }
.task-count { background: none; color: var(--muted); padding: 0; min-width: 0; font-size: 12px; font-weight: 500; }
.task[data-done="true"] .task-count { background: none; color: var(--ok); }
.flash { background: var(--surface); box-shadow: none; animation: none; }
.toast { font-weight: 500; }

/* radius scale: controls 8, tags 6, cards 12, panels 16; press feedback; one easing */
:root { --ease: cubic-bezier(.23, 1, .32, 1); }
.score-pill, .pace, .week-chip, .chip, .level-tag { border-radius: 6px; }
.task, .panel, .lab-card, .note, .drill, .pitfalls, .practice-item, .resume-strip { border-radius: 12px; }
.block-grid, .step-list, .links, .stages, .biz, .table-scroll, .stage-items { border-radius: 12px; overflow: hidden; }
.today-hero, .progress-top, .lab-mount, .flash { border-radius: 16px; }
.toast { border-radius: 12px; animation-timing-function: var(--ease); }
.btn, .option, .chip, .mode, .lab-seg button, .lab-node, .mark, .pill-btn { transition: background-color .2s var(--ease), border-color .2s var(--ease), color .2s var(--ease), transform .12s var(--ease); }
.btn:active, .option:not(:disabled):active, .chip:active, .lab-seg button:active, .lab-node:active, .mark:active { transform: scale(.98); }
.option.is-right, .option.is-wrong { animation: none; }
.flash-def, .flash-use { animation: reveal .2s var(--ease); }
@keyframes reveal { from { opacity: 0; transform: translateY(4px); } }
.mode { transition: none; }
.skip-link { position: absolute; left: 16px; top: -48px; z-index: 70; padding: 8px 12px; border-radius: 8px; background: var(--ink); color: var(--ground); text-decoration: none; }
.skip-link:focus { top: 8px; }

/* labs */
.lab { gap: 16px; }
.lab-mount { display: grid; gap: 16px; padding: 20px; border: 1px solid var(--rule); border-radius: 12px; background: var(--surface); min-width: 0; }
.lab-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.lab-ctl { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 4px 12px; min-width: 220px; flex: 1 1 220px; font-size: 13px; color: var(--muted); }
.lab-ctl span { grid-column: 1 / -1; }
.lab-ctl input { grid-column: 1 / 3; width: 100%; accent-color: var(--accent); }
.lab-ctl output { font-family: var(--mono); font-size: 12px; color: var(--ink); font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
.lab-seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 2px; border: 1px solid var(--rule); border-radius: 8px; background: var(--ground); }
.lab-seg button { padding: 8px 12px; border-radius: 8px; font-size: 13px; color: var(--muted); transition: background-color .15s ease, color .15s ease; }
.lab-seg button:hover { color: var(--ink); }
.lab-seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--rule); }
.lab-stage { display: grid; gap: 16px; min-width: 0; }
.lab-split { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); align-items: start; }
.lab-svg { width: 100%; height: auto; display: block; overflow: visible; font-family: var(--mono); }
.lab-svg text { font-size: 12px; fill: var(--ink); text-anchor: middle; }
.lab-svg .lab-cap { font-size: 11px; fill: var(--muted); }
.lab-svg text[text-anchor="start"] { text-anchor: start; }
.lab-svg text[text-anchor="end"] { text-anchor: end; }
.lab-svg .lab-cap-accent { fill: var(--accent-ink); }
.lab-svg .lab-num { font-size: 11px; fill: var(--ink); font-weight: 500; }
.lab-svg .lab-call { font-size: 12px; text-anchor: start; fill: var(--ink); }
.lab-tok rect, .lab-key rect { fill: var(--surface); stroke: var(--rule); stroke-width: 1; }
.lab-tok { cursor: pointer; }
.lab-tok:hover rect { stroke: var(--accent); }
.lab-tok.is-on rect { fill: color-mix(in srgb, var(--accent) 14%, var(--surface)); stroke: var(--accent); }
.lab-tok:focus-visible { outline: none; }
.lab-tok:focus-visible rect { stroke: var(--ink); stroke-width: 2; }
.lab-arc { fill: none; stroke: var(--accent); stroke-linecap: round; }
.lab-key .lab-bar { fill: var(--accent); stroke: none; }
.lab-axis { stroke: var(--rule); stroke-width: 1; }
.lab-thr { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 4 3; }
.lab-line, .lab-path { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
.lab-path-muted { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-linejoin: round; opacity: .7; }
.lab-best { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.lab-pt { fill: var(--surface); stroke: var(--ink); stroke-width: 1.2; }
.lab-contour { fill: none; stroke: var(--rule); stroke-width: 1; }
.lab-hneg { fill: var(--muted); opacity: .35; }
.lab-hpos { fill: var(--accent); opacity: .85; }
.lab-int { stroke: var(--accent); stroke-width: 6; stroke-linecap: round; }
.lab-int-muted { stroke: var(--muted); stroke-width: 6; stroke-linecap: round; opacity: .6; }
.lab-out { fill: var(--bad); opacity: .08; }
.lab-mw { fill: color-mix(in srgb, var(--ink) 70%, var(--surface)); }
.lab-mk { fill: var(--accent); }
.lab-mr { fill: var(--rule); }
.br-tp { fill: var(--accent); }
.br-fn { fill: var(--surface); stroke: var(--accent); stroke-width: 1.2; }
.br-fp { fill: var(--bad); }
.br-tn { fill: var(--rule); opacity: .7; }

/* teardown plates: hairline ink, fills tinted from the line color */
.lab-plate { cursor: pointer; }
.lab-plate polygon { stroke-width: 1; stroke-linejoin: round; transition: fill .15s ease; }
.lab-plate .top { fill: color-mix(in srgb, var(--tone) 12%, var(--surface)); stroke: var(--tone); }
.lab-plate .side { fill: color-mix(in srgb, var(--tone) 28%, var(--surface)); stroke: var(--tone); }
.lab-plate .lead { fill: none; stroke: var(--muted); stroke-width: .8; }
.lab-plate .dot { fill: var(--tone); }
.lab-plate:hover .top, .lab-plate.is-on .top { fill: color-mix(in srgb, var(--tone) 30%, var(--surface)); }
.lab-plate.is-on .lab-call { font-weight: 600; }
.lab-plate:focus-visible { outline: none; }
.lab-plate:focus-visible .top { stroke-width: 2.5; }
.tone-ink { --tone: var(--ink); }
.tone-accent { --tone: var(--accent); }
.tone-ok { --tone: var(--ok); }
.tone-warn { --tone: var(--warn); }

.lab-card { display: grid; gap: 8px; align-content: start; padding: 16px; border: 1px solid var(--rule-soft); border-radius: 8px; background: var(--ground); font-size: 14.5px; line-height: 1.55; }
.lab-card b { font-weight: 600; }
.lab-warn { color: var(--bad); }
.lab-metric { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.lab-note { font-size: 14px; line-height: 1.55; color: var(--muted); max-width: 78ch; }
.lab-kv { display: grid; grid-template-columns: auto auto; gap: 4px 16px; justify-content: start; font-size: 14px; }
.lab-kv span { color: var(--muted); }
.lab-kv b { font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.lab-kv .ok, .lab-cm .ok { color: var(--ok); }
.lab-kv .bad, .lab-cm .bad { color: var(--bad); }
.lab-cm { display: grid; grid-template-columns: auto 1fr 1fr; gap: 1px; background: var(--rule-soft); border: 1px solid var(--rule-soft); font-family: var(--mono); font-size: 12.5px; }
.lab-cm > * { padding: 8px 12px; background: var(--surface); }
.lab-cm b { font-weight: 500; color: var(--muted); }

.lab-flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.lab-node { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); font-size: 13.5px; transition: border-color .15s ease, background-color .15s ease; }
.lab-node:hover { border-color: var(--accent); }
.lab-node.is-past { color: var(--muted); }
.lab-node.is-on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.lab-node-n { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.lab-arrow { width: 14px; height: 1px; background: var(--rule); position: relative; }
.lab-arrow::after { content: ""; position: absolute; right: 0; top: -3px; border: 3.5px solid transparent; border-left-color: var(--rule); border-right: 0; }

.lab-grid { display: grid; gap: 8px; }
.lab-row { display: grid; grid-template-columns: 32px 52px repeat(4, 34px); align-items: center; gap: 8px; font-size: 13px; }
.lab-row b { font-family: var(--mono); font-weight: 500; }
.lab-row .lab-cap { font-family: var(--mono); font-size: 11px; color: var(--muted); }

<script>
const DATA = __DATA__;
</script>
<script>
const QUIZ = DATA.quiz;
const FAQ = DATA.faq;
const LIB = DATA.library;
const TRACKS = DATA.tracks || { tracks: [], assignment: {} };
const ROUTE = DATA.route || { stages: [] };
const KEYS = ["А", "Б", "В", "Г", "Д", "Е"];
const STORE = "ai-trainer-v2";
const MARKS = "ai-trainer-progress-v1";
const PASS = 0.8;
const STUDY = "ai-trainer-study-v1";
const INTERVALS = [0, 1, 3, 7, 14, 30, 60];
const DEFAULT_PLAN = { deadline: "2026-12-31", perDay: 20, at: "" };
const MODES = ["today", "exam", "ref", "lib", "interview", "progress"];
const KEY_CODES = [["Digit1", "Numpad1", "KeyF"], ["Digit2", "Numpad2", "Comma"], ["Digit3", "Numpad3", "KeyD"], ["Digit4", "Numpad4", "KeyU"]];
const SECTIONS = Object.fromEntries(FAQ.sections.map(s => [s.id, s]));
const QKEY = new Map(QUIZ.questions.map(q => [q, "q" + hash(q.q)]));
const TERMS = FAQ.sections.flatMap(s => (s.terms || []).map(t => ({ sec: s.id, term: t, key: "t" + hash(s.id + "|" + t.t) })));
const STATE_LABEL = { done: "шаг пройден", active: "в работе", todo: "не начат" };
const SYNC = { ref: null, status: "local", timer: null, chain: Promise.resolve() };
const app = document.getElementById("app");
const announcer = document.getElementById("announcer");

const state = {
  mode: "today",
  level: "all",
  track: "all",
  session: null,
  cards: null,
  history: load(),
  marks: loadMarks(),
  study: loadStudy(),
  confirmReset: 0,
  query: ""
};

function hash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0).toString(36);
}

function emptyStudy() {
  return { srs: {}, days: {}, plan: { ...DEFAULT_PLAN } };
}

function loadStudy() {
  try {
    const raw = localStorage.getItem(STUDY);
    const s = raw ? JSON.parse(raw) : {};
    return { ...emptyStudy(), ...s, plan: { ...DEFAULT_PLAN, ...(s.plan || {}) } };
  } catch (e) {
    return emptyStudy();
  }
}

function saveStudy() {
  try {
    localStorage.setItem(STUDY, JSON.stringify(state.study));
  } catch (e) {}
}

function dayKey(d = new Date()) {
  const z = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`;
}

function parseDay(key) {
  const [y, m, d] = key.split("-").map(Number);
  return new Date(y, m - 1, d);
}

function shiftDay(key, n) {
  const d = parseDay(key);
  d.setDate(d.getDate() + n);
  return dayKey(d);
}

function daysBetween(a, b) {
  const utc = k => { const [y, m, d] = k.split("-").map(Number); return Date.UTC(y, m - 1, d); };
  return Math.round((utc(b) - utc(a)) / 86400000);
}

function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* FSRS-6 (open-spaced-repetition/ts-fsrs, MIT): stability s in days, difficulty d from 1 to 10.
   Ratings: 1 again, 2 hard, 3 good, 4 easy. Retention target 0.9 makes the interval equal to s. */
const FSRS = (() => {
  const w = [0.212, 1.2931, 2.3065, 8.2956, 6.4133, 0.8334, 3.0194, 0.001, 1.8722, 0.1666, 0.796,
    1.4835, 0.0614, 0.2629, 1.6483, 0.6014, 1.8729, 0.5425, 0.0912, 0.0658, 0.1542];
  const RETENTION = 0.9, MAX_IVL = 365;
  const decay = -w[20], factor = Math.pow(0.9, 1 / decay) - 1;
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const initD = g => w[4] - Math.exp((g - 1) * w[5]) + 1;
  const recall = (t, s) => Math.pow(1 + factor * t / s, decay);
  const interval = s => clamp(Math.round(s / factor * (Math.pow(RETENTION, 1 / decay) - 1)), 1, MAX_IVL);
  function next(mem, t, g) {
    if (!mem) return { s: clamp(w[g - 1], 0.001, 36500), d: clamp(initD(g), 1, 10) };
    const { s, d } = mem;
    let ns;
    if (t === 0) {
      const sinc = Math.pow(s, -w[19]) * Math.exp(w[17] * (g - 3 + w[18]));
      ns = s * (g >= 2 ? Math.max(sinc, 1) : sinc);
    } else if (g === 1) {
      const fail = w[11] * Math.pow(d, -w[12]) * (Math.pow(s + 1, w[13]) - 1) * Math.exp((1 - recall(t, s)) * w[14]);
      ns = Math.min(Math.max(s / Math.exp(w[17] * w[18]), 0.001), fail);
    } else {
      ns = s * (1 + Math.exp(w[8]) * (11 - d) * Math.pow(s, -w[9]) * (Math.exp((1 - recall(t, s)) * w[10]) - 1)
        * (g === 2 ? w[15] : 1) * (g === 4 ? w[16] : 1));
    }
    const nd = d + (-w[6] * (g - 3)) * (10 - d) / 9;
    return { s: clamp(ns, 0.001, 36500), d: clamp(w[7] * initD(4) + (1 - w[7]) * nd, 1, 10) };
  }
  return { next, recall, interval, initD, clamp };
})();

// Memory state of a card; entries saved by the old Leitner scheduler only have box and lapses
function memOf(e) {
  if (!e) return null;
  if (e.s > 0 && e.d >= 1) return { s: e.s, d: e.d };
  return { s: e.box > 0 ? INTERVALS[e.box] : 0.5, d: FSRS.clamp(FSRS.initD(3) + 1.5 * (e.lapses || 0), 1, 10) };
}

function lastDay(e) {
  if (e.last) return e.last;
  const t = e.at ? new Date(e.at) : null;
  return t && !isNaN(t) ? dayKey(t) : dayKey();
}

// Probability of recalling the card today, from 0 to 1
function recallToday(e) {
  const m = memOf(e);
  return m ? FSRS.recall(Math.max(0, daysBetween(lastDay(e), dayKey())), m.s) : 0;
}

function grade(key, ok, rating) {
  const g = rating || (ok ? 3 : 1);
  const cur = state.study.srs[key];
  const today = dayKey();
  const t = cur ? Math.max(0, daysBetween(lastDay(cur), today)) : 0;
  const mem = FSRS.next(memOf(cur), t, g);
  const ivl = g === 1 ? 0 : FSRS.interval(mem.s);
  let box = 0;
  if (g > 1) INTERVALS.forEach((v, i) => { if (i > 0 && ivl >= v) box = i; });
  state.study.srs[key] = {
    s: Math.round(mem.s * 1000) / 1000,
    d: Math.round(mem.d * 1000) / 1000,
    last: today,
    box,
    due: shiftDay(today, ivl),
    at: stamp(),
    n: (cur ? cur.n : 0) + 1,
    lapses: (cur ? cur.lapses : 0) + (g === 1 ? 1 : 0)
  };
  const d = state.study.days[today] || { n: 0, ok: 0 };
  state.study.days[today] = { n: d.n + 1, ok: d.ok + (ok ? 1 : 0), at: stamp() };
  if (d.n + 1 === state.study.plan.perDay) {
    celebrate();
    toast(`Дневная цель выполнена: ${state.study.plan.perDay} ответов`);
  }
}

function todayCount() {
  const d = state.study.days[dayKey()];
  return d ? d.n : 0;
}

function streak() {
  let day = dayKey();
  if (!state.study.days[day]) day = shiftDay(day, -1);
  let n = 0;
  while (state.study.days[day] && state.study.days[day].n > 0) {
    n += 1;
    day = shiftDay(day, -1);
  }
  return n;
}

function dueQuestions() {
  const today = dayKey();
  return QUIZ.questions
    .map(q => ({ q, e: state.study.srs[QKEY.get(q)] }))
    .filter(x => x.e && x.e.due <= today)
    .sort((a, b) => recallToday(a.e) - recallToday(b.e) || b.e.lapses - a.e.lapses)
    .map(x => x.q);
}

function weakQuestions() {
  return QUIZ.questions.filter(q => {
    const e = state.study.srs[QKEY.get(q)];
    return e && e.lapses > 0 && memOf(e).s < 5;
  });
}

function load() {
  try {
    const raw = localStorage.getItem(STORE);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function save() {
  try {
    localStorage.setItem(STORE, JSON.stringify(state.history));
  } catch (e) {}
}

function emptyMarks() {
  return { read: {}, practice: {}, started: null, updated: null, resetAt: null };
}

function loadMarks() {
  try {
    const raw = localStorage.getItem(MARKS);
    return raw ? { ...emptyMarks(), ...JSON.parse(raw) } : emptyMarks();
  } catch (e) {
    return emptyMarks();
  }
}

function saveMarks() {
  try {
    localStorage.setItem(MARKS, JSON.stringify(state.marks));
  } catch (e) {}
}

function stamp() {
  return new Date().toISOString();
}

function commit(keepStart) {
  const now = stamp();
  state.marks.updated = now;
  if (!state.marks.started && !keepStart) state.marks.started = now;
  save();
  saveMarks();
  saveStudy();
  pushRemote();
}

function snapshotProgress() {
  return {
    history: state.history,
    read: state.marks.read,
    practice: state.marks.practice,
    srs: state.study.srs,
    days: state.study.days,
    plan: state.study.plan,
    started: state.marks.started,
    updated: state.marks.updated,
    resetAt: state.marks.resetAt
  };
}

function applyProgress(p) {
  state.history = p.history || {};
  state.marks = {
    read: p.read || {},
    practice: p.practice || {},
    started: p.started || null,
    updated: p.updated || null,
    resetAt: p.resetAt || null
  };
  state.study = {
    srs: p.srs || {},
    days: p.days || {},
    plan: { ...DEFAULT_PLAN, ...(p.plan || state.study.plan) }
  };
}

function canon(value) {
  return JSON.stringify(value, (key, x) => x && typeof x === "object" && !Array.isArray(x)
    ? Object.fromEntries(Object.keys(x).sort().map(k => [k, x[k]]))
    : x);
}

function newer(a, b) {
  if (!b) return a;
  if (!a) return b;
  return (b.at || "") > (a.at || "") ? b : a;
}

function mergeProgress(local, remote) {
  if (!remote) return local;
  const resetAt = [local.resetAt, remote.resetAt].filter(Boolean).sort().pop() || null;
  const fresh = e => e && (!resetAt || (e.at || "") > resetAt);
  const pick = (x, y) => {
    const out = {};
    new Set([...Object.keys(x || {}), ...Object.keys(y || {})]).forEach(id => {
      const e = newer((x || {})[id], (y || {})[id]);
      if (fresh(e)) out[id] = e;
    });
    return out;
  };
  return {
    history: pick(local.history, remote.history),
    read: pick(local.read, remote.read),
    practice: pick(local.practice, remote.practice),
    srs: pick(local.srs, remote.srs),
    days: pick(local.days, remote.days),
    plan: newer(local.plan, remote.plan) || null,
    started: [local.started, remote.started].filter(t => t && (!resetAt || t > resetAt)).sort()[0] || null,
    updated: [local.updated, remote.updated].filter(Boolean).sort().pop() || null,
    resetAt
  };
}

function pushRemote() {
  if (!SYNC.ref) return;
  clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(() => {
    const body = JSON.parse(JSON.stringify(snapshotProgress()));
    SYNC.chain = SYNC.chain
      .then(() => SYNC.ref && SYNC.ref.set(body))
      .catch(e => {
        if (e && e.code === "unavailable") {
          setTimeout(pushRemote, 3000 + Math.random() * 2000);
          return;
        }
        SYNC.ref = null;
        SYNC.status = "local";
        renderCounters();
      });
  }, 800);
}

async function connectAccount() {
  if (!window.claude || typeof window.claude.use !== "function") return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    const uid = user ? await user.id() : null;
    if (!db || !uid) return;
    const ref = db.doc("data/users/" + uid + "/progress");
    const snap = await ref.get();
    const remote = snap.exists ? snap.data() : null;
    const local = snapshotProgress();
    const merged = mergeProgress(local, remote);
    applyProgress(merged);
    save();
    saveMarks();
    SYNC.ref = ref;
    SYNC.status = "account";
    if (!remote || canon(merged) !== canon(mergeProgress(remote, remote))) pushRemote();
    const busy = (state.session && state.session.idx < state.session.items.length) ||
      (state.cards && state.cards.idx < state.cards.items.length);
    if (state.mode === "ref") refreshMarks();
    else if (!busy) render();
    else renderCounters();
  } catch (e) {
    SYNC.ref = null;
    SYNC.status = "local";
  }
}

function isOn(kind, id) {
  const m = state.marks[kind][id];
  return !!(m && m.on);
}

function bestOf(h) {
  if (!h || !h.total) return null;
  const b = h.best && h.best.total ? h.best : null;
  return b && b.right / b.total > h.right / h.total ? b : { right: h.right, total: h.total };
}

function passed(id) {
  const b = bestOf(state.history[id]);
  return !!b && b.right / b.total >= PASS;
}

function stepState(b) {
  if (isOn("read", b.id) && passed(b.id)) return "done";
  if (isOn("read", b.id) || isOn("practice", b.id) || state.history[b.id]) return "active";
  return "todo";
}

function hasPractice(id) {
  return !!(SECTIONS[id] && (SECTIONS[id].practice || []).length);
}

function toggleMark(kind, id) {
  const on = !isOn(kind, id);
  state.marks[kind][id] = { on, at: stamp() };
  commit();
  say(on ? "Отмечено" : "Отметка снята");
}

function markButton(kind, id, onLabel, offLabel) {
  const on = isOn(kind, id);
  return `<button class="chip mark" type="button" data-mark="${kind}" data-id="${id}" data-on="${esc(onLabel)}" data-off="${esc(offLabel)}" aria-pressed="${on}">${esc(on ? "✓ " + onLabel : offLabel)}</button>`;
}

function refreshMarks() {
  app.querySelectorAll("[data-mark]").forEach(el => {
    const on = isOn(el.dataset.mark, el.dataset.id);
    el.setAttribute("aria-pressed", String(on));
    el.textContent = on ? "✓ " + el.dataset.on : el.dataset.off;
  });
  app.querySelectorAll(".ref-link[data-sec]").forEach(el => {
    el.dataset.read = String(isOn("read", el.dataset.sec));
  });
  renderCounters();
}

function bindMarks() {
  app.querySelectorAll("[data-mark]").forEach(el => {
    el.addEventListener("click", () => {
      toggleMark(el.dataset.mark, el.dataset.id);
      if (state.mode === "progress") renderProgress();
      else refreshMarks();
    });
  });
}

function openSection(id, part) {
  state.query = "";
  setMode("ref");
  const target = document.getElementById((part ? part + "-" : "sec-") + id) || document.getElementById("sec-" + id);
  if (target) target.scrollIntoView({ block: "start" });
}

function openExam(id) {
  setMode("exam");
  startBlock(id);
}

function resetAll() {
  const now = stamp();
  state.history = {};
  state.marks = { ...emptyMarks(), updated: now, resetAt: now };
  state.study = { ...emptyStudy(), plan: state.study.plan };
  state.confirmReset = 0;
  commit(true);
  say("Прогресс сброшен");
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function mono(s) {
  return esc(s).replace(/`([^`]+)`/g, '<code class="inline">$1</code>');
}

function questionsOf(id) {
  return QUIZ.questions.filter(q => q.block === id);
}

function trackOf(id) {
  const key = TRACKS.assignment[id];
  return TRACKS.tracks.find(t => t.id === key) || null;
}

function blocksByLevel() {
  return QUIZ.blocks.filter(b =>
    (state.level === "all" || b.level === state.level) &&
    (state.track === "all" || TRACKS.assignment[b.id] === state.track)
  );
}

function termCount() {
  return FAQ.sections.reduce((n, s) => n + (s.terms ? s.terms.length : 0), 0);
}

function scoreClass(r) {
  return r >= .8 ? "is-good" : r >= .6 ? "is-mid" : "is-bad";
}

function say(text) {
  announcer.textContent = text;
}

function setMode(mode) {
  state.mode = mode;
  state.session = null;
  state.cards = null;
  state.iv = null;
  MODES.forEach(m => document.getElementById("tab-" + m).setAttribute("aria-pressed", String(m === mode)));
  render();
  window.scrollTo({ top: 0 });
}

function startSession(kind, items, extra = {}) {
  if (!items.length) return;
  const list = kind === "block" ? shuffled(items) : items;
  state.cards = null;
  state.session = {
    kind,
    items: list,
    perms: list.map(q => shuffled(q.options.map((_, i) => i))),
    idx: 0,
    picked: null,
    answers: {},
    recorded: false,
    title: "",
    back: state.mode,
    ...extra
  };
  render();
  window.scrollTo({ top: 0 });
}

function startBlock(id) {
  const block = QUIZ.blocks.find(b => b.id === id);
  startSession("block", questionsOf(id), { block: id, title: block ? block.title : id });
}

function startReview() {
  startSession("review", dueQuestions().slice(0, 20), { title: "Повторение по расписанию" });
}

function startWeak() {
  startSession("weak", shuffled(weakQuestions()).slice(0, 15), { title: "Работа над ошибками" });
}

function startMix() {
  const next = nextStep();
  const limit = next ? next.order : Infinity;
  const open = new Set(QUIZ.blocks.filter(b => b.order <= limit || state.history[b.id]).map(b => b.id));
  startSession("mix", shuffled(QUIZ.questions.filter(q => open.has(q.block))).slice(0, 5), { title: "Смешанная пятиминутка" });
}

function nextStep() {
  return QUIZ.blocks.find(b => stepState(b) !== "done") || null;
}

function pick(orig) {
  const s = state.session;
  if (!s || s.picked !== null) return;
  const q = s.items[s.idx];
  const ok = orig === q.correct;
  s.picked = orig;
  s.answers[s.idx] = orig;
  grade(QKEY.get(q), ok);
  commit();
  say(ok ? "Верно" : "Неверно");
  renderQuestion();
  const next = document.getElementById("next");
  if (next) next.focus({ preventScroll: true });
}

function advance() {
  const s = state.session;
  if (!s || s.picked === null) return;
  s.idx += 1;
  s.picked = null;
  render();
  window.scrollTo({ top: 0 });
}

function leaveSession() {
  const back = state.session ? state.session.back : state.mode;
  state.session = null;
  state.cards = null;
  setMode(back);
}

function materialCount() {
  const urls = new Set();
  FAQ.sections.forEach(s => (s.resources || []).forEach(r => urls.add(r.u)));
  LIB.roadmap.forEach(s => s.items.forEach(r => urls.add(r.u)));
  (LIB.catalog ? LIB.catalog.groups : []).forEach(g => g.items.forEach(r => urls.add(r.u)));
  return urls.size;
}

function renderCounters() {
  const el = document.getElementById("counters");
  const done = QUIZ.blocks.filter(b => stepState(b) === "done").length;
  const items = [
    `<b>${QUIZ.questions.length}</b> вопросов`,
    `<b>${QUIZ.blocks.length}</b> блоков`,
    `<b>${ROUTE.stages.length}</b> этапов`,
    `<b>${termCount()}</b> терминов`,
    `<b>${materialCount()}</b> материалов`
  ].map(x => `<span class="cnt">${x}</span><span class="cnt-sep" aria-hidden="true">·</span>`).join("");
  el.innerHTML = items + `<span class="cnt cnt-main">пройдено <b>${done}</b> из ${QUIZ.blocks.length} шагов</span>`;
}

function render() {
  renderCounters();
  if (state.cards) return renderCards();
  if (state.iv) return state.iv.idx >= state.iv.items.length ? renderIvResult() : renderIvItem();
  if (state.mode === "interview") return renderInterview();
  if (state.session) return state.session.idx >= state.session.items.length ? renderResult() : renderQuestion();
  if (state.mode === "today") return renderToday();
  if (state.mode === "ref") return renderReference();
  if (state.mode === "lib") return renderLibrary();
  if (state.mode === "progress") return renderProgress();
  return renderStart();
}

function cardOf(b) {
  const n = questionsOf(b.id).length;
  const h = bestOf(state.history[b.id]);
  const pill = h
    ? `<span class="score-pill ${scoreClass(h.right / h.total)}" title="лучший результат">${h.right}/${h.total}</span>`
    : `<span class="score-pill">не пройден</span>`;
  return `<button class="block-card" type="button" data-block="${b.id}">
    <span class="block-sigil">${b.id}</span>
    <span class="block-name"><span class="step-no">${b.order}.</span> ${esc(b.title)}</span>
    <span class="block-note">${esc(b.hint || b.note || "")}</span>
    <span class="block-stats">
      <span class="level-tag ${b.level === "экспертный" ? "is-hard" : ""}">${esc(b.level || "")}</span>
      ${trackOf(b.id) ? `<span class="level-tag">${esc(trackOf(b.id).title)}</span>` : ""}
      <span>${n} вопросов</span>
      ${pill}
    </span>
  </button>`;
}

function renderStart() {
  const list = blocksByLevel();
  const stages = ROUTE.stages.filter(name => list.some(b => b.stage === name));
  const cards = stages.map(name => {
    const group = list.filter(b => b.stage === name);
    const done = group.filter(b => passed(b.id)).length;
    return `<section class="stage-band">
      <header class="stage-head">
        <h3 class="stage-name">${esc(name)}</h3>
        <span class="stage-count">${done} из ${group.length} сдано</span>
      </header>
      <div class="block-grid">${group.map(cardOf).join("")}</div>
    </section>`;
  }).join("");

  const answered = Object.values(state.history);
  const right = answered.reduce((s, h) => s + h.right, 0);
  const total = answered.reduce((s, h) => s + h.total, 0);

  app.innerHTML = `
    <div class="view-head">
      <p class="eyebrow">Экзамен</p>
      <h2 class="view-title">Выбери блок и отвечай без подсказок</h2>
      <p class="view-lede">Каждый вопрос разбирается сразу после ответа: почему верный вариант верен и чем именно плохи остальные. В конце блока собирается лист ошибок.</p>
    </div>
    ${total ? `<div class="resume-strip">
      <span>Суммарно верно ${right} из ${total} · сдано блоков ${QUIZ.blocks.filter(b => passed(b.id)).length} из ${QUIZ.blocks.length}</span>
      <button class="btn btn-ghost" type="button" id="toprogress">Открыть прогресс</button>
    </div>` : ""}
    <div class="filters" role="group" aria-label="Сложность">
      <span class="eyebrow">Сложность</span>
      <button class="chip" type="button" data-level="all" aria-pressed="${state.level === "all"}">все</button>
      <button class="chip" type="button" data-level="базовый" aria-pressed="${state.level === "базовый"}">базовый</button>
      <button class="chip" type="button" data-level="продвинутый" aria-pressed="${state.level === "продвинутый"}">продвинутый</button>
      <button class="chip" type="button" data-level="экспертный" aria-pressed="${state.level === "экспертный"}">экспертный</button>
    </div>
    <div class="filters" role="group" aria-label="Трек">
      <span class="eyebrow">Трек</span>
      <button class="chip" type="button" data-track="all" aria-pressed="${state.track === "all"}">все</button>
      ${TRACKS.tracks.map(t => `<button class="chip" type="button" data-track="${t.id}" aria-pressed="${state.track === t.id}">${esc(t.title)}</button>`).join("")}
    </div>
    <div class="route">${cards.length ? cards : `<p class="empty">В этом сочетании фильтров блоков нет.</p>`}</div>
    <p class="footer-note">${esc(syncText())}</p>
  `;

  app.querySelectorAll("[data-block]").forEach(el => {
    el.addEventListener("click", () => startBlock(el.dataset.block));
  });
  app.querySelectorAll("[data-level]").forEach(el => {
    el.addEventListener("click", () => { state.level = el.dataset.level; render(); });
  });
  app.querySelectorAll("[data-track]").forEach(el => {
    el.addEventListener("click", () => { state.track = el.dataset.track; render(); });
  });
  const toProgress = document.getElementById("toprogress");
  if (toProgress) toProgress.addEventListener("click", () => setMode("progress"));
}

function sessionLabel(s) {
  return s.kind === "block" ? "К списку блоков" : "К плану на сегодня";
}

function renderQuestion() {
  const s = state.session;
  const q = s.items[s.idx];
  const perm = s.perms[s.idx];
  const block = QUIZ.blocks.find(b => b.id === q.block);
  const picked = s.picked;
  const done = picked !== null;
  const total = s.items.length;
  const pct = Math.round((s.idx + (done ? 1 : 0)) / total * 100);
  const right = Object.entries(s.answers).filter(([i, a]) => s.items[i].correct === a).length;
  const head = s.kind === "block"
    ? `Блок ${block.id} · ${esc(block.title)}`
    : `${esc(s.title)} · блок ${block.id}`;

  const options = perm.map((orig, j) => {
    let cls = "option";
    let mark = "";
    if (done) {
      if (orig === picked && orig === q.correct) { cls += " is-right"; mark = "✓"; }
      else if (orig === picked) { cls += " is-wrong"; mark = "✕"; }
      else if (orig === q.correct) { cls += " is-key"; mark = "✓"; }
    }
    return `<button class="${cls}" type="button" data-opt="${orig}" ${done ? "disabled" : ""}>
      <span class="option-key">${KEYS[j]}</span>
      <span>${esc(q.options[orig])}</span>
      <span class="option-mark">${mark}</span>
    </button>`;
  }).join("");

  app.innerHTML = `
    <div class="exam-wrap">
      <div class="gauge">
        <div class="gauge-row">
          <span>${head}</span>
          <span>${s.idx + 1} / ${total} · верно ${right}</span>
        </div>
        <div class="gauge-track"><div class="gauge-fill" style="width:${pct}%"></div></div>
      </div>
      <h2 class="question">${esc(q.q)}</h2>
      <div class="options">${options}</div>
      ${done ? `<div class="verdict">
        <p class="verdict-why">${mono(q.why)}</p>
        ${q.case ? `<div class="note"><span class="note-label">Из твоей практики</span><span>${mono(q.case)}</span></div>` : ""}
      </div>` : `<p class="kbd-hint">Клавиши <kbd>1</kbd>–<kbd>4</kbd> или <kbd>А</kbd>–<kbd>Г</kbd> выбирают ответ, <kbd>Enter</kbd> ведёт дальше</p>`}
      <div class="exam-actions">
        <button class="btn" type="button" id="quit">${sessionLabel(s)}</button>
        ${done ? `<button class="btn btn-primary" type="button" id="next">${s.idx + 1 === total ? "Итоги" : "Дальше →"}</button>` : ""}
      </div>
    </div>
  `;

  app.querySelectorAll("[data-opt]").forEach(el => {
    el.addEventListener("click", () => pick(Number(el.dataset.opt)));
  });
  document.getElementById("quit").addEventListener("click", leaveSession);
  const next = document.getElementById("next");
  if (next) next.addEventListener("click", advance);
}

function renderResult() {
  const s = state.session;
  const items = s.items;
  const block = s.kind === "block" ? QUIZ.blocks.find(b => b.id === s.block) : null;
  const right = items.reduce((n, q, i) => n + (s.answers[i] === q.correct ? 1 : 0), 0);
  const pct = Math.round(right / items.length * 100);
  if (block && !s.recorded) {
    const wasPassed = passed(block.id);
    const prev = bestOf(state.history[block.id]);
    const best = prev && prev.right / prev.total > right / items.length ? prev : { right, total: items.length };
    state.history[block.id] = { right, total: items.length, at: stamp(), best };
    commit();
    if (!wasPassed && passed(block.id)) {
      celebrate();
      toast(`Блок ${block.id} сдан`);
    }
  }
  if (!block && !s.recorded && pct >= 80) celebrate();
  s.recorded = true;

  const misses = items.map((q, i) => ({ q, i })).filter(({ q, i }) => s.answers[i] !== q.correct);
  const missHtml = misses.length ? misses.map(({ q, i }) => `
    <details class="miss">
      <summary>${esc(q.q)}</summary>
      <div class="miss-body">
        <p class="miss-line"><b>Ты выбрал</b>${esc(q.options[s.answers[i]] ?? "нет ответа")}</p>
        <p class="miss-line"><b>Верно</b>${esc(q.options[q.correct])}</p>
        <p>${mono(q.why)}</p>
        ${q.case ? `<div class="note"><span class="note-label">Из твоей практики</span><span>${mono(q.case)}</span></div>` : ""}
      </div>
    </details>`).join("") : `<p class="empty">Ошибок нет. ${block ? "Возьми блок посложнее." : "Так держать."}</p>`;

  const rows = block ? QUIZ.blocks.map(b => {
    const h = bestOf(state.history[b.id]);
    const r = h ? h.right / h.total : 0;
    return `<tr>
      <td class="term-name">${b.id}</td>
      <td>${esc(b.title)}</td>
      <td style="font-family:var(--mono);font-variant-numeric:tabular-nums">${h ? `${h.right}/${h.total}` : "—"}</td>
      <td><div class="bar-track"><div class="bar-fill" style="width:${Math.round(r * 100)}%"></div></div></td>
    </tr>`;
  }).join("") : "";

  const best = block ? bestOf(state.history[block.id]) : null;
  const lede = right === items.length
    ? (block ? "Блок закрыт без ошибок." : "Без ошибок.")
    : `Ошибок ${items.length - right}. Они уже в повторении: сегодня, потом через день, потом реже.`;

  app.innerHTML = `
    <div class="result">
      <div class="result-top">
        <div>
          <p class="eyebrow">${block ? `Итог блока ${block.id}` : "Итог"}</p>
          <h2 class="view-title">${esc(block ? block.title : s.title)}</h2>
          <p class="view-lede">Верно ${right} из ${items.length}. ${lede}${block && best && (best.right !== right || best.total !== items.length) ? ` Лучший результат по блоку ${best.right}/${best.total}, он и идёт в зачёт.` : ""}</p>
        </div>
        <div class="result-score"><b>${pct}%</b><span>${right}/${items.length}</span></div>
      </div>

      <div class="exam-actions" style="justify-content:flex-start">
        ${misses.length ? `<button class="btn btn-primary" type="button" id="redo">Перерешать ошибки (${misses.length})</button>` : ""}
        ${block ? `<button class="btn" type="button" id="again">Пройти блок заново</button>
        <button class="btn" type="button" id="toref">Открыть справочник блока</button>` : ""}
        <button class="btn ${misses.length ? "" : "btn-primary"}" type="button" id="back">${sessionLabel(s)}</button>
      </div>

      <section class="sub">
        <h3 class="sub-label">Ошибки и разбор</h3>
        ${missHtml}
      </section>

      ${block ? `<section class="sub">
        <h3 class="sub-label">Карта прогресса</h3>
        <div class="table-scroll">
          <table>
            <thead><tr><th>Блок</th><th>Тема</th><th>Лучший счёт</th><th>Доля</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </section>` : ""}
    </div>
  `;

  const redo = document.getElementById("redo");
  if (redo) redo.addEventListener("click", () => {
    const back = s.back;
    startSession("mistakes", misses.map(m => m.q), { title: "Ошибки ещё раз", back });
  });
  document.getElementById("back").addEventListener("click", leaveSession);
  if (block) {
    document.getElementById("again").addEventListener("click", () => {
      const back = s.back;
      startBlock(block.id);
      state.session.back = back;
    });
    document.getElementById("toref").addEventListener("click", () => openSection(block.id));
  }
}

function sectionMatches(sec, q) {
  if (!q) return true;
  return JSON.stringify(sec).toLowerCase().includes(q);
}

function renderTheory(sec) {
  if (!sec.theory) return "";
  return `<section class="sub"><h3 class="sub-label">Теория</h3><div class="theory">${
    sec.theory.map(t => `<article class="theory-item"><h4>${esc(t.h)}</h4><p>${mono(t.p)}</p></article>`).join("")
  }</div></section>`;
}

function renderPractice(sec) {
  if (!sec.practice) return "";
  return `<section class="sub"><h3 class="sub-label">Практика</h3><div class="practice">${
    sec.practice.map(p => `<article class="practice-item">
      <h4>${esc(p.t)}</h4>
      <p>${mono(p.d)}</p>
      ${p.code ? `<pre tabindex="0"><code>${esc(p.code)}</code></pre>` : ""}
    </article>`).join("")
  }</div></section>`;
}

function renderBusiness(sec) {
  if (!sec.business) return "";
  return `<section class="sub"><h3 class="sub-label">Где это в бизнесе</h3><div class="biz">${
    sec.business.map(b => `<article class="biz-item"><h4>${esc(b.t)}</h4><p>${mono(b.d)}</p></article>`).join("")
  }</div></section>`;
}

function renderTerms(sec) {
  if (!sec.terms || !sec.terms.length) return "";
  return `<section class="sub"><h3 class="sub-label">Термины</h3>
    <div class="table-scroll">
      <table class="terms-table">
        <thead><tr><th>Термин</th><th>Что это</th><th>Как применяется</th></tr></thead>
        <tbody>${sec.terms.map(t => `<tr>
          <td class="term-name">${esc(t.t)}</td>
          <td>${mono(t.d)}</td>
          <td class="term-use">${mono(t.m)}</td>
        </tr>`).join("")}</tbody>
      </table>
    </div>
  </section>`;
}

function renderPitfalls(sec) {
  if (!sec.pitfalls || !sec.pitfalls.length) return "";
  return `<section class="sub"><h3 class="sub-label">Ловушки</h3>
    <div class="pitfalls">${sec.pitfalls.map(p => `<p class="pitfall"><span>${mono(p)}</span></p>`).join("")}</div>
  </section>`;
}

function renderDrill(sec) {
  if (!sec.drill) return "";
  return `<section class="sub" id="drill-${sec.id}"><h3 class="sub-label">Задание</h3>
    <div class="drill">${mono(sec.drill)}</div>
  </section>`;
}

function linkRows(items) {
  return items.map(r => `<div class="link-row">
    <a href="${esc(r.u)}" target="_blank" rel="noopener">${esc(r.t)}</a>
    <span class="kind">${esc(r.k || "")}${r.lang ? " · " + esc(r.lang) : ""}</span>
    <p>${mono(r.n || "")}</p>
  </div>`).join("");
}

function renderLinks(items) {
  return `<div class="links">${linkRows(items)}</div>`;
}

function renderResources(sec) {
  if (!sec.resources || !sec.resources.length) return "";
  return `<section class="sub"><h3 class="sub-label">Материалы</h3>${renderLinks(sec.resources)}</section>`;
}

function renderReference() {
  const q = state.query.trim().toLowerCase();
  const shown = FAQ.sections.filter(s => sectionMatches(s, q));

  const nav = FAQ.sections.map(s => {
    const on = shown.includes(s);
    return `<a class="ref-link" href="#sec-${s.id}" data-sec="${s.id}" data-read="${isOn("read", s.id)}" style="${on ? "" : "opacity:.35"}"><b>${s.id}</b><span>${esc(s.title)}</span></a>`;
  }).join("");

  const body = shown.length ? shown.map(s => `
    <section class="section" id="sec-${s.id}">
      <div class="section-head">
        <h2 class="section-title"><span>${s.id}</span>${esc(s.title)}</h2>
        <p class="section-lede">${mono(s.lead)}</p>
      </div>
      ${renderLab(s)}
      ${renderTheory(s)}
      ${renderPractice(s)}
      ${renderBusiness(s)}
      ${renderTerms(s)}
      ${renderPitfalls(s)}
      ${renderDrill(s)}
      ${renderResources(s)}
      <div class="section-marks" role="group" aria-label="Отметки раздела ${s.id}">
        ${markButton("read", s.id, "Раздел прочитан", "Отметить раздел прочитанным")}
        ${hasPractice(s.id) ? markButton("practice", s.id, "Практики сделаны", "Отметить практики сделанными") : ""}
      </div>
    </section>`).join("") : `<p class="empty">По запросу «${esc(state.query)}» ничего не нашлось.</p>`;

  app.innerHTML = `
    <div class="view-head">
      <p class="eyebrow">Справочник</p>
      <h2 class="view-title">Теория, практика и где это встречается в работе</h2>
      <p class="view-lede">Разделы совпадают с блоками экзамена. Поиск идёт по всему содержимому раздела, включая термины и код.</p>
    </div>
    <div class="ref-layout">
      <aside class="ref-nav">
        <label class="sr-only" for="q">Поиск по справочнику</label>
        <input class="ref-search" id="q" type="search" placeholder="Например: Макнемар, косинус, Optuna" value="${esc(state.query)}">
        <p class="meta-label">${shown.length} из ${FAQ.sections.length} разделов</p>
        <nav class="ref-links">${nav}</nav>
      </aside>
      <div class="sections">${body}</div>
    </div>
  `;

  bindMarks();
  mountLabs(app);

function plural(n, one, few, many) {
  const a = Math.abs(n) % 100;
  const b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}

function planInfo() {
  const steps = QUIZ.blocks;
  const today = dayKey();
  const deadline = state.study.plan.deadline || DEFAULT_PLAN.deadline;
  const daysLeft = Math.max(0, daysBetween(today, deadline));
  const done = steps.filter(b => stepState(b) === "done").length;
  const remaining = steps.filter(b => stepState(b) !== "done");
  const weeksLeft = Math.max(1, daysLeft / 7);
  const perWeek = Math.ceil(remaining.length / weeksLeft);
  const startKey = state.marks.started ? dayKey(new Date(state.marks.started)) : today;
  const span = Math.max(1, daysBetween(startKey, deadline));
  const elapsed = Math.min(span, Math.max(0, daysBetween(startKey, today)));
  const expected = Math.floor(steps.length * elapsed / span);
  const behind = Math.max(0, expected - done);
  const weekEnd = shiftDay(today, (7 - parseDay(today).getDay()) % 7);
  const weekTargets = remaining.slice(0, Math.max(1, Math.min(perWeek, remaining.length)));
  return { steps, today, deadline, daysLeft, done, remaining, perWeek, behind, weekEnd, weekTargets };
}

function unlockedTerms() {
  const next = nextStep();
  const limit = next ? next.order : Infinity;
  const open = new Set(QUIZ.blocks.filter(b => b.order <= limit || isOn("read", b.id)).map(b => b.id));
  return TERMS.filter(c => open.has(c.sec));
}

function cardDeck(limit = 12) {
  const today = dayKey();
  const pool = unlockedTerms();
  const due = pool.filter(c => state.study.srs[c.key] && state.study.srs[c.key].due <= today);
  const fresh = pool.filter(c => !state.study.srs[c.key]);
  const order = id => (QUIZ.blocks.find(b => b.id === id) || { order: 99 }).order;
  fresh.sort((a, b) => order(b.sec) - order(a.sec));
  const deck = shuffled(due).slice(0, limit);
  return deck.concat(fresh.slice(0, Math.min(8, limit - deck.length)));
}

function startCards() {
  const items = cardDeck();
  if (!items.length) return;
  state.session = null;
  state.cards = { items, idx: 0, flipped: false, known: 0, back: state.mode };
  render();
  window.scrollTo({ top: 0 });
}

function flipCard() {
  if (!state.cards || state.cards.flipped) return;
  state.cards.flipped = true;
  renderCards();
}

function gradeCard(ok) {
  const c = state.cards;
  if (!c || !c.flipped) return;
  grade(c.items[c.idx].key, ok);
  commit();
  if (ok) c.known += 1;
  c.idx += 1;
  c.flipped = false;
  if (c.idx >= c.items.length && c.known === c.items.length) celebrate();
  renderCards();
}

function heatmap(weeks = 14) {
  const today = dayKey();
  const dow = (parseDay(today).getDay() + 6) % 7;
  const start = shiftDay(today, -(weeks - 1) * 7 - dow);
  const goal = state.study.plan.perDay || 20;
  const cells = [];
  for (let i = 0; i < weeks * 7; i++) {
    const key = shiftDay(start, i);
    const n = (state.study.days[key] || { n: 0 }).n;
    const l = n === 0 ? 0 : n < goal / 2 ? 1 : n < goal ? 2 : 3;
    const future = key > today;
    cells.push(`<i data-l="${future ? 0 : l}" ${key === today ? 'data-today="true"' : ""} ${future ? 'data-future="true"' : ""} title="${fmtDate(key + "T12:00:00")}: ${n} ${plural(n, "ответ", "ответа", "ответов")}"></i>`);
  }
  return `<div class="heat" aria-hidden="true">${cells.join("")}</div>`;
}

}

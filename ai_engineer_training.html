ельно фиксируется, что происходит при отказе: задача закрывается, откладывается или уходит оператору целиком."}],"practice":[{"t":"Описать инструмент так, чтобы модель не ошибалась","d":"Опиши схему параметров с типами и примерами, а в описании укажи границу применимости. Потом прогони двадцать запросов и посчитай долю вызовов не того инструмента.","code":"TOOL = {\n  'name': 'find_document',\n  'description': 'Поиск документа по номеру или дате. Не использовать для поиска по тексту письма.',\n  'input_schema': {\n    'type': 'object',\n    'properties': {\n      'number': {'type': ['string', 'null'], 'description': 'Исходящий номер, например РЦ-ИСХ-6596'},\n      'date': {'type': ['string', 'null'], 'description': 'Дата в формате YYYY-MM-DD'},\n    },\n    'required': ['number', 'date'],\n  },\n}"},{"t":"Предохранители в цикле","d":"Лимит шагов, бюджет токенов и защита от повтора одного и того же вызова. Двадцать строк, которые превращают зависание в понятный отказ.","code":"seen, spent = set(), 0\nfor step in range(MAX_STEPS):\n    out = model(messages, tools=TOOLS)\n    spent += out.usage.input_tokens + out.usage.output_tokens\n    if spent > TOKEN_BUDGET:\n        return 'stopped: token budget'\n    if out.stop_reason != 'tool_use':\n        return out.text\n    key = (out.tool.name, json.dumps(out.tool.args, sort_keys=True))\n    if key in seen:\n        return 'stopped: repeated call'\n    seen.add(key)\n    messages.append(run_tool(out.tool))\nreturn 'stopped: step limit'"},{"t":"Оценка агента на наборе задач","d":"Двадцать задач с проверяемым исходом: получилось или нет, за сколько шагов, во сколько токенов. Эти три числа говорят о качестве больше, чем любое впечатление."},{"t":"Трейс каждого шага","d":"Пиши шаг, инструмент, аргументы, результат и токены в структурированный лог. Без него разбор падения агента превращается в гадание."},{"t":"Структурированная ошибка инструмента","d":"Таймаут, пустой результат и отказ по правам это три разных исхода. Общее сообщение об ошибке лишает агента информации для восстановления.","code":"def call_tool(name, args):\n    try:\n        result = TOOLS[name](**args)\n    except TimeoutError as err:\n        return {'status': 'transient', 'kind': 'timeout',\n                'attempted': args, 'retry': True, 'detail': str(err)}\n    except PermissionError as err:\n        return {'status': 'denied', 'attempted': args,\n                'retry': False, 'escalate': True, 'detail': str(err)}\n    if not result:\n        return {'status': 'empty', 'attempted': args,\n                'retry': False, 'note': 'источник ответил, совпадений нет'}\n    return {'status': 'ok', 'data': result}"},{"t":"Оценка агента по четырём числам","d":"Доля решённых, шаги, стоимость, срабатывания предохранителей. Успех за сорок шагов вместо четырёх это не успех.","code":"report = {\n    'solved': sum(r.solved for r in runs) / len(runs),\n    'steps_median': median(r.steps for r in runs),\n    'cost_avg': sum(r.cost for r in runs) / len(runs),\n    'guard_hits': sum(r.guard_hits for r in runs),\n    'wrong_refusals': sum(r.refused and r.solvable for r in runs),\n}\nfor k, v in report.items():\n    print(f'{k:16} {v}')"}],"business":[{"t":"Разбор входящей почты и документов","d":"Агент читает письмо, находит документ в архиве, заполняет карточку, при неуверенности отдаёт человеку. Ценность считается в доле обращений, прошедших без оператора, при явном ограничении на необратимые действия."},{"t":"Внутренний помощник по системам компании","d":"Доступ к поиску, тикетам и базе знаний через инструменты. Здесь права важнее качества: агенту с правом писать в прод-систему нужен контур подтверждения."},{"t":"Автоматизация рутины разработки","d":"Кодовые агенты в CI: правки по issue, обновление зависимостей, разбор упавших тестов. Экономика простая — стоимость запуска против времени инженера, а лимиты шагов защищают от бесконечной попытки."},{"t":"Когда агент не нужен","d":"Если шаги известны заранее, конвейер дешевле, предсказуемее и проще в поддержке. Умение обосновать отказ от агента экономит заказчику и деньги, и разбор инцидентов."}],"resources":[{"t":"Building Effective Agents (Anthropic)","u":"https://www.anthropic.com/engineering/building-effective-agents","k":"статья","lang":"en","n":"Паттерны и их цена: когда конвейер, когда агент."},{"t":"Anthropic — Tool use","u":"https://docs.anthropic.com/en/docs/agents-and-tools/tool-use/overview","k":"документация","lang":"en","n":"Схемы инструментов, принудительный выбор, обработка ошибок вызова."},{"t":"ReAct: Synergizing Reasoning and Acting","u":"https://arxiv.org/abs/2210.03629","k":"статья","lang":"en","n":"Первоисточник цикла «мысль, действие, наблюдение»."},{"t":"Model Context Protocol","u":"https://modelcontextprotocol.io/","k":"спецификация","lang":"en","n":"Стандарт подключения инструментов вместо самописной обёртки под каждого клиента."},{"t":"OWASP Top 10 для LLM-приложений","u":"https://genai.owasp.org/llm-top-10/","k":"документация","lang":"en","n":"Инъекции через данные и чрезмерные полномочия агента как отдельные классы риска."},{"t":"Model Context Protocol","u":"https://modelcontextprotocol.io/docs/getting-started/intro","k":"документация","lang":"en","n":"Протокол подключения инструментов и источников данных к моделям."}]},{"id":"V","title":"Продвинутый RAG и его метрики","level":"экспертный","lead":"Базовый RAG собирается за вечер и в проде не работает. Разница — в нарезке, в двухступенчатом поиске и в том, что качество меряют четырьмя метриками, а не одной.","terms":[{"t":"Стратегии нарезки","d":"По фиксированному размеру, рекурсивная по разделителям, по структуре документа, семантическая. Перекрытие смягчает разрыв смысла на границе.","m":"Первый источник ошибок: разрезанный смысл не находится никогда, потому что в чанке нет термина, по которому ищут."},{"t":"Заголовочный контекст в чанке","d":"Хранение пути раздела вместе с фрагментом, чтобы кусок оставался осмысленным вне документа.","m":"Для бланка это была бы шапка: «Исходящий №», оторванный от значения, перестаёт быть реквизитом."},{"t":"Query rewriting","d":"Переписывание короткого запроса в развёрнутый перед поиском.","m":"Лечит разрыв между тем, как спрашивают, и тем, как написано в документах."},{"t":"HyDE","d":"Генерация гипотетического ответа и поиск по нему: ответ лексически ближе к искомому документу, чем вопрос.","m":"Приём, который спрашивают сразу после «что такое RAG». Знать формулировку."},{"t":"RRF","d":"Reciprocal Rank Fusion: слияние ранжирований по обратным рангам, а не по оценкам. Оценки BM25 и косинуса живут в разных шкалах и несопоставимы.","m":"Тот же принцип, что в твоих замерах: складывать можно только сопоставимое."},{"t":"Bi-encoder против cross-encoder","d":"Первый считает эмбеддинг документа заранее и потому дёшев на большом корпусе; второй читает пару «запрос + документ» вместе, точнее и дороже.","m":"Отсюда двухступенчатая схема: дешёвый отбор top-50, дорогое упорядочивание внутри."},{"t":"context recall","d":"Доля нужных фрагментов, попавших в переданный контекст. Потолок всей системы.","m":"Если фрагмента нет в контексте, генератор физически не может ответить верно — как реквизит, которого нет во входном документе."},{"t":"context precision","d":"Доля релевантного среди переданного. Низкая означает, что модель тонет в мусоре и отвлекается.","m":"Растёт от re-ranking'а сильнее, чем от увеличения top-k."},{"t":"faithfulness","d":"Опирается ли ответ на переданный контекст или содержит добавленное от себя.","m":"Прямой аналог твоей проверки на выдуманный номер: заполнено ли из документа или дописано правдоподобно."},{"t":"answer relevancy","d":"Отвечает ли ответ на заданный вопрос. Может быть низкой при высоком faithfulness — всё верно, но не о том.","m":"Четыре метрики нужны, чтобы локализовать поломку: ретривер, генератор или формулировка."},{"t":"Многошаговый вопрос","d":"Ответ собирается из нескольких документов, и ни один фрагмент не содержит его целиком.","m":"Требует декомпозиции на подвопросы. Включать после разбора промахов, а не заранее."},{"t":"Проверяемая цитата","d":"Идентификатор фрагмента рядом с каждым утверждением, проверяемый по поданному контексту.","m":"Делает разбор ошибок дешёвым: сразу видно, ошибся поиск или генератор."},{"t":"Правильный отказ","d":"Ответ «в документах нет», когда найденное не содержит ответа.","m":"Меряется отдельным набором вопросов, ответов на которые в корпусе заведомо нет."},{"t":"Фильтрация по правам до поиска","d":"Права проверяются на уровне запроса к индексу, а не вычёркиванием из готовой выдачи.","m":"Иначе по числу вычеркнутого пользователь догадывается о существовании закрытых документов."}],"pitfalls":["Считать одну общую метрику RAG и не знать, что чинить при её падении.","Складывать оценки BM25 и косинусной близости напрямую.","Наращивать top-k вместо того, чтобы починить нарезку.","Ставить cross-encoder на весь корпус и удивляться стоимости.","Улучшать промпт генератора, не измерив recall ретривера."],"drill":"Собери игрушечный RAG на своих же 95 документах: нарезка по абзацам с перекрытием, гибрид BM25 плюс эмбеддинги через RRF, reranker на top-20. Придумай двадцать вопросов и померь recall@5 и faithfulness. Цель не результат, а чтобы механика прошла через руки: после своей сборки понимание другого качества.","theory":[{"h":"Четыре метрики вместо одной","p":"Качество RAG раскладывается на четыре независимых числа. context recall: доля нужных фрагментов, попавших в контекст, потолок всей системы. context precision: доля релевантного среди переданного, показывает, тонет ли модель в мусоре. faithfulness: опирается ли ответ на переданное или добавляет от себя. answer relevancy: отвечает ли ответ на вопрос. Комбинации диагностичны: низкий recall чинится поиском, низкая precision — переранжированием и уменьшением k, низкая faithfulness — промптом и требованием цитаты, низкая relevancy при высокой faithfulness означает, что модель отвечает на другой вопрос."},{"h":"Запрос тоже нужно готовить","p":"Короткий запрос пользователя лексически далёк от текста документа. Query rewriting разворачивает его в полную формулировку, а HyDE идёт дальше: модель пишет гипотетический ответ, и поиск идёт по нему, потому что ответ ближе к искомому фрагменту по словарю. Оба приёма стоят дополнительного вызова модели, поэтому включаются по замеру recall, а не по умолчанию. Третий приём — разложение сложного вопроса на подзапросы, когда ответ собирается из нескольких мест."},{"h":"Двухступенчатый поиск: дёшево широко, дорого узко","p":"Bi-encoder считает вектор документа заранее, поэтому поиск по миллиону чанков стоит копейки, но точность ограничена. Cross-encoder читает пару «запрос плюс документ» вместе и потому заметно точнее, но его нельзя пускать на весь корпус. Отсюда стандартная схема: широкий отбор top-50 гибридом, затем переранжирование cross-encoder'ом до top-5. Прирост меряется на фиксированном кандидатном списке, иначе неясно, что именно улучшилось."},{"h":"Нарезка решает больше, чем модель эмбеддингов","p":"Стратегии: фиксированный размер (просто и ломает структуру), рекурсивная по разделителям (лучше, но не знает про таблицы), по структуре документа (заголовок и его абзацы, таблица целиком), семантическая (границы там, где меняется тема). К любому чанку приписывается путь раздела: фрагмент должен оставаться осмысленным вне документа, потому что модель увидит именно его, без окружения."},{"h":"Метаданные и фильтрация до вектора","p":"Тип документа, дата, контрагент, раздел — это фильтры, которые отсекают кандидатов до векторного поиска и стоят почти ничего. На смешанном корпусе предфильтр обычно даёт больший прирост recall, чем смена эмбеддера. Обратная сторона: метаданные надо заполнять на этапе разбора, и если их нет в источнике, их надо извлекать."},{"h":"Отладка в правильном порядке","p":"Сначала проверяется, был ли нужный фрагмент в top-k. Если не был, чинится поиск: нарезка, метаданные, гибрид, переписывание запроса. Если был, но ответ неверен, чинится передача и промпт: порядок чанков, их число, требование цитаты с идентификатором. Обратный порядок отладки (сразу править промпт) съедает недели и не даёт результата."},{"h":"Вопросы, требующие нескольких документов","p":"Ответ на «изменились ли условия оплаты по сравнению с прошлым договором» лежит в двух документах сразу, и одиночный поиск его не находит: ни один фрагмент не содержит ответа целиком. Решение это декомпозиция вопроса на подвопросы, отдельный поиск по каждому и сборка ответа из найденного. Плата очевидна: вызовов больше, задержка выше, ошибки подвопросов накапливаются. Включать такую схему стоит после того, как разбор промахов показал именно многошаговые вопросы, а не потому, что она красиво выглядит в архитектуре."},{"h":"Цитата важнее ответа","p":"Ответ без ссылки на источник непроверяем, и в документообороте это дороже неточности. Схема простая: генератор обязан вернуть для каждого утверждения идентификатор фрагмента, из которого оно взято, а постпроцессор проверяет, что фрагмент действительно был в поданном контексте. Утверждение без валидной ссылки либо удаляется, либо помечается. Побочная выгода: разбор ошибок становится дешёвым, потому что видно, ошибся поиск или ошибся генератор."},{"h":"Отказ отвечать это функция, а не сбой","p":"Когда найденные фрагменты не содержат ответа, правильное поведение это сказать об этом, а не собрать правдоподобный текст. Реализуется двумя способами, обычно вместе: порог по релевантности лучшего фрагмента и явное разрешение в промпте отвечать «в документах нет». Проверяется отдельным набором вопросов, ответов на которые в корпусе заведомо нет, и доля правильных отказов становится пятой метрикой рядом с четырьмя основными. Без такой проверки система выглядит хорошо ровно до первого вопроса за пределами корпуса."},{"h":"Права доступа в поиске","p":"Корпус редко бывает одинаково доступен всем: договоры, кадровые документы, переписка. Фильтрация по правам делается до векторного поиска, а не после, иначе пользователь получает выдачу, из которой вычеркнуто половина, и по числу вычеркнутого догадывается о существовании документов. Права хранятся рядом с чанком, проверяются на уровне запроса к индексу, а изменение прав обязано отражаться в индексе так же быстро, как удаление документа."},{"h":"Набор вопросов без ручной разметки","p":"Оценка упирается в отсутствие размеченных пар «вопрос и правильный фрагмент». Дешёвый обход: взять случайные фрагменты корпуса и сгенерировать к каждому вопрос, ответ на который в нём содержится. Получается набор, где правильный фрагмент известен по построению, и на нём считается полнота поиска. Ограничение честно называется: такие вопросы проще реальных и не покрывают многошаговые случаи, поэтому синтетический набор годится для отслеживания регрессий, а для абсолютной оценки нужны реальные вопросы пользователей."},{"h":"Изменение корпуса и устаревшие ответы","p":"Документ отредактировали, ответ в кэше остался прежним. Ключ кэша должен включать версию корпуса или хотя бы версии процитированных фрагментов, иначе система уверенно цитирует прошлогоднюю редакцию. Минимальная защита без кэша тоже нужна: рядом с ответом показывается дата документа и его версия, чтобы человек видел, на чём основан ответ. Отзыв документа обязан инвалидировать и индекс, и кэш одновременно."}],"practice":[{"t":"Посчитать все четыре метрики","d":"Собери 30 вопросов с эталонным фрагментом и ответом. Считай context recall и precision по идентификаторам чанков, faithfulness и answer relevancy — судьёй с рубрикой или через ragas.","code":"from ragas import evaluate\nfrom ragas.metrics import context_recall, context_precision, faithfulness, answer_relevancy\nres = evaluate(dataset, metrics=[context_recall, context_precision, faithfulness, answer_relevancy])\nprint(res)"},{"t":"Переранжирование на фиксированном списке","d":"Возьми top-50 гибрида и переранжируй cross-encoder'ом. Сравни recall@5 до и после на одном и том же кандидатном списке, иначе сравнение бессмысленно.","code":"from sentence_transformers import CrossEncoder\nce = CrossEncoder('BAAI/bge-reranker-v2-m3')\npairs = [(query, c['text']) for c in candidates]\nscores = ce.predict(pairs)\ntop5 = [candidates[i] for i in sorted(range(len(scores)), key=lambda i: -scores[i])[:5]]"},{"t":"HyDE за десять строк","d":"Сгенерируй гипотетический ответ и ищи по нему. Замерь recall@5 с ним и без. Если прироста нет, выключи: это лишний вызов модели на каждый запрос.","code":"hypo = model(f'Кратко ответь на вопрос так, как это написано в регламенте: {query}')\nvec = emb.encode(['query: ' + hypo], normalize_embeddings=True)\nids = np.argsort(vec @ V.T)[0][::-1][:20]"},{"t":"Сравнить четыре стратегии нарезки","d":"Фиксированная, рекурсивная, по структуре, по структуре с путём раздела в тексте чанка. Один и тот же набор вопросов, одна метрика — context recall. Таблица из четырёх строк закрывает спор о нарезке."},{"t":"Проверка цитат постпроцессором","d":"Каждое утверждение ссылается на фрагмент, и ссылка проверяется по поданному контексту. Без валидной ссылки утверждение не публикуется.","code":"given = {c['id'] for c in context_chunks}\n\nclean, dropped = [], []\nfor claim in answer['claims']:\n    if claim['source_id'] in given:\n        clean.append(claim)\n    else:\n        dropped.append(claim)\n\nprint('утверждений:', len(answer['claims']), '| без источника:', len(dropped))"},{"t":"Синтетический набор для отслеживания регрессий","d":"Вопрос генерируется по фрагменту, поэтому правильный фрагмент известен по построению. Годится для регрессий, не для абсолютной оценки.","code":"pairs = []\nfor chunk in random.sample(corpus, 200):\n    question = ask_model(GEN_QUESTION_PROMPT, chunk.text)\n    pairs.append({'q': question, 'gold_id': chunk.id})\n\nhits = sum(p['gold_id'] in retrieve(p['q'], k=5) for p in pairs)\nprint('recall@5 на синтетике:', round(hits / len(pairs), 3))"}],"business":[{"t":"Поддержка первой линии","d":"Оператор получает ответ со ссылкой на регламент. Метрика бизнеса — доля обращений, закрытых без эскалации, и время ответа; faithfulness здесь важнее красоты формулировки."},{"t":"Юридический и договорный поиск","d":"Нужны точные реквизиты и цитата с источником. Гибрид обязателен, а ответ без ссылки на пункт юрист не примет."},{"t":"Внутренняя база знаний инженеров","d":"Документы живут и меняются, поэтому важны метаданные версии и даты: ответ по устаревшему регламенту хуже отсутствия ответа."},{"t":"Оценка до внедрения","d":"Четыре метрики на тридцати вопросах — минимальный пилот, который показывает заказчику, где система работает, а где нет, до того как её раскатывают на всех."}],"resources":[{"t":"Ragas — метрики RAG","u":"https://docs.ragas.io/","k":"инструмент","lang":"en","n":"context recall и precision, faithfulness, answer relevancy из коробки."},{"t":"HyDE: Precise Zero-Shot Dense Retrieval","u":"https://arxiv.org/abs/2212.10496","k":"статья","lang":"en","n":"Поиск по сгенерированному гипотетическому ответу."},{"t":"ColBERT и late interaction","u":"https://arxiv.org/abs/2004.12832","k":"статья","lang":"en","n":"Компромисс между bi-encoder и cross-encoder, на котором построены современные переранжировщики."},{"t":"LlamaIndex — оценка ретривера","u":"https://docs.llamaindex.ai/en/stable/module_guides/evaluating/","k":"документация","lang":"en","n":"Готовые харнессы для замера поиска отдельно от генерации."},{"t":"BGE reranker","u":"https://huggingface.co/BAAI/bge-reranker-v2-m3","k":"модель","lang":"en","n":"Мультиязычный cross-encoder для переранжирования top-50."},{"t":"HotpotQA","u":"https://arxiv.org/abs/1809.09600","k":"статья","lang":"en","n":"Набор многошаговых вопросов и способ мерить поиск на них."}]},{"id":"W","title":"Архитектура модели и сэмплирование","level":"экспертный","lead":"Что происходит под temperature=0, почему длинный вход дорожает квадратично и чем предобучение отличается от выравнивания. Без этого остальные знания держатся на заучивании.","terms":[{"t":"Self-attention","d":"Каждый токен сопоставляется с каждым; число пар растёт как квадрат длины. Отсюда стоимость prefill и предел контекста.","m":"Картинка на две страницы — тысячи визуальных токенов. Удвоение dpi учетверяет площадь и бьёт именно сюда."},{"t":"Scaling laws","d":"Предсказуемая связь качества с параметрами, данными и вычислениями; при фиксированном бюджете есть оптимальное соотношение размера и числа обучающих токенов.","m":"Аргумент против «возьмём побольше»: крупнее всегда дороже в инференсе и не всегда лучше."},{"t":"Temperature","d":"Растягивает или сжимает распределение перед выбором. Ноль означает отказ от сэмплирования — берётся самый вероятный токен.","m":"У тебя стоит 0. Это не осторожность, а правильный выбор для задачи с одним верным ответом."},{"t":"top-k","d":"Оставляет k самых вероятных токенов независимо от их весов — даже когда модель уверена и второй вариант ничтожен.","m":"Негибок именно поэтому; на практике чаще берут top-p."},{"t":"top-p (nucleus)","d":"Оставляет минимальный набор, чей суммарный вес достигает p. Размер набора адаптивен: на уверенном шаге один токен, на неуверенном десятки.","m":"Предпочтительнее top-k по этой причине."},{"t":"Greedy против beam search","d":"Beam ищет последовательность с максимальным правдоподобием. Самая вероятная последовательность скучна и склонна к повторам, поэтому beam хорош там, где верный ответ один.","m":"Извлечение реквизитов — как раз такая задача, и greedy здесь обоснован."},{"t":"Cross-entropy","d":"Средняя стоимость предсказания токена. Метрика языкового моделирования, не полезности.","m":"Модель может иметь низкую cross-entropy и путать факты."},{"t":"Perplexity","d":"Экспонента cross-entropy, «насколько модель удивлена текстом». Несопоставима между моделями с разными токенизаторами.","m":"Не отвечает на вопрос «сколько полей оператор правит руками» — значит, для приёмки бесполезна."},{"t":"Post-training","d":"Этап после предобучения: SFT учит формату ответа, preference tuning выравнивает поведение. Предобучение даёт знания, post-training — поведение.","m":"Диагностическое различие: «не знает» лечится RAG или дообучением на знаниях, «знает, но не так отвечает» — промптом."},{"t":"KV-кэш","d":"Сохранённые ключи и значения внимания для обработанных токенов, чтобы не пересчитывать их на каждом шаге генерации.","m":"Следствие квадратичного внимания, а не его причина — на собесе это различают."},{"t":"Остаточная связь","d":"Сложение входа блока с его выходом. Без неё градиент не доходит до нижних слоёв глубокой сети.","m":"Вместе с нормализацией слоя делает возможным обучение десятков слоёв подряд."},{"t":"Позиционное кодирование","d":"Способ внести порядок токенов во внимание, которое само по себе к порядку безразлично.","m":"Качество падает на расстояниях, которых не было в обучении. Растяжение контекста требует проверки на своих данных."},{"t":"Штрафы за повтор","d":"Понижение вероятности уже встречавшихся токенов: за присутствие, за частоту, общий штраф.","m":"Для извлечения данных выключаются: повтор значения в документе это норма, а не дефект."},{"t":"Неравномерность потерь квантования","d":"Типовые ответы страдают мало, редкие термины и точность цифр ломаются первыми.","m":"Проверять срезом по трудным случаям, а не средней метрикой."}],"pitfalls":["Считать рост KV-кэша причиной квадратичной сложности, а не следствием.","Выбирать модель по числу параметров, игнорируя, сколько токенов она видела.","Путать temperature с top-p: первое меняет форму распределения, второе — множество допустимых токенов.","Применять beam search к открытой генерации и получать серый текст.","Сравнивать perplexity моделей с разными токенизаторами."],"drill":"Возьми любую локальную модель и один и тот же промпт, прогони с temperature 0, 0.7 и 1.2, с top-p 0.9 и без. Посмотри своими глазами, что меняется в ответах. Затем посчитай, во сколько раз вырастет число визуальных токенов при переходе с dpi 150 на 300, и сопоставь с квадратичной сложностью внимания.","theory":[{"h":"Что происходит между промптом и ответом","p":"Текст превращается в токены, токены в векторы, дальше десятки блоков внимания и полносвязных слоёв, на выходе распределение вероятностей по словарю для следующего токена. Сэмплер выбирает из этого распределения один токен, он дописывается ко входу, и цикл повторяется. Всё, что называют «настройками генерации», управляет только последним шагом: как именно выбирается токен из распределения. Модель при этом не меняется."},{"h":"Температура, top-k и top-p","p":"Температура растягивает или сжимает распределение перед выбором: ниже единицы делает пики острее, выше сглаживает. Ноль означает отказ от сэмплирования, всегда берётся самый вероятный токен. top-k оставляет k кандидатов независимо от их весов, поэтому на уверенном распределении тащит хвост, а на неуверенном режет лишнее. top-p берёт минимальный набор, чья суммарная вероятность достигает p, и потому адаптивен. Для извлечения данных рабочая настройка одна: температура 0 и схема ответа."},{"h":"Greedy против beam search","p":"Жадный выбор берёт самый вероятный токен на каждом шаге и может пропустить последовательность, которая в сумме вероятнее. Beam search держит несколько гипотез и выбирает лучшую по общему правдоподобию. Для перевода и коротких структурированных ответов beam полезен, для свободного текста он даёт скучные и повторяющиеся результаты, потому что самая вероятная последовательность редко бывает интересной."},{"h":"Cross-entropy и perplexity: что они меряют","p":"Cross-entropy — средняя стоимость предсказания следующего токена на тексте, perplexity — её экспонента, «насколько модель удивлена». Обе меряют языковое моделирование, а не полезность: модель с лучшей perplexity не обязана лучше извлекать реквизиты. Сравнивать perplexity между моделями с разными токенизаторами нельзя вообще, потому что знаменатель разный."},{"h":"Предобучение, SFT и выравнивание","p":"Предобучение даёт знание языка и мира на огромном корпусе. SFT учит формату ответа на парах «запрос, эталонный ответ». Выравнивание по предпочтениям (RLHF, DPO) двигает поведение в сторону того, что люди оценивают выше. Отсюда практический вывод: «модель не хочет отвечать в нужном формате» лечится схемой ответа и примерами, а не поиском обходного промпта, потому что формат заложен на этапе post-training."},{"h":"Почему длинный вход дорожает быстрее, чем кажется","p":"Число пар «токен с токеном» во внимании растёт как квадрат длины, поэтому удвоение входа учетверяет работу prefill. KV-кэш снимает пересчёт на этапе генерации, но занимает память линейно по длине и числу параллельных запросов. Обе величины считаются до закупки железа: одна определяет время до первого токена, вторая — сколько запросов помещается в карту одновременно."},{"h":"Из чего собран блок трансформера","p":"Блок состоит из внимания и полносвязной части, вокруг каждой стоит нормализация слоя и остаточная связь. Остаточная связь пропускает вход мимо преобразования и складывает его с результатом: без неё градиент до нижних слоёв не доходит, и глубокая сеть не обучается. Нормализация удерживает масштаб активаций в рабочем диапазоне. Полносвязная часть обычно расширяет размерность вчетверо и сжимает обратно, и в ней лежит большая часть параметров модели, хотя внимание привлекает больше внимания."},{"h":"Откуда модель знает порядок слов","p":"Внимание само по себе симметрично: переставь токены, и результат не изменится. Порядок вносится позиционным кодированием. Современный способ поворачивает векторы запроса и ключа на угол, зависящий от позиции, и тогда скалярное произведение начинает зависеть от расстояния между токенами. Отсюда и проблема с длиной: модель обучалась на позициях до некоторого предела, а на больших расстояниях углы выходят за пределы виденного, и качество падает. Способы растянуть контекст существуют, но все они меняют распределение и требуют проверки на своих данных."},{"h":"Логиты, softmax и штрафы","p":"Модель выдаёт по числу на каждый токен словаря, эти числа называются логитами. Softmax превращает их в вероятности, температура делит логиты перед этим преобразованием. Поверх накладывают штрафы: за повтор уже встречавшихся токенов, за частоту, за присутствие. Штрафы решают проблему зацикливания на генерации длинного текста и вредят там, где повтор нормален: в таблицах, списках, реквизитах. Для извлечения данных штрафы выключают, иначе модель начнёт избегать правильного значения только потому, что оно уже встречалось."},{"h":"Почему декодер не видит будущее","p":"При обучении декодер предсказывает следующий токен по предыдущим, и чтобы он не подглядывал, внимание маскируется: позиция видит только себя и то, что левее. Энкодер такой маски не имеет и видит контекст с обеих сторон, поэтому лучше подходит для разметки и классификации. Отсюда практическое следствие: одна и та же архитектура даёт разные инструменты, и выбор между ними определяется задачей, а не новизной модели."},{"h":"Чем платят за квантование","p":"Квантование уменьшает число бит на вес: модель занимает меньше памяти и считается быстрее. Потери распределены неравномерно: короткие типовые ответы почти не страдают, а редкие термины, длинные рассуждения и точность в цифрах ломаются первыми. Поэтому проверять квантованную модель средней метрикой недостаточно, нужен срез по трудным случаям. Практический порядок: восьмибитное почти всегда безопасно, четырёхбитное проверяется замером, ниже четырёх имеет смысл только при жёстком дефиците памяти."},{"h":"Дистилляция: маленькая модель учится у большой","p":"Большая модель размечает данные, маленькая обучается воспроизводить её ответы. Выгода двойная: цена инференса падает на порядок, и модель перестаёт меняться без ведома команды. Потолок качества здесь это качество разметки от большой модели, и он проверяется на человеческом эталоне, а не на согласии с учителем. Работает тем лучше, чем уже задача: на одной операции с фиксированным форматом дистилляция почти всегда оправдана, на широком наборе разных задач почти никогда."}],"practice":[{"t":"Посмотреть, что делают сэмплеры","d":"Один промпт, три температуры, top-p с ним и без. Сравни ответы глазами и посчитай долю валидных JSON. На извлечении разница видна сразу.","code":"for t in (0.0, 0.7, 1.2):\n    for p in (1.0, 0.9):\n        outs = [call(prompt, temperature=t, top_p=p) for _ in range(20)]\n        ok = sum(is_valid_json(o) for o in outs)\n        print(f'temp={t} top_p={p} валидных {ok}/20')"},{"t":"Увидеть распределение следующего токена","d":"Возьми локальную модель и выведи топ-10 кандидатов с вероятностями на конкретном шаге. После этого температура и top-p перестают быть магией.","code":"import torch\nlogits = model(**tok(prompt, return_tensors='pt')).logits[0, -1]\nprobs = torch.softmax(logits, dim=-1)\ntop = torch.topk(probs, 10)\nfor p, i in zip(top.values, top.indices):\n    print(round(float(p), 4), repr(tok.decode(i)))"},{"t":"Проверить, что температура 0 не даёт побитовой воспроизводимости","d":"Прогони один и тот же вход двадцать раз при temperature=0 через провайдера и сравни ответы побайтово. Расхождения объясняются батчингом и арифметикой на GPU, а не сэмплированием."},{"t":"Посчитать стоимость длины входа","d":"Замерь TTFT на входах в 1, 2 и 4 тысячи токенов. Кривая покажет, насколько твой сервис чувствителен к длине, и это число нужно до разговора про железо."},{"t":"Выключить штрафы для извлечения данных","d":"Штрафы за повтор придуманы для длинного текста. В извлечении они заставляют модель избегать правильного значения только потому, что оно уже встречалось.","code":"params = {\n    'temperature': 0,\n    'top_p': 1.0,\n    'frequency_penalty': 0,\n    'presence_penalty': 0,\n    'repetition_penalty': 1.0,\n}\nprint('для извлечения:', params)\nprint('для свободного текста: temperature 0.7, top_p 0.9, repetition_penalty 1.05')"},{"t":"Проверить квантование на трудных случаях","d":"Средняя метрика скрывает потери. Сравнивать надо на срезе: редкие термины, длинные документы, точность цифр.","code":"slices = {\n    'обычные   ': common_docs,\n    'редкие    ': rare_term_docs,\n    'длинные   ': long_docs,\n    'с цифрами ': numeric_docs,\n}\nfor name, docs in slices.items():\n    full = score(run(model_fp16, docs), gold)\n    quant = score(run(model_int4, docs), gold)\n    print(f'{name} fp16={full:.3f} int4={quant:.3f} дельта={quant - full:+.3f}')"}],"business":[{"t":"Настройки генерации в договоре на сервис","d":"Температура, top-p, максимальная длина ответа и версия модели попадают в описание сервиса. Иначе воспроизвести заявленное качество на приёмке невозможно."},{"t":"Выбор между beam и greedy в переводе","d":"В задачах перевода и нормализации beam даёт заметный прирост качества за фиксированную плату по времени. В свободной генерации он ухудшает текст, и это надо уметь объяснить."},{"t":"Разговор про perplexity с исследователями","d":"Когда команда приносит модель с лучшей perplexity, вопрос один: что это даёт на целевой метрике. Часто ничего, и это надо показать замером, а не спором."},{"t":"Планирование длины контекста","d":"Квадратичная стоимость внимания и линейный рост KV-кэша задают, сколько документов можно подавать одновременно. Это прямо превращается в число карт и в цену обработки."}],"resources":[{"t":"Attention Is All You Need","u":"https://arxiv.org/abs/1706.03762","k":"статья","lang":"en","n":"Устройство блока внимания, на котором стоит всё остальное."},{"t":"The Curious Case of Neural Text Degeneration (nucleus sampling)","u":"https://arxiv.org/abs/1904.09751","k":"статья","lang":"en","n":"Откуда взялся top-p и почему максимизация правдоподобия портит текст."},{"t":"Hugging Face — стратегии генерации","u":"https://huggingface.co/docs/transformers/generation_strategies","k":"документация","lang":"en","n":"Все сэмплеры и их параметры с примерами кода."},{"t":"Scaling Laws for Neural Language Models","u":"https://arxiv.org/abs/2001.08361","k":"статья","lang":"en","n":"Связь качества с размером модели, данными и вычислениями."},{"t":"Karpathy — Let's build GPT","u":"https://www.youtube.com/watch?v=kCc8FmEb1nY","k":"видео","lang":"en","n":"Тот же материал, написанный в коде от первого токена до генерации."},{"t":"RoFormer: Rotary Position Embedding","u":"https://arxiv.org/abs/2104.09864","k":"статья","lang":"en","n":"Как позиция вносится поворотом векторов запроса и ключа и почему это зависит от расстояния."},{"t":"The Illustrated Transformer","u":"https://jalammar.github.io/illustrated-transformer/","k":"статья","lang":"en","n":"Разбор блока по шагам с картинками: внимание, остаточные связи, нормализация."}]},{"id":"Z","title":"Личная гигиена: то, на чём ты уже спотыкался","lead":"Не теория. Это перечень конкретных проколов с датами — те, что повторялись, и те, что дорого стоили. Читается за две минуты перед каждым отчётом.","terms":[{"t":"Флаги store_true теряются молча","d":"--number-retry, --describe-only по умолчанию выключены. При пересборке команды исчезают без предупреждения.","m":"03.08: корректный прогон holdout_incoming_nostamp_full_0803 ушёл с number_retry=off, хотя перезапрос был готов и обкатан в тот же день. Проверять фактом — поле в meta-json, а не намерение."},{"t":"Тумблеры называть всегда","d":"Перед прогоном и при каждой цифре перечислять, что включено и что выключено. Две цифры сравнимы только при совпадающем наборе флагов.","m":"Если наборы разные — сказать это раньше, чем назвать числа."},{"t":"Адрес коммита проверять командой","d":"git remote -v, git branch --show-current, git log --oneline -3 целевой ветки. Память «куда пушили в прошлый раз» — не доказательство.","m":"04.08: весь день ЭДО-код уходил в email-summary-poc, потому что так было в памяти с 31.07. Актуальный адрес — mws-edo-bossreferent, ветка v2-deterministic-signals, каталог benchmark/."},{"t":"Формулировка чисел","d":"Каждое число мысленно достроить до «X из Y по такому-то критерию на таком-то наборе». Не достраивается — не публиковать.","m":"24.07: четыре неточности подряд в одной сводке. Каждая — тихое слияние или расширение, читающееся как более сильное утверждение."},{"t":"Негатив проверять исчерпывающе","d":"Перед «нет / не найдено / блокер» — все измерения: форматы, папки, вложенные архивы, варианты имён. Минимум два независимых способа.","m":"Формулировать с областью: «в pdf не нашёл; docx не смотрел». Не перекладывать на людей последствия своей неполной проверки."},{"t":"Смоук после каждого фикса","d":"После каждой правки костыля или бага — двадцать смоук-тестов, и только потом следующий фикс.","m":"Смоук должен быть адекватен фиксу: код → item через API; инфра-фикс → целевые проверки."},{"t":"Валидация делегированного кода","d":"Прочитать код целиком, а не диффом, проверить границы и пустой вход, прогнать на реальных данных.","m":"«Codex сказал, что тесты проходят» — не проверка."}],"pitfalls":["Назвать цифру, не проверив состояние тумблеров в meta-json.","Запушить по адресу из памяти.","Сказать «проверено», проверив частично.","Оставить в коде недоделанную ветку, которая сработает при обычном запуске.","Сравнить два прогона с разными флагами и не сказать об этом первым."],"drill":"Перед следующим отчётом проделай ровно три вещи: вытащи тумблеры из meta-json обоих сравниваемых прогонов и положи их в первую строку; достроь каждое число до «X из Y по критерию на наборе»; назови область действия вывода. Если хоть одно не получается — цифра не готова к публикации.","level":"базовый"}]},"library":{"intro":"Маршрут собран из awesome-artificial-intelligence (роадмап AI-инженера), курса Visual GenAI от Yandex Research и ШАДа, учебника MIT 6.042J и материалов, привязанных к блокам тренажёра. Каждый этап указывает, какие блоки он закрывает, чтобы читать не подряд, а под дыру.","roadmap":[{"stage":"1","title":"Основания","goal":"Понимать, что происходит внутри, и уметь говорить об этом формулами, а не метафорами.","blocks":["T","S","A"],"items":[{"t":"MIT 6.042J — Mathematics for Computer Science","u":"https://ocw.mit.edu/courses/6-042j-mathematics-for-computer-science-spring-2015/mit6_042js15_textbook.pdf","k":"учебник","lang":"en","n":"Главы 16–19: вероятность, матожидание, отклонение от среднего. Глава 13: асимптотика. 920 страниц, читать выборочно."},{"t":"Attention Is All You Need","u":"https://arxiv.org/abs/1706.03762","k":"статья","lang":"en","n":"Q, K, V и multi-head в оригинале. Разделы 3.1–3.3."},{"t":"Karpathy — Neural Networks: Zero to Hero","u":"https://www.youtube.com/playlist?list=PLAqhIrjkxbuWI23v9cThsA9GvCAUhRvKZ","k":"видео","lang":"en","n":"От градиента руками до GPT. Единственный курс, после которого трансформер перестаёт быть чёрным ящиком."},{"t":"Understanding Deep Learning (Prince)","u":"https://udlbook.github.io/udlbook/","k":"книга","lang":"en","n":"Бесплатный PDF с ноутбуками. Лучший мост между интуицией и математикой."},{"t":"Speech and Language Processing (Jurafsky, Martin)","u":"https://web.stanford.edu/~jurafsky/slp3/","k":"учебник","lang":"en","n":"Канон NLP. Главы про эмбеддинги, последовательности и разметку сущностей."}]},{"stage":"2","title":"Приложения на моделях","goal":"Собирать работающие системы: промпт, схема ответа, поиск, инструменты.","blocks":["C","F","S","R"],"items":[{"t":"Hugging Face LLM Course","u":"https://huggingface.co/learn/llm-course/chapter1/1","k":"курс","lang":"en","n":"Трансформеры, датасеты, дообучение, современный инструментарий."},{"t":"Anthropic — Prompt engineering","u":"https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/overview","k":"документация","lang":"en","n":"Критерии успеха, тестирование промптов, работа со схемами ответа."},{"t":"OpenAI Cookbook","u":"https://cookbook.openai.com/","k":"код","lang":"en","n":"Рабочие примеры structured outputs, tool use, retrieval и эвалов."},{"t":"LlamaIndex — документация","u":"https://docs.llamaindex.ai/","k":"документация","lang":"en","n":"Ingestion, индексация, ретриверы, агентные конвейеры."},{"t":"Docling","u":"https://github.com/docling-project/docling","k":"инструмент","lang":"en","n":"Разбор PDF и сканов в структуру. База для структурного чанкинга."},{"t":"Building Effective Agents (Anthropic)","u":"https://www.anthropic.com/engineering/building-effective-agents","k":"статья","lang":"en","n":"Когда агент нужен, когда достаточно конвейера. Паттерны и их цена."}]},{"stage":"3","title":"Оценка и надёжность","goal":"Уметь доказать, что стало лучше, и поймать деградацию до заказчика.","blocks":["A","B","G","P","L"],"items":[{"t":"Demystifying Evals for AI Agents (Anthropic)","u":"https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents","k":"статья","lang":"en","n":"Как строится набор задач, грейдеры и харнесс оценки."},{"t":"Ragas","u":"https://docs.ragas.io/","k":"инструмент","lang":"en","n":"Метрики RAG: faithfulness, context precision и recall."},{"t":"Promptfoo","u":"https://www.promptfoo.dev/docs/","k":"инструмент","lang":"en","n":"Тест-кейсы и ассерты для промптов, сравнение моделей, red-team проверки."},{"t":"statsmodels — proportions и тесты","u":"https://www.statsmodels.org/stable/stats.html","k":"инструмент","lang":"en","n":"proportion_confint, mcnemar, multipletests. Три функции против всех споров о метрике."},{"t":"Designing Machine Learning Systems (Huyen)","u":"https://www.oreilly.com/library/view/designing-machine-learning/9781098107956/","k":"книга","lang":"en","n":"Утечки, дрейф, мониторинг, границы ответственности компонентов."}]},{"stage":"4","title":"Прод и железо","goal":"Развернуть на своём железе, посчитать деньги, выдержать нагрузку.","blocks":["E","H","O"],"items":[{"t":"vLLM — документация","u":"https://docs.vllm.ai/","k":"документация","lang":"en","n":"PagedAttention, continuous batching, guided decoding — три ответа на вопрос «зачем vLLM»."},{"t":"LiteLLM","u":"https://docs.litellm.ai/","k":"инструмент","lang":"en","n":"Единый интерфейс к провайдерам, лимиты, учёт расходов."},{"t":"Langfuse","u":"https://langfuse.com/docs","k":"инструмент","lang":"en","n":"Трассировка вызовов, версии промптов, метрики в проде."},{"t":"OWASP Top 10 для LLM-приложений","u":"https://genai.owasp.org/llm-top-10/","k":"документация","lang":"en","n":"Инъекции в промпт, утечки данных, небезопасный вывод. Язык разговора с безопасниками."},{"t":"AI Engineering (Huyen)","u":"https://www.oreilly.com/library/view/ai-engineering/9781098166298/","k":"книга","lang":"en","n":"Приложения на фундаментальных моделях: от выбора модели до эксплуатации."}]},{"stage":"5","title":"Генеративное зрение","goal":"Диффузия и авторегрессия для картинок и видео: теория плюс семь практик.","blocks":["R","K"],"items":[{"t":"Visual GenAI — курс Yandex Research и ШАД","u":"https://github.com/dbaranchuk/VisualGenAI","k":"курс","lang":"en/ru","n":"12 лекций: слайды на английском, видео на русском. 7 домашних с ноутбуками, список экзаменационных вопросов."},{"t":"Неделя 1 — DDPM и denoising score matching","u":"https://github.com/dbaranchuk/VisualGenAI/blob/main/week1_ddpm_dsm/ddpm_dsm_lecture.pdf","k":"слайды","lang":"en","n":"Точка входа в диффузию. Дальше идут непрерывное время и flow matching."},{"t":"Неделя 5 — диффузия на практике","u":"https://github.com/dbaranchuk/VisualGenAI/tree/main/week4_practical_dm","k":"слайды","lang":"en","n":"Архитектуры, пространства, приёмы обучения и сэмплинга, которые реально стоят в проде."},{"t":"Недели 6–7 — модели за несколько шагов","u":"https://github.com/dbaranchuk/VisualGenAI/tree/main/week5_few_step_models_flow_maps","k":"слайды","lang":"en","n":"Consistency models, MeanFlow, distribution matching. Почему генерация ускорилась в десятки раз."},{"t":"Неделя 11 — мультимодальная генерация и управление","u":"https://github.com/dbaranchuk/VisualGenAI/tree/main/week9_multimodal_generation_and_conditioning","k":"слайды","lang":"en","n":"ControlNet, IP-Adapter: как вообще управляют тем, что генерится."}]},{"stage":"6","title":"Агентная инженерия","goal":"Строить и удерживать системы, где модель вызывает инструменты и живёт дольше одного окна.","blocks":["H","I"],"items":[{"t":"Model Context Protocol","u":"https://modelcontextprotocol.io/","k":"спецификация","lang":"en","n":"Стандарт подключения инструментов и данных к моделям."},{"t":"Effective Context Engineering for AI Agents","u":"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents","k":"статья","lang":"en","n":"Что класть в контекст, что выбрасывать, как жить дольше одного окна."},{"t":"12-Factor Agents","u":"https://github.com/humanlayer/12-factor-agents","k":"репозиторий","lang":"en","n":"Принципы управляемых LLM-приложений вокруг детерминированного кода."},{"t":"How We Built Our Multi-Agent Research System","u":"https://www.anthropic.com/engineering/multi-agent-research-system","k":"статья","lang":"en","n":"Оркестратор и воркеры, параллельный поиск, эксплуатационные уроки."},{"t":"Pydantic AI","u":"https://ai.pydantic.dev/","k":"фреймворк","lang":"en","n":"Типизированные агенты: схема ответа и валидация как часть каркаса."}]}],"sources":[{"t":"awesome-artificial-intelligence","u":"https://github.com/owainlewis/awesome-artificial-intelligence","n":"Курируемый список для разработчиков, которые строят генеративные и агентные системы. Отсюда взяты книги, курсы, статьи и инструменты этапов 1–4 и 6."},{"t":"Visual GenAI (dbaranchuk)","u":"https://github.com/dbaranchuk/VisualGenAI","n":"Курс ШАДа и Yandex Research: 12 лекций, 7 практик, экзаменационные вопросы. Слайды на английском, лекции и семинары на русском."},{"t":"MIT OCW 6.042J, весна 2015","u":"https://ocw.mit.edu/courses/6-042j-mathematics-for-computer-science-spring-2015/","n":"Учебник на 920 страниц плюс видеолекции и задачи с решениями."}],"videos":[{"block":"S","items":[{"t":"3Blue1Brown — Transformers, the tech behind LLMs (Deep Learning, глава 5)","u":"https://www.youtube.com/watch?v=wjZofJX0v4M","k":"видео","lang":"en","n":"Визуальный разбор того, как токен проходит через модель. Смотреть перед главой 6."},{"t":"3Blue1Brown — Attention in transformers, step-by-step (глава 6)","u":"https://www.youtube.com/watch?v=eMlx5fFNoYc","k":"видео","lang":"en","n":"Q, K и V нарисованы по шагам. После него формула softmax(q·kᵀ/√d_k) читается как картинка."},{"t":"Andrej Karpathy — Let's build GPT: from scratch, in code, spelled out","u":"https://www.youtube.com/watch?v=kCc8FmEb1nY","k":"видео","lang":"en","n":"Self-attention и causal mask пишутся руками в коде. Главное видео блока."},{"t":"Deep Learning School — Лекция. Трансформеры. Self-Attention","u":"https://www.youtube.com/watch?v=f544TipD2QY","k":"видео","lang":"ru","n":"Курс ФПМИ МФТИ. Русскоязычный вход в тему, если английские лекции идут тяжело."},{"t":"Igor Kotenkov — Transformer, explained in detail (NLP Lecture, на русском)","u":"https://www.youtube.com/watch?v=iOrNbK2T92M","k":"видео","lang":"ru","n":"Подробный разбор архитектуры с презентацией, уровень выше вводного."},{"t":"Deep Learning School — Лекция. Контестные эмбеддинги. Word2Vec","u":"https://www.youtube.com/watch?v=WbtQzAvhnRI","k":"видео","lang":"ru","n":"Откуда взялись векторы слов и чем контекстные представления отличаются от статических."},{"t":"ФКН ВШЭ — Глубинное обучение 1, лекция 6: токенизация, эмбеддинги слов, TextCNN","u":"https://www.youtube.com/watch?v=WihC2R5lNmg","k":"видео","lang":"ru","n":"Токенизация в подслова и почему она влияет на разметку сущностей."},{"t":"ИУ5 — Лекция 8. Трансформеры и механизм внимания","u":"https://www.youtube.com/watch?v=3GVmrjgkWe8","k":"видео","lang":"ru","n":"Обзорная лекция: внимание в RNN, архитектура трансформера, BERT и GPT в одном месте."}]},{"block":"F","items":[{"t":"Practical RAG — Choosing the Right Embedding Model, Chunking Strategy, and More","u":"https://www.youtube.com/watch?v=j1XRLh7yzzY","k":"видео","lang":"en","n":"Практический разбор решений, которые принимаются до первой строки кода RAG."},{"t":"RAG Retrieval Deep Dive: BM25, Embeddings, and the Power of Agentic Search","u":"https://www.youtube.com/watch?v=AS_HlJbJjH8","k":"видео","lang":"en","n":"Почему демо работает, а прод нет: разбор слоёв поиска."},{"t":"The Complete Guide to Hybrid Search in RAG (BM25 + Embeddings + Reranker)","u":"https://www.youtube.com/ енты, файлы, терминал."},{"t":"AI Engineer — канал","u":"https://www.youtube.com/@owainlewis/videos","k":"видео","lang":"en","n":"Практические разборы по кодовым агентам и инженерии ИИ."}]},{"title":"Оркестрация и software factories","blocks":["H","I"],"items":[{"t":"Harness Engineering (OpenAI)","u":"https://openai.com/index/harness-engineering/","k":"статья","lang":"en","n":"Полевой отчёт о разработке с кодовыми агентами: ограничения репозитория, автопроверки, управление."},{"t":"Codex Orchestration with Symphony","u":"https://openai.com/index/open-source-codex-orchestration-symphony/","k":"статья","lang":"en","n":"Референсная архитектура: работа проекта разбивается на изолированные наблюдаемые прогоны агентов."},{"t":"How We Built Our Multi-Agent Research System","u":"https://www.anthropic.com/engineering/multi-agent-research-system","k":"статья","lang":"en","n":"Оркестратор и воркеры, параллельный поиск, оценка, эксплуатационные уроки."},{"t":"Factory","u":"https://github.com/owainlewis/factory","k":"инструмент","lang":"en","n":"Контрольная панель для планирования и координации агентов по репозиториям."}]},{"title":"Visual GenAI: все 12 лекций","blocks":["R","K"],"items":[{"t":"Неделя 1 — DDPM и denoising score matching","u":"https://github.com/dbaranchuk/VisualGenAI/blob/main/week1_ddpm_dsm/ddpm_dsm_lecture.pdf","k":"слайды","lang":"en","n":"Точка входа в диффузию. Есть лекция и семинар на русском."},{"t":"Неделя 2 — непрерывная диффузия: PF-ODE и SDE","u":"https://github.com/dbaranchuk/VisualGenAI/blob/main/week2_continuous_time_diffusion/continuous_time_diffusion_lecture.pdf","k":"слайды","lang":"en","n":"Непрерывное время: два эквивалентных взгляда на процесс."},{"t":"Неделя 3 — flow matching","u":"https://github.com/dbaranchuk/VisualGenAI/blob/main/week3_flow_matching_and_solvers/flow_matching_lecture.pdf","k":"слайды","lang":"en","n":"Связь flow matching с диффузией, современный стандарт обучения."},{"t":"Неделя 4 — эффективные солверы: DDIM и DPM-Solver","u":"https://github.com/dbaranchuk/VisualGenAI/blob/main/week3_flow_matching_and_solvers/solvers_lecture.pdf","k":"слайды","lang":"en","n":"Как уменьшить число шагов сэмплирования без потери качества."},{"t":"Неделя 5 — диффузия на практике","u":"https://github.com/dbaranchuk/VisualGenAI/blob/main/week4_practical_dm/practical_dm_lecture.pdf","k":"слайды","lang":"en","n":"Пространства, архитектуры, приёмы обучения и сэмплинга из продакшена."},{"t":"Неделя 6 — flow map модели (consistency, MeanFlow)","u":"https://github.com/dbaranchuk/VisualGenAI/blob/main/week5_few_step_models_flow_maps/few_step_flow_map_lecture.pdf","k":"слайды","lang":"en","n":"Обучаемые интеграторы траектории ради быстрой генерации."},{"t":"Неделя 7 — distribution matching (DMD, ADD, SwD)","u":"https://github.com/dbaranchuk/VisualGenAI/blob/main/week6_few_step_models_distribution_matching/distribution_matching_lecture.pdf","k":"слайды","lang":"en","n":"Как генераторы за несколько шагов догоняют многошаговые по качеству."},{"t":"Неделя 8 — авторегрессионная визуальная генерация","u":"https://github.com/dbaranchuk/VisualGenAI/blob/main/week7_visual_ar_models/visual_ar_models_lecture.pdf","k":"слайды","lang":"en","n":"VQ-VAE и VQ-GAN, масштабные модели VAR и Switti, непрерывный AR."},{"t":"Неделя 9 — генерация видео","u":"https://github.com/dbaranchuk/VisualGenAI/blob/main/week8_video_diffusion_and_efficient_genai/video_generation_and_efficient_genai_lecture.pdf","k":"слайды","lang":"en","n":"Архитектуры, трудности и авторегрессионные видео-диффузионные модели."},{"t":"Неделя 10 — эффективные диффузионные модели","u":"https://github.com/dbaranchuk/VisualGenAI/tree/main/week8_video_diffusion_and_efficient_genai","k":"слайды","lang":"en","n":"Кэширование, разреженное внимание, квантование: оптимизации уровня модели."},{"t":"Неделя 11 — мультимодальная генерация и управление","u":"https://github.com/dbaranchuk/VisualGenAI/blob/main/week9_multimodal_generation_and_conditioning/multimodal_generation_and_conditioning.pdf","k":"слайды","lang":"en","n":"ControlNet, IP-Adapter и механизмы обусловливания."},{"t":"Неделя 12 — 3D-генерация","u":"https://github.com/dbaranchuk/VisualGenAI/blob/main/week10_3d_generative_models/3d_generative_models_lecture.pdf","k":"слайды","lang":"en","n":"Введение в 3D-моделирование и multi-view диффузию."}]},{"title":"Visual GenAI: практики и экзамен","blocks":["R"],"items":[{"t":"Практика 1 — DDPM и DSM","u":"https://github.com/dbaranchuk/VisualGenAI/tree/main/assignments/hw1_diffusion_fundamentals","k":"ноутбук","lang":"en","n":"Стартовый шаблон плюс task.pdf с постановкой."},{"t":"Практика 2 — DPM-Solver","u":"https://github.com/dbaranchuk/VisualGenAI/tree/main/assignments/hw2_diffusion_solvers","k":"ноутбук","lang":"en","n":"Эффективные солверы, с теоретической частью."},{"t":"Практика 3 — обучение flow matching","u":"https://github.com/dbaranchuk/VisualGenAI/tree/main/assignments/hw3_flow_matching","k":"ноутбук","lang":"en","n":"Тренировка модели потоков с нуля."},{"t":"Практика 4 — flow map модели","u":"https://github.com/dbaranchuk/VisualGenAI/tree/main/assignments/hw4_flow_maps","k":"ноутбук","lang":"en","n":"Быстрое сэмплирование через обучаемые интеграторы."},{"t":"Практика 5 — дистилляция ADD и MMD","u":"https://github.com/dbaranchuk/VisualGenAI/tree/main/assignments/hw5_distribution_matching","k":"ноутбук","lang":"en","n":"Сведение многошагового генератора к нескольким шагам."},{"t":"Практика 6 — MAR с flow-matching головой","u":"https://github.com/dbaranchuk/VisualGenAI/tree/main/assignments/hw6_masked_ar","k":"ноутбук","lang":"en","n":"Авторегрессионная генерация в непрерывном пространстве."},{"t":"Практика 7 — сэмплирование AR video diffusion","u":"https://github.com/dbaranchuk/VisualGenAI/tree/main/assignments/hw7_video_ar_diffusion","k":"ноутбук","lang":"en","n":"Генерация видео авторегрессионной диффузией."},{"t":"Экзаменационные вопросы курса","u":"https://github.com/dbaranchuk/VisualGenAI/blob/main/exam/exam_topics_visual_genai.md","k":"список","lang":"en","n":"Полный перечень тем к экзамену: удобно как чек-лист по курсу."}]}]}},"tracks":{"tracks":[{"id":"measure","title":"Замеры и доказательства","order":1},{"id":"data","title":"Данные","order":2},{"id":"models","title":"Модели","order":3},{"id":"retrieval","title":"Поиск и агенты","order":4},{"id":"prod","title":"Прод и инфраструктура","order":5},{"id":"craft","title":"Ремесло и ML-канон","order":6}],"assignment":{"A":"measure","G":"measure","M":"measure","P":"measure","T":"measure","B":"data","N":"data","O":"data","C":"models","D":"models","K":"models","S":"models","W":"models","F":"retrieval","R":"retrieval","U":"retrieval","V":"retrieval","E":"prod","H":"prod","I":"craft","J":"craft","L":"craft","Q":"craft","Z":"craft"}}};
</script>
<script>
const QUIZ = DATA.quiz;
const FAQ = DATA.faq;
const LIB = DATA.library;
const TRACKS = DATA.tracks || { tracks: [], assignment: {} };
const KEYS = ["А", "Б", "В", "Г", "Д", "Е"];
const STORE = "ai-trainer-v2";
const app = document.getElementById("app");
const announcer = document.getElementById("announcer");

const state = {
  mode: "exam",
  level: "all",
  track: "all",
  block: null,
  order: [],
  idx: 0,
  picked: null,
  answers: {},
  history: load(),
  query: ""
};

function load() {
  try {
    const raw = localStorage.getItem(STORE);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function save() {
  try {
    localStorage.setItem(STORE, JSON.stringify(state.history));
  } catch (e) {}
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function mono(s) {
  return esc(s).replace(/`([^`]+)`/g, '<code class="inline">$1</code>');
}

function questionsOf(id) {
  return QUIZ.questions.filter(q => q.block === id);
}

function trackOf(id) {
  const key = TRACKS.assignment[id];
  return TRACKS.tracks.find(t => t.id === key) || null;
}

function blocksByLevel() {
  return QUIZ.blocks.filter(b =>
    (state.level === "all" || b.level === state.level) &&
    (state.track === "all" || TRACKS.assignment[b.id] === state.track)
  );
}

function termCount() {
  return FAQ.sections.reduce((n, s) => n + (s.terms ? s.terms.length : 0), 0);
}

function scoreClass(r) {
  return r >= .8 ? "is-good" : r >= .6 ? "is-mid" : "is-bad";
}

function say(text) {
  announcer.textContent = text;
}

function setMode(mode) {
  state.mode = mode;
  document.getElementById("tab-exam").setAttribute("aria-pressed", String(mode === "exam"));
  document.getElementById("tab-ref").setAttribute("aria-pressed", String(mode === "ref"));
  document.getElementById("tab-lib").setAttribute("aria-pressed", String(mode === "lib"));
  render();
}

function startBlock(id) {
  state.block = id;
  state.order = questionsOf(id).map((_, i) => i);
  state.idx = 0;
  state.picked = null;
  state.answers = {};
  render();
  window.scrollTo({ top: 0 });
}

function materialCount() {
  const urls = new Set();
  FAQ.sections.forEach(s => (s.resources || []).forEach(r => urls.add(r.u)));
  LIB.roadmap.forEach(s => s.items.forEach(r => urls.add(r.u)));
  (LIB.catalog ? LIB.catalog.groups : []).forEach(g => g.items.forEach(r => urls.add(r.u)));
  return urls.size;
}

function renderCounters() {
  const el = document.getElementById("counters");
  const done = Object.keys(state.history).length;
  el.innerHTML = [
    `<b>${QUIZ.questions.length}</b> вопросов`,
    `<b>${QUIZ.blocks.length}</b> блоков`,
    `<b>${termCount()}</b> терминов`,
    `<b>${materialCount()}</b> материалов`,
    done ? `<b>${done}</b> блоков пройдено` : "не начато"
  ].join("<span aria-hidden=\"true\">·</span>");
}

function render() {
  renderCounters();
  if (state.mode === "ref") return renderReference();
  if (state.mode === "lib") return renderLibrary();
  if (state.block === null) return renderStart();
  if (state.idx >= state.order.length) return renderResult();
  return renderQuestion();
}

function renderStart() {
  const list = blocksByLevel();
  const cards = list.map(b => {
    const n = questionsOf(b.id).length;
    const h = state.history[b.id];
    const pill = h
      ? `<span class="score-pill ${scoreClass(h.right / h.total)}">${h.right}/${h.total}</span>`
      : `<span class="score-pill">не пройден</span>`;
    return `<button class="block-card" type="button" data-block="${b.id}">
      <span class="block-sigil">${b.id}</span>
      <span class="block-name">${esc(b.title)}</span>
      <span class="block-note">${esc(b.note || "")}</span>
      <span class="block-stats">
        <span class="level-tag ${b.level === "экспертный" ? "is-hard" : ""}">${esc(b.level || "")}</span>
        ${trackOf(b.id) ? `<span class="level-tag">${esc(trackOf(b.id).title)}</span>` : ""}
        <span>${n} вопросов</span>
        ${pill}
      </span>
    </button>`;
  }).join("");

  const answered = Object.values(state.history);
  const right = answered.reduce((s, h) => s + h.right, 0);
  const total = answered.reduce((s, h) => s + h.total, 0);

  app.innerHTML = `
    <div class="view-head">
      <p class="eyebrow">Экзамен</p>
      <h2 class="view-title">Выбери блок и отвечай без подсказок</h2>
      <p class="view-lede">Каждый вопрос разбирается сразу после ответа: почему верный вариант верен и чем именно плохи остальные. В конце блока собирается лист ошибок.</p>
    </div>
    ${total ? `<div class="resume-strip">
      <span>Суммарно верно ${right} из ${total} · пройдено блоков ${answered.length} из ${QUIZ.blocks.length}</span>
      <button class="btn btn-ghost" type="button" id="reset">Сбросить прогресс</button>
    </div>` : ""}
    <div class="filters" role="group" aria-label="Сложность">
      <span class="eyebrow">Сложность</span>
      <button class="chip" type="button" data-level="all" aria-pressed="${state.level === "all"}">все</button>
      <button class="chip" type="button" data-level="базовый" aria-pressed="${state.level === "базовый"}">базовый</button>
      <button class="chip" type="button" data-level="продвинутый" aria-pressed="${state.level === "продвинутый"}">продвинутый</button>
      <button class="chip" type="button" data-level="экспертный" aria-pressed="${state.level === "экспертный"}">экспертный</button>
    </div>
    <div class="filters" role="group" aria-label="Трек">
      <span class="eyebrow">Трек</span>
      <button class="chip" type="button" data-track="all" aria-pressed="${state.track === "all"}">все</button>
      ${TRACKS.tracks.map(t => `<button class="chip" type="button" data-track="${t.id}" aria-pressed="${state.track === t.id}">${esc(t.title)}</button>`).join("")}
    </div>
    <div class="block-grid">${cards.length ? cards : `<p class="empty">В этом сочетании фильтров блоков нет.</p>`}</div>
    <p class="footer-note">Ответы и прогресс хранятся только в этом браузере.</p>
  `;

  app.querySelectorAll("[data-block]").forEach(el => {
    el.addEventListener("click", () => startBlock(el.dataset.block));
  });
  app.querySelectorAll("[data-level]").forEach(el => {
    el.addEventListener("click", () => { state.level = el.dataset.level; render(); });
  });
  app.querySelectorAll("[data-track]").forEach(el => {
    el.addEventListener("click", () => { state.track = el.dataset.track; render(); });
  });
  const reset = document.getElementById("reset");
  if (reset) reset.addEventListener("click", () => { state.history = {}; save(); render(); });
}

function renderQuestion() {
  const block = QUIZ.blocks.find(b => b.id === state.block);
  const items = questionsOf(state.block);
  const q = items[state.order[state.idx]];
  const picked = state.picked;
  const done = picked !== null;
  const pct = Math.round((state.idx + (done ? 1 : 0)) / items.length * 100);

  const options = q.options.map((opt, i) => {
    let cls = "option";
    let mark = "";
    if (done) {
      if (i === picked && i === q.correct) { cls += " is-right"; mark = "✓"; }
      else if (i === picked) { cls += " is-wrong"; mark = "✕"; }
      else if (i === q.correct) { cls += " is-key"; mark = "✓"; }
    }
    return `<button class="${cls}" type="button" data-opt="${i}" ${done ? "disabled" : ""}>
      <span class="option-key">${KEYS[i]}</span>
      <span>${esc(opt)}</span>
      <span class="option-mark">${mark}</span>
    </button>`;
  }).join("");

  app.innerHTML = `
    <div class="exam-wrap">
      <div class="gauge">
        <div class="gauge-row">
          <span>Блок ${block.id} · ${esc(block.title)}</span>
          <span>${state.idx + 1} / ${items.length}</span>
        </div>
        <div class="gauge-track"><div class="gauge-fill" style="width:${pct}%"></div></div>
      </div>
      <h2 class="question">${esc(q.q)}</h2>
      <div class="options">${options}</div>
      ${done ? `<div class="verdict">
        <p class="verdict-why">${mono(q.why)}</p>
        ${q.case ? `<div class="note"><span class="note-label">Из твоей практики</span><span>${mono(q.case)}</span></div>` : ""}
      </div>` : ""}
      <div class="exam-actions">
        <button class="btn" type="button" id="quit">К списку блоков</button>
        ${done ? `<button class="btn btn-primary" type="button" id="next">${state.idx + 1 === items.length ? "Итоги блока" : "Дальше"}</button>` : ""}
      </div>
    </div>
  `;

  app.querySelectorAll("[data-opt]").forEach(el => {
    el.addEventListener("click", () => {
      state.picked = Number(el.dataset.opt);
      state.answers[state.idx] = state.picked;
      say(state.picked === q.correct ? "Верно" : "Неверно");
      renderQuestion();
    });
  });
  document.getElementById("quit").addEventListener("click", () => { state.block = null; render(); });
  const next = document.getElementById("next");
  if (next) next.addEventListener("click", () => {
    state.idx += 1;
    state.picked = null;
    render();
    window.scrollTo({ top: 0 });
  });
}

function renderResult() {
  const block = QUIZ.blocks.find(b => b.id === state.block);
  const items = questionsOf(state.block);
  const right = items.reduce((n, q, i) => n + (state.answers[i] === q.correct ? 1 : 0), 0);
  const pct = Math.round(right / items.length * 100);
  state.history[block.id] = { right, total: items.length };
  save();

  const misses = items.map((q, i) => ({ q, i })).filter(({ q, i }) => state.answers[i] !== q.correct);
  const missHtml = misses.length ? misses.map(({ q, i }) => `
    <details class="miss">
      <summary>${esc(q.q)}</summary>
      <div class="miss-body">
        <p class="miss-line"><b>Ты выбрал</b>${esc(q.options[state.answers[i]] ?? "нет ответа")}</p>
        <p class="miss-line"><b>Верно</b>${esc(q.options[q.correct])}</p>
        <p>${mono(q.why)}</p>
        ${q.case ? `<div class="note"><span class="note-label">Из твоей практики</span><span>${mono(q.case)}</span></div>` : ""}
      </div>
    </details>`).join("") : `<p class="empty">Ошибок нет. Возьми блок посложнее.</p>`;

  const rows = QUIZ.blocks.map(b => {
    const h = state.history[b.id];
    const r = h ? h.right / h.total : 0;
    return `<tr>
      <td class="term-name">${b.id}</td>
      <td>${esc(b.title)}</td>
      <td style="font-family:var(--mono);font-variant-numeric:tabular-nums">${h ? `${h.right}/${h.total}` : "—"}</td>
      <td><div class="bar-track"><div class="bar-fill" style="width:${Math.round(r * 100)}%"></div></div></td>
    </tr>`;
  }).join("");

  app.innerHTML = `
    <div class="result">
      <div class="result-top">
        <div>
          <p class="eyebrow">Итог блока ${block.id}</p>
          <h2 class="view-title">${esc(block.title)}</h2>
          <p class="view-lede">Верно ${right} из ${items.length}. ${right === items.length ? "Блок закрыт." : `Ошибок ${items.length - right}, разбор ниже.`}</p>
        </div>
        <div class="result-score"><b>${pct}%</b><span>${right}/${items.length}</span></div>
      </div>

      <section class="sub">
        <h3 class="sub-label">Ошибки и разбор</h3>
        ${missHtml}
      </section>

      <section class="sub">
        <h3 class="sub-label">Карта прогресса</h3>
        <div class="table-scroll">
          <table>
            <thead><tr><th>Блок</th><th>Тема</th><th>Счёт</th><th>Доля</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </section>

      <div class="exam-actions">
        <button class="btn" type="button" id="again">Пройти блок заново</button>
        <button class="btn" type="button" id="toref">Открыть справочник блока</button>
        <button class="btn btn-primary" type="button" id="back">К списку блоков</button>
      </div>
    </div>
  `;

  document.getElementById("again").addEventListener("click", () => startBlock(block.id));
  document.getElementById("back").addEventListener("click", () => { state.block = null; render(); });
  document.getElementById("toref").addEventListener("click", () => {
    setMode("ref");
    const target = document.getElementById("sec-" + block.id);
    if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
  });
}

function sectionMatches(sec, q) {
  if (!q) return true;
  return JSON.stringify(sec).toLowerCase().includes(q);
}

function renderTheory(sec) {
  if (!sec.theory) return "";
  return `<section class="sub"><h3 class="sub-label">Теория</h3><div class="theory">${
    sec.theory.map(t => `<article class="theory-item"><h4>${esc(t.h)}</h4><p>${mono(t.p)}</p></article>`).join("")
  }</div></section>`;
}

function renderPractice(sec) {
  if (!sec.practice) return "";
  return `<section class="sub"><h3 class="sub-label">Практика</h3><div class="practice">${
    sec.practice.map(p => `<article class="practice-item">
      <h4>${esc(p.t)}</h4>
      <p>${mono(p.d)}</p>
      ${p.code ? `<pre><code>${esc(p.code)}</code></pre>` : ""}
    </article>`).join("")
  }</div></section>`;
}

function renderBusiness(sec) {
  if (!sec.business) return "";
  return `<section class="sub"><h3 class="sub-label">Где это в бизнесе</h3><div class="biz">${
    sec.business.map(b => `<article class="biz-item"><h4>${esc(b.t)}</h4><p>${mono(b.d)}</p></article>`).join("")
  }</div></section>`;
}

function renderTerms(sec) {
  if (!sec.terms || !sec.terms.length) return "";
  return `<section class="sub"><h3 class="sub-label">Термины</h3>
    <div class="table-scroll">
      <table class="terms-table">
        <thead><tr><th>Термин</th><th>Что это</th><th>Как применяется</th></tr></thead>
        <tbody>${sec.terms.map(t => `<tr>
          <td class="term-name">${esc(t.t)}</td>
          <td>${mono(t.d)}</td>
          <td class="term-use">${mono(t.m)}</td>
        </tr>`).join("")}</tbody>
      </table>
    </div>
  </section>`;
}

function renderPitfalls(sec) {
  if (!sec.pitfalls || !sec.pitfalls.length) return "";
  return `<section class="sub"><h3 class="sub-label">Ловушки</h3>
    <div class="pitfalls">${sec.pitfalls.map(p => `<p class="pitfall"><span>${mono(p)}</span></p>`).join("")}</div>
  </section>`;
}

function renderDrill(sec) {
  if (!sec.drill) return "";
  return `<section class="sub"><h3 class="sub-label">Задание</h3>
    <div class="drill">${mono(sec.drill)}</div>
  </section>`;
}

function linkRows(items) {
  return items.map(r => `<div class="link-row">
    <a href="${esc(r.u)}" target="_blank" rel="noopener">${esc(r.t)}</a>
    <span class="kind">${esc(r.k || "")}${r.lang ? " · " + esc(r.lang) : ""}</span>
    <p>${mono(r.n || "")}</p>
  </div>`).join("");
}

function renderLinks(items) {
  return `<div class="links">${linkRows(items)}</div>`;
}

function renderResources(sec) {
  if (!sec.resources || !sec.resources.length) return "";
  return `<section class="sub"><h3 class="sub-label">Материалы</h3>${renderLinks(sec.resources)}</section>`;
}

function renderReference() {
  const q = state.query.trim().toLowerCase();
  const shown = FAQ.sections.filter(s => sectionMatches(s, q));

  const nav = FAQ.sections.map(s => {
    const on = shown.includes(s);
    return `<a class="ref-link" href="#sec-${s.id}" style="${on ? "" : "opacity:.35"}"><b>${s.id}</b><span>${esc(s.title)}</span></a>`;
  }).join("");

  const body = shown.length ? shown.map(s => `
    <section class="section" id="sec-${s.id}">
      <div class="section-head">
        <h2 class="section-title"><span>${s.id}</span>${esc(s.title)}</h2>
        <p class="section-lede">${mono(s.lead)}</p>
      </div>
      ${renderTheory(s)}
      ${renderPractice(s)}
      ${renderBusiness(s)}
      ${renderTerms(s)}
      ${renderPitfalls(s)}
      ${renderDrill(s)}
      ${renderResources(s)}
    </section>`).join("") : `<p class="empty">По запросу «${esc(state.query)}» ничего не нашлось.</p>`;

  app.innerHTML = `
    <div class="view-head">
      <p class="eyebrow">Справочник</p>
      <h2 class="view-title">Теория, практика и где это встречается в работе</h2>
      <p class="view-lede">Разделы совпадают с блоками экзамена. Поиск идёт по всему содержимому раздела, включая термины и код.</p>
    </div>
    <div class="ref-layout">
      <aside class="ref-nav">
        <label class="sr-only" for="q">Поиск по справочнику</label>
        <input class="ref-search" id="q" type="search" placeholder="Например: Макнемар, косинус, Optuna" value="${esc(state.query)}">
        <p class="meta-label">${shown.length} из ${FAQ.sections.length} разделов</p>
        <nav class="ref-links">${nav}</nav>
      </aside>
      <div class="sections">${body}</div>
    </div>
  `;

  const input = document.getElementById("q");
  input.addEventListener("input", e => {
    state.query = e.target.value;
    const pos = e.target.selectionStart;
    renderReference();
    const next = document.getElementById("q");
    next.focus();
    next.setSelectionRange(pos, pos);
  });
}

function renderLibrary() {
  const stages = LIB.roadmap.map(s => `
    <article class="stage">
      <div class="stage-num">${s.stage}</div>
      <div class="stage-head">
        <h3>${esc(s.title)}</h3>
        <p>${mono(s.goal)}</p>
        <div class="stage-blocks">${s.blocks.map(b => {
          const blk = QUIZ.blocks.find(x => x.id === b);
          return `<span class="chip">${b} · ${esc(blk ? blk.title : "")}</span>`;
        }).join("")}</div>
      </div>
      <div class="stage-items">${linkRows(s.items)}</div>
    </article>`).join("");

  app.innerHTML = `
    <div class="view-head">
      <p class="eyebrow">Библиотека</p>
      <h2 class="view-title">Маршрут от оснований до агентных систем</h2>
      <p class="view-lede">${mono(LIB.intro)}</p>
    </div>
    <div class="stages">${stages}</div>
    ${LIB.videos ? `<section class="sources">
      <h3 class="sub-label">Видео по блокам</h3>
      ${LIB.videos.map(g => {
        const blk = QUIZ.blocks.find(x => x.id === g.block);
        return `<div class="video-group">
          <h4 class="video-head"><span>${g.block}</span>${esc(blk ? blk.title : "")}</h4>
          ${renderLinks(g.items)}
        </div>`;
      }).join("")}
    </section>` : ""}
    ${LIB.catalog ? `<section class="sources">
      <h3 class="sub-label">Полный каталог источников</h3>
      <p class="view-lede">${mono(LIB.catalog.intro)}</p>
      ${LIB.catalog.groups.map(g => `<div class="video-group">
        <h4 class="video-head">${esc(g.title)}</h4>
        <div class="stage-blocks">${(g.blocks || []).map(b => {
          const blk = QUIZ.blocks.find(x => x.id === b);
          return `<span class="chip">${b} · ${esc(blk ? blk.title : "")}</span>`;
        }).join("")}</div>
        ${renderLinks(g.items)}
      </div>`).join("")}
    </section>` : ""}
    <section class="sources">
      <h3 class="sub-label">Откуда собрано</h3>
      ${renderLinks(LIB.sources.map(s => ({ t: s.t, u: s.u, k: "источник", n: s.n })))}
    </section>
    <p class="footer-note">Ссылки открываются в новой вкладке. Материалы на русском помечены в колонке справа.</p>
  `;
}

document.getElementById("tab-exam").addEventListener("click", () => setMode("exam"));
document.getElementById("tab-ref").addEventListener("click", () => setMode("ref"));
document.getElementById("tab-lib").addEventListener("click", () => setMode("lib"));

render();
</script>

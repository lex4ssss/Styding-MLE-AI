во действий, привязка к состоянию среды и цикл проверки","Модель для анализа логов и телеметрии","Способ дообучения на последовательностях действий"],"correct":1,"why":"Отделять технический термин от маркетингового — часть инженерной работы. Полезное содержание здесь есть: как только модель что-то делает, а не только пишет, появляются идемпотентность, откат, подтверждение необратимых шагов и ограничение полномочий.","case":"Твой сервис пока только заполняет поля. В день, когда он начнёт сам что-то записывать в карточку, эти вопросы станут твоими."},{"block":"K","q":"LCM — в чём подвох этой аббревиатуры?","options":["Ни в чём, это устоявшийся термин","Она перегружена: Large Concept Model — моделирование последовательностей в пространстве эмбеддингов предложений вместо токенов; Latent Consistency Model — ускорение диффузионной генерации до нескольких шагов. Совершенно разные вещи","Это устаревшее название LLM","Это то же самое, что MoE, только у другого вендора"],"correct":1,"why":"Правильная реакция на перегруженную аббревиатуру — уточнить, о чём речь, а не угадать. Идея концептных моделей содержательна: если единица предсказания — смысл предложения, модель становится независимой от языка и токенизатора. Идея consistency-моделей — про число шагов сэмплирования и к языку отношения не имеет.","case":"Такой вопрос проверяет честность: «уточните, какую именно имеете в виду» сильнее угадывания."},{"block":"L","q":"Классы распределены 5% и 95%. Модель даёт accuracy 0.95. Что это значит?","options":["Хороший результат, можно выпускать","Ровно ничего: константный ответ «большинство» даёт столько же. При дисбалансе смотрят precision, recall и PR-AUC, а accuracy бесполезна","Модель переобучена","Нужна калибровка вероятностей"],"correct":1,"why":"Первое, что делают при дисбалансе, — считают метрику для тривиального бейзлайна. Не обходит его модель — обсуждать нечего. ROC-AUC при сильном дисбалансе тоже выглядит оптимистично, потому что учитывает множество легко отсекаемых негативов; PR-AUC честнее.","case":"«Доля верно заполненных полей» — метрика с тем же перекосом: отправитель почти всегда МТС, и эвристика «всегда МТС» даёт высокий счёт вообще без модели. Ты этот бейзлайн проверял, и это было правильно."},{"block":"L","q":"Порог классификатора. Кто и как его выбирает?","options":["Модель, это часть обучения","Ставится 0.5 как нейтральное значение","Продукт: порог задаётся ценой ошибок. Если пропуск в десять раз дороже ложной тревоги, порог смещается в сторону recall. Подбирают на валидации по матрице стоимости, не на тесте","Выбирается по максимуму F1"],"correct":2,"why":"0.5 — не нейтральный выбор, а произвольный. Модель выдаёт упорядоченность, а решение о пороге экономическое: что дороже — пропустить или ошибочно поднять тревогу. F1 годится, когда цены ошибок равны, а они почти никогда не равны.","case":"Светофор в твоём сервисе — это набор порогов на оценке уверенности. Пока не сказано, что дороже оператору — лишняя проверка или пропущенная ошибка, — пороги назначены произвольно."},{"block":"L","q":"Модель выдала 0.9. Значит ли это, что в 90% таких случаев ответ верен?","options":["Да, это и есть вероятность","Да, если выход прошёл через softmax","Нет: сырой выход почти всегда некалиброван. Совпадение уверенности с частотой правильных ответов проверяют диаграммой надёжности и Brier score, а исправляют Platt scaling или изотонической регрессией","Нет, у моделей вообще не бывает вероятностей"],"correct":2,"why":"Некалиброванная модель может быть отлично упорядочена и при этом систематически завышать уверенность — тогда порог 0.9 не означает того, что от него ждут. Калибровка обучается на отложенной части, не меняет порядок, а только шкалу.","case":"confidence_score у сервиса — открытый вопрос №6, формулы нет. Пока она неизвестна и не проверена калибровкой, светофор нельзя объяснять оператору как вероятность."},{"block":"L","q":"Дисбаланс 1:20. Что делать в первую очередь?","options":["Применить SMOTE","Начать с честной метрики и весов классов (class_weight), а порог подбирать по цене ошибки. Синтетическая генерация примеров — не первый шаг и на текстах часто вредна","Отбросить часть большого класса","Собрать больше данных любой ценой"],"correct":1,"why":"Дисбаланс сам по себе не проблема — проблема в метрике и пороге, которые его игнорируют. Веса классов меняют функцию потерь, не искажая данные. SMOTE интерполирует признаки, что для текстовых и категориальных представлений даёт бессмысленные примеры и оптимистичную валидацию.","case":"Твои редкие случаи — рукописные документы, нетиповые бланки — это тот же дисбаланс. Их исключили из набора, это законно, но тогда область вывода не включает такие документы, и это надо произносить вслух."},{"block":"L","q":"Как объяснить заказчику precision и recall на твоей задаче?","options":["Точность и полнота — термины общеизвестны","Precision: из полей, которые сервис заполнил, какая доля верна — боль в лишней правке. Recall: из полей, которые надо было заполнить, какую долю сервис заполнил — боль в ручном доборе","Precision важнее, на нём и строить разговор","Это одна метрика, посчитанная с двух сторон"],"correct":1,"why":"Заказчику важны не термины, а два разных вида боли: «сервис написал ерунду, я исправлял» и «сервис промолчал, я заполнял сам». Формулировка через операции оператора сразу выводит на разговор о пороге и о том, что дороже.","case":"Отсюда и спор «нет в справочнике: пусто или как есть». Пусто — жертвуешь recall, как есть — precision. Замер обеих политик даёт цифры для решения вместо мнений."},{"block":"L","q":"Нужно понять, надёжно ли заполнено поле. Как поставить это как задачу бинарной классификации?","options":["Спросить у модели её уверенность","Взять логарифмы вероятностей токенов ответа","Обучить лёгкий классификатор на наблюдаемых признаках: согласие двух вызовов, наличие строки в тексте страницы, соответствие формату, похожесть на справочное значение, качество скана. Метка — совпало ли с эталоном","Поставить LLM-судью проверять каждое поле"],"correct":2,"why":"Это стандартная схема: отдельная модель предсказывает, права ли основная. Признаки берутся из наблюдаемого, а не из самоотчёта модели. Метка бесплатна — она уже есть в результатах твоего скорера. И такая модель, в отличие от самоотчёта, калибруется и проверяется как обычный классификатор.","case":"95 документов с эталоном и десятки прогонов — датасет для такого классификатора у тебя фактически собран. Это и есть честный confidence_score, и ровно тот кусок работы, где начинается классический data science."},{"block":"M","q":"Прогон запускается длинной командой с флагами, которую ты собираешь руками. Что с этим не так?","options":["Ничего, так гибче","Слишком долго набирать, нужен алиас","Флаги теряются молча, и цифра оказывается получена не в той конфигурации, в которой ты думал. Конфигурация должна лежать в файле, попадать в артефакт прогона и восстанавливаться из него одной командой","Команда не сохраняется в истории"],"correct":2,"why":"Ручная сборка команды — источник ошибок, которые видно только по метаданным, если они вообще пишутся. Правильно: конфиг под версионированием, запуск вида make run CONFIG=..., полный слепок конфигурации внутри результата.","case":"03.08 корректный прогон ушёл с number_retry=off, хотя перезапрос был готов и обкатан в тот же день. Это цена ручной команды, и она уже заплачена."},{"block":"M","q":"Скрипт, который «по нажатию кнопки даёт готовые данные для проверки гипотезы». Что в нём обязательно?","options":["Прогресс-бар и аккуратный вывод в консоль","Один вход (конфиг), фиксированные сиды, кэш промежуточных шагов по хешу входа, идемпотентность при повторе, манифест с версиями кода и данных, один файл-отчёт на выходе","Параллельность по документам","Запуск из ноутбука с интерактивными графиками"],"correct":1,"why":"Смысл такого скрипта — сократить путь от гипотезы до цифры до минут и сделать цифру воспроизводимой. Кэш по хешу входа означает, что повторный запуск не платит дважды за неизменившиеся шаги, а манифест — что через месяц понятно, что именно было прогнано.","case":"У тебя 348 файлов в results/ и проверка тумблеров отдельным однострочником по *.jsonl.meta.json. Конвейер есть, кнопки нет."},{"block":"M","q":"Optuna — что она делает и чем отличается от перебора по сетке?","options":["Обучает модель за тебя","Считает кросс-валидацию","Ищет гиперпараметры адаптивно: TPE строит модель зависимости результата от параметров и предлагает следующую точку там, где ожидается улучшение. Плюс отсекает бесперспективные испытания, не доводя их до конца","Визуализирует результаты экспериментов"],"correct":2,"why":"Сетка тратит бюджет равномерно, в том числе на области, уже показавшие себя плохо. TPE концентрируется на перспективных и на том же числе испытаний находит лучшую точку. Pruner (Median, Hyperband) снимает испытание досрочно — на дорогих прогонах это основная экономия.","case":"У тебя ровно такая задача: dpi × max_side × качество JPEG × порог матчера. Перебор сетки — десятки платных прогонов, адаптивный поиск даёт тот же ответ за меньшее число."},{"block":"M","q":"Ключевые понятия Optuna?","options":["model, fit, predict","grid, params, score","study (исследование с целевой функцией и направлением), trial (одно испытание), suggest_* (запрос значения параметра внутри целевой функции), sampler, pruner, storage","config, run, report"],"correct":2,"why":"Пространство задаётся кодом внутри целевой функции — define-by-run: можно ветвиться, делать параметры условными, менять диапазоны по ходу. storage (например, файл SQLite) позволяет прервать поиск и продолжить, а также вести его из нескольких процессов; importance показывает, какие параметры вообще влияют.","case":"Условное пространство пригодится сразу: number_retry имеет смысл только при определённых порогах, и в обычной сетке это не выразить."},{"block":"M","q":"Кросс-валидация на твоих данных: поля из 95 документов. Какая схема верна?","options":["Обычный k-fold по полям","Stratified k-fold по типу поля","GroupKFold с группировкой по документу: поля одного документа коррелированы, и попадание одного документа и в train, и в test завышает результат","Случайное разделение 80/20"],"correct":2,"why":"Единица независимости здесь — документ, а не поле: у полей одного бланка общий скан, общее качество печати, общий шаблон. Разрезав документ между фолдами, ты меряешь запоминание конкретного бланка. Тот же принцип касается bootstrap: ресэмплить надо документы.","case":"Это же объясняет, почему доверительный интервал, посчитанный по полям без учёта группировки, выходит обманчиво узким."},{"block":"M","q":"Где в кросс-валидации чаще всего возникает утечка?","options":["В выборе метрики","В размере фолдов","В препроцессинге, посчитанном на всех данных до разбиения: нормализация, отбор признаков, подбор словаря, подгонка порога. Всё это обязано считаться внутри каждого фолда","В числе повторов кросс-валидации"],"correct":2,"why":"Классическая ошибка: масштабирование или отбор признаков на полном наборе, а потом «честная» кросс-валидация. Статистика теста уже просочилась в преобразование, и оценка завышена. Отсюда nested CV: подбор гиперпараметров во внутреннем цикле, оценка во внешнем — иначе оценка описывает параметры, подобранные под неё же.","case":"Прямая аналогия с твоим holdout: подбор порога матчера на том же наборе, на котором объявляется цифра, — та же утечка, только сделанная вручную."},{"block":"M","q":"Optuna нашла набор параметров, дающий +4пп. Что сделать до того, как объявить результат?","options":["Объявить: поиск был честным","Проверить лучшую точку на отложенном наборе, которого поиск не видел, и сравнить с базовой конфигурацией парным тестом. Сотня испытаний — это сотня сравнений, и лучшее из них смещено вверх","Прогнать поиск ещё раз с другим сидом","Увеличить число испытаний"],"correct":1,"why":"Автопоиск — это множественные сравнения в промышленном масштабе: чем больше испытаний, тем сильнее лучший результат завышен переобучением на валидацию. Поэтому обязательна отдельная отложенная проверка и сравнение с базой парным тестом, а не «лучший trial показал 0.92».","case":"Это то же правило, из-за которого нельзя перебирать 12 промптов на holdout, — просто автоматизированное и потому более опасное."},{"block":"N","q":"«Слишком шумные данные». Что делает инженер с этой формулировкой первым?","options":["Чистит данные","Собирает больше данных","Разделяет три разных шума: шум входа (скан, перекос, печать), шум метки (эталон противоречив) и дисперсию оценки (выборка мала). Лечатся они по-разному, и путать их — терять недели","Усложняет модель, чтобы она была устойчивее"],"correct":2,"why":"«Шумно» — это симптом, за которым стоят три разные болезни. Шум входа лечится препроцессингом, шум метки — переписыванием правила разметки, дисперсия оценки не лечится вообще: её надо признать и считать интервалы. Пока не сказано, какой из трёх, любое действие — наугад.","case":"У тебя были все три одновременно: полностью рукописный 021426, трижды переписанное правило темы и n=39 с интервалом порядка ±8пп."},{"block":"N","q":"Почему шум метки — самый опасный из трёх?","options":["Его труднее всего заметить в данных","Он ставит потолок: выше согласия разметчиков модель оценить нельзя, и часть «ошибок модели» — это спор о правиле. При этом он выглядит как недоработка модели и провоцирует бесполезную оптимизацию","Он растёт по мере накопления данных","Он не лечится вообще"],"correct":1,"why":"Меряется согласием независимых разметчиков. Если оно 0.85, разница между моделью на 0.85 и на 0.90 не имеет смысла: вторая цифра просто ближе к предпочтениям конкретного разметчика. Правильное действие — переписать правило до однозначности, а не крутить промпт.","case":"Правило темы переписывалось 04.08, 07.08 и 13.08. Каждый раз это был шум метки, и каждый раз он выглядел как проблема модели."},{"block":"N","q":"Нормализация текста перед сравнением. Минимальный набор?","options":["lower() и strip()","Удаление всей пунктуации","Юникод NFKC, регистр, единые кавычки и тире, сжатие пробелов, латинские буквы-двойники кириллицы, а для русского — лемматизация там, где сравниваются словоформы","Транслитерация в латиницу"],"correct":2,"why":"NFKC приводит визуально одинаковые символы к одной форме — без него неразрывный пробел, лигатуры и полноширинные знаки ломают сравнение молча. Латинские двойники (A, B, C, E, H, K, M, O, P, T, X) — отдельная беда русских документов: строка выглядит правильной и не совпадает.","case":"В твоём эталоне «OOO „T2 МОБАЙЛ“» набрано латиницей, и в скорере это уже обработано. Остальное из списка того же класса и стоит проверить."},{"block":"N","q":"Нормализация изображения перед подачей в VLM. Что реально влияет?","options":["Только dpi","Выравнивание перекоса, правильная ориентация, обрезка полей, контраст. Агрессивная бинаризация и шумоподавление часто ВРЕДЯТ: модель обучалась на естественных изображениях, а не на пороговых масках","Перевод в чёрно-белое помогает всегда","Ничего: современные модели устойчивы к качеству скана"],"correct":1,"why":"Наследие OCR-пайплайнов подсказывает бинаризацию и агрессивную чистку — для VLM это обычно потеря информации. Надёжно помогают правильная ориентация и отсутствие перекоса; всё остальное проверяется замером, а не переносится по аналогии.","case":"dps_orient.py — твой единственный рычаг препроцессинга, и по итогу это верный выбор: ориентация даёт эффект, чистка — нет."},{"block":"N","q":"Ошибки распределены неравномерно. Что делать вместо перебора промптов?","options":["Увеличить выборку","Сменить модель на более крупную","Error analysis по стратам: разложить ошибки по признакам документа — рукописный, скан против цифрового, число страниц, тип бланка, отправитель, и найти, где они концентрируются. Одна страта обычно даёт большую часть промахов","Поднять температуру для разнообразия ответов"],"correct":2,"why":"Средняя метрика скрывает структуру ошибок. Стратификация превращает «качество 0.88» в «на цифровых бланках 0.96, на сканах 0.71», и дальше понятно, что чинить и стоит ли вообще. Это дешевле любого перебора гиперпараметров и почти всегда информативнее.","case":"Ты это делал, но как решение аналитика: восемь нетиповых плюс рукописный 021426 исключены из набора. Как метод стратификацию надо применять ДО исключения, чтобы знать цену каждой страты."},{"block":"N","q":"Что означает «владеть основами data science» применительно к твоей работе?","options":["Знать наизусть алгоритмы машинного обучения","Уметь обучать нейросети","Держать дисциплину: бейзлайн до модели, разведочный анализ до выводов, честный сплит с учётом групп, ни одной цифры без интервала и области действия, error analysis до оптимизации, полная воспроизводимость — сид, версия данных, версия кода","Знать математическую статистику на уровне курса"],"correct":2,"why":"Основа этого ремесла — не список алгоритмов, а порядок действий, который не даёт обмануть себя. Почти все ошибки здесь не про модель: утечка, отсутствующий бейзлайн, метрика мимо задачи, вывод шире проверенного. Алгоритмы взаимозаменяемы, дисциплина — нет.","case":"Твоя память проколов — ровно перечень нарушений этой дисциплины. Из неё и собран раздел «Личная гигиена»."},{"block":"O","q":"Почему в ЭДО и в почте не понадобился SQL, и что из этого следует?","options":["Потому что данных было мало","Потому что данные были неструктурированные","Обе задачи были офлайн-экспериментами над файлами: 95 документов и 469 тредов целиком влезают в память, а jsonl с pandas дают более короткий цикл итерации, чем схема с миграциями. Следствие — накопленный опыт не покрывает работу с хранилищем, а её спрашивают всегда","Потому что в сервисе уже был SQLite"],"correct":2,"why":"Выбор был локально верным: на таких объёмах база замедлила бы работу. Но опыт получился односторонним — ты умеешь исследовать файлы и не умеешь строить хранилище, а в продукте ML-инженер почти всегда достаёт данные сам.","case":"Строго говоря, в ЭДО ты делал не классический data science: не было обучения модели, признаков, таблиц и кросс-валидации. Была инженерия оценки и пайплайна. Отсюда и пробел, который ты нащупал сам."},{"block":"O","q":"Что дало бы SQL-хранилище прогонов вместо каталога с файлами?","options":["Экономию места на диске","Запросы вместо скриптов: «все прогоны с number_retry=on и dpi=200», «поля, регрессировавшие между двумя прогонами», «динамика по полю за месяц» — одним запросом вместо разбора jsonl","Надёжность хранения","Возможность работать над данными в команде"],"correct":1,"why":"Три таблицы — runs с конфигурацией, predictions, gold — превращают все сравнительные скрипты в JOIN и GROUP BY. Заодно исчезает класс ошибок с тумблерами: конфигурация становится колонками, по которым фильтруют, а не строкой описания, которую парсят регуляркой.","case":"348 файлов в results/ и однострочник по *.jsonl.meta.json для проверки флагов — это ручная замена индексу."},{"block":"O","q":"Минимум SQL, без которого в аналитике не обойтись?","options":["SELECT, WHERE, ORDER BY","JOIN всех видов, GROUP BY с HAVING, оконные функции (ROW_NUMBER, LAG для сравнения последовательных прогонов), CTE, индексы и чтение EXPLAIN, транзакции и upsert через ON CONFLICT","Хранимые процедуры и триггеры","Шардирование и репликация"],"correct":1,"why":"Оконные функции — водораздел: без них «сравни каждый прогон с предыдущим» не выражается запросом. EXPLAIN нужен, чтобы отличать «запрос медленный» от «нет индекса». ON CONFLICT — потому что идемпотентная загрузка требуется всегда.","case":"LAG по прогонам, упорядоченным по времени, — это твой перескор и сравнение баз, выраженные одной строкой вместо скрипта."},{"block":"O","q":"Твои items — это JSON. Что даёт Postgres в этом случае?","options":["Ничего, JSON лучше держать в файлах","Тип jsonb с индексами GIN: поля внутри документа фильтруются и соединяются запросом, при этом схему заранее фиксировать не нужно. Гибрид — стабильные поля колонками, изменчивые в jsonb","Автоматическую валидацию структуры","Сжатие данных"],"correct":1,"why":"Это снимает ложную дилемму «схема или файлы»: стабильное — в колонки с индексами и типами, изменчивое — в jsonb, который тоже индексируется. Для набора, где состав полей эталона меняется от версии к версии, это ровно нужный компромисс.","case":"Твой эталон менялся v1.2 → v1.3 двумя значениями. В jsonb такая правка не требует миграции, а фильтр по полю всё равно работает."},{"block":"O","q":"Транзакции: зачем ML-инженеру уровни изоляции?","options":["Не нужны, это забота бэкендеров","Потому что загрузка результатов прогона — это несколько связанных вставок, и при сбое на середине в базе останется половина прогона, которую потом посчитают за целый. Атомарность плюс upsert по естественному ключу делают повторный запуск безопасным","Чтобы ускорить вставку","Чтобы несколько процессов могли читать одновременно"],"correct":1,"why":"Наполовину загруженный прогон — тихая порча данных: метрика посчитается, будет выглядеть правдоподобно и окажется неверной. Транзакция плюс идемпотентный upsert превращают повторный запуск из риска в норму.","case":"Тот же принцип, что и с идемпотентностью в сервисе: любая операция, которую можно повторить, будет повторена."},{"block":"P","q":"Чем гиперпараметр отличается от параметра?","options":["Ничем, это синонимы","Параметры модель выучивает из данных (веса); гиперпараметры задаются до обучения или до прогона и данными не подбираются — они выбираются на валидации. Для твоего пайплайна гиперпараметры это dpi, max_side, порог матчера, температура, число страниц","Гиперпараметры — это только скорость обучения и размер батча","Гиперпараметры задаёт провайдер модели"],"correct":1,"why":"Различие практическое: параметры оптимизируются градиентом внутри обучения, гиперпараметры — внешним поиском по валидации, и каждый такой поиск потребляет независимость набора. В LLM-пайплайне без обучения гиперпараметрами становятся все настройки рендера, промпта и постобработки, и подбирать их надо с той же дисциплиной.","case":"Ты подбираешь dpi, max_side, порог матчера и версию промпта. Это гиперпараметры, и holdout, на котором их подбирали, больше не holdout."},{"block":"P","q":"Как выбрать метрику под задачу?","options":["Взять общепринятую для этого типа задач","Взять ту, по которой удобно сравниваться с публикациями","Вывести из решения, которое по ней будут принимать, и из цены каждой ошибки: метрика должна двигаться тогда и только тогда, когда меняется польза для того, кто с результатом работает","Взять несколько и смотреть на все сразу"],"correct":2,"why":"Метрика — это формализация цены ошибки. Если она растёт, а оператору не легче, метрика выбрана неверно, и оптимизация по ней вредна. Отсюда же следует, что порог и режим сравнения — часть метрики, а не деталь реализации.","case":"Режим cover («лишний адресат не ошибка») — это решение о цене ошибки, принятое аналитиком. Именно поэтому оно и должно приниматься заказчиком, а не в коде скорера."},{"block":"P","q":"Метрика для отбора решений и метрика для отчёта заказчику — одна или разные?","options":["Всегда одна, иначе будет путаница","Разные по назначению: для отбора нужна чувствительная и дешёвая (быстро считается, реагирует на малые изменения), для отчёта — понятная и привязанная к работе оператора. Их надо явно связать, чтобы рост первой не расходился со второй","Для отчёта берут ту же, но округлённую","Для отбора всегда loss, для отчёта всегда accuracy"],"correct":1,"why":"Чувствительная метрика позволяет отбирать варианты на малой выборке, понятная — объясняет пользу. Опасность в расхождении: если они не связаны, можно месяц двигать первую без эффекта на вторую. Связь проверяется прямо: посчитать обе на серии прогонов и посмотреть, идут ли они вместе.","case":"У тебя micro по всем полям — метрика отбора, а «сколько полей оператор правит руками» — метрика пользы. Их совпадение никто не проверял."},{"block":"P","q":"Один эксперимент — сколько изменений за раз?","options":["Сколько успеешь, время дорого","Одно измеряемое изменение за прогон. Изменил промпт и dpi одновременно — результат необъясним, а откатывать придётся оба","Два-три, если они в разных частях пайплайна","Любое число, если есть автопоиск"],"correct":1,"why":"Смешанное изменение даёт цифру без причины: непонятно, что помогло, что помешало и что оставить. Исключение — осознанный факторный план, где комбинации выбраны заранее и разложение эффектов предусмотрено. Автопоиск это правило не отменяет, а автоматизирует: он тоже меняет по одному, только быстро.","case":"Твоё правило «смоук на один фикс» — это оно же на уровне процесса. Соблюдай его и в замерах, а не только в починке багов."},{"block":"P","q":"Что записать об эксперименте, чтобы он имел смысл через месяц?","options":["Итоговую метрику и дату","Гипотезу в проверяемой форме, что именно меняли и относительно чего, полную конфигурацию с состоянием всех флагов, метрику с интервалом, вывод и область его действия, и решение: что теперь делаем и чего перестаём","Команду запуска и результат","Ссылку на прогон в системе трейсинга"],"correct":1,"why":"Эксперимент без записанной гипотезы превращается в наблюдение, а без записанного решения — в потраченные деньги. Пункт «чего перестаём делать» самый ценный и почти всегда пропускается: именно он не даёт вернуться к отвергнутому варианту через месяц.","case":"Твой блок «Пробовали — не сработало» в записях — ровно этот пункт. Он уже спас как минимум повторный заход на qwen3.6 и на запятую как разделитель."},{"block":"P","q":"Метрика выросла на 3пп. Какой вопрос задать до того, как это объявить?","options":["На сколько это лучше конкурентов","Совпадают ли наборы флагов и версия скорера, больше ли рост, чем разброс на этом n, и не подбиралось ли изменение на том же наборе, на котором объявляется цифра","Стоит ли выкатывать в прод","Можно ли выжать ещё"],"correct":1,"why":"Три проверки закрывают почти все ложные победы: сопоставимость конфигурации, значимость на данном размере выборки и независимость набора от процесса подбора. Ни одна из них не требует новых данных — только честности перед собой.","case":"Расхождение 0.7949 против 0.8529 было именно первым пунктом: разные версии обработки исключённых полей, а не разное качество."},{"block":"Q","q":"Прогноз просрочки по контрагенту: модель на кросс-валидации даёт AUC 0.94, в проде 0.71. Что проверять первым?","options":["Переобучение: уменьшить глубину деревьев","Утечку: какой из признаков в момент прогноза физически ещё не известен, и не считались ли агрегаты по всей выборке до разбиения","Дрейф данных: распределения изменились","Порог классификации подобран на другой выборке"],"correct":1,"why":"Разрыв в 23 пункта между валидацией и продом почти всегда означает, что в обучении был признак из будущего. Дрейф так резко не бьёт, переобучение видно уже на валидации. Метод проверки один: для каждого признака записать, в какой момент реального процесса он заполняется, и выбросить всё, что появляется после момента прогноза.","case":"Классика в скоринге: поле «дата фактической оплаты» заполнено у всех исторических записей и пусто у тех, кого нужно прогнозировать."},{"block":"Q","q":"Данные с датами, 18 месяцев истории. Какая схема валидации корректна?","options":["KFold с перемешиванием, 5 фолдов","Стратифицированный KFold по целевой переменной","Разбиение вперёд по времени (TimeSeriesSplit) с зазором в размер горизонта прогноза","Случайное разбиение 80/20 с фиксированным сидом"],"correct":2,"why":"Перемешивание даёт модели доступ к будущему: она учится на данных, которых в момент прогноза не существует. Разбиение вперёд воспроизводит реальность, а зазор между train и test не даёт признакам последнего дня обучения просочиться в первый день проверки.","case":"Одна и та же модель на KFold и на TimeSeriesSplit даёт разные числа. Разрыв между ними и есть размер самообмана."},{"block":"Q","q":"В данных 40 категориальных признаков, часть с тысячами уникальных значений. Что выбрать и почему?","options":["XGBoost с one-hot кодированием","CatBoost с передачей колонок через cat_features: упорядоченное кодирование категорий борется с утечкой целевой переменной, которую даёт наивный target encoding","LightGBM с label encoding по алфавиту","Нейросеть с обучаемыми эмбеддингами категорий"],"correct":1,"why":"One-hot на тысяче значений раздувает матрицу и теряет сигнал. Наивный target encoding по всей выборке протаскивает цель в признак. CatBoost считает статистику по категории только по «прошлым» объектам в случайной перестановке, поэтому кодирование не видит собственной цели.","case":"Label encoding по алфавиту вводит ложный порядок: «Альфа» < «Бета» не значит ничего, но дерево будет резать по этому порядку."},{"block":"Q","q":"Заказчик: «недопрогноз спроса дороже перепрогноза втрое». Как это попадает в модель?","options":["Умножить прогноз на коэффициент 1.2 после обучения","Обучать на MAE, а порог сдвинуть вручную","Обучать с квантильной (pinball) функцией потерь на нужный квантиль — тогда модель оптимизирует асимметричную стоимость, а не среднее","Взвесить объекты в обучении по объёму продаж"],"correct":2,"why":"Асимметрия стоимости — это свойство задачи, и место ей в функции потерь, а не в ручной поправке сверху. Pinball loss с квантилем около 0.75 даёт прогноз, который систематически выше медианы ровно настолько, насколько недопрогноз дороже.","case":"Коэффициент 1.2 поверх прогноза — тот же квантиль, только подобранный на глаз и без валидации."},{"block":"Q","q":"Что означает высокая встроенная feature_importance у признака «номер документа»?","options":["Признак важен, его надо оставить","Признак имеет много уникальных значений, по нему удобно резать выборку — это почти наверняка утечка или переобучение, а не содержательная важность","Модель недообучена","Нужно применить SHAP, чтобы понять направление влияния"],"correct":1,"why":"Встроенная важность по числу разбиений завышает вклад признаков с большой кардинальностью. Идентификатор почти всегда коррелирует со временем создания записи, а значит с целью. Проверка — пермутационная важность на валидации и вопрос «какую информацию этот признак несёт содержательно».","case":"SHAP здесь тоже покажет высокий вклад: он объясняет модель, а не проверяет правомерность признака."},{"block":"Q","q":"Бейзлайн «значение прошлой недели» даёт MAE 120, CatBoost после двух дней настройки — 118. Вывод?","options":["Модель выигрывает, можно внедрять","Нужно больше гиперпараметров","Выигрыш в пределах шума: проверить бутстрепом по фолдам, и если отрыв не подтверждается, честно сказать, что задача решается наивным правилом","Нужна нейросеть"],"correct":2,"why":"Разница 2 из 120 — это менее 2%. Без интервала это не результат. И вывод «наивное правило достаточно» — полноценный результат проекта: он экономит заказчику инфраструктуру и поддержку модели.","case":"То же правило, что в блоке A: сначала интервал, потом слово «лучше»."},{"block":"R","q":"Tesseract на сканах с МФУ даёт 12% ошибок по символам. Что даст наибольший прирост при наименьших затратах?","options":["Перейти на платный облачный OCR","Обучить собственную модель распознавания","Коррекция перекоса и подбор бинаризации, проверенные по CER на размеченной выборке, плюс правильный --psm под тип страницы","Поднять dpi до 600"],"correct":2,"why":"Перекос в два-три градуса и неудачная бинаризация — самые частые причины провала Tesseract на офисных сканах, и обе лечатся бесплатно. 600 dpi увеличивает файл вчетверо и почти не помогает: у сканера просто нет этой информации. Проверять каждый вариант надо по CER, потому что «выглядит чище» и «распознаётся лучше» расходятся регулярно.","case":"Tesseract с четвёртой версии использует LSTM-распознавание строк, и ему важна ровная базовая линия строки."},{"block":"R","q":"Зачем в RAG чистить корпус, если модель «и так разберётся»?","options":["Чтобы сэкономить место в индексе","Качество ответа ограничено сверху качеством поиска: колонтитулы и дубликаты притягиваются к любому запросу и вытесняют нужный чанк из top-k, а до генератора он просто не доходит","Чтобы уменьшить стоимость эмбеддингов","Чистка не нужна при достаточно большом top-k"],"correct":1,"why":"Повторяющийся на каждой странице блок имеет высокую близость ко всему подряд и занимает места в выдаче. Нужный фрагмент вылетает из top-k, и никакой промпт его не вернёт: генератор его не видит. Увеличение k не лечит, а усугубляет — добавляет шума в середину контекста.","case":"Минимальный набор: нормализация NFKC, склейка переносов, удаление повторяющихся блоков по частоте, дедупликация MinHash, отбраковка коротких чанков."},{"block":"R","q":"Почему в документном поиске держат и BM25, и векторный поиск?","options":["Для отказоустойчивости: если один упадёт, работает второй","У них разные слепые зоны: dense размывает точные строки (номер договора, артикул, фамилия), BM25 не ловит перефразировки; слияние через RRF берёт сильные стороны обоих без подбора весов","BM25 работает быстрее и используется как предварительный фильтр","Так требует большинство векторных БД"],"correct":1,"why":"Эмбеддинг кодирует смысл, и редкая точная строка в нём растворяется: «РЦ-ИСХ-6596» и «РЦ-ИСХ-6597» окажутся почти неразличимы. BM25 находит их точно, но проваливается, когда спрашивают другими словами. RRF складывает позиции в двух ранжированиях, поэтому не требует калибровки разных по природе оценок.","case":"Cross-encoder переранжирует top-50 после слияния: он дорогой, поэтому его никогда не пускают на весь корпус."},{"block":"R","q":"Что делает ColPali и чем он отличается от «OCR, затем векторный поиск по тексту»?","options":["Это более точный OCR на основе VLM","Индексирует страницу как изображение: патчи страницы сопоставляются с токенами запроса late-interaction, поэтому макет, таблицы и графика участвуют в поиске, а OCR из контура убран","Это библиотека чанкинга PDF по структуре","Это переранжировщик поверх обычного текстового поиска"],"correct":1,"why":"Классический путь теряет информацию дважды: OCR не передаёт макет, а чанкинг рвёт таблицы. ColPali кодирует изображение страницы напрямую и сравнивает по схеме ColBERT. Цена — размер индекса: на страницу приходится много векторов, а не один.","case":"Прямое применение — там, где ответ лежит на чертеже или в структуре таблицы, а не в потоке текста."},{"block":"R","q":"Модель извлекла из документа номер, которого в документе нет. Какой контур ловит это дешевле всего?","options":["Второй вызов LLM с просьбой перепроверить","Сверка ответа с OCR-слоем страницы: если значения нет среди распознанных слов с допуском на опечатку, поле помечается подозрительным","Повышение температуры для разнообразия ответов","Голосование трёх прогонов"],"correct":1,"why":"OCR даёт слова с координатами и уверенностью, и это независимый от модели источник. Сверка стоит миллисекунды и ловит именно выдуманные значения. Самопроверка тем же экземпляром страдает предвзятостью: модель подтверждает собственное рассуждение, а голосование втрое дороже и на детерминированной задаче даёт мало.","case":"Допуск на опечатку нужен обязательно: расстояние Левенштейна ≤ 2 закрывает типичные подмены нуля и буквы «О»."},{"block":"R","q":"Детекция брака на фото: класса «брак» 0.4%. Какая пара метрик осмысленна?","options":["Accuracy и loss на валидации","mAP при IoU 0.5 и accuracy","Recall при фиксированном уровне ложных срабатываний в час плюс стоимость пропуска — accuracy при 0.4% положительных бесполезна","F1 и ROC-AUC на всей выборке"],"correct":2,"why":"Модель, которая всегда говорит «годен», даёт accuracy 99.6%. В таких задачах смотрят на recall при рабочей нагрузке на оператора: сколько ложных тревог в час он выдержит. Дальше метрика переводится в деньги через стоимость пропущенного брака.","case":"Та же логика, что в блоке L про порог и дисбаланс, только на картинках."},{"block":"S","q":"Индекс собран на multilingual-e5, команда меняет эмбеддер на bge-m3. Что обязательно?","options":["Ничего, размерности совпадают","Пересчитать векторы только для новых документов","Полная переиндексация корпуса: векторы разных моделей живут в разных пространствах, и смешение даёт тихую деградацию поиска без единой ошибки в логах","Добавить нормализацию векторов при поиске"],"correct":2,"why":"Совпадение размерности ничего не значит: координаты означают разное. Смешанный индекс не падает и не ругается, он просто перестаёт находить. Это одна из самых дорогих по времени поиска ошибок именно потому, что она бесшумная.","case":"Отсюда же правило хранить имя и версию модели эмбеддингов в метаданных индекса."},{"block":"S","q":"Recall@5 на E5 неожиданно низкий. Что проверить в первую очередь?","options":["Размер чанков","Префиксы: E5 обучен асимметрично, запрос кодируется как «query: …», документ как «passage: …», и без них качество падает молча","Метрику расстояния в индексе","Количество документов в корпусе"],"correct":1,"why":"Префикс — часть входа, на котором модель обучалась, а не оформление. Без него запрос и документ кодируются одинаково, и асимметрия, ради которой модель обучали, теряется. У BGE ту же роль играет инструкция к запросу, у Qwen3-Embedding — поле instruction.","case":"Ошибка не даёт исключений и не видна в логах: только просевшая метрика, которую обычно списывают на «плохие чанки»."},{"block":"S","q":"В формуле внимания softmax(q·kᵀ / √d_k)·v зачем деление на корень из d_k?","options":["Нормирует веса, чтобы они суммировались в единицу","Ускоряет вычисления на GPU","Держит дисперсию скалярного произведения около единицы: без деления при большой размерности softmax насыщается и градиенты почти исчезают","Компенсирует отсутствие позиционного кодирования"],"correct":2,"why":"Скалярное произведение двух d-мерных векторов со случайными координатами имеет дисперсию порядка d. При d = 128 значения разлетаются, softmax становится почти one-hot, и обучение встаёт. Сумму в единицу обеспечивает сам softmax, деление тут ни при чём.","case":"Проверка простая: читал человек формулу или только пересказ."},{"block":"S","q":"Задача: классифицировать входящие письма по 12 отделам. Энкодер или декодер?","options":["Декодер: современные LLM решают всё","Энкодер (BERT-подобный) плюс лёгкая голова классификации: двунаправленное внимание, ответ — один из 12 классов, генерировать нечего, инференс дешевле на порядок","Энкодер-декодер: нужен перевод внутреннего представления в метку","Разницы нет, важна только разметка"],"correct":1,"why":"Декодер обучен предсказывать следующий токен и видит только левый контекст. Для понимания целого текста двунаправленный энкодер сильнее при кратно меньшем размере. Плюс детерминированный выход: класс из фиксированного списка вместо текста, который надо парсить.","case":"Умение сказать «здесь LLM не нужна» и обосновать стоимостью и метрикой — ровно то, что отличает инженера от вайб-кодера."},{"block":"S","q":"В RAG увеличили top-k с 5 до 20, качество ответов упало. Объяснение?","options":["Превышен лимит контекста, часть чанков обрезана","Модель хуже использует информацию в середине длинного контекста (lost in the middle), а лишние чанки добавляют шум и вытесняют релевантное из зоны внимания","Эмбеддер плохо ранжирует за пределами top-5","Выросла температура из-за длины входа"],"correct":1,"why":"Эффект замерен экспериментально: точность зависит от позиции нужного факта в контексте и проседает в середине. Отсюда два практических рычага — переранжировать так, чтобы главное было в начале или в конце, и подбирать k замером, а не щедростью.","case":"Проверяется на своих данных за час: один и тот же факт ставится на позицию 1, 5 и 10, считается доля верных ответов."},{"block":"S","q":"Что означает косинусная близость 0.86 между запросом и чанком?","options":["Ответ с вероятностью 86% находится в этом чанке","Чанк релевантен, если порог 0.8","Только одно: угол между двумя векторами в пространстве конкретной модели — шкала у разных моделей разная, и абсолютный порог с одной на другую не переносится","Совпадение 86% слов запроса и чанка"],"correct":2,"why":"Косинус — геометрия, а не вероятность. У одной модели типичная близость случайной пары 0.7, у другой 0.2, поэтому «порог 0.8» без указания модели бессмыслен. Порог калибруется на размеченных парах той же модели, и заново после каждой её смены.","case":"На нормированных векторах косинус совпадает со скалярным произведением, поэтому метрику индекса выбирают один раз и под неё нормируют."},{"block":"S","q":"Что делает causal mask в декодере?","options":["Маскирует случайные токены при обучении, чтобы модель их восстанавливала","Закрывает будущие токены, чтобы при предсказании следующего токена модель не видела ответ — это и отличает декодер от энкодера архитектурно","Ограничивает длину контекста","Убирает внимание к служебным токенам"],"correct":1,"why":"Маскирование случайных токенов с восстановлением — это MLM, задача обучения энкодеров вроде BERT. Causal mask — треугольная маска в матрице внимания: токен i видит только токены до i включительно. Без неё обучение предсказанию следующего токена вырождается в копирование.","case":"Отсюда и невозможность взять готовый декодер и использовать его как двунаправленный энкодер без переобучения."},{"block":"T","q":"Отчёт: «мы на 95% уверены, что качество выше 0.90». Что здесь неверно?","options":["Ничего, это стандартная формулировка доверительного интервала","Нужно было указать метод расчёта интервала","Истинное значение — константа, случайна процедура построения интервала: корректно сказать, что 95% интервалов, построенных таким способом, накрывают истину","95% слишком низкий уровень для продакшна"],"correct":2,"why":"Из неверной трактовки вырастают решения, которых замер не поддерживает: «мы на 95% уверены, что стало лучше». Разбор ровно этой разницы — раздел 19.5 учебника MIT 6.042J, «Confidence versus Probability».","case":"Формулировка для отчёта: «доля 0.918, 95% интервал Уилсона [0.81, 0.97], n = 49»."},{"block":"T","q":"Качество выросло в каждом типе документов, но упало в целом по выборке. Как это называется и что делать?","options":["Ошибка в скорере, пересчитать","Парадокс Симпсона: изменился состав выборки по типам; сравнивать надо внутри типов и явно указывать веса, а агрегат без разбивки не называть результатом","Переобучение на частых типах","Случайный шум, нужен больший объём"],"correct":1,"why":"Агрегат — это средневзвешенное, и веса поменялись: доля тяжёлых типов выросла. Разбор в главе 17. Лечение не статистическое, а отчётное: показывать пер-типовые числа и состав выборки рядом с агрегатом.","case":"У тебя ровно эта ситуация возникает при сравнении holdout и dev: разный состав полей даёт разный знаменатель."},{"block":"T","q":"Сколько ожидаемо ошибок в документе, если поля зависимы между собой?","options":["Посчитать нельзя без матрицы корреляций","Сумма вероятностей ошибки по каждому полю: линейность матожидания работает независимо от зависимости величин","Произведение вероятностей","Нужна симуляция Монте-Карло"],"correct":1,"why":"E[X+Y] = E[X] + E[Y] всегда, зависимость не требуется. Это одно из самых полезных свойств в практических расчётах: ожидаемое число правок оператора на документ считается сложением по полям. Зависимость влияет на дисперсию, а не на среднее.","case":"А вот E[XY] = E[X]·E[Y] требует независимости, и на этом регулярно ошибаются."},{"block":"T","q":"Перебрано 24 конфигурации, лучшая значима при p = 0.04. Что сказать в отчёте?","options":["Результат значим, p меньше 0.05","При 24 сравнениях ожидаемое число ложных срабатываний около одного: нужна поправка на множественность (Холм) и подтверждение на отложенных данных","Нужно повторить эксперимент с другим сидом","Снизить уровень значимости до 0.01 для всех экспериментов"],"correct":1,"why":"Вероятность хотя бы одного ложного успеха при 24 независимых проверках и α = 0.05 близка к 0.7. Холм мощнее Бонферрони при том же контроле. И отдельно: набор, на котором отбирали лучшую конфигурацию, больше не годится для подтверждения.","case":"Комбинаторика перебора: три промпта × два рендера × четыре модели — это и есть двадцать четыре."},{"block":"T","q":"Длинная сторона страницы выросла с 1600 до 3200 px. Как изменится время prefill, грубо?","options":["Вдвое: линейно по стороне","Не изменится, если модель ресайзит вход","Число визуальных токенов растёт примерно вчетверо (по площади), а стоимость внимания квадратична по числу токенов, поэтому prefill дорожает на порядок","Втрое: логарифмическая зависимость"],"correct":2,"why":"Картинка режется на патчи фиксированного размера, значит токенов пропорционально площади: сторона ×2 даёт площадь ×4. Внимание квадратично по длине последовательности, поэтому суммарно рост близок к шестнадцатикратному до учёта оптимизаций вроде FlashAttention. Оценка порядка делается до эксперимента и экономит день.","case":"Именно поэтому параметры рендера — часть описания прогона, а не вкусовая настройка."},{"block":"T","q":"Детектор с точностью 99% срабатывает на документе. Дефект встречается в 1 случае из 1000. Какова вероятность, что дефект реальный?","options":["99%","Около 9%: при 1000 документов будет один настоящий дефект и около десяти ложных срабатываний","50%","Данных недостаточно"],"correct":1,"why":"Байес: на 1000 документов приходится 1 дефект (детектор его поймает) и 999 чистых, из которых 1% даст около 10 ложных тревог. Из 11 срабатываний настоящее одно, то есть примерно 9%. Это главная причина, по которой детекторы редких событий тонут в ложных срабатываниях независимо от заявленной точности.","case":"Отсюда практика: у редкого класса смотрят на precision при рабочем пороге, а не на общую точность."},{"block":"L","q":"Модель ловит брак: 2% положительных в потоке. Отчёт говорит accuracy 98.1%. Что это за число?","options":["Хороший результат, близкий к потолку","Ровно то же, что даёт предсказатель «брака нет никогда»: accuracy при таком дисбалансе не отличает рабочую модель от пустой, нужны precision и recall по положительному классу","Заниженная оценка: надо смотреть F1","Число корректное, но требует доверительного интервала"],"correct":1,"why":"При 2% положительных тривиальная модель даёт 98%. Accuracy складывает верные отрицательные в общий котёл и потому маскирует полную неработоспособность. Правильный набор: precision (сколько сработок настоящие), recall (какую долю брака поймали) и PR-AUC как метрика, не зависящая от порога.","case":"Интервал здесь не поможет: проблема не в точности оценки, а в том, что меряется не та величина."},{"block":"L","q":"Чем precision отличается от accuracy на пальцах?","options":["Ничем, это синонимы из разных традиций перевода","Precision считается только среди объектов, которые модель пометила положительными; accuracy считается по всей выборке и включает верные отрицательные","Precision для многоклассовой задачи, accuracy для бинарной","Precision учитывает порог, accuracy нет"],"correct":1,"why":"Precision отвечает на вопрос оператора «из ста поднятых тревог сколько настоящих». Accuracy отвечает на вопрос «какую долю всех объектов модель классифицировала верно», и при редком положительном классе он почти целиком определяется отрицательными. Порог влияет на обе метрики.","case":"Русский перевод «точность» используется для обеих величин, поэтому в отчётах их пишут латиницей или через формулу."},{"block":"J","q":"Нужно обучить NER на 3000 размеченных документах, но LoRA брать не хочется. Что делать?","options":["Без LoRA обучить нельзя, только промпт с few-shot","Полностью дообучить энкодер (BERT-подобный) на задачу token classification: 100–300 млн параметров влезают в одну карту целиком, выход строгий по токенам, галлюцинаций нет","Обучить с нуля свой трансформер на этих данных","Использовать только правила и словари"],"correct":1,"why":"LoRA нужна там, где модель не помещается в память для полного обучения. У энкодера такой проблемы нет: полное дообучение на 3000 примерах занимает минуты. Плюс token classification даёт границы сущностей в тексте, чего генерация не даёт. Обучение трансформера с нуля на 3000 примерах безнадёжно.","case":"Остальные способы без LoRA: CRF на признаках, дистилляция из большой модели в энкодер, слабая разметка эвристиками, активное обучение."},{"block":"J","q":"F1 по извлечению сущностей 0.93, но заказчик недоволен качеством карточек. Где искать причину?","options":["В пороге классификации","В разметке: F1 завышен","В связывании сущности со справочником: извлечение и нормализация — две разные задачи с разными метриками, и вторая может проваливаться при отличном извлечении","В токенизаторе"],"correct":2,"why":"Извлечь «ООО „Ромашка“» и понять, что это контрагент №4412 из справочника, — разные шаги. Первый меряется F1 по спанам, второй точностью связывания. Общее число прячет, какой из них сломался, поэтому в отчёте они идут раздельно.","case":"Связывание строится как каскад: нормализация строки, нечёткое сравнение, затем проверка по жёсткому ключу вроде ИНН."},{"block":"K","q":"С чего начинается выбор модели под новый проект?","options":["С верхних строчек лидерборда по нужной задаче","С ограничений: где крутится, уходят ли данные наружу, какая допустима задержка, какой бюджет на запрос — половина верхушки лидерборда отпадает на первом же из них","С размера модели: берём максимальный, который влезает в бюджет","С опроса команды о знакомых фреймворках"],"correct":1,"why":"Лидерборды меряют не твою задачу и заражены утечкой тестов в обучение. Ограничения же отсекают кандидатов жёстко и бесплатно: требование on-prem убирает все закрытые API, требование секундной задержки убирает крупные модели. Качество проверяется в конце и на своих 30–50 примерах.","case":"Лицензия проверяется до пилота: часть открытых весов запрещает коммерческое использование."},{"block":"N","q":"«Данные слишком шумные». Что делать до того, как менять модель?","options":["Увеличить размер обучающей выборки","Разложить 30 ошибок на три кучи: плохой вход, спорная разметка, настоящий промах модели, и чинить самую большую","Применить SMOTE и сглаживание меток","Поднять регуляризацию"],"correct":1,"why":"Под словом «шум» прячутся три разные болезни с разным лечением: шум входа лечится предобработкой, шум метки — переписыванием правила разметки, малая выборка — доверительным интервалом и расчётом нужного n. Без разложения лечится та, которая понятнее, а не та, которая больше.","case":"Согласие разметчиков (Cohen's kappa) задаёт потолок: требовать от модели больше, чем сходятся люди, бессмысленно."},{"block":"N","q":"Признаки стандартизуются (вычесть среднее, поделить на σ). Где легко получить утечку?","options":["Если стандартизовать целевую переменную","Если считать среднее и σ по всему набору до разбиения на train и test — статистика теста попадает в обучение; правильно считать внутри Pipeline на каждом фолде","Если применять стандартизацию к категориальным признакам","Утечки здесь быть не может: это детерминированное преобразование"],"correct":1,"why":"Преобразование детерминированное, но его параметры оцениваются по данным. Оценка по всему набору переносит информацию о тесте в обучение, и метрика выходит завышенной. Pipeline в sklearn делает правильный порядок обязательным, а не опциональным.","case":"Деревьям и бустингам стандартизация не нужна вовсе: им безразличен масштаб, важен только порядок значений."},{"block":"O","q":"Почему в ЭДО и в почте можно было обойтись файлами, и когда это перестаёт работать?","options":["Потому что данных было мало; база нужна от миллиона строк","Потому что это офлайн-исследование одним процессом без конкурентной записи и связей между таблицами; база нужна, когда пишет больше одного процесса, нужны частичные обновления, запросы по связям или объём перестал помещаться в память","Потому что jsonl быстрее Postgres на чтении","Потому что SQL не подходит для ML-данных"],"correct":1,"why":"Файлы честно выигрывают, пока нет конкурентного доступа и отношений: версия набора равна файлу, воспроизводимость даётся копированием. Признаков перехода четыре, и ни одного из них в тех задачах не было. Формулировать это надо как «не нужен на этих задачах», а не «не нужен вообще».","case":"Даже там таблица runs плюс predictions сняла бы потерю тумблеров: сравнение двух прогонов становится одним JOIN вместо раскопок в именах файлов."},{"block":"P","q":"Подобрали порог классификации на holdout и там же посчитали итоговую метрику. Что не так?","options":["Ничего, порог — не параметр модели","Порог — гиперпараметр, и его подбор расходует набор: итоговое число завышено, потому что выбран максимум на этом же наборе","Нужно было использовать ROC-AUC вместо порога","Нужно было подбирать порог на обучающей выборке"],"correct":1,"why":"Всё, что выбирается снаружи модели, съедает независимость набора: глубина дерева, top-k, температура, версия промпта, порог. Правильный порядок: подбор на валидации, итог на отложенных данных, которых подбор не видел.","case":"Та же механика, что с перебором двенадцати промптов на holdout: после отбора набор перестаёт быть holdout."},{"block":"R","q":"Корпус из 40 тысяч сканов режется на чанки по 512 символов. Таблицы отвечают неверно. Что менять?","options":["Увеличить чанк до 2000 символов","Добавить перекрытие чанков 30%","Резать по структуре документа: таблица уходит в чанк целиком, к каждому чанку приписывается путь (документ, раздел) и метаданные; разбор структуры делают unstructured или Docling","Перейти на другую модель эмбеддингов"],"correct":2,"why":"Фиксированная длина рвёт таблицу между строками, и обе половины теряют смысл: заголовки столбцов остаются в одном чанке, значения в другом. Структурный чанкинг решает это на уровне разбора, а перекрытие лишь маскирует плохие границы. Метаданные дают вторую выгоду: фильтр по типу документа до векторного поиска отсекает половину ложных кандидатов.","case":"Увеличение чанка ухудшает точность поиска: длинный чанк усредняет смысл и хуже отличается от соседей."},{"block":"R","q":"Что делает --psm в Tesseract и почему это влияет на результат?","options":["Задаёт язык распознавания","Задаёт режим сегментации страницы: как трактовать макет — целая страница, единый блок, одна строка, одно слово; неверный режим ломает распознавание даже на чистом скане","Включает LSTM-движок вместо старого","Управляет порогом бинаризации"],"correct":1,"why":"Tesseract сначала решает, где на изображении текст и как он разбит, и только потом распознаёт. Если подать вырезанное поле, а движок будет искать колонки, он найдёт их там, где их нет. Для вырезанных полей обычно берут --psm 7 (одна строка), для блока текста --psm 6. Язык задаётся флагом -l, движок задаётся --oem.","case":"Проверяется замером CER на размеченной выборке: два режима, два числа, выбор очевиден."},{"block":"R","q":"Когда мультимодальный индекс (поиск по изображению страницы) оправдан, а когда это лишняя сложность?","options":["Всегда оправдан: изображение содержит больше информации, чем текст","Оправдан, когда смысл несёт макет или графика — таблицы, чертежи, бланки; на потоке плоского текста гибридный текстовый поиск дешевле и обычно не хуже, и решается это замером на своём корпусе","Оправдан только при отсутствии текстового слоя в PDF","Оправдан, когда документов меньше тысячи"],"correct":1,"why":"Индекс по страницам-картинкам даёт много векторов на страницу и заметно дороже в хранении и поиске. Он окупается там, где OCR теряет смысл: позиция реквизита, структура таблицы, содержание схемы. Решение принимается сравнением трёх конфигураций на своих данных, а не общим соображением.","case":"Отсутствие текстового слоя решается OCR и не требует мультимодального индекса само по себе."},{"block":"S","q":"Два предложения об одном и том же написаны разными словами. Почему косинусная близость их сближает?","options":["Потому что у них совпадает часть слов после лемматизации","Потому что модель обучалась так, чтобы тексты, встречающиеся в похожих контекстах, получали близкие направления в векторном пространстве; близость измеряется углом, а не совпадением слов","Потому что косинус нормирует длину и потому игнорирует различия","Потому что оба вектора нормированы к единице"],"correct":1,"why":"Семантическая близость — свойство обученного пространства, а не формулы. Косинус только измеряет угол между векторами; смысл в них вкладывает обучение на парах похожих и непохожих текстов. Нормировка убирает влияние длины вектора, но сама по себе смысла не добавляет.","case":"Обратная сторона: точные строки вроде номера договора в этом пространстве размываются, и их ловит BM25, а не косинус."},{"block":"Q","q":"Данных полмиллиона строк, 40 категориальных признаков, нужен быстрый цикл экспериментов. Чем различаются CatBoost, LightGBM и XGBoost в этом выборе?","options":["Ничем существенным: качество после настройки примерно одинаковое, выбирают по привычке","CatBoost даёт упорядоченное кодирование категорий и симметричные деревья, LightGBM растит дерево по листьям и выигрывает в скорости на больших выборках, XGBoost требует кодировать категории самому и берётся ради экосистемы","CatBoost для регрессии, LightGBM для классификации, XGBoost для ранжирования","LightGBM единственный поддерживает пропуски в данных"],"correct":1,"why":"Различия в том, как растёт дерево и как обрабатываются категории. Leaf-wise рост LightGBM быстрее и точнее на больших данных, но легче переобучается на маленьких. Ordered target statistics в CatBoost снимает утечку, которую руками делают в первый же день. Пропуски умеют обрабатывать все три.","case":"Разница в качестве между ними после настройки обычно меньше, чем прирост от одного нового осмысленного признака."},{"block":"U","q":"Чем агент отличается от обычного пайплайна с несколькими вызовами модели?","options":["Числом вызовов: агент вызывает модель много раз","Тем, что маршрут не задан заранее: модель сама решает, какое действие следующее, на основании наблюдений — управление передано ей, и потому число шагов и стоимость заранее неизвестны","Наличием памяти между вызовами","Тем, что агент работает асинхронно"],"correct":1,"why":"Ключевое различие — кто владеет потоком управления. В пайплайне ветвление написано тобой и предсказуемо; в агенте его выбирает модель на каждом шаге. Отсюда всё остальное: невозможность заранее назвать стоимость, потребность в лимите шагов, необходимость наблюдаемости каждого шага и риск зацикливания.","case":"Твой перезапрос темы при неудачном ответе — это ещё пайплайн: условие написано тобой. Агентом он стал бы, если бы модель сама решала, перезапрашивать ли и что именно."},{"block":"U","q":"Как правильно описать инструмент, чтобы модель им пользовалась верно?","options":["Подробно объяснить в системном промпте, когда его звать","Типизированной схемой аргументов с описанием каждого поля плюс однофразовое описание, когда инструмент применим и когда нет; описание — часть контракта, а не документация для человека","Дать пример вызова в few-shot","Назвать инструмент максимально понятно"],"correct":1,"why":"Модель выбирает инструмент по его описанию и заполняет аргументы по схеме — это и есть механизм, а не уговоры в системном промпте. Границы применимости («не использовать для X») в описании работают лучше, чем те же слова в общей инструкции, потому что читаются в момент выбора. Схема ещё и валидирует аргументы до исполнения.","case":"Тот же принцип, что в блоке C: механизм вместо просьбы. Извлечение шести реквизитов — это один инструмент с шестью типизированными полями и явным null."},{"block":"U","q":"ReAct — что это за цикл?","options":["Реактивное программирование для агентов","Чередование рассуждения и действия: модель пишет мысль, выбирает действие, получает наблюдение из среды и снова рассуждает уже с ним. Рассуждение и результат действия попадают в один контекст","Способ обработки ошибок инструментов","Параллельный запуск нескольких инструментов"],"correct":1,"why":"Смысл в том, что модель рассуждает не в вакууме, а поверх фактов, полученных из среды. Это отличает ReAct от чистой цепочки рассуждений, где модель может уверенно домыслить то, что легко было проверить вызовом. Практическая цена — контекст растёт с каждым шагом, и это главный источник расходов у агентов.","case":"Прямая аналогия с твоим правилом: сначала проверить фактом, потом утверждать. ReAct — это то же правило, вшитое в цикл модели."},{"block":"U","q":"Агент ошибся. Добавили шаг саморефлексии: пусть проверит свой ответ. Когда это НЕ помогает?","options":["Никогда не помогает","Когда у модели нет нового источника информации: она проверяет себя тем же знанием, которым ошиблась, и склонна подтвердить собственный ответ. Рефлексия работает, когда даёт доступ к внешнему сигналу — результату теста, запросу, валидатору","Когда температура нулевая","Когда контекст слишком длинный"],"correct":1,"why":"Самопроверка без новых фактов — это тот же вызов с тем же распределением; модель систематически предпочитает свой предыдущий ответ. Полезной рефлексия становится, когда шаг проверки приносит внешнюю информацию: код запустили и он упал, схема не сошлась, поиск не подтвердил утверждение.","case":"То же, что с судьёй-LLM в блоке G: без полного контекста и без проверяемых фактов он завышает оценку. Механизм проверки обязан приносить факт, а не мнение."},{"block":"U","q":"Память агента: буфер истории, суммаризация, векторная выборка. Чем эти три варианта различаются по стоимости?","options":["Векторная память всегда дешевле","Буфер растёт линейно и вместе с ним растёт цена каждого следующего шага; суммаризация обрезает рост, но теряет детали безвозвратно; векторная выборка держит цену ровной, но добавляет ошибку поиска. Выбор — это размен, а не улучшение","Суммаризация не теряет информацию, если модель хорошая","Память не влияет на стоимость, только на качество"],"correct":1,"why":"Каждый шаг агента переотправляет накопленный контекст, поэтому длинный диалог дорожает квадратично по числу шагов. Все три стратегии — способы этим управлять, и у каждой своя плата: детали, точность выборки или деньги. Правильный ответ называет размен, а не «лучшую» стратегию.","case":"У тебя это уже проявлялось на длинных тредах в summary-задаче: маршрутизация на HTM при >7 сообщений или >40K символов — ровно управление ростом контекста."},{"block":"U","q":"Агенту дали доступ к записи в карточку документа. Что обязательно до запуска?","options":["Тщательно проработанный системный промпт с запретами","Ограничение полномочий до минимума, идемпотентность операций по ключу, подтверждение необратимых шагов человеком, лимит шагов и полный трейс каждого действия","Логирование всех вызовов","Ретраи с экспоненциальной задержкой"],"correct":1,"why":"Как только модель действует, а не пишет, безопасность перестаёт быть вопросом формулировок. Инъекция в документе может попытаться воспользоваться любым доступным полномочием, поэтому единственная надёжная защита — их отсутствие. Идемпотентность нужна, потому что повтор случится; лимит шагов — потому что цикл рано или поздно зациклится.","case":"Сейчас у тебя площадь минимальна: модель только заполняет поля, ничего не вызывая. Это и есть причина, по которой инъекция в входящем документе пока не опасна."},{"block":"V","q":"Документы нарезаются на чанки. Что теряется на границе и как это лечат?","options":["Ничего не теряется, если чанки достаточно большие","Смысл, разорванный границей: определение отдельно от термина, реквизит отдельно от заголовка. Лечится перекрытием чанков, нарезкой по структуре документа и хранением заголовочного контекста вместе с чанком","Теряется только форматирование","Лечится увеличением top-k"],"correct":1,"why":"Разрезанный смысл не находится никогда: в чанке нет термина, по которому его ищут. Перекрытие — грубое, но дешёвое лечение; нарезка по заголовкам и абзацам лучше, потому что уважает структуру; добавление заголовка раздела в каждый чанк даёт контекст без дублирования текста. Увеличение top-k не помогает — нужного куска в индексе просто нет в пригодном виде.","case":"В твоих документах это была бы шапка бланка: реквизит, оторванный от подписи «Исходящий №», перестаёт быть номером."},{"block":"V","q":"Query rewriting и HyDE — зачем?","options":["Чтобы исправить опечатки пользователя","Чтобы сблизить формулировку запроса с формулировкой документов: переписывание разворачивает короткий запрос в полный, HyDE генерирует гипотетический ответ и ищет по нему, потому что ответ лексически ближе к искомому документу, чем вопрос","Чтобы сократить длину запроса и сэкономить токены","Чтобы разбить сложный запрос на подзапросы"],"correct":1,"why":"Вопрос и ответ написаны разными словами: «как оформить доверенность» и текст самой доверенности лексически далеки. HyDE обходит этот разрыв, генерируя черновой ответ и ища по нему. Разбиение сложного запроса — тоже полезный приём, но это уже декомпозиция, а не переписывание.","case":"Для твоей задачи неактуально — ты не ищешь. Знать нужно, потому что это первое, что спрашивают после «что такое RAG»."},{"block":"V","q":"Гибридный поиск даёт два ранжирования — лексическое и векторное. Как их слить?","options":["Взять среднее из обеих оценок","Нормировать оценки и сложить с весами, подобранными вручную","Reciprocal Rank Fusion: складывать не оценки, а обратные ранги. Оценки BM25 и косинусной близости живут в разных шкалах и несопоставимы, а ранги сопоставимы всегда","Взять пересечение результатов"],"correct":2,"why":"Главная ловушка — попытка сравнить оценки напрямую: BM25 не ограничен сверху и зависит от длины документа, косинус лежит в своём диапазоне. RRF работает с порядком, а не с величиной, поэтому не требует калибровки и подбора весов. Пересечение отбрасывает документы, найденные только одним методом,, а это как раз самое ценное в гибриде.","case":"Тот же принцип, что в твоём скорере: сравнивать сопоставимое. Две метрики с разными шкалами нельзя складывать, как две цифры с разными флагами."},{"block":"V","q":"Re-ranking cross-encoder'ом: почему его не применяют ко всему корпусу?","options":["Он менее точен, чем векторный поиск","Он читает пару «запрос + документ» вместе, поэтому его нельзя посчитать заранее и закэшировать: стоимость линейна по числу кандидатов. Отсюда схема «дешёвый поиск даёт top-50, дорогой reranker их упорядочивает»","Он требует дообучения на своих данных","Он работает только с короткими документами"],"correct":1,"why":"Bi-encoder считает эмбеддинг документа один раз навсегда, поэтому поиск по миллиону документов дёшев. Cross-encoder видит запрос и документ одновременно — это даёт точность, но требует прогона модели на каждую пару в момент запроса. Отсюда двухступенчатая схема: широкий дешёвый отбор, затем точное упорядочивание малого числа кандидатов.","case":"Экономически это то же, что твой перезапрос номера: дорогая операция применяется только там, где дешёвая дала повод."},{"block":"V","q":"Четыре метрики RAG: context precision, context recall, faithfulness, answer relevancy. Какая за что отвечает?","options":["Все четыре меряют качество ответа с разных сторон","Первые две меряют ретривер (нашлось ли нужное и не мусор ли остальное), faithfulness — опирается ли ответ на найденное, answer relevancy — отвечает ли ответ на заданный вопрос. Первые две про поиск, вторые две про генерацию","Precision и recall про ответ, остальные про контекст","Faithfulness и answer relevancy — синонимы"],"correct":1,"why":"Ценность набора в том, что он локализует поломку. Низкий context recall — виноват ретривер, промпт не спасёт. Высокий recall при низком faithfulness — модель нашла, но выдумала помимо найденного. Высокий faithfulness при низком answer relevancy — ответ верен по фактам, но не на тот вопрос. Одна общая метрика все три случая сливает и не говорит, что чинить.","case":"Ровно та же логика, что в твоём разделении «покрытие детектора» и «точность на сработках»: разные вопросы — разные числа."},{"block":"V","q":"Почему recall ретривера называют потолком всей RAG-системы?","options":["Потому что он обычно самая низкая метрика","Потому что если нужного фрагмента нет в переданном контексте, генератор физически не может дать верный ответ — никакой промпт, никакая модель и никакая температура этого не исправят","Потому что его считают первым","Потому что генератор всегда работает лучше ретривера"],"correct":1,"why":"Это жёсткое ограничение, а не эмпирическое наблюдение: генератор видит только то, что ему передали. Отсюда порядок работ — сначала довести recall@k, потом заниматься промптом генератора. Обратный порядок — самая частая трата времени в RAG-проектах.","case":"Аналог в твоей работе: если реквизита нет в поданном на вход документе, модель не может его извлечь. Ты это уже доказал на 013580в и 016975в."},{"block":"W","q":"Self-attention: почему длинный вход дорожает быстрее, чем линейно?","options":["Из-за роста числа слоёв","Потому что каждый токен сопоставляется с каждым: число пар растёт как квадрат длины последовательности. Отсюда и стоимость prefill, и практический предел контекста","Из-за увеличения размера словаря","Потому что растёт KV-кэш"],"correct":1,"why":"Квадратичная сложность внимания — причина большинства инженерных ухищрений вокруг длинного контекста: Flash Attention оптимизирует работу с памятью при том же объёме вычислений, разреженное внимание сокращает число пар, а KV-кэш убирает пересчёт уже обработанных токенов при генерации. Рост KV-кэша — следствие, а не причина.","case":"Твой картиночный вход — это тысячи визуальных токенов в prefill. Удвоение dpi учетверяет площадь и бьёт по стоимости именно здесь."},{"block":"W","q":"Scaling laws — что они утверждают и что из этого практично?","options":["Что чем больше параметров, тем лучше модель","Что качество предсказуемо связано с параметрами, объёмом данных и вычислениями, и при фиксированном бюджете есть оптимальное соотношение размера модели и числа обучающих токенов. Практический вывод: крупная недообученная модель хуже меньшей, обученной как следует","Что удвоение данных всегда лучше удвоения параметров","Что после определённого размера рост прекращается"],"correct":1,"why":"Главное следствие — размер сам по себе не аргумент. Именно scaling laws объясняют, почему модель на 8B, обученная на достаточном объёме, обходит старую 70B, и почему выбирать модель по числу параметров наивно. Для инженера это ещё и аргумент против «возьмём побольше»: побольше стоит дороже в инференсе всегда, а лучше — не всегда.","case":"Прямо относится к твоему выбору между 35B MoE и дообученной 7B под on-prem."},{"block":"W","q":"Temperature, top-k и top-p — что каждый делает с распределением следующего токена?","options":["Все три отсекают маловероятные токены разными способами","Temperature растягивает или сжимает распределение до выбора; top-k оставляет k самых вероятных; top-p оставляет минимальный набор, чей суммарный вес достигает p, поэтому размер набора меняется от шага к шагу","Temperature и top-p — синонимы с разной шкалой","Top-k отсекает по порогу вероятности, top-p — по числу токенов"],"correct":1,"why":"Temperature действует на форму распределения, а top-k и top-p — на то, из чего вообще разрешено выбирать. Ключевое различие внутри пары: top-k всегда оставляет ровно k вариантов, даже когда модель уверена и второй вариант ничтожен; top-p адаптивен — на уверенном шаге оставит один токен, на неуверенном десятки. Поэтому top-p обычно предпочтительнее.","case":"У тебя temperature=0, то есть сэмплирование отключено вовсе и берётся самый вероятный токен. Знать остальное нужно, чтобы понимать, что именно ты отключил."},{"block":"W","q":"Beam search даёт последовательность с более высокой суммарной вероятностью. Почему его не используют для открытой генерации?","options":["Он слишком медленный","Потому что самая вероятная последовательность — это не самая лучшая: она скучна, склонна к повторам и к общим формулировкам. Beam хорош там, где ответ один правильный (перевод, распознавание), и плох там, где ответов много","Он не работает с длинным контекстом","Он несовместим с KV-кэшем"],"correct":1,"why":"Максимизация правдоподобия и качество текста расходятся: человеческая речь не состоит из самых вероятных продолжений. Отсюда практическое правило — beam для задач с единственным верным выходом, сэмплирование для открытых. Для извлечения реквизитов, где ответ один, greedy оправдан именно поэтому.","case":"Твоя задача из первой категории: у входящего номера один верный ответ, поэтому temperature=0 и greedy — правильный выбор, а не осторожность."},{"block":"W","q":"Perplexity и cross-entropy — что меряют и когда бесполезны?","options":["Качество ответов модели на задаче","Насколько модель удивлена текстом: cross-entropy — средняя стоимость предсказания токена, perplexity — её экспонента. Меряют языковое моделирование, а не полезность, и несопоставимы между моделями с разными токенизаторами","Разнообразие генерации","Скорость сходимости при обучении"],"correct":1,"why":"Обе метрики про предсказание следующего токена и ничего не говорят о том, решена ли задача: модель может иметь низкую perplexity и при этом путать факты. Вторая ловушка — сравнение между моделями: разные токенизаторы дробят один и тот же текст на разное число токенов, поэтому числа несопоставимы. Для прикладной оценки нужны задачные метрики.","case":"Тот же принцип, что в блоке P: метрика выводится из решения, которое по ней принимают. Perplexity не отвечает на вопрос «сколько полей оператор правит руками»."},{"block":"W","q":"Post-training — что это и чем отличается от предобучения?","options":["Дообучение на своих данных после покупки модели","Этап после предобучения, превращающий модель-предсказатель текста в модель-собеседника: supervised fine-tuning учит формату ответа, preference tuning выравнивает поведение по предпочтениям. Предобучение даёт знания, post-training — поведение","Квантование и оптимизация перед выкладкой","Тестирование модели на бенчмарках"],"correct":1,"why":"Различение важно диагностически: если модель чего-то не знает — это предобучение и лечится RAG или дообучением на знаниях; если знает, но отвечает не в том виде или отказывается — это post-training и лечится промптом или выравниванием. Смешивая их, инженер выбирает неправильное лечение.","case":"Полезно в разговоре с заказчиком: «модель не знает наших сокращений» и «модель не отдаёт их в нужном формате» — разные проблемы с разной ценой."}]},"faq":{"sections":[{"id":"A","title":"Замеры и статистика","lead":"Вся твоя работа — это сравнение чисел, но инструмента «это разница или шум» у тебя нет. Это первый и самый дешёвый апгрейд: три формулы закрывают девять из десяти споров о метрике.","terms":[{"t":"Интервал Уилсона","d":"Доверительный интервал для доли. Работает при малых n и у краёв шкалы, в отличие от формулы Вальда, которая там врёт и выезжает за границы [0,1].","m":"45/49 по дате — это 0.918 с интервалом примерно [0.81, 0.97]. Пиши интервал рядом с каждой пер-полевой дробью."},{"t":"Тест Макнемара","d":"Проверка значимости для парных бинарных замеров: два прогона на одном наборе. Смотрит только на расхождения — b (стало верно) и c (стало неверно), игнорируя совпадения.","m":"Единственно верный тест для «промпт А против промпта Б на holdout-39». Хи-квадрат и t-тест здесь неприменимы: выборки не независимы."},{"t":"Bootstrap","d":"Пересэмплирование набора с возвращением 10 000 раз, чтобы получить эмпирическое распределение метрики. Даёт интервал для любой метрики, даже когда формулы нет.","m":"Ресэмплить надо документы, а не поля: поля одного документа коррелированы, иначе интервал выйдет обманчиво узким."},{"t":"micro / macro average","d":"micro = сумма попаданий / сумма проверок. macro = среднее пер-полевых долей, все поля равновесны.","m":"micro на holdout = 169/181. macro считается из (34/36, 37/39, 39/39, 30/33, 29/34) и показывает то, что micro прячет."},{"t":"MDE, минимально детектируемый эффект","d":"Насколько велика должна быть разница, чтобы её вообще можно было увидеть на выборке данного размера.","m":"На 39 документах и ~180 проверках MDE порядка 4–6 пунктов. Улучшение на 2пп на таком наборе не доказуемо — это надо сказать вслух до прогона, а не после."},{"t":"Множественные сравнения","d":"Чем больше вариантов перебрано, тем выше шанс, что лучший — просто удачный шум. Поправка Холма (мощнее Бонферрони) корректирует порог значимости.","m":"12 вариантов промпта на одном holdout — гарантированный ложный «успех». Перебор ведётся на dev, holdout трогается один раз."},{"t":"Утечка через переиспользование holdout","d":"Каждый замер на holdout расходует его независимость. После многих итераций он становится вторым dev.","m":"Заведи третий набор, который не открывался ни разу, и держи его на момент приёмки."},{"t":"p-значение","d":"Вероятность получить наблюдаемую или большую разницу при условии, что разницы нет.","m":"Не вероятность гипотезы и не размер эффекта. Без интервала и размера эффекта бесполезно."},{"t":"Мощность и ошибка второго рода","d":"Вероятность заметить эффект, если он есть. Обычный ориентир 0.8, то есть каждый пятый реальный эффект пропускается.","m":"Отрицательный результат при низкой мощности означает слепой инструмент, а не отсутствие разницы."},{"t":"Правило трёх","d":"При нуле ошибок на n попытках верхняя граница частоты ошибок примерно 3/n.","m":"Ноль ошибок на ста документах это «не более трёх процентов», а не «ноль процентов»."},{"t":"Парадокс Симпсона","d":"Направление эффекта в агрегате противоположно направлению внутри каждой группы из-за разного состава.","m":"Лечится разложением по слоям и контролем состава выборок при сравнении."}],"pitfalls":["Складывать разные категории в одно число: 4 HIDDEN и 3 FORMAT — это не «7 дефектов».","Сливать покрытие детектора и точность на его срабатываниях в одну дробь.","Расширять область вывода: «потолок пайплайна» вместо «потолок этого пайплайна на dev-наборе с этим рендером».","Называть улучшение, не проверив, что оно больше разброса.","Сравнивать два числа, полученные с разными тумблерами, не назвав различие первым."],"drill":"Возьми любую пер-полевую дробь из своих баз и посчитай интервал Уилсона в три строки на Python (statsmodels.stats.proportion.proportion_confint(count, nobs, method='wilson')). Потом посчитай Макнемара между двумя своими последними прогонами holdout-39. Вопрос, на который ты должен ответить: какая из твоих объявленных за месяц побед статистически подтверждается?","level":"базовый","theory":[{"h":"Любая метрика — это оценка, а не факт","p":"Доля 169/181 не число, а оценка неизвестной величины по выборке. У оценки есть разброс, и он тем больше, чем меньше знаменатель. Пока рядом с дробью нет интервала, вопрос «это улучшение или шум» не имеет ответа, и спор о цифре превращается в спор о вере. Первое действие при любом сравнении: посчитать интервал для каждой дроби и интервал для разницы."},{"h":"Уилсон вместо Вальда, и почему это важно у краёв","p":"Нормальное приближение (интервал Вальда) строит симметричный интервал вокруг доли и у краёв шкалы выезжает за границы отрезка [0,1], а при малых n даёт обманчиво узкий результат. Интервал Уилсона решает уравнение относительно истинной доли и остаётся внутри шкалы. Практически: доли выше 0.9 и выборки в десятки наблюдений — это ровно та область, где Вальд врёт, а у тебя почти все пер-полевые дроби живут именно там."},{"h":"Парные замеры требуют парного теста","p":"Когда два прогона сделаны на одном наборе и отличаются одним изменением, выборки не независимы: те же документы, те же поля. Информацию несут только расхождения: сколько полей починилось и сколько сломалось. Тест Макнемара работает именно с этой парой чисел. Хи-квадрат и t-тест для независимых выборок здесь неприменимы и дадут неверный уровень значимости. Побочная польза парного взгляда: итог может не измениться, а внутри при этом два документа улучшились и два сломались."},{"h":"Bootstrap там, где формулы нет","p":"Для сложной метрики (macro-average по полям, средняя правка на документ, доля документов без ошибок) готовой формулы интервала не существует. Bootstrap решает это перевыборкой: 10 000 раз берёшь выборку того же размера с возвращением, считаешь метрику, берёшь 2.5-й и 97.5-й перцентили. Ключевая деталь: перевыбирать нужно документы, а не поля. Поля одного документа коррелированы, и перевыборка полей даёт обманчиво узкий интервал."},{"h":"MDE: сколько данных нужно, чтобы вопрос вообще имел ответ","p":"Минимально детектируемый эффект считается до эксперимента, а не после. При 50 наблюдениях и доле о

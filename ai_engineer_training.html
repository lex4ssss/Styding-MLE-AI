коло 0.9 честно различимы только разницы порядка десяти пунктов; всё, что меньше, неотличимо от шума при любом количестве прогонов. Отсюда правильная реакция на просьбу «улучшить на 2пп»: сначала назвать объём выборки, при котором такое улучшение вообще можно измерить, и стоимость разметки этого объёма."},{"h":"Множественные сравнения и износ holdout","p":"Каждое сравнение при уровне 0.05 даёт пять процентов шанса на ложный успех. Двадцать сравнений, и один ложный успех практически гарантирован. Второй эффект тоньше: набор, на котором отбирали лучший вариант, перестаёт быть независимым, и результат на нём смещён вверх. Рабочая дисциплина: отбор на dev, holdout открывается один раз в конце, при серии сравнений применяется поправка Холма."},{"h":"Что говорит p-значение и чего оно не говорит","p":"Это вероятность увидеть такую же или большую разницу, если на деле разницы нет. Оно ничего не говорит ни о вероятности гипотезы, ни о размере эффекта, ни о пользе изменения. На большом наборе статистически значимым становится прирост в половину пункта, который никому не нужен; на маленьком наборе полезная разница в десять пунктов не дотягивает до значимости. Поэтому рядом с любым p всегда идут две вещи: размер эффекта и доверительный интервал. Порог 0.05 условен и не является границей истины."},{"h":"Мощность: почему «разницы не нашли» это не «разницы нет»","p":"Мощность это вероятность заметить эффект, если он есть. При маленьком наборе она низкая, и отрицательный результат означает лишь то, что инструмент слеп. Считается заранее: задаёшь ожидаемую разницу, желаемую мощность (обычно 0.8) и получаешь нужное число объектов. Если посчитанное число недостижимо, эксперимент бессмыслен, и честный вывод звучит как «набор не позволяет ответить на этот вопрос», а не как «разницы нет». Обратная сторона: при мощности 0.8 каждый пятый реальный эффект будет пропущен, и это нормальная цена, а не ошибка."},{"h":"Правило трёх для нулевых ошибок","p":"Прогон дал ноль ошибок на ста документах, и хочется сказать «работает идеально». Верхняя граница доли ошибок при нулевом наблюдении приблизительно равна трём, делённым на число попыток: на ста документах это три процента, на пятидесяти шесть, на двадцати пятнадцать. Точный расчёт через биномиальное распределение даёт 2.95 процента для ста. Формулировка после чистого прогона звучит так: «ошибок не наблюдалось, верхняя граница частоты ошибок при таком объёме три процента», и это честнее любого «ноль ошибок»."},{"h":"Парадокс Симпсона и стратификация","p":"Версия A выигрывает на договорах и выигрывает на письмах, но проигрывает на общем наборе. Так бывает, когда состав групп разный: в общей смеси доля трудных документов у версий не совпадает. Средство простое: смотреть метрику в разрезе типов документов, а не только агрегат, и следить за составом выборок при сравнении. Правило для отчёта: агрегат сопровождается разложением по слоям, иначе агрегат утверждает то, чего в данных нет."},{"h":"Метрика это распределение, а не число","p":"При ненулевой температуре два прогона на одних данных дают разные цифры, и разброс между ними иногда больше, чем измеряемый эффект. Прежде чем сравнивать версии, полезно измерить собственный шум системы: три прогона без единого изменения дают вилку, ниже которой ничего сравнивать нельзя. Если вилка шире ожидаемого эффекта, сначала фиксируют сид и температуру, потом сравнивают. Тот же приём ловит зависимость от порядка обработки и от кэша."},{"h":"Дробь с маленьким знаменателем","p":"Поле встречается в семи документах из выборки, шесть распознаны верно, в отчёт идёт 86 процентов. Доверительный интервал по Уилсону для шести из семи это примерно от 49 до 97 процентов, и такая цифра не годится ни для сравнения версий, ни для приёмки. Правило: рядом с каждой долей стоит знаменатель, а поля с малым числом наблюдений либо объединяются в группу, либо помечаются как неизмеримые на этом наборе. Считать среднее по полям, где часть долей построена на трёх объектах, значит смешивать шум с сигналом."}],"practice":[{"t":"Интервал рядом с каждой дробью","d":"Добавь в отчётный скрипт колонку с интервалом Уилсона. Одна строка кода, и вопрос «это улучшение?» отпадает сам.","code":"from statsmodels.stats.proportion import proportion_confint\n\nfor field, (k, n) in per_field.items():\n    lo, hi = proportion_confint(k, n, method='wilson')\n    print(f'{field:12} {k}/{n} = {k/n:.3f}  [{lo:.2f}, {hi:.2f}]')"},{"t":"Макнемар между двумя прогонами","d":"Собери таблицу 2×2 по парам «поле в прогоне A, то же поле в прогоне B» и прогони тест. Значение имеют только b и c.","code":"from statsmodels.stats.contingency_tables import mcnemar\nb = sum(1 for k in keys if not old[k] and new[k])\nc = sum(1 for k in keys if old[k] and not new[k])\nprint('fixed', b, 'broken', c)\nprint(mcnemar([[0, b], [c, 0]], exact=True))"},{"t":"Bootstrap по документам","d":"Считай интервал для macro-метрики перевыборкой документов. Сравни с интервалом, полученным перевыборкой полей: второй окажется заметно уже, и это ровно та ошибка, которую делают чаще всего.","code":"import numpy as np\nrng = np.random.default_rng(0)\ndocs = list(by_doc)\nvals = []\nfor _ in range(10000):\n    sample = rng.choice(len(docs), len(docs), replace=True)\n    vals.append(macro_metric([by_doc[docs[i]] for i in sample]))\nprint(np.percentile(vals, [2.5, 97.5]))"},{"t":"Считать MDE до разметки","d":"Перед тем как обещать улучшение, посчитай симуляцией, какой размер выборки нужен для его обнаружения. Число обычно отрезвляет и превращает разговор из «давайте попробуем» в «давайте разметим столько-то»."},{"t":"Верхняя граница при нулевых ошибках","d":"Считать после каждого чистого прогона. Формулировка «ошибок нет» без знаменателя ничего не значит.","code":"def zero_error_bound(n, conf=0.95):\n    exact = 1 - (1 - conf) ** (1 / n)\n    return 3 / n, exact\n\nfor n in (20, 50, 100, 300):\n    rough, exact = zero_error_bound(n)\n    print(f'n={n:4}  правило трёх {rough:.3%}  точно {exact:.3%}')"},{"t":"Собственный шум системы до сравнения версий","d":"Три прогона без изменений дают вилку. Эффект меньше вилки не обсуждается, пока не зафиксированы сид и температура.","code":"runs = [score(dataset) for _ in range(3)]\nspread = max(runs) - min(runs)\nprint('прогоны:', [round(r, 4) for r in runs])\nprint('вилка  :', round(spread, 4))\nprint('порог обсуждаемого эффекта:', round(spread, 4), 'и выше')"}],"business":[{"t":"Приёмка пилота","d":"Заказчик пишет в договоре «точность не ниже 90%». Без размера выборки и интервала это обязательство невыполнимо в обе стороны: на 50 документах и 88%, и 94% статистически совместимы с девяноста."},{"t":"Спор о том, стало ли лучше","d":"Две команды приносят разные цифры по одной системе. В девяти случаях из десяти дело в разных наборах, версиях скорера или флагах, а не в модели. Интервал и описание прогона закрывают спор за пять минут."},{"t":"Планирование бюджета разметки","d":"Расчёт MDE переводится в число документов, число документов в часы аналитика, часы в деньги. Это единственный честный способ ответить на вопрос «сколько стоит поднять качество на три пункта»."},{"t":"Мониторинг в проде","d":"Ежедневная метрика на небольшом потоке шумит сама по себе. Без контрольных границ команда каждый день реагирует на шум, а настоящую деградацию замечает последней."}],"resources":[{"t":"statsmodels — интервалы для долей","u":"https://www.statsmodels.org/stable/generated/statsmodels.stats.proportion.proportion_confint.html","k":"инструмент","lang":"en","n":"Уилсон, Клоппер-Пирсон и остальные методы одним вызовом."},{"t":"statsmodels — тест Макнемара","u":"https://www.statsmodels.org/stable/generated/statsmodels.stats.contingency_tables.mcnemar.html","k":"инструмент","lang":"en","n":"Парный тест для двух прогонов на одном наборе."},{"t":"Seeing Theory — визуальная статистика","u":"https://seeing-theory.brown.edu/","k":"интерактив","lang":"en","n":"Распределения, ЦПТ и доверительные интервалы в виде интерактивных картинок."},{"t":"MIT 6.042J, глава 19 — отклонение от среднего","u":"https://ocw.mit.edu/courses/6-042j-mathematics-for-computer-science-spring-2015/mit6_042js15_textbook.pdf","k":"учебник","lang":"en","n":"Чебышёв, оценка по выборке и разница между доверием и вероятностью."},{"t":"Самая полная и понятная лекция по A/B тестам: метрики, гипотезы, статистика, инструменты","u":"https://www.youtube.com/watch?v=FEI1OA-zgb8","k":"видео","lang":"ru","n":"Полный цикл проверки гипотезы. Язык, на котором говорят продуктовые команды."},{"t":"Yandex for Analytics — Формула доверия: доверительные интервалы для ratio- и uplift-метрик","u":"https://www.youtube.com/watch?v=0yhbw9QV9Z4","k":"видео","lang":"ru","n":"Интервалы для дробных метрик — ровно твой случай с пер-полевыми долями."},{"t":"ASA Statement on p-Values","u":"https://www.amstat.org/asa/files/pdfs/P-ValueStatement.pdf","k":"статья","lang":"en","n":"Шесть принципов от американской статистической ассоциации: что p-значение не означает."},{"t":"statsmodels — расчёт мощности и размера выборки","u":"https://www.statsmodels.org/stable/generated/statsmodels.stats.power.NormalIndPower.html","k":"документация","lang":"en","n":"Считает нужное число объектов по ожидаемому эффекту и желаемой мощности."},{"t":"Simpson's paradox","u":"https://en.wikipedia.org/wiki/Simpson%27s_paradox","k":"справка","lang":"en","n":"Разбор с классическими примерами, включая приём в университет и медицинские исследования."}]},{"id":"B","title":"Эталон, данные, утечки","lead":"Метрика ломается здесь чаще, чем модель. Загрязнённый эталон нельзя починить хорошим промптом, а нечестная цифра дороже плохой.","terms":[{"t":"Контаминация тестсета","d":"Оценочные данные просочились в промпт, few-shot или в дообучение. Метрика перестаёт мерить обобщение.","m":"21.07: примеры темы из эталонных формулировок аналитика по тестовым докам. Модель скопировала их дословно, 8/8 оказалось фикцией, честные 6/8."},{"t":"Якорение разметчика","d":"Разметчик, который видит предсказание модели, склонен его принять. Эталон подстраивается под модель.","m":"Переразметку по итогам прогона проводить слепо: документ и значение, без указания источника."},{"t":"Cohen's kappa","d":"Согласие двух разметчиков за вычетом случайных совпадений. Потолок задачи: выше согласия людей модель оценить нельзя.","m":"Правило темы у тебя переписывалось трижды. Низкое согласие — сигнал переписать правило, а не выбрать «правильного» разметчика."},{"t":"Дефект эталона против промаха модели","d":"Значение из другой версии файла, опечатка, реквизит физически отсутствует во входном документе.","m":"026382 — gold-дефект версии. Номера 013580в и 016975в есть в карточке и в stamp-версии, но не в основном документе. Промахи модели считаются после вычета таких случаев."},{"t":"Версионирование датасета","d":"Файл + хеш содержимого. Без хеша «тот же датасет» — ничем не подтверждённое утверждение.","m":"dataset=<файл>@<sha> в описании рана. Эталон правится еженедельно, ссылка на имя файла ничего не значит."},{"t":"Описание набора","d":"Происхождение, состав, что подаётся на вход, статус эталона, измеряемые и исключённые поля, ограничения применения.","m":"not_measured_fields: ['signatory'] на всех 39 holdout — знаменатель 181 вместо 220. Это обязано быть в первой строке описания, а не в примечании."},{"t":"Смещение отбора","d":"Набор собран так, что систематически отличается от потока: один период, один источник, только прошедшие предыдущий этап.","m":"Каждое условие отбора это оговорка к метрике. Пишется в описание набора сразу."},{"t":"Наблюдений на поле","d":"Число документов, где поле реально присутствует. Метрика по полю считается по нему, а не по размеру набора.","m":"Тридцать наблюдений дают интервал около плюс-минус пятнадцать пунктов, сто около восьми."},{"t":"Near-duplicates","d":"Документы, отличающиеся мелочами: номером, датой, одним абзацем. Хеш-дедупликация их не ловит.","m":"MinHash с порогом около 0.8 по нормализованному тексту, проверка между наборами и внутри теста."},{"t":"Дрейф состава","d":"Расхождение между составом эталона и составом текущего потока по типам, источникам, длине, доле сканов.","m":"Зелёная метрика на старом наборе при падении в проде это обычно он."}],"pitfalls":["Брать few-shot примеры из документов, на которых меряешь.","Согласовывать переразметку, показав аналитику, что значения пришли от модели.","Считать промахом поле, которого нет во входном файле.","Менять эталон и не перескорить старые прогоны — потом сравнивать их с новыми.","Держать один скорер в двух копиях в двух ветках: они разъедутся, и цифры разойдутся необъяснимо."],"drill":"Прогони grep по своим предсказаниям: совпадает ли хоть один ответ модели дословно с текстом примера в промпте. Затем проверь свой текущий промпт на предмет любых формулировок, взятых из оценочных документов. Это тридцать минут и оно один раз уже спасло бы тебе замер.","level":"базовый","theory":[{"h":"Эталон — это измерительный прибор, а не данные","p":"К эталону применимы те же требования, что к прибору: поверка, версия, известная погрешность. Отсюда три обязательных свойства. Версия: правка разметки создаёт новую версию, а не молча меняет историю метрик. Происхождение: кто размечал, по какому правилу, когда. Погрешность: согласие разметчиков, ниже которого требовать от модели бессмысленно. Метрика, посчитанная по неверсионированному эталону, невоспроизводима по определению."},{"h":"Контаминация: как метрика начинает мерить саму себя","p":"Три канала загрязнения. Первый: пример из оценочной выборки попал в промпт как few-shot, и модель воспроизводит подсказку. Второй: оценочные документы попали в обучающую выборку при дообучении. Третий, самый незаметный: эталон переразмечен по предсказаниям модели. Проверка на первый канал стоит один grep: совпадает ли ответ модели дословно с текстом примера. На третий — слепой вердикт разметчика, который не знает, откуда пришло значение."},{"h":"Дефект эталона против промаха модели","p":"Перед тем как называть поле промахом, исключаются: значение из другой версии файла, опечатка разметчика, поле физически отсутствует во входе (лежит в карточке или на непереданной странице), правило разметки изменилось после создания эталона. Порядок обязателен: иначе чинится промпт там, где надо чинить разметку. Практика — держать в отчёте отдельную строку «дефекты эталона» и не смешивать её с ошибками модели."},{"h":"Согласие разметчиков задаёт потолок","p":"Cohen's kappa вычитает совпадения, которые случились бы случайно, поэтому она честнее голого процента согласия, особенно при несбалансированных классах. Значение kappa около 0.85 означает, что и люди спорят, и требовать от модели 0.95 бессмысленно: часть «ошибок» будет спором о правиле. Низкая kappa — сигнал переписать инструкцию разметки, а не выбрать «правильного» разметчика."},{"h":"Описание набора: без него цифра не воспроизводится","p":"Минимум, который сопровождает любое число: файл датасета и его хеш, версия эталона, число документов и полей, какие поля не меряются и почему, критерий попадания документа в набор. Разные знаменатели — обычная причина несопоставимости двух «одинаковых» метрик: на одном наборе поле не меряется вовсе, на другом меряется, и агрегаты расходятся без всякой связи с качеством модели."},{"h":"Утечки в данных и как их искать","p":"Три вида. Признак из будущего: в момент предсказания его ещё не существует. Дубликаты между train и test: один документ в двух наборах, часто в разных форматах. Групповая утечка: страницы одного документа или документы одного контрагента разошлись по обучению и проверке. Поиск: дедупликация по хешу и по близости, проверка разбиений на группы, и простой вопрос к каждому признаку — когда он заполняется в реальной системе."},{"h":"Как набирается выборка и чем она смещена","p":"Случайная выборка из потока даёт средний срез и плохо покрывает редкое. Стратифицированная задаёт доли по типам заранее и позволяет мерить каждый тип отдельно. Выборка по худшим случаям хороша для отладки и непригодна для отчётной цифры. Смещение отбора приходит незаметно: взяли документы за один месяц, взяли только те, что прошли предыдущий этап, взяли те, где эталон уже был. Каждая такая фраза в описании набора это оговорка к метрике, и писать её надо сразу, а не когда результат оспорят."},{"h":"Сколько документов нужно на поле","p":"Метрика считается по полю, значит и объём нужен на поле, а не на документ. Если реквизит встречается в четверти документов, то на выборке в сорок документов он даёт десять наблюдений, и доверительный интервал по нему шире тридцати пунктов. Рабочая прикидка: тридцать наблюдений на поле дают интервал около плюс-минус пятнадцати пунктов, сто наблюдений около плюс-минус восьми. Отсюда способ собирать эталон: не «сорок документов», а «столько, чтобы на каждое обязательное поле пришлось не меньше тридцати случаев»."},{"h":"Три набора и гигиена holdout","p":"Набор для разработки правят и смотрят каждый день. Набор для проверки трогают при каждом релизе. Holdout открывают редко и по регламенту, потому что каждый взгляд на него, за которым следует правка, немного превращает его в набор для разработки. Практика: держать holdout отдельно, фиксировать дату и причину каждого прогона по нему, и заводить новый, когда счётчик обращений перевалил за десяток. Цифра с holdout идёт в отчёт, цифры с остальных наборов идут в работу."},{"h":"Near-duplicates: утечка, которую не видно глазом","p":"Два документа отличаются номером и датой, остальное совпадает. Один попал в примеры промпта, другой в тестовый набор, и метрика выросла без всякой причины. Полная дедупликация по хешу такие пары не ловит. Работающий приём: шинглы и MinHash по нормализованному тексту, порог похожести около 0.8, ручной просмотр найденных пар. Проверять надо в обе стороны: между обучающими примерами и тестом, и внутри теста, где дубли искажают вес отдельных шаблонов."},{"h":"Инструкция разметчику это код","p":"Разметка воспроизводима ровно настолько, насколько подробна инструкция. Минимум: определение каждого поля, правило для спорных случаев, примеры да и нет, правило для пустого значения, правило для нескольких кандидатов. Инструкция версионируется вместе с набором, потому что смена правила меняет эталон, а значит и все метрики до неё. Типичный признак плохой инструкции: два разметчика расходятся на одних и тех же случаях, и согласие не растёт от разговора."},{"h":"Дрейф потока и состав набора","p":"Эталон собран в марте, поток в сентябре другой: появился новый контрагент со своим шаблоном, доля сканов выросла, средняя длина документа изменилась. Метрика на старом наборе остаётся зелёной, а качество в проде падает. Дешёвый мониторинг состава: доля типов документов, доля сканов против цифровых, распределение длины, доля документов от новых источников. Расхождение состава между эталоном и потоком за месяц это сигнал обновить набор, а не менять модель."}],"practice":[{"t":"Проверить few-shot на контаминацию","d":"Сравни ответы модели с текстом примеров из промпта. Полное или почти полное совпадение означает, что метрика измеряет твою подсказку.","code":"import difflib\nfor doc_id, pred in predictions.items():\n    for ex in fewshot_examples:\n        ratio = difflib.SequenceMatcher(None, pred.strip(), ex.strip()).ratio()\n        if ratio > 0.9:\n            print('contaminated', doc_id, round(ratio, 2))"},{"t":"Версионировать эталон явно","d":"Клади рядом с эталоном хеш и дату, а в результат прогона пиши версию эталона. Тогда вопрос «по какому эталону получена эта цифра» имеет ответ без археологии.","code":"import hashlib, json, pathlib\np = pathlib.Path('gold/holdout39.jsonl')\nmeta = {'file': p.name, 'sha': hashlib.sha256(p.read_bytes()).hexdigest()[:12],\n        'n_docs': sum(1 for _ in p.open(encoding='utf-8'))}\npathlib.Path('gold/holdout39.meta.json').write_text(json.dumps(meta, ensure_ascii=False, indent=2), encoding='utf-8')"},{"t":"Посчитать kappa между разметчиками","d":"Дай двум людям 30 одинаковых документов и посчитай kappa. Число сразу говорит, где потолок задачи и нужно ли переписывать правило.","code":"from sklearn.metrics import cohen_kappa_score\nprint(round(cohen_kappa_score(rater_a, rater_b), 3))"},{"t":"Слепая переразметка","d":"Когда предлагаешь аналитику исправить эталон, показывай документ и значение, не говоря, что значение пришло от модели. Иначе якорение делает эталон зависимым от предсказаний, и метрика начинает мерить сама себя."},{"t":"Поиск почти-дубликатов между наборами","d":"Прогонять перед каждым замером и после каждого пополнения набора. Хеш-дедупликация такие пары пропускает.","code":"from datasketch import MinHash, MinHashLSH\n\ndef sig(text, k=5):\n    m = MinHash(num_perm=128)\n    words = norm(text).split()\n    for i in range(len(words) - k + 1):\n        m.update(' '.join(words[i:i + k]).encode())\n    return m\n\nlsh = MinHashLSH(threshold=0.8, num_perm=128)\nfor doc_id, text in train.items():\n    lsh.insert(doc_id, sig(text))\n\nfor doc_id, text in test.items():\n    hits = lsh.query(sig(text))\n    if hits:\n        print('утечка:', doc_id, '->', hits)"},{"t":"Счётчик обращений к holdout","d":"Каждый прогон по holdout пишется в журнал с датой и причиной. Десяток обращений это повод заводить новый набор.","code":"import json\nimport datetime\n\ndef log_holdout_run(reason, score, path='holdout_runs.json'):\n    runs = json.load(open(path)) if os.path.exists(path) else []\n    runs.append({'date': datetime.date.today().isoformat(),\n                 'reason': reason, 'score': score})\n    json.dump(runs, open(path, 'w'), ensure_ascii=False, indent=1)\n    print('обращений к holdout:', len(runs))\n    if len(runs) > 10:\n        print('пора заводить новый holdout')"}],"business":[{"t":"Спор с заказчиком о качестве","d":"Когда заказчик говорит «у вас ошибка», в половине случаев это расхождение правил разметки. Версия эталона и письменное правило превращают конфликт в согласование определения."},{"t":"Аудит и регуляторная проверка","d":"В банках и медицине от поставщика требуют показать, на каких данных получена заявленная точность. Без версионирования эталона это заканчивается пересдачей замера за свой счёт."},{"t":"Смена подрядчика по разметке","d":"Инструкция разметки с примерами и целевой kappa — то, что передаётся новому подрядчику. Без неё качество данных меняется незаметно, а метрика уезжает через месяц."},{"t":"Публикация цифр наружу","d":"Цифра в презентации живёт дольше проекта. Указание набора, его размера и того, что не меряется, защищает от вопросов через год, когда контекста уже никто не помнит."}],"resources":[{"t":"scikit-learn — cohen_kappa_score","u":"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.cohen_kappa_score.html","k":"инструмент","lang":"en","n":"Согласие разметчиков в одну строку, включая взвешенные варианты."},{"t":"Datasheets for Datasets","u":"https://arxiv.org/abs/1803.09010","k":"статья","lang":"en","n":"Шаблон описания набора: происхождение, состав, ограничения. Готовый чек-лист для отчёта."},{"t":"DVC — версионирование данных","u":"https://dvc.org/doc","k":"инструмент","lang":"en","n":"Версии датасетов рядом с кодом, если файлы с хешами уже не хватает."},{"t":"Argilla — разметка и согласие","u":"https://docs.argilla.io/","k":"инструмент","lang":"en","n":"Интерфейс разметки с поддержкой нескольких аннотаторов и разбора расхождений."},{"t":"datasketch — MinHash и LSH","u":"https://ekzhu.com/datasketch/minhash.html","k":"инструмент","lang":"en","n":"Поиск почти-дубликатов на больших наборах за линейное время."},{"t":"cleanlab — поиск ошибок разметки","u":"https://docs.cleanlab.ai/stable/index.html","k":"инструмент","lang":"en","n":"Находит подозрительные метки в эталоне, включая противоречия между разметчиками."}]},{"id":"C","title":"Промпт, схема ответа, декодинг","lead":"Правило вместо просьбы. Всё, что можно сделать механизмом — схемой, грамматикой, валидатором — не делается инструкцией в промпте: инструкция необязательна к исполнению и стоит внимания модели.","terms":[{"t":"Structured output / JSON Schema","d":"Ответ обязан соответствовать схеме. Провайдер валидирует его, а не ты парсишь.","m":"У OpenAI — response_format: json_schema. У Anthropic — tool use со схемой. У vLLM — guided decoding."},{"t":"Constrained decoding","d":"Грамматика обрезает распределение на каждом шаге сэмплинга: невалидный токен физически не может быть выбран. Реализации: Outlines, XGrammar, llguidance.","m":"Это разница между «модель обычно возвращает JSON» и «модель не может вернуть не-JSON». Твои парсеры и перезапросы — костыль на этом месте."},{"t":"Function calling / tool use","d":"Тот же механизм схемы, но с семантикой вызова. Модель выбирает инструмент и заполняет типизированные аргументы.","m":"Извлечение шести реквизитов естественно ложится в один инструмент с шестью типизированными полями и явным null."},{"t":"Явный null в схеме","d":"Разрешение не заполнять поле. Без него модель дозаполняет отсутствующий реквизит правдоподобной выдумкой.","m":"number_retry однажды выдумал номер из реквизита «На № … от …» — модель предпочитает заполнить, а не признать отсутствие."},{"t":"Перегрузка промпта","d":"Каждое новое общее правило перераспределяет внимание и регрессирует то, что работало.","m":"v5 с +5 правилами: 91.2% → 79.4%. reply v4 с +3 правками: 69.4% → 54.5%. Few-shot (+2 примера): +7.7пп без регрессии."},{"t":"Детерминизм при temperature=0","d":"Greedy-выбор детерминирован математически, но не в рантайме: батчинг, порядок редукций на GPU, неассоциативность плавающей точки.","m":"Отсюда пин провайдера. Дрейф качества без изменения кода — почти всегда смена сборки на той стороне."},{"t":"Именование механизмов","d":"retry, backoff, timeout — занятые термины транспортного слоя. Для смысловых повторов: requery, refine, followup.","m":"MR !3: ревьюер прочитал subject_retry как сетевой ретрай и предложил httpx transport. Ревью ушло не туда."},{"t":"tool_choice","d":"Параметр API, задающий, обязан ли вызов инструмента произойти и какой именно инструмент вызвать.","m":"auto допускает текстовый ответ, any гарантирует какой-то инструмент, имя гарантирует нужный."},{"t":"Рассеивание внимания","d":"Падение качества чтения в середине длинного входа. Ошибки коррелируют с позицией, а не со сложностью.","m":"Лечится разбиением на проходы и отдельной сверкой, не размером контекстного окна."},{"t":"Кэш префикса","d":"Переиспользование неизменного начала промпта между вызовами: дешевле и быстрее.","m":"Неизменное вперёд, переменное в конец. Правка одного символа в начале обнуляет кэш."},{"t":"top-p и top-k","d":"Отсечение кандидатов по накопленной вероятности и по количеству соответственно.","m":"Для извлечения данных достаточно температуры около нуля. Крутить все три параметра сразу нельзя."}],"pitfalls":["Чинить формат ответа инструкцией «отвечай только JSON» вместо схемы.","Добавлять правила в промпт и не перепроверять то, что раньше работало.","Класть промпты и бизнес-логику в провайдер-специфичный клиент: при втором провайдере всё продублируется.","Писать ручной цикл ретраев, не посмотрев встроенное в библиотеку (httpx.AsyncHTTPTransport(retries=N)).","Считать temperature=0 гарантией воспроизводимости."],"drill":"Перепиши свой вызов извлечения на structured output со схемой из шести полей и явным null. Прогони на дев-56 с одинаковыми тумблерами и сравни Макнемаром с текущим. Гипотеза для проверки: часть промахов по номеру — это дозаполнение вместо пустоты.","level":"базовый","theory":[{"h":"Механизм вместо просьбы","p":"Инструкция в промпте необязательна к исполнению: она конкурирует за внимание с остальным текстом и нарушается тем чаще, чем длиннее вход. Механизм исполняется всегда. Иерархия надёжности: грамматика декодирования (невалидный токен физически не может быть выбран), схема ответа на уровне API, валидатор на выходе с повтором, и только в самом низу текстовая инструкция. Правило простое: всё, что выражается схемой, выражается схемой."},{"h":"Как работает constrained decoding","p":"На каждом шаге генерации модель выдаёт распределение по словарю. Ограниченное декодирование обнуляет вероятность токенов, которые нарушили бы грамматику, и нормирует остаток, поэтому невалидный JSON получиться не может. Реализации: json_schema в response_format у OpenAI, guided decoding (Outlines, XGrammar) у vLLM, tool use со схемой у Anthropic. Цена: небольшая накладная на построение автомата и потеря свободы там, где схема слишком жёсткая."},{"h":"Явный null против выдуманных значений","p":"Обязательное поле заставляет модель выдать значение даже тогда, когда его в документе нет: легального способа сказать «неприменимо» у неё просто нет. Nullable-поле снимает стимул к выдумке на этапе генерации. Постфильтр, который отбрасывает подозрительные значения, обнаруживает проблему, но не предотвращает её, и это разные вещи."},{"h":"Перегрузка промпта и регрессия на несвязанных примерах","p":"Добавление общих правил перераспределяет внимание модели, и то, что работало, начинает ломаться. Признак: правки, адресованные одному полю, роняют качество на документах, к которым они не относятся. Лечение: держать промпт коротким, выносить частные случаи в постпроцессор и валидатор, а улучшать через few-shot примеры, которые дают прирост без переписывания общих правил."},{"h":"Детерминизм: чего temperature=0 не даёт","p":"Нулевая температура убирает сэмплирование, но не убирает недетерминизм рантайма: батчинг, порядок редукций на GPU, неассоциативность плавающей арифметики. Плюс провайдер меняет сборку и квантование без предупреждения. Отсюда практика: пинить модель и провайдера, писать их в манифест прогона и держать канареечный набор, который ловит смену сборки на той стороне."},{"h":"Повтор с обратной связью, а не просто повтор","p":"Наивный ретрай воспроизводит ту же ошибку: модель не знает, что именно сломалось. Рабочая схема отправляет три вещи: исходный документ, неудачный ответ и конкретную ошибку валидации. Это включает самокоррекцию, и на ошибках формата она работает хорошо. Важно ограничить число повторов и считать их в стоимость: два ретрая на каждый документ удваивают счёт."},{"h":"tool_choice: гарантия на уровне API, а не просьбы","p":"Если ответ обязан быть структурой, инструмент выбирается принудительно по имени. Режим auto оставляет модели право ответить текстом, и конвейер время от времени получает прозу вместо JSON. Режим any гарантирует вызов какого-то инструмента, но при нескольких определённых выбор остаётся за моделью. Указание конкретного имени закрывает оба случая. Инструкция в системном промпте это не заменяет: гарантия живёт на уровне API, а текст промпта необязателен к исполнению."},{"h":"Few-shot: сколько, откуда и чем опасно","p":"Два-три примера обычно дают основной прирост, дальше отдача падает, а цена и риск перекоса растут. Примеры задают не только формат, но и распределение: три примера с заполненным полем учат модель заполнять его всегда. Брать примеры из тестового набора нельзя, метрика после этого измеряет саму себя. Рабочий набор примеров собирается из отдельной корзины, покрывает разные исходы, включая пустое значение и отказ, и версионируется вместе с промптом."},{"h":"Многопроходная обработка против рассеивания внимания","p":"Длинный документ одним вызовом читается неравномерно: начало и конец лучше середины, и ошибки коррелируют с позицией, а не со сложностью. Диагностический признак именно такой, привязка ошибок к месту в документе. Лечение структурное: извлечение по разделам отдельными вызовами, затем проход сверки, который разрешает противоречия между разделами. Увеличение контекстного окна здесь не помогает, если документ и так помещается, а более настойчивая инструкция не компенсирует рассеивание."},{"h":"Порядок полей в схеме управляет рассуждением","p":"Модель заполняет структуру по порядку, и поле, стоящее раньше, влияет на то, что окажется в следующих. Отсюда практическое следствие: поля с обоснованием, цитатой из источника или коротким рассуждением ставятся до итогового значения, а не после. Обратный порядок превращает обоснование в оправдание уже принятого решения. Тот же приём работает как отладочный: цитата рядом со значением показывает, откуда модель его взяла, и удешевляет разбор ошибок."},{"h":"Кэш префикса меняет структуру промпта","p":"Провайдеры кэшируют неизменное начало промпта, и повторный вызов с тем же префиксом дешевле и быстрее. Из этого следует порядок сборки: сначала неизменное (системный промпт, схема, примеры, справочники), потом переменное (документ, вопрос). Перестановка блоков или правка одного символа в начале обнуляет кэш целиком. У кэша есть время жизни и минимальный размер префикса, которые надо смотреть у конкретного провайдера, прежде чем закладывать экономию в расчёт."},{"h":"Температура, top-p и top-k управляют разным","p":"Температура растягивает или сжимает распределение вероятностей перед выбором токена. Top-k оставляет k самых вероятных кандидатов, top-p оставляет столько, чтобы их суммарная вероятность достигла p. Для извлечения данных берут температуру около нуля и не трогают остальное. Для генерации текста крутят top-p, оставляя температуру умеренной. Крутить всё сразу бессмысленно: параметры перекрывают друг друга, и результат перестаёт объясняться."}],"practice":[{"t":"Схема ответа с nullable-полями","d":"Опиши карточку документа схемой, где отсутствующий реквизит выражается как null, а не как пустая строка. Пустая строка и null различаются в отчёте: одно означает «нет в документе», другое — «модель не справилась».","code":"CARD = {\n  'type': 'object',\n  'additionalProperties': False,\n  'required': ['number', 'date', 'sender', 'subject'],\n  'properties': {\n    'number': {'type': ['string', 'null']},\n    'date': {'type': ['string', 'null'], 'pattern': r'^\\d{4}-\\d{2}-\\d{2}$'},\n    'sender': {'type': ['string', 'null']},\n    'subject': {'type': ['string', 'null'], 'maxLength': 200},\n  },\n}"},{"t":"Повтор с текстом ошибки валидации","d":"Валидируй ответ схемой и при неудаче отправляй модели её собственный вывод вместе с сообщением валидатора. Ограничь двумя попытками.","code":"from jsonschema import Draft202012Validator, ValidationError\n\ndef ask_with_repair(doc, prompt, tries=2):\n    out = call_model(prompt, doc)\n    for _ in range(tries):\n        try:\n            Draft202012Validator(CARD).validate(out)\n            return out\n        except ValidationError as e:\n            out = call_model(prompt, doc, previous=out, error=e.message)\n    return None"},{"t":"Канареечный набор на смену сборки","d":"Двадцать документов с зафиксированными ответами, прогоняемые перед каждым релизом и раз в неделю по расписанию. Расхождение без изменений в коде означает, что сборка у провайдера сменилась."},{"t":"Проверить перегрузку промпта замером","d":"Добавляя правило, прогоняй полный набор, а не только те документы, ради которых правило вводилось. Смотри на пер-полевые дроби: типичная картина — плюс два пункта на целевом поле и минус три на двух других."},{"t":"Принудительный вызов конкретного инструмента","d":"Единственный способ гарантировать структуру ответа. Инструкция в промпте гарантией не является.","code":"response = client.messages.create(\n    model=MODEL,\n    max_tokens=2048,\n    tools=[EXTRACT_TOOL],\n    tool_choice={'type': 'tool', 'name': 'extract_document'},\n    messages=[{'role': 'user', 'content': payload}],\n)\nblock = next(b for b in response.content if b.type == 'tool_use')\ndata = block.input"},{"t":"Двухпроходная обработка длинного документа","d":"Первый проход по разделам, второй сверяет и разрешает противоречия. Применять, когда ошибки коррелируют с позицией в документе.","code":"parts = [extract(section) for section in split_by_headings(doc)]\n\nconflicts = {}\nfor field in FIELDS:\n    values = {p[field] for p in parts if p.get(field)}\n    if len(values) > 1:\n        conflicts[field] = sorted(values)\n\nfinal = reconcile(parts, conflicts) if conflicts else merge(parts)\nprint('противоречий:', len(conflicts), conflicts)"}],"business":[{"t":"Интеграция с чужой системой","d":"Приёмная сторона принимает строго описанный JSON. Схема на уровне API превращает «модель иногда возвращает текст» из инцидента в невозможное событие, и это прямо влияет на SLA интеграции."},{"t":"Стоимость ретраев","d":"Каждый повтор — это ещё один оплаченный вызов и плюс к задержке. Замена ретраев на грамматику декодирования уменьшает и счёт, и хвост латентности."},{"t":"Аудит решений","d":"Когда ответ модели влияет на деньги, нужна трассировка: какая версия промпта, какая схема, какой ответ. Версионирование промпта наравне с кодом — требование аудита, а не аккуратность."},{"t":"Передача правил бизнесу","d":"Правила, живущие в тексте промпта, невидимы для аналитика. Вынесенные в схему и валидатор, они становятся документом, который можно согласовать и проверить."}],"resources":[{"t":"OpenAI — Structured Outputs","u":"https://platform.openai.com/docs/guides/structured-outputs","k":"документация","lang":"en","n":"response_format с json_schema и ограничения на схемы."},{"t":"Anthropic — Tool use","u":"https://docs.anthropic.com/en/docs/agents-and-tools/tool-use/overview","k":"документация","lang":"en","n":"Гарантированный вызов конкретного инструмента как способ получить строгую структуру."},{"t":"vLLM — structured outputs и guided decoding","u":"https://docs.vllm.ai/en/latest/features/structured_outputs.html","k":"документация","lang":"en","n":"Грамматики на своём инференсе: Outlines и XGrammar."},{"t":"Outlines","u":"https://dottxt-ai.github.io/outlines/","k":"инструмент","lang":"en","n":"Генерация по регулярным выражениям и JSON-схемам для локальных моделей."},{"t":"Anthropic — Prompt engineering overview","u":"https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/overview","k":"документация","lang":"en","n":"Как тестировать промпт и определять критерии успеха до правок."},{"t":"Anthropic — Tool use overview","u":"https://docs.claude.com/en/docs/agents-and-tools/tool-use/overview","k":"документация","lang":"en","n":"Определение инструментов и режимы tool_choice, включая принудительный вызов по имени."},{"t":"Anthropic — Prompt caching","u":"https://docs.claude.com/en/docs/build-with-claude/prompt-caching","k":"документация","lang":"en","n":"Как устроен кэш префикса: границы блоков, время жизни, минимальный размер."},{"t":"Lost in the Middle","u":"https://arxiv.org/abs/2307.03172","k":"статья","lang":"en","n":"Замер того, как качество чтения зависит от позиции в длинном входе."}]},{"id":"D","title":"VLM и вход","lead":"Настройки рендера — это не вкусовщина, а часть метрики. Ты уже знаешь это на практике; здесь механика, которая объясняет почему.","terms":[{"t":"Визуальные токены и тайлинг","d":"Картинка режется на патчи фиксированного размера; число токенов растёт с площадью. Многие VLM режут вход на тайлы плюс уменьшенная копия целиком.","m":"200 dpi × max_side 1600 × 2 страницы — это тысячи токенов в prefill. Отсюда и цена, и TTFT."},{"t":"Порог читаемости шрифта","d":"Ниже некоторого dpi штрихи мелкого шрифта схлопываются в пиксельную кашу, и модель не столько ошибается, сколько угадывает.","m":"Первым ломается номер: короткая строка из цифр и разделителей без семантической избыточности."},{"t":"Геометрия бланка","d":"В формализованном документе позиция реквизита несёт его смысл: адресат справа вверху, исходящий номер в шапке слева, подпись внизу.","m":"11.08 текстовый вход отклонён замером именно поэтому: плоский текст стирает разметку страницы."},{"t":"Окно страниц","d":"Сколько страниц реально уходит в модель. Ограничение нормально, замалчивание — нет.","m":"У тебя 2 страницы, на стенде ML_MAX_PAGES=50 и dpi 150. Цифра со стенда будет другой не из-за модели — скажи это до того, как её назовут."},{"t":"MoE (a3b в имени модели)","d":"Mixture-of-Experts: всего 35B параметров, активны на токен ~3B. Память по полному размеру, скорость примерно как у плотной 3B.","m":"Это готовый ответ на вопрос «сколько железа надо под неё on-prem»: VRAM считаем по 35B, throughput — по 3B."},{"t":"OCR против VLM","d":"Классическое распознавание даёт текст и координаты дёшево; модель нужна там, где смысл в расположении.","m":"Гибрид часто лучше обоих: OCR для координат и проверки, VLM для структуры."},{"t":"Распознавание таблиц","d":"Три подзадачи: границы таблицы, сетка строк и столбцов, содержимое ячеек. Ломается обычно сетка.","m":"Мерить по доле правильно собранных строк целиком, а не по проценту символов."},{"t":"Нормализация значений","d":"Приведение обеих сторон сравнения к одному виду: кавычки, пробелы, буквы-двойники, регистр, форматы дат.","m":"Не должна склеивать реально разные значения, иначе метрика становится мягче задачи."},{"t":"Выдуманное значение против пропуска","d":"Пропуск видит оператор, выдуманное уходит дальше по процессу и стоит дороже.","m":"В пер-полевой таблице это отдельная колонка, и она важнее доли верных."}],"pitfalls":["Подбирать dpi и max_side на глаз вместо сетки замеров по цене и пер-полевому качеству.","Называть цифру, не указав окно страниц и параметры рендера.","Считать, что картинка защищает от чего-либо: VLM читает с неё текст, включая инъекции.","Сравнивать свой замер с замером стенда, не сверив настройки рендера."],"drill":"Собери сетку: dpi (150 / 200 / 300) × max_side (1200 / 1600 / 2000) на дев-56, и построй две кривые — цена за документ и попадания по номеру. Ты получишь конкретный ответ вместо унаследованных значений, и он же станет аргументом при настройке стенда.","level":"базовый","theory":[{"h":"Как страница становится токенами","p":"Картинка режется на патчи фиксированного размера, каждый патч превращается в вектор, и дальше языковая модель работает с ними как с токенами. Отсюда два следствия. Число визуальных токенов растёт пропорционально площади: сторона вдвое больше — токенов вчетверо больше. И стоимость внимания квадратична по числу токенов, поэтому рост площади бьёт по времени до первого токена сильнее, чем кажется. Параметры рендера — это параметры стоимости и качества одновременно."},{"h":"Разрешение против читаемости","p":"Ниже некоторого dpi штрихи мелкого шрифта схлопываются, и первым ломается то, что набрано самым мелким: номера, индексы, реквизиты в подвале. Выше некоторого разрешения информации не прибавляется, потому что её нет в исходном скане, а цена растёт. Правильный способ выбрать точку — сетка замеров dpi × длинная сторона по двум осям: пер-полевое качество и цена за документ. Глазом эта точка не находится."},{"h":"Почему картинка выигрывает у текстового слоя","p":"В бланке позиция несёт смысл: адресат справа вверху, исходящий номер слева в шапке, подпись внизу. Плоский текст эту геометрию стирает, и модель теряет признак, по которому различает похожие строки. Отсюда правило: если документ формализован, текстовый слой сам по себе слабее картинки, а гибрид (текст плюс изображение) — отдельная гипотеза, которую нужно мерить, а не считать очевидной."},{"h":"Окно страниц как явное ограничение","p":"Подавать две страницы из сорока нормально: у входящих реквизиты почти всегда в шапке. Ненормально называть метрику, не назвав это ограничение. Замер стоит один прогон: посчитать, на скольких документах нужное поле встречается дальше второй страницы. Это число либо закрывает вопрос навсегда, либо меняет конфигурацию."},{"h":"Предобработка перед подачей в VLM","p":"Тот же набор, что перед OCR: коррекция перекоса, обрезка полей, нормализация контраста. Разница в проверке: качество меряется не CER, а конечной метрикой по полям. Агрессивная бинаризация, полезная для Tesseract, для VLM часто вредна: модель обучалась на естественных изображениях, а не на чёрно-белых масках."},{"h":"Что означает a3b в имени модели","p":"Mixture-of-Experts: в модели 35 млрд параметров, но на каждый токен активируется около 3 млрд. Память нужна под все веса, скорость примерно как у плотной трёхмиллиардной. Практический вывод для расчёта железа: VRAM считается по полному размеру, пропускная способность — по активной части. Такие модели дают дешёвый инференс при дорогой памяти."},{"h":"OCR против VLM: когда классика дешевле","p":"Печатный текст на чистом скане распознаётся классическим движком быстрее и дешевле модели, причём с координатами каждого слова. VLM выигрывает там, где значение зависит от расположения: бланки, таблицы без линовки, рукописные пометки, печати поверх текста. Рабочая схема часто гибридная: OCR даёт текстовый слой и координаты, VLM отвечает на вопросы о структуре, а сопоставление ответа с текстовым слоем даёт и проверку, и подсветку. Выбор делается замером на своей выборке, а не по обещаниям карточки модели."},{"h":"Таблицы это отдельная задача","p":"Распознавание таблицы разбивается на три подзадачи: найти границы таблицы, восстановить сетку строк и столбцов, прочитать ячейки. Ломается обычно вторая: объединённые ячейки, таблицы без линий, перенос строки внутри ячейки, продолжение таблицы на следующей странице. Плоский текст из таблицы почти всегда бесполезен, потому что теряет привязку значения к заголовку. Проверять качество надо не по проценту прочитанных символов, а по проценту правильно собранных строк целиком."},{"h":"Что делает препроцессинг и что он не чинит","p":"Выравнивание перекоса, обрезка полей и чёрной рамки сканера, бинаризация с адаптивным порогом, удаление муара и точечного шума. Это дешёвые операции, которые поднимают качество на плохих сканах и ничего не дают на чистых. Чего препроцессинг не чинит: потерянные при сканировании штрихи, слишком низкое исходное разрешение, обрезанный край документа. Порядок работ: сначала посмотреть на худшие двадцать сканов глазами, потом чинить то, что там реально видно."},{"h":"Нормализация перед сравнением","p":"Модель вернула «ООО „Ромашка“», эталон содержит «ООО «Ромашка»», сравнение строк даёт промах на ровном месте. До сравнения приводятся к одному виду: тип кавычек, пробелы неразрывные и двойные, буквы-двойники из латиницы в кириллических словах, регистр, формат даты и номера. Нормализация пишется один раз и применяется к обеим сторонам сравнения. Отдельно фиксируется, что нормализация не делает: она не должна склеивать реально разные значения, иначе метрика становится мягче задачи."},{"h":"Оценка извлечения по полям, а не по документу","p":"Документ считается верным целиком редко, и такая метрика почти не даёт сигнала для работы. Полезнее пер-полевая таблица: по каждому реквизиту доля верных, доля пустых при наличии значения, доля выдуманных при отсутствии. Третья колонка важнее первых двух, потому что выдуманное значение дороже пропуска: пропуск видит оператор, выдуманное уходит дальше по процессу. Сводный документный показатель оставляют для отчёта заказчику, работают по полям."},{"h":"Цена страницы складывается заранее","p":"Визуальные токены на страницу зависят от разрешения, текстовые от объёма промпта и схемы, выходные от размера ответа. Прикидка делается до прогона: страниц в документе, документов в день, токенов на страницу, цена за миллион. Получившаяся цифра определяет и архитектуру, и допустимое разрешение. Типичная ошибка расчёта: считать только входные токены, забыв, что схема ответа и примеры едут в каждом вызове и что кэш префикса работает лишь при неизменном начале промпта."}],"practice":[{"t":"Сетка рендера по качеству и цене","d":"Прогони набор в девяти конфигурациях: dpi 150/200/300 на длинную сторону 1200/1600/2000. Построй таблицу: пер-полевое качество, число визуальных токенов, цена за документ, TTFT. Точка выбирается по таблице, а не по ощущению.","code":"for dpi in (150, 200, 300):\n    for side in (1200, 1600, 2000):\n        res = run(dataset, dpi=dpi, max_side=side, jpeg_quality=85)\n        print(dpi, side, score(res), tokens(res), cost(res), p95(res))"},{"t":"Посчитать, что теряется за окном страниц","d":"Пройди по эталону и посчитай, на скольких документах каждое поле впервые встречается дальше второй страницы. Это прямая оценка потолка при текущем окне.","code":"from collections import Counter\nbeyond = Counter()\nfor doc in gold:\n    for field, page in doc['field_page'].items():\n        if page > 2:\n            beyond[field] += 1\nprint(beyond.most_common())"},{"t":"Сравнить картинку, текстовый слой и гибрид","d":"Три прогона на одном наборе: только изображение, только извлечённый текст, изображение плюс текст в промпте. Разница в пер-полевых метриках отвечает на вопрос, который иначе решается спором."},{"t":"Зафиксировать параметры рендера в манифесте","d":"dpi, длинная сторона, качество JPEG, число страниц, порядок предобработки — в манифест прогона. Без этого два числа по одной системе несопоставимы, и это выясняется в худший момент."},{"t":"Сравнить OCR и VLM на своей выборке","d":"Один прогон, три колонки: OCR, VLM, гибрид. Решение принимается по таблице, а не по описанию модели.","code":"rows = []\nfor doc in sample:\n    rows.append({\n        'id': doc.id,\n        'ocr': score(extract_ocr(doc), gold[doc.id]),\n        'vlm': score(extract_vlm(doc), gold[doc.id]),\n        'hybrid': score(extract_hybrid(doc), gold[doc.id]),\n    })\n\nfor key in ('ocr', 'vlm', 'hybrid'):\n    print(key, round(sum(r[key] for r in rows) / len(rows), 3))"},{"t":"Нормализация перед сравнением","d":"Применяется к обеим сторонам. Отдельно проверяется, что она не склеивает разные значения.","code":"import re\nimport unicodedata\n\nLOOKALIKE = str.maketrans('ACEHKMOPTXYacepxy', 'АСЕНКМОРТХУасерху')\n\ndef norm(s):\n    s = unicodedata.normalize('NFKC', s or '')\n    s = s.replace('\\u00a0', ' ').replace('„', '«').replace('“', '»')\n    s = s.translate(LOOKALIKE)\n    s = re.sub(r'\\s+', ' ', s).strip().casefold()\n    return s\n\nassert norm('ООО „Ромашка“') == norm('ООО «Ромашка»')\nassert norm('Intel Corporation') != norm('Antel Corporation')"}],"business":[{"t":"Цена обработки документа","d":"Визуальные токены — основная статья расходов в документных конвейерах. Снижение длинной стороны с 2000 до 1600 иногда даёт минус треть счёта при неизменном качестве, и это решение уровня одной строки конфига."},{"t":"Разные источники сканов","d":"МФУ в филиалах, мобильные фото, электронные PDF: три разных распределения качества. Одна конфигурация рендера на всех даёт неровное качество, и правильный ответ — ветка по источнику, а не средняя настройка."},{"t":"Согласование ограничений с заказчиком","d":"«Мы читаем первые две страницы» должно стоять в описании сервиса рядом с метрикой. Ограничение, названное заранее, — инженерное решение; найденное заказчиком — инцидент."},{"t":"Расчёт железа под визуальный вход","d":"Длинный prefill означает большой KV-кэш, и он перестаёт быть поправкой в расчёте VRAM. Для on-prem это прямо определяет, сколько документов в минуту вытянет одна карта."}],"resources":[{"t":"Qwen-VL / Qwen2.5-VL — карточка модели","u":"https://huggingface.co/Qwen/Qwen2.5-VL-7B-Instruct","k":"документация","lang":"en","n":"Как модель режет изображение и какие ограничения по разрешению закладывались."},{"t":"Hugging Face — vision-language модели","u":"https://huggingface.co/blog/vlms","k":"разбор","lang":"en","n":"Как изображение попадает в языковую модель: проекция патчей и cross-attention."},{"t":"Pillow — работа с изображениями","u":"https://pillow.readthedocs.io/","k":"инструмент","lang":"en","n":"Ресайз, качество JPEG, конвертация цветовых пространств для конвейера рендера."},{"t":"pdf2image / pdftoppm","u":"https://pdf2image.readthedocs.io/","k":"инструмент","lang":"en","n":"Рендер PDF в растр с контролем dpi — начало конвейера."},{"t":"Tesseract — документация","u":"https://tesseract-ocr.github.io/tessdoc/","k":"документация","lang":"en","n":"Классический движок OCR: режимы сегментации страницы, определение ориентации, вывод с координатами."},{"t":"PaddleOCR","u":"https://github.com/PaddlePaddle/PaddleOCR","k":"инструмент","lang":"en","n":"Распознавание текста и таблиц, включая структуру документа."},{"t":"OpenCV — пороговая обработка","u":"https://docs.opencv.org/4.x/d7/d4d/tutorial_py_thresholding.html","k":"документация","lang":"en","n":"Адаптивная бинаризация и подготовка скана перед распознаванием."}]},{"id":"E","title":"Инференс и деплой","lead":"Полный пробел, и при этом on-prem уже стоит в требованиях заказчика. Здесь минимум, ниже которого разговор про своё железо невозможен.","terms":[{"t":"prefill / decode","d":"Две фазы генерации. Prefill обрабатывает весь промпт разом и упирается в вычисления. Decode генерирует по токену и упирается в пропускную способность памяти.","m":"Картинки — это тяжёлый prefill. Растёт TTFT, TPOT почти не меняется."},{"t":"TTFT / TPOT","d":"Время до первого токена и время на каждый следующий. Первое определяется prefill, второе — decode.","m":"Разложение «почему документ обрабатывается N секунд» идёт ровно по этим двум слагаемым."},{"t":"KV-кэш","d":"Сохранённые ключи и значения внимания для уже обработанных токенов, чтобы не пересчитывать их на каждом шаге. Линеен по длине контекста и числу параллельных запросов.","m":"На длинных визуальных входах KV-кэш легко перевешивает веса модели. В расчёте VRAM он обязателен, а не поправка."},{"t":"PagedAttention","d":"Хранение KV-кэша блоками фиксированного размера, как страниц виртуальной памяти. Убирает внутреннюю фрагментацию.","m":"Главный рычаг throughput в vLLM: в ту же VRAM влезает кратно больше одновременных запросов."},{"t":"Continuous batching","d":"Запросы входят и покидают батч на каждом шаге генерации, не дожидаясь самого длинного в батче.","m":"Вместе с PagedAttention — полный ответ на «зачем vLLM, а не голый transformers»."},{"t":"Prefix caching","d":"Переиспользование KV-кэша общего префикса между запросами: системный промпт считается один раз.","m":"У тебя системный промпт одинаков на всех документах — это прямая экономия prefill."},{"t":"Квантование","d":"FP16 ≈ 2 байта на параметр, INT8 ≈ 1, INT4 ≈ 0.5. Схемы: AWQ, GPTQ, GGUF, FP8. Потеря точности неравномерна.","m":"Средняя метрика почти не падает, а трудные документы проседают. Принимать по пер-полевым метрикам и по хвосту, не по агрегату."},{"t":"Расчёт VRAM","d":"Веса (параметры × байт на параметр) + KV-кэш (длина контекста × слои × размерность × 2 × байт × параллельные запросы) + активации.","m":"35B в FP16 — примерно 70 ГБ только под веса. 80 ГБ едва хватает на один экземпляр с коротким контекстом."},{"t":"Backpressure","d":"Отказ или очередь при перегрузке вместо приёма запроса, который всё равно не будет обслужен. Обратное — 429 и лавина ретраев.","m":"qwen3.6 на DeepInfra: 23 из 39 упали с 429 engine_overloaded. Ровно этого не должно быть у вас."},{"t":"Спекулятивный декодинг","d":"Маленькая модель предсказывает несколько токенов вперёд, большая проверяет их одним проходом. Ускоряет decode без потери качества.","m":"Знать, что такое существует, и не путать с квантованием — этого достаточно на данном этапе."},{"t":"Формула KV-кэша","d":"2 на слои на kv-головы на размер головы на байты точности, всё это на число токенов.","m":"Тридцать два слоя, восемь kv-голов, head_dim 128, fp16 дают 128 КБ на токен и 4 ГБ на 32 тысячи токенов."},{"t":"Тензорный и конвейерный параллелизм","d":"Разрез слоя между картами против разреза модели по слоям.","m":"Тензорный внутри узла с быстрой шиной, конвейерный между узлами. До обоих пробуют квантование."},{"t":"Насыщение по конкурентности","d":"Точка, после которой рост числа одновременных запросов перестаёт увеличивать пропускную способность и только растит задержку.","m":"Находится ступенчатым замером. Это и есть рабочий предел узла, который идёт в расчёт мощности."},{"t":"Прогрев","d":"Синтетические запросы после старта до включения в балансировку: загрузка весов и компиляция ядер занимают заметное время.","m":"Первые запросы медленнее установившегося режима в разы и портят перцентили, если сервис включён сразу."}],"pitfalls":["Считать VRAM только по весам, забыв KV-кэш.","Масштабировать GPU-сервис числом воркеров.","Принимать квантование по средней метрике.","Отвечать на перегрузку ретраями вместо очереди.","Обещать latency, не разложив её на prefill и decode."],"drill":"Подними vLLM локально или на любой доступной карте с маленькой моделью (7B в INT4 влезет в 8 ГБ). Померь TTFT и TPOT на коротком и длинном промпте, увидь разницу глазами. Затем посчитай на бумаге, сколько карт нужно под qwen3.5-35b-a3b при 30 документах в минуту — это тот расчёт, который у тебя спросят.","level":"продвинутый","theory":[{"h":"Две фазы инференса с разными узкими местами","p":"Prefill обрабатывает весь вход сразу и упирается в вычисления: здесь живёт время до первого токена. Decode генерирует по токену за шаг и упирается в пропускную способность памяти, потому что на каждом шаге читаются все веса ради одного токена. Отсюда разные лекарства: prefill лечится кэшем префикса и батчингом, decode — квантованием, спекулятивным декодингом и укрупнением батча. Документный конвейер с картинками — это тяжёлый prefill и короткий decode."},{"h":"KV-кэш: где кончается память","p":"Чтобы не пересчитывать внимание по всей истории на каждом шаге, key и value уже обработанных токенов хранятся в памяти. Размер кэша линеен по длине контекста и по числу одновременных запросов. На длинных входах он легко перевешивает сами веса, поэтому расчёт VRAM из двух слагаемых (веса плюс кэш) — обязательная часть планирования, а не уточнение."},{"h":"PagedAttention и continuous batching","p":"Без PagedAttention под каждый запрос резервируется непрерывный буфер на максимальную длину, и большая часть памяти простаивает. Блочное хранение с таблицей страниц убирает эту фрагментацию и позволяет держать кратно больше одновременных запросов. Continuous batching добавляет второе: запросы входят в батч и покидают его на каждом шаге генерации, а не ждут самого длинного в батче. Вместе это и есть ответ на вопрос «зачем vLLM, а не голый transformers»."},{"h":"Квантование и неравномерность потерь","p":"AWQ, GPTQ, GGUF, FP8 — схемы сжатия весов. Они экономят память и ускоряют decode, но качество теряется неравномерно: средняя метрика почти не двигается, а трудные и нетиповые случаи проседают заметно. Поэтому решение о квантовании принимается по пер-полевым метрикам и по хвосту распределения, а не по агрегату. Для документов это ровно те случаи, где оператору и так больнее всего."},{"h":"Backpressure вместо ретраев","p":"GPU не масштабируется добавлением воркеров: они делят одну память. При фиксированном железе честный рычаг — очередь с ограниченной глубиной и асинхронный контракт: клиент получает идентификатор и опрашивает статус. Ретраи при перегрузке усугубляют её, потому что клиент шлёт больше запросов именно тогда, когда сервис не справляется. Отказ с понятным кодом и временем повтора лучше, чем растущая очередь и таймауты."},{"h":"Что мерить в проде","p":"Четыре величины: TTFT и полное время ответа по перцентилям (p50, p95, p99), throughput в документах в минуту, занятость GPU и глубина очереди, доля ошибок по типам. Среднее время бесполезно: пользователь чувствует хвост. И отдельно — стоимость на документ, потому что она связывает инженерные решения с разговором про деньги."},{"h":"Сколько памяти нужно: веса плюс кэш плюс запас","p":"Веса занимают число параметров на число байт точности: семь миллиардов в fp16 это около тринадцати гигабайт, в четырёхбитном квантовании около трёх с третью. Поверх лежит KV-кэш, который считается отдельно и растёт с длиной и числом одновременных запросов. Поверх этого активации и фрагментация аллокатора, на которые закладывают запас процентов в десять-пятнадцать. Карта на двадцать четыре гигабайта под семёрку в fp16 годится для одного-двух коротких запросов и не годится для потока с длинным контекстом: упирается не размер модели, а кэш."},{"h":"Формула KV-кэша и что её уменьшает","p":"На один токен приходится два (ключ и значение) на число слоёв на число kv-голов на размер головы на байты точности. Для тридцати двух слоёв, восьми kv-голов при группированном внимании, размера головы сто двадцать восемь и fp16 выходит сто двадцать восемь килобайт на токен: полгигабайта на четыре тысячи токенов и четыре гигабайта на тридцать две тысячи. Уменьшают это тремя способами: группированное внимание вместо многоголового, квантование кэша в восемь бит, ограничение максимальной длины запроса. Первое заложено в архитектуру, остальные включаются на сервере."},{"h":"Размер батча торгует задержкой за пропускную способность","p":"Чем больше запросов обрабатывается одновременно, тем выше суммарная пропускная способность и тем хуже время до первого токена у каждого. Фаза генерации упирается в скорость чтения памяти, поэтому батчинг там почти бесплатен по времени и очень выгоден по итогу. Фаза чтения промпта упирается в вычисления, и длинный чужой промпт в том же батче задерживает всех. Отсюда типичная настройка: ограничить максимальную длину промпта, включить непрерывный батчинг и мерить не среднее, а девяносто пятый и девяносто девятый перцентили."},{"h":"Параллелизм, когда модель не влезает в карту","p":"Тензорный параллелизм режет каждый слой между картами и требует быстрой связи между ними, потому что обмен происходит на каждом слое. Конвейерный делит модель по слоям, обмен реже, но появляются простои. Практическое правило: тензорный внутри одного узла с быстрой шиной, конвейерный между узлами и только когда иначе никак. Дешёвая альтернатива, которую пробуют первой, это квантование: четырёхбитная модель часто влезает в одну карту и работает быстрее, чем та же модель в fp16 на двух."},{"h":"Спекулятивное декодирование","p":"Маленькая быстрая модель предлагает несколько следующих токенов, большая проверяет их за один проход и принимает совпавший префикс. Выигрыш берётся из того, что проверка нескольких токенов стоит почти столько же, сколько генерация одного. Ускорение реально на предсказуемом тексте (код, шаблонные документы) и падает почти до нуля на тексте, где маленькая модель угадывает плохо. Качество при этом не меняется: принимаются только те токены, которые выдала бы большая модель сама."},{"h":"Холодный старт и прогрев","p":"Загрузка весов с диска в память карты занимает от десятков секунд до минут, компиляция графов и подбор ядер добавляют ещё. Первые запросы после старта медленнее установившегося режима в разы, и именно они попадают в мониторинг как аномалия. Практика: прогревать сервис синтетическими запросами до включения в балансировку, держать модель загруженной вместо выгрузки по простою, а при автомасштабировании закладывать время старта в порог срабатывания. На своём железе без автомасштабирования это разовая проблема, в облаке постоянная."}],"practice":[{"t":"Посчитать VRAM до запуска","d":"Веса плюс кэш плюс активации. Формула кэша: 2 (key и value) × слои × головы_kv × размер_головы × длина × батч × байт_на_число. Числа берутся из конфига модели, а не из головы.","code":"def kv_gb(layers, kv_heads, head_dim, seq, batch, dtype_bytes=2):\n    return 2 * layers * kv_heads * head_dim * seq * batch * dtype_bytes / 1024 ** 3\n\nprint('weights fp16 GB', 35e9 * 2 / 1024 ** 3)\nprint('kv 8k ctx, 8 parallel', round(kv_gb(64, 8, 128, 8192, 8), 1))"},{"t":"Нагрузочный замер по перцентилям","d":"Прогони поток запросов с фиксированным параллелизмом и сними p50, p95, p99 отдельно для TTFT и полного времени. Повышай параллелизм, пока p95 не выйдет за допустимое: это и есть рабочая ёмкость.","code":"import numpy as np\nlat = np.array(latencies)\nfor p in (50, 95, 99):\n    print(f'p{p}', round(float(np.percentile(lat, p)), 2))"},{"t":"Проверить квантование на хвосте","d":"Сравни FP16 и квантованную сборку не по среднему, а по пер-полевым метрикам и отдельно по подвыборке плохих сканов. Если проседает только хвост, это и есть настоящая цена квантования."},{"t":"Включить кэш префикса","d":"Если системный промпт и инструкции одинаковы для всех документов, префиксный кэш убирает их повторный prefill. На длинных инструкциях выигрыш по TTFT заметный и достаётся настройкой, а не переписыванием кода."},{"t":"Расчёт памяти до закупки железа","d":"Веса, кэш и запас считаются на салфетке. Упирается обычно кэш при потоке длинных запросов, а не размер модели.","code":"def vram_gb(params_b, bits, layers, kv_heads, head_dim, ctx, concurrent):\n    weights = params_b * 1e9 * bits / 8\n    kv_per_token = 2 * layers * kv_heads * head_dim * 2\n    kv = kv_per_token * ctx * concurrent\n    total = (weights + kv) * 1.15\n    return weights / 1024**3, kv / 1024**3, total / 1024**3\n\nw, kv, total = vram_gb(7, 16, 32, 8, 128, ctx=8192, concurrent=8)\nprint(f'веса {w:.1f} ГБ | кэш {kv:.1f} ГБ | итого с запасом {total:.1f} ГБ')"},{"t":"Нагрузочный замер по перцентилям и насыщению","d":"Поднимать конкурентность ступенями, пока пропускная способность не перестанет расти. Точка перегиба и есть рабочий предел.","code":"for concurrency in (1, 2, 4, 8, 16, 32):\n    stats = bench(concurrency=concurrency, requests=200)\n    print(f'c={concurrency:3}  rps={stats.rps:6.2f}  '\n          f'ttft_p95={stats.ttft_p95:6.0f}ms  e2e_p99={stats.e2e_p99:7.0f}ms')"}],"business":[{"t":"On-prem по требованию заказчика","d":"Данные не покидают контур: выбор сужается до открытых весов, а разговор идёт про карты, VRAM и штат сопровождения. Расчёт железа — часть коммерческого предложения, и ошибка вдвое здесь стоит бюджета проекта."},{"t":"SLA на время обработки","d":"Обязательство «документ за 30 секунд» проверяется по p95 под пиковой нагрузкой, а не по замеру на одном файле. Очередь и backpressure превращают пик из отказа в предсказуемую задержку."},{"t":"Стоимость на документ как метрика продукта","d":"Цена складывается из визуальных токенов, длины ответа и числа повторов. Она сравнима между конфигурациями и понятна бизнесу, в отличие от TPOT."},{"t":"Деградация вместо падения","d":"При перегрузке сервис должен отдавать понятный отказ с временем повтора, а не копить таймауты. Это требование к интеграции, которое фиксируется в контракте API."}],"resources":[{"t":"vLLM — документация","u":"https://docs.vllm.ai/","k":"документация","lang":"en","n":"PagedAttention, continuous batching, prefix caching и параметры памяти."},{"t":"Efficient Memory Management for LLM Serving with PagedAttention","u":"https://arxiv.org/abs/2309.06180","k":"статья","lang":"en","n":"Первоисточник: откуда берётся выигрыш и сколько памяти терялось до него."},{"t":"Text Generation Inference","u":"https://huggingface.co/docs/text-generation-inference/index","k":"документация","lang":"en","n":"Альтернативный сервер инференса: полезно для сравнения решений."},{"t":"llama.cpp и GGUF","u":"https://github.com/ggml-org/llama.cpp","k":"инструмент","lang":"en","n":"Квантованный инференс на CPU и слабых GPU: вариант для локальных пилотов."},{"t":"Transformer Inference Arithmetic","u":"https://kipp.ly/transformer-inference-arithmetic/","k":"статья","lang":"en","n":"Разбор арифметики инференса: память, полоса, откуда берутся задержки."},{"t":"Fast Inference from Transformers via Speculative Decoding","u":"https://arxiv.org/abs/2211.17192","k":"статья","lang":"en","n":"Оригинальная работа про спекулятивное декодирование и условия выигрыша."},{"t":"llmperf — нагрузочное тестирование инференса","u":"https://github.com/ray-project/llmperf","k":"инструмент","lang":"en","n":"Замер TTFT, межтокенной задержки и пропускной способности под конкурентностью."}]},{"id":"F","title":"RAG, эмбеддинги, дообучение","lead":"Канон, которого не было в твоих задачах. Половина ценности здесь — уметь обоснованно сказать «нам это не нужно» и показать расчёт.","terms":[{"t":"Когда RAG не нужен","d":"Когда релевантный контекст известен заранее и помещается в окно. RAG решает выбор из корпуса, а не извлечение из данного документа.","m":"Твоя задача — не RAG. Один документ, две страницы, всё на входе."},{"t":"Чанкинг","d":"Нарезка документов на фрагменты для индексации. Размер, перекрытие и границы (по абзацам, по заголовкам) определяют, что вообще может быть найдено.","m":"Первый источник ошибок в RAG: реквизит, разрезанный границей чанка, не находится никогда."},{"t":"Эмбеддинги и косинусная близость","d":"Текст в вектор, близость по углу между векторами. Ловят смысл, плохо ловят точные строки.","m":"Номер договора и фамилия в эмбеддинге размываются — это принципиальное ограничение, а не недостаток конкретной модели."},{"t":"BM25","d":"Лексический поиск по частоте терминов. Ловит точные и редкие термины, не ловит перефразировки.","m":"В твоей предметной области — номера, артикулы, наименования — BM25 обязателен."},{"t":"Гибридный поиск и RRF","d":"Слияние лексического и векторного ранжирований. Reciprocal Rank Fusion складывает обратные ранги без подбора весов.","m":"Дефолт для продакшена. Чисто векторный поиск в проде почти всегда ошибка."},{"t":"Reranker (cross-encoder)","d":"Модель, читающая пару «запрос + кандидат» вместе. Дорого, поэтому запускается на top-50, а не на корпусе.","m":"Даёт наибольший прирост точности за наименьшую сложность в типовом RAG."},{"t":"recall@k, MRR, NDCG","d":"recall@k — доля запросов, где нужное попало в top-k, потолок всей системы. MRR и NDCG — качество порядка выдачи.","m":"Ретривер меряется отдельно от генератора. Если нужного нет в top-k, промпт не спасёт."},{"t":"LoRA","d":"Обучаются низкоранговые добавки к матрицам (A·B, ранг 8–64), базовые веса заморожены. Адаптер весит мегабайты.","m":"Дешёвое обучение, несколько адаптеров на одну базу, меньший риск катастрофического забывания."},{"t":"QLoRA","d":"LoRA поверх базы, квантованной в 4 бита, чтобы обучение влезло в одну карту.","m":"Стандартный способ дообучить крупную модель на доступном железе."},{"t":"SFT / DPO","d":"Supervised fine-tuning учит формату и стилю по парам вход-выход. DPO учит предпочтениям по парам лучше/хуже.","m":"Для извлечения реквизитов релевантен SFT, и то при тысячах примеров."},{"t":"Порядок рычагов","d":"Промпт → few-shot → structured output → постпроцессор и валидатор → и только потом дообучение.","m":"95 документов — это не про дообучение. Формулировка с расчётом сильнее отказа по интуиции."},{"t":"Граница чанка","d":"Резка по структуре документа вместо резки по числу символов, с добавлением заголовка раздела в текст чанка.","m":"Влияет на recall сильнее, чем размер. Фрагмент без контекста плохо отличим от соседних."},{"t":"HNSW","d":"Приближённый поиск по графу соседей: быстро и полно ценой памяти и медленной вставки.","m":"При переходе с плоского индекса первым делом меряют потерю recall и называют её цифрой."},{"t":"Переписывание запроса","d":"Несколько формулировок вопроса или гипотетический ответ вместо исходного запроса при поиске.","m":"Включается после замера, показавшего промахи именно из-за расхождения языка вопроса и документа."},{"t":"Удаление из индекса","d":"Отозванный документ должен исчезать из выдачи сразу, вместе со всеми своими чанками.","m":"Удалять по идентификатору документа и держать регрессионный тест на пустую выдачу по отозванному."}],"pitfalls":["Строить RAG там, где контекст известен.","Мерить RAG только по финальному ответу, не измерив ретривер отдельно.","Использовать чистый векторный поиск на данных с точными идентификаторами.","Идти в дообучение, не исчерпав промпт и постпроцессор.","Забывать, что дообучение привязывает к собственной инфраструктуре инференса."],"drill":"Собери игрушечный RAG на своих же документах: 95 файлов, чанки по абзацам, гибрид BM25 + эмбеддинги, reranker. Померь recall@5 на двадцати вопросах, которые придумаешь сам. Цель не в результате, а в том, чтобы механика прошла через руки.","level":"продвинутый","theory":[{"h":"Порядок рычагов: дообучение идёт последним","p":"Промпт, few-shot, структурированный вывод, постпроцессор с валидатором, поиск нужного контекста, и только потом обучение весов. Каждый следующий рычаг дороже предыдущего в разы и добавляет свою инфраструктуру: хранение чекпоинтов, свой инференс, регресс-тесты на каждую версию весов. Инженерная зрелость видна там, где этот порядок называют вслух и показывают, на каком шаге остановился и почему."},{"h":"Что такое веса и что с ними можно делать","p":"Веса — это матрицы чисел, полученные обучением; чекпоинт — их снимок на диске (safetensors как безопасный формат вместо pickle). С ними делают четыре вещи. Полное дообучение (SFT) меняет все веса и требует памяти под градиенты и состояния оптимизатора, примерно вчетверо больше, чем под сами веса. LoRA учит низкоранговые добавки при замороженной базе: обучаемых параметров доли процента, адаптер весит мегабайты. Merge вливает адаптер в базовые веса, чтобы не платить за него на инференсе. Квантование сжимает веса после обучения (AWQ, GPTQ, GGUF, FP8) и меняет качество неравномерно: среднее почти не двигается, редкие случаи проседают."},{"h":"Когда дообучение действительно нужно","p":"Три честных признака. Первый: нужен стабильный формат или стиль, которого промпт не держит даже со схемой. Второй: доменный язык, которого в предобучении не было (внутренние коды, узкая терминология), и few-shot не закрывает. Третий: нужно уменьшить модель, сохранив качество на узкой задаче, ради латентности и цены. Порог по данным грубый: сотни примеров — это про промпт и постпроцессор, тысячи однородных — уже разговор про LoRA. И отдельно: дообучение не чинит поиск. Если нужный фрагмент не попал в top-k, веса не помогут."},{"h":"Чистка корпуса как часть RAG, а не подготовка к нему","p":"Качество ответа ограничено сверху recall@k, а recall ограничен качеством корпуса. Обязательный минимум перед индексацией: нормализация юникода, склейка переносов, удаление повторяющихся колонтитулов, дедупликация почти-дубликатов, отбраковка пустых и служебных чанков, заполнение метаданных (тип документа, дата, контрагент, раздел). Метаданные важнее, чем кажется: фильтр по типу документа до векторного поиска отсекает половину ложных кандидатов бесплатно."},{"h":"Оценка RAG по слоям","p":"Система разбирается на три слоя, и каждый меряется отдельно. Ретривер — recall@k, MRR, NDCG. Переранжировщик — прирост тех же метрик на фиксированном кандидатном списке. Генератор — faithfulness (выводится ли ответ из поданного контекста) и correctness относительно эталона. Цифра «качество RAG 78%» без разбивки не говорит, что чинить. Правило отладки: сначала проверяешь, был ли ответ в top-k, и только потом трогаешь промпт."},{"h":"Мультимодальный и гибридный поиск: когда каждый оправдан","p":"Гибрид (BM25 плюс векторы, слияние RRF) оправдан почти всегда, где есть точные строки: номера, артикулы, фамилии, коды. Мультимодальный нужен, когда смысл лежит в макете или графике: таблицы, чертежи, бланки, где позиция реквизита и есть его значение. Оба решения принимаются замером на своём корпусе: три конфигурации, одна таблица recall@5, разговор закрыт. Без замера это вкусовщина, которая стоит недели интеграции."},{"h":"Чанкинг: размер, перекрытие, границы","p":"Слишком мелкий чанк теряет контекст и даёт обрывки; слишком крупный размывает вектор и тащит в промпт лишнее. Рабочий диапазон обычно от двухсот до восьмисот токенов с перекрытием в десять-двадцать процентов, но цифра выводится замером, а не берётся из статьи. Важнее размера граница: резать по структуре документа (заголовок, пункт, строка таблицы), а не по числу символов. Каждому чанку добавляют заголовок раздела и название документа, иначе вектор фрагмента без контекста плохо отличим от соседних."},{"h":"Выбор модели эмбеддингов","p":"Смотрят на четыре вещи: поддержка языка корпуса, максимальная длина входа, размерность вектора, лицензия и способ развёртывания. Размерность влияет на память индекса линейно: миллион чанков по 1024 измерения в float32 это около четырёх гигабайт, в int8 вчетверо меньше. Общие рейтинги дают направление, но порядок на своём корпусе почти всегда другой, поэтому две-три модели сравниваются на собственном наборе вопросов по recall@k. Смена модели эмбеддингов требует полной переиндексации, это закладывается в план."},{"h":"Индексы: плоский, HNSW, IVF","p":"Плоский перебор точен и линеен по времени, до сотни тысяч векторов его достаточно и он остаётся эталоном качества. HNSW строит многоуровневый граф соседей: быстрый поиск и высокая полнота ценой памяти и медленной вставки. IVF режет пространство на ячейки и смотрит только ближайшие, дешевле по памяти, но требует обучения на данных и теряет полноту на границах. Первое, что меряют при переходе с плоского на приближённый, это потеря recall: цифра должна быть названа, а не подразумеваться."},{"h":"Когда вопрос не похож на ответ","p":"Пользователь спрашивает «можно ли вернуть предоплату», в документе написано «условия расторжения договора». Векторная близость такие пары ловит плохо. Три приёма: переписывание запроса в несколько формулировок и объединение результатов, генерация гипотетического ответа с последующим поиском по нему, и гибрид с полнотекстовым поиском, который вытягивает точные термины и номера. Все три стоят дополнительных вызовов, поэтому включаются после того, как замер показал именно этот тип промахов, а не для галочки."},{"h":"Сколько чанков подавать генератору","p":"Больше контекста не значит лучше ответ: лишние фрагменты разбавляют внимание и вытесняют релевантное, а платит за них каждый вызов. Рабочий порядок: взять top-k пошире ретривером, переранжировать кросс-энкодером, подать в генератор три-пять лучших. Оптимальное число находят замером faithfulness при разном k, и кривая обычно имеет максимум, а не растёт монотонно. Отдельно проверяют поведение при нуле найденного: система обязана отвечать «в документах нет», а не сочинять."},{"h":"Жизнь индекса: обновление и удаление","p":"Корпус меняется: документы добавляются, редактируются, отзываются. Полная переиндексация раз в сутки проста и предсказуема, инкрементальное обновление дешевле, но требует учёта версий чанков и честного удаления. Особая боль это удаление: отозванный документ обязан исчезнуть из выдачи сразу, иначе система цитирует то, чего больше нет. Практика: хранить рядом с вектором идентификатор документа и версию, удалять по идентификатору, а не по тексту, и держать проверку «поиск по отозванному документу ничего не находит» в регрессионных тестах."}],"practice":[{"t":"Разложить провал по слоям за один прогон","d":"Собери 30 вопросов с известным правильным чанком. Для каждого запиши: попал ли нужный чанк в top-5, попал ли в top-20, верен ли финальный ответ. Три числа сразу говорят, чинить поиск или промпт.","code":"rows = []\nfor q, gold_id in qa:\n    ids = retrieve(q, k=20)\n    rows.append({\n        'in_top5': gold_id in ids[:5],\n        'in_top20': gold_id in ids,\n        'answer_ok': judge(answer(q, ids[:5]), gold_answer[q]),\n    })\nimport pandas as pd\nprint(pd.DataFrame(rows).mean())"},{"t":"Посчитать цену дообучения до того, как его предлагать","d":"Оцени три числа: сколько размеченных примеров есть сейчас, сколько стоит собрать десятикратно больше, и какой прирост даёт промпт с few-shot на тех же данных. Если промпт закрывает разрыв наполовину, разговор о LoRA откладывается."},{"t":"LoRA на маленьком датасете как эксперимент, а не как решение","d":"Если всё же пробуешь, держи базовую модель замороженной, r в диапазоне 8–32, и обязательно отложенный набор, который не участвовал в подборе. Сравнивай не с нуля, а с лучшим промптом.","code":"from peft import LoraConfig, get_peft_model\ncfg = LoraConfig(r=16, lora_alpha=32, lora_dropout=0.05,\n                 target_modules=['q_proj', 'v_proj'], task_type='CAUSAL_LM')\nmodel = get_peft_model(base_model, cfg)\nmodel.print_trainable_parameters()"},{"t":"Фильтр метаданных перед вектором","d":"Добавь к каждому чанку тип документа и год, и прогоняй поиск с предфильтром. Замерь recall@5 до и после. На смешанном корпусе это обычно самый дешёвый прирост из всех."},{"t":"Подобрать размер чанка замером","d":"Перебрать три-четыре размера с перекрытием на своём наборе вопросов и смотреть recall@k, а не ощущения.","code":"for size in (200, 400, 800):\n    for overlap in (0, int(size * 0.15)):\n        index = build_index(chunk(corpus, size, overlap))\n        r5 = recall_at_k(index, questions, k=5)\n        print(f'size={size:4} overlap={overlap:3} recall@5={r5:.3f} '\n              f'chunks={len(index)}')"},{"t":"Гибридный поиск через RRF","d":"Слияние рангов полнотекстового и векторного поиска. Даёт устойчивый прирост там, где в запросах встречаются номера, артикулы и фамилии.","code":"def rrf(rank_lists, k=60):\n    scores = {}\n    for ranking in rank_lists:\n        fo

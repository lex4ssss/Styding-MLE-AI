function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function gauss(r) {
  const u = Math.max(r(), 1e-12);
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r());
}

function fmt(x, d = 2) {
  return Number.isFinite(x) ? x.toFixed(d) : "—";
}

function pct(x, d = 0) {
  return Number.isFinite(x) ? (x * 100).toFixed(d) + "%" : "—";
}

function range(label, id, min, max, step, value, suffix = "") {
  return `<label class="lab-ctl"><span>${label}</span>
    <input type="range" data-k="${id}" min="${min}" max="${max}" step="${step}" value="${value}">
    <output data-o="${id}">${value}${suffix}</output></label>`;
}

function segmented(id, options, value) {
  return `<div class="lab-seg" role="group">${options.map(([v, t]) =>
    `<button type="button" data-seg="${id}" data-v="${v}" aria-pressed="${String(v) === String(value)}">${t}</button>`).join("")}</div>`;
}

function bindLab(el, st, draw) {
  el.addEventListener("input", e => {
    const k = e.target.dataset && e.target.dataset.k;
    if (!k) return;
    st[k] = Number(e.target.value);
    draw();
  });
  el.addEventListener("click", e => {
    const b = e.target.closest("[data-seg],[data-act]");
    if (!b || !el.contains(b)) return;
    if (b.dataset.seg) {
      const v = b.dataset.v;
      st[b.dataset.seg] = isNaN(Number(v)) ? v : Number(v);
    } else {
      st.act = b.dataset.act;
      st.actArg = b.dataset.arg;
    }
    draw();
    st.act = null;
  });
}

function syncOutputs(el, st, fmtMap = {}) {
  el.querySelectorAll("[data-o]").forEach(o => {
    const k = o.dataset.o;
    o.textContent = fmtMap[k] ? fmtMap[k](st[k]) : st[k];
  });
}

/* 1. Self-attention */
const ATT_SENT = {
  lock: { title: "навесной замок на двери", tokens: ["навесной", "замок", "на", "двери"] },
  castle: { title: "старинный замок на горе", tokens: ["старинный", "замок", "на", "горе"] }
};
const ATT_VEC = {
  "навесной": [0.2, 1.7, 0.0, 0.0],
  "замок": [0.9, 1.0, 1.0, 0.0],
  "на": [0.0, 0.0, 0.0, 1.3],
  "двери": [0.7, 1.3, 0.1, 0.0],
  "старинный": [0.3, 0.1, 1.5, 0.0],
  "горе": [0.6, 0.0, 1.7, 0.0]
};

function labAttention(el) {
  const st = { sent: "lock", q: 1, d: 64, scale: 1 };
  el.innerHTML = `
    <div class="lab-controls">
      ${segmented("sent", [["lock", "навесной замок"], ["castle", "старинный замок"]], st.sent)}
      ${range("Размерность головы d", "d", 4, 512, 4, st.d)}
      ${segmented("scale", [[1, "делить на √d"], [0, "не делить"]], st.scale)}
    </div>
    <div class="lab-stage" data-view></div>
    <p class="lab-note" data-note></p>`;
  const view = el.querySelector("[data-view]");
  const note = el.querySelector("[data-note]");
  function draw() {
    if (st.act === "q") st.q = Number(st.actArg);
    el.querySelectorAll("[data-seg]").forEach(b => b.setAttribute("aria-pressed", String(String(st[b.dataset.seg]) === b.dataset.v)));
    syncOutputs(el, st);
    const toks = ATT_SENT[st.sent].tokens;
    const q = ATT_VEC[toks[st.q]];
    const grow = Math.sqrt(st.d / 4);
    const raw = toks.map(t => ATT_VEC[t].reduce((s, v, i) => s + v * q[i], 0) * grow * 1.6);
    const logits = raw.map(x => st.scale ? x / Math.sqrt(st.d) * 2 : x);
    const m = Math.max(...logits);
    const ex = logits.map(x => Math.exp(x - m));
    const z = ex.reduce((a, b) => a + b, 0);
    const w = ex.map(x => x / z);
    const H = -w.reduce((s, p) => s + (p > 0 ? p * Math.log2(p) : 0), 0);
    const W = 640, x0 = 70, gap = (W - 2 * x0) / (toks.length - 1);
    const qx = x0 + st.q * gap;
    const arcs = toks.map((t, i) => {
      const kx = x0 + i * gap;
      const mid = (qx + kx) / 2, h = 26 + Math.abs(kx - qx) * 0.28;
      return `<path d="M${qx} 74 Q${mid} ${74 + h} ${kx} 150" class="lab-arc" style="stroke-width:${0.6 + w[i] * 7};opacity:${0.18 + w[i] * 0.82}"/>`;
    }).join("");
    const top = toks.map((t, i) => `<g class="lab-tok ${i === st.q ? "is-on" : ""}" data-act="q" data-arg="${i}" tabindex="0" role="button" aria-label="Запрос: ${t}">
        <rect x="${x0 + i * gap - 56}" y="34" width="112" height="34" rx="6"/>
        <text x="${x0 + i * gap}" y="56">${t}</text></g>`).join("");
    const bottom = toks.map((t, i) => {
      const bx = x0 + i * gap, bh = Math.max(2, w[i] * 96);
      return `<g class="lab-key">
        <rect x="${bx - 56}" y="150" width="112" height="30" rx="6"/>
        <text x="${bx}" y="170">${t}</text>
        <rect class="lab-bar" x="${bx - 18}" y="${300 - bh}" width="36" height="${bh}"/>
        <text class="lab-num" x="${bx}" y="${294 - bh}">${pct(w[i])}</text>
        <text class="lab-cap" x="${bx}" y="318">q·k ${fmt(logits[i], 1)}</text></g>`;
    }).join("");
    view.innerHTML = `<p class="lab-legend">сверху запрос (query), нажми на слово; снизу ключи (keys) и веса после softmax, толщина дуги — тот же вес</p>
      <svg viewBox="0 24 ${W} 306" class="lab-svg" role="group" aria-label="Веса внимания">
      ${arcs}${top}${bottom}</svg>`;
    const lead = toks.map((t, i) => [t, w[i]]).filter((_, i) => i !== st.q).sort((a, b) => b[1] - a[1])[0];
    const self = w[st.q];
    note.textContent = `Энтропия весов ${fmt(H, 2)} бита из ${fmt(Math.log2(toks.length), 2)} возможных. ` +
      (st.scale ? "" : (H < 0.3 ? "Без деления на √d softmax почти one-hot: градиент через остальные слова исчезает. " : "Увеличь d, чтобы увидеть насыщение. ")) +
      (self > 0.9
        ? `«${toks[st.q]}» смотрит почти только на себя: контекст в его вектор не попадает.`
        : `Из соседей больше всего «${toks[st.q]}» берёт от «${lead[0]}» (${pct(lead[1])}), поэтому одно и то же слово получает разный вектор в разных фразах. Переключи фразу и сравни.`);
    view.querySelectorAll(".lab-tok").forEach(g => g.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); st.q = Number(g.dataset.arg); draw(); }
    }));
  }
  bindLab(el, st, draw);
  draw();
}

const RAG_METRIC = { index: ["доля таблиц целиком", "доля чанков без разрыва", "recall@5 на чистом корпусе", "recall@k до и после смены модели", "потеря recall HNSW против плоского"], query: ["", "утечки по правам: 0", "recall@50 у каждого ранжирования", "recall@5 после слияния", "прирост recall@5 на том же списке", "faithfulness", "доля верных отказов"] };

function labStepper(el, STEPS, METRIC, phases) {
  const st = { phase: phases[0][0], i: 0 };
  el.innerHTML = `
    <div class="lab-controls">
      ${phases.length > 1 ? segmented("phase", phases, st.phase) : ""}
      <div class="lab-seg"><button type="button" data-act="prev">← шаг</button><button type="button" data-act="next">шаг →</button></div>
    </div>
    <div class="lab-stage" data-view></div>`;
  const view = el.querySelector("[data-view]");
  let lastPhase = st.phase;
  function draw() {
    if (st.phase !== lastPhase) { st.i = 0; lastPhase = st.phase; }
    const steps = STEPS[st.phase];
    if (st.act === "next") st.i = Math.min(steps.length - 1, st.i + 1);
    if (st.act === "prev") st.i = Math.max(0, st.i - 1);
    if (st.act === "go") st.i = Number(st.actArg);
    el.querySelectorAll("[data-seg]").forEach(b => b.setAttribute("aria-pressed", String(String(st[b.dataset.seg]) === b.dataset.v)));
    const flow = steps.map((s, i) => `<button type="button" class="lab-node ${i === st.i ? "is-on" : ""} ${i < st.i ? "is-past" : ""}" data-act="go" data-arg="${i}">
      <span class="lab-node-n">${i + 1}</span><span>${s[0]}</span></button>`).join(`<span class="lab-arrow" aria-hidden="true"></span>`);
    const s = steps[st.i];
    const metric = (METRIC[st.phase] || [])[st.i];
    view.innerHTML = `<div class="lab-flow">${flow}</div>
      <div class="lab-card"><b>${st.i + 1}. ${s[0]}</b><p>${s[1]}</p><p class="lab-warn">${s[2]}</p>${metric ? `<p class="lab-metric">мерить: ${metric}</p>` : ""}</div>`;
  }
  bindLab(el, st, draw);
  draw();
}

function labRag(el) {
  labStepper(el, RAG_STEPS, RAG_METRIC, [["query", "запрос"], ["index", "индексация"]]);
}

/* 4. Threshold, PR and cost */
function labThreshold(el) {
  const st = { prev: 5, t: 50, cfp: 1, cfn: 8, sep: 3 };
  el.innerHTML = `
    <div class="lab-controls">
      ${range("Доля положительных", "prev", 1, 50, 1, st.prev, "%")}

      ${range("Цена ложной тревоги", "cfp", 1, 20, 1, st.cfp)}
      ${range("Цена пропуска", "cfn", 1, 20, 1, st.cfn)}
      ${range("Разделимость классов", "sep", 1, 5, 1, st.sep)}
    </div>
    <div class="lab-stage lab-split" data-view></div>`;
  const view = el.querySelector("[data-view]");
  function sample() {
    const r = rng(7), N = 2000, pos = Math.round(N * st.prev / 100), mu = 0.12 + st.sep * 0.06;
    const clip = x => Math.min(0.999, Math.max(0.001, x));
    const s = [];
    for (let i = 0; i < N; i++) {
      const y = i < pos ? 1 : 0;
      s.push([clip(0.5 + (y ? mu : -mu) + gauss(r) * 0.16), y]);
    }
    return s;
  }
  function draw() {
    syncOutputs(el, st, { t: v => fmt(v / 100, 2), prev: v => v + "%" });
    const data = sample();
    const th = st.t / 100;
    let tp = 0, fp = 0, fn = 0, tn = 0;
    data.forEach(([s, y]) => { if (s >= th) { y ? tp++ : fp++; } else { y ? fn++ : tn++; } });
    const P = tp + fn, prec = tp / Math.max(1, tp + fp), rec = tp / Math.max(1, P), acc = (tp + tn) / data.length;
    const costs = [];
    for (let k = 1; k < 100; k++) {
      const t2 = k / 100; let a = 0, b = 0;
      data.forEach(([s, y]) => { if (s >= t2 && !y) a++; if (s < t2 && y) b++; });
      costs.push([t2, a * st.cfp + b * st.cfn]);
    }
    const best = costs.reduce((m, c) => c[1] < m[1] ? c : m, costs[0]);
    const maxCost = Math.max(...costs.map(c => c[1]));
    const bins = 40, hp = new Array(bins).fill(0), hn = new Array(bins).fill(0);
    data.forEach(([s, y]) => { const b = Math.min(bins - 1, Math.floor(s * bins)); (y ? hp : hn)[b]++; });
    const hmax = Math.max(...hn, ...hp, 1);

    const barsN = hn.map((v, i) => `<rect class="lab-hneg" x="${X(i / bins)}" y="${hY(v)}" width="${(W - 60) / bins - 1}" height="${150 - hY(v)}"/>`).join("");
    const barsP = hp.map((v, i) => `<rect class="lab-hpos" x="${X(i / bins)}" y="${hY(v)}" width="${(W - 60) / bins - 1}" height="${150 - hY(v)}"/>`).join("");
    const cost = costs.map(([t2, c]) => `${X(t2)},${280 - c / maxCost * 90}`).join(" ");

        <polyline class="lab-line" points="${cost}"/>

        <text class="lab-num" x="${X(best[0])}" y="${270 - best[1] / maxCost * 90}">минимум при ${fmt(best[0], 2)}</text>
      </svg></div>

          <b>модель +</b><span class="ok">TP ${tp}</span><span class="bad">FP ${fp}</span>

  const uid = "d" + Math.random().toString(36).slice(2, 8);

    let x = 1, y = 0.9 / squash(), vx = 0, vy = 0; const pts = [[x, y]];
    const lr = st.lr / 1000;
    for (let i = 0; i < 60; i++) {

      pts.push([x, y]);

    const gd = run(0), mo = run(st.mom / 100);
    const clamp = v => Math.max(-1.6, Math.min(1.6, v));
    const line = r => r.pts.map(([x, y]) => `${X(clamp(x))},${Y(clamp(y))}`).join(" ");
    const dist = r => Math.hypot(...r.pts[r.pts.length - 1]);
    view.innerHTML = `<p class="lab-legend">f = ½(x² + κy²), 60 шагов, ось y растянута, чтобы овраг был виден</p>
      <svg viewBox="0 0 ${W} ${Hh}" class="lab-svg" role="img" aria-label="Траектории спуска">
      <defs><clipPath id="${uid}"><rect x="0" y="0" width="${W}" height="${Hh}"/></clipPath></defs>
      <g clip-path="url(#${uid})">${ell}

      <circle class="lab-best" cx="${X(0)}" cy="${Y(0)}" r="4"/>
</svg>
      <p class="lab-kv">
        <span>серая, без момента: до минимума</span><b>${gd.div ? "разошёлся" : fmt(dist(gd), 3)}</b>
        <span>цветная, с моментом β ${fmt(st.mom / 100, 2)}: до минимума</span><b>${mo.div ? "разошёлся" : fmt(dist(mo), 3)}</b>

/* 6. Bias and variance: polynomial degree */
function polyFit(xs, ys, deg, ridge = 1e-9) {
  const n = deg + 1, A = Array.from({ length: n }, () => new Array(n + 1).fill(0));
  xs.forEach((x, k) => {
    const p = []; let v = 1;
    for (let i = 0; i < n; i++) { p.push(v); v *= x; }
    for (let i = 0; i < n; i++) { for (let j = 0; j < n; j++) A[i][j] += p[i] * p[j]; A[i][n] += p[i] * ys[k]; }
  });
  for (let i = 0; i < n; i++) A[i][i] += ridge;
  for (let c = 0; c < n; c++) {
    let piv = c;
    for (let r = c + 1; r < n; r++) if (Math.abs(A[r][c]) > Math.abs(A[piv][c])) piv = r;
    [A[c], A[piv]] = [A[piv], A[c]];
    for (let r = 0; r < n; r++) {
      if (r === c || !A[c][c]) continue;
      const f = A[r][c] / A[c][c];
      for (let j = c; j <= n; j++) A[r][j] -= f * A[c][j];
    }
  }
  return A.map((row, i) => row[n] / (row[i] || 1));
}

function polyVal(w, x) {
  let s = 0, v = 1;
  for (const c of w) { s += c * v; v *= x; }
  return s;
}

/* 7. Splits and leakage */
function labSplits(el) {
  const st = { mode: "random", fold: 0 };
  const docs = ["Д1", "Д2", "Д3", "Д4", "Д5", "Д6"];
  const rows = [];
  docs.forEach((d, i) => { for (let f = 0; f < 4; f++) rows.push({ doc: i, field: f, month: i + 1 }); });
  const r = rng(5);
  const shuffled = rows.map((x, i) => [r(), i]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
  el.innerHTML = `
    <div class="lab-controls">
      ${segmented("mode", [["random", "KFold по полям"], ["group", "GroupKFold по документам"], ["time", "по времени"]], st.mode)}
      ${segmented("fold", [[0, "фолд 1"], [1, "фолд 2"], [2, "фолд 3"]], st.fold)}
    </div>
    <div class="lab-stage" data-view></div>`;
  const view = el.querySelector("[data-view]");
  function draw() {
    el.querySelectorAll("[data-seg]").forEach(b => b.setAttribute("aria-pressed", String(String(st[b.dataset.seg]) === b.dataset.v)));
    const test = new Set();
    if (st.mode === "random") shuffled.forEach((idx, k) => { if (k % 3 === st.fold) test.add(idx); });
    if (st.mode === "group") rows.forEach((x, idx) => { if (x.doc % 3 === st.fold) test.add(idx); });
    if (st.mode === "time") rows.forEach((x, idx) => { if (x.doc === 3 + st.fold) test.add(idx); });
    const trainDocs = new Set(rows.filter((_, i) => !test.has(i) && (st.mode !== "time" || rows[i].doc < 3 + st.fold)).map(x => x.doc));
    const used = i => st.mode !== "time" || test.has(i) || rows[i].doc < 3 + st.fold;
    let leaks = 0;
    const cells = rows.map((x, i) => {
      const isTest = test.has(i), leak = isTest && trainDocs.has(x.doc);
      if (leak) leaks++;
      const cls = !used(i) ? "is-off" : isTest ? (leak ? "is-leak" : "is-test") : "is-train";
      return `<span class="lab-cell ${cls}" title="${docs[x.doc]}, поле ${x.field + 1}">${x.field + 1}</span>`;
    });
    const grid = docs.map((d, i) => `<div class="lab-row"><b>${d}</b><span class="lab-cap">мес. ${i + 1}</span>${cells.slice(i * 4, i * 4 + 4).join("")}</div>`).join("");
    const msg = st.mode === "random"
      ? `Поля одного документа разошлись по обучению и проверке: ${leaks} из ${test.size} проверочных полей видели «свой» бланк в обучении. Метрика меряет запоминание бланка.`
      : st.mode === "group"
        ? "Документ целиком либо в обучении, либо в проверке: утечки через общий скан и шаблон нет."
        : "Обучение только на прошлом, проверка на следующем месяце. Будущее в обучение не попадает, светлые строки ещё не наступили.";
    view.innerHTML = `<div class="lab-grid">${grid}</div>
      <p class="lab-legend"><span class="lab-cell is-train"></span>обучение <span class="lab-cell is-test"></span>проверка <span class="lab-cell is-leak"></span>проверка с утечкой</p>
      <p class="lab-note">${msg}</p>`;
  }
  bindLab(el, st, draw);
  draw();
}

/* 9. VRAM calculator */
const VRAM_PRESETS = {
  "7b": { p: 7, layers: 32, kv: 8, hd: 128, label: "плотная 7B" },
  "14b": { p: 14, layers: 48, kv: 8, hd: 128, label: "плотная 14B" },
  "moe": { p: 35, layers: 48, kv: 4, hd: 128, label: "MoE 35B, ~3B активных" }
};

function labVram(el) {
  const st = { preset: "7b", bits: 16, ctx: 8, conc: 8, gpu: 24 };
  el.innerHTML = `
    <div class="lab-controls">
      ${segmented("preset", Object.entries(VRAM_PRESETS).map(([k, v]) => [k, v.label]), st.preset)}
      ${segmented("bits", [[16, "fp16"], [8, "int8"], [4, "int4"]], st.bits)}
      ${range("Контекст, тыс. токенов", "ctx", 1, 128, 1, st.ctx)}
      ${range("Параллельных запросов", "conc", 1, 64, 1, st.conc)}
      ${segmented("gpu", [[24, "24 ГБ"], [48, "48 ГБ"], [80, "80 ГБ"]], st.gpu)}
    </div>
    <div class="lab-stage" data-view></div>`;
  const view = el.querySelector("[data-view]");
  function draw() {
    el.querySelectorAll("[data-seg]").forEach(b => b.setAttribute("aria-pressed", String(String(st[b.dataset.seg]) === b.dataset.v)));
    syncOutputs(el, st);
    const m = VRAM_PRESETS[st.preset];
    const G = 1024 ** 3;
    const weights = m.p * 1e9 * st.bits / 8 / G;
    const perTok = 2 * m.layers * m.kv * m.hd * 2;
    const kv = perTok * st.ctx * 1024 * st.conc / G;
    const reserve = (weights + kv) * 0.15;
    const total = weights + kv + reserve;
    const scale = Math.max(total, st.gpu) * 1.08, W = 600, X = v => 20 + v / scale * (W - 40);
    const seg = (a, b, cls) => `<rect class="${cls}" x="${X(a)}" y="40" width="${Math.max(0, X(b) - X(a))}" height="40"/>`;
    const fits = total <= st.gpu;
    let maxConc = 0;
    for (let c = 1; c <= 512; c++) { if ((weights + perTok * st.ctx * 1024 * c / G) * 1.15 <= st.gpu) maxConc = c; }
    view.innerHTML = `<p class="lab-legend">веса ${fmt(weights, 1)} · KV-кэш ${fmt(kv, 1)} · запас 15% ${fmt(reserve, 1)} · итого ${fmt(total, 1)} ГиБ</p>
      <svg viewBox="0 0 ${W} 100" class="lab-svg" role="img" aria-label="Память видеокарты">
      ${seg(0, weights, "lab-mw")}${seg(weights, weights + kv, "lab-mk")}${seg(weights + kv, total, "lab-mr")}
      <line class="lab-thr" x1="${X(st.gpu)}" y1="26" x2="${X(st.gpu)}" y2="96"/>
      <text class="lab-num" x="${X(st.gpu)}" y="20">карта ${st.gpu} ГБ</text></svg>
      <p class="lab-kv"><span>KV на токен</span><b>${fmt(perTok / 1024, 0)} КиБ</b><span>влезает</span><b class="${fits ? "ok" : "bad"}">${fits ? "да" : "нет"}</b><span>макс. запросов при этом контексте</span><b>${maxConc}</b></p>
      <p class="lab-note">${st.preset === "moe" ? "MoE хранит все 35 млрд параметров, а считает примерно как трёхмиллиардная: память по полному размеру, скорость по активным. " : ""}${kv > weights ? "Кэш уже больше весов: упирается длина и число запросов, а не размер модели." : "Пока основную память занимают веса; добавь контекст или запросы, и кэш их обгонит."} Конфигурации слоёв условные, для своей модели числа берут из config.json.</p>`;
  }
  bindLab(el, st, draw);
  draw();
}

/* string normalization */
const LAB_HOMO = { "A": "А", "B": "В", "C": "С", "E": "Е", "H": "Н", "K": "К", "M": "М", "O": "О", "P": "Р", "T": "Т", "X": "Х", "a": "а", "c": "с", "e": "е", "o": "о", "p": "р", "x": "х", "y": "у" };
function labNormalize(el) {
  const st = {};
  const presets = [
    ["OOO \u201eT2 МОБАЙЛ\u201c", "ООО «Т2 Мобайл»"],
    ["ГУФССП\u00a0по Иркутской обла\u00adсти", "ГУФССП по Иркутской области"],
    ["Исх. № РЦ\u2013ИСХ\u20136596", "Исх. № РЦ-ИСХ-6596"]
  ];
  el.innerHTML = `
    <div class="lab-controls">
      <div class="lab-seg">${presets.map((p, i) => `<button type="button" data-act="preset" data-arg="${i}">пример ${i + 1}</button>`).join("")}</div>
    </div>
    <div class="lab-norm">
      <label class="lab-ctl"><span>Ответ модели</span><input type="text" data-in="a"></label>
      <label class="lab-ctl"><span>Эталон</span><input type="text" data-in="b"></label>
    </div>
    <div class="lab-stage" data-view></div>`;
  const ia = el.querySelector('[data-in="a"]'), ib = el.querySelector('[data-in="b"]');
  const decode = s => s.replace(/\\u([0-9a-f]{4})/gi, (_, h) => String.fromCharCode(parseInt(h, 16)));
  ia.value = decode(presets[0][0]); ib.value = presets[0][1];
  const view = el.querySelector("[data-view]");
  const steps = [
    ["как есть", s => s],
    ["NFKC", s => s.normalize("NFKC")],
    ["невидимые и неразрывные", s => s.replace(/\u00ad/g, "").replace(/[\u00a0\u2007\u202f]/g, " ")],
    ["кавычки и тире", s => s.replace(/[\u201e\u201c\u201d\u00ab\u00bb"]/g, "\"").replace(/[\u2012-\u2015\u2212]/g, "-")],
    ["латинские двойники", s => s.replace(/\S+/g, w => { const lat = w.match(/[A-Za-z]/g) || []; return lat.length && lat.every(ch => LAB_HOMO[ch]) ? w.replace(/[A-Za-z]/g, ch => LAB_HOMO[ch]) : w; })],
    ["регистр и пробелы", s => s.toLowerCase().replace(/\s+/g, " ").trim()]
  ];
  function show(s) {
    return [...s].map(ch => {
      const code = ch.charCodeAt(0);
      if (code === 0xa0) return '<mark class="lab-mark" title="неразрывный пробел">⍽</mark>';
      if (code === 0xad) return '<mark class="lab-mark" title="мягкий перенос">¬</mark>';
      if (/[A-Za-z]/.test(ch) && LAB_HOMO[ch]) return `<mark class="lab-mark" title="латинская ${ch}">${esc(ch)}</mark>`;
      if (code > 0x2000 && code < 0x2070) return `<mark class="lab-mark" title="U+${code.toString(16)}">${esc(ch)}</mark>`;
      return esc(ch);
    }).join("");
  }
  function draw() {
    if (st.act === "preset") { const p = presets[Number(st.actArg)]; ia.value = decode(p[0]); ib.value = decode(p[1]); }
    let a = ia.value, b = ib.value;
    const rows = steps.map(([name, fn], i) => {
      if (i) { a = fn(a); b = fn(b); }
      const eq = a === b;
      return `<div class="lab-nrow"><span class="lab-cap">${i}. ${name}</span><code>${show(a)}</code><code>${show(b)}</code><b class="${eq ? "ok" : "bad"}">${eq ? "равно" : "не равно"}</b></div>`;
    }).join("");
    view.innerHTML = `<div class="lab-ntable">${rows}</div><p class="lab-note">Подсвечены символы, которые глаз не отличает: латиница среди кириллицы, неразрывный пробел, мягкий перенос, типографские тире и кавычки. Нормализация применяется к обеим сторонам и не должна склеивать разные значения: «по Иркутской области» и «по Приморскому краю» после неё всё равно разные.</p>`;
  }
  ia.addEventListener("input", draw); ib.addEventListener("input", draw);
  bindLab(el, st, draw);
  draw();
}

/* PSI drift */
function labPsi(el) {
  const st = { b1: 10, b2: 20, b3: 30 };
  el.innerHTML = `
    <div class="lab-controls">
      ${range("Корзина 1, %", "b1", 1, 70, 1, st.b1)}
      ${range("Корзина 2, %", "b2", 1, 70, 1, st.b2)}
      ${range("Корзина 3, %", "b3", 1, 70, 1, st.b3)}
    </div>
    <div class="lab-stage" data-view></div>`;
  const view = el.querySelector("[data-view]");
  function draw() {
    syncOutputs(el, st);
    const ref = [0.25, 0.25, 0.25, 0.25];
    let cur = [st.b1, st.b2, st.b3].map(v => v / 100);
    const rest = 1 - cur.reduce((s, v) => s + v, 0);
    cur.push(Math.max(0.001, rest));
    const sum = cur.reduce((s, v) => s + v, 0); cur = cur.map(v => v / sum);
    const parts = cur.map((c, i) => (c - ref[i]) * Math.log(c / ref[i]));
    const psi = parts.reduce((s, v) => s + v, 0);
    const level = psi < 0.1 ? ["ok", "стабильно"] : psi < 0.25 ? ["warn", "внимание"] : ["bad", "тревога"];
    const W = 600, bw = 90, X = i => 60 + i * 130;
    const bars = cur.map((c, i) => `<rect class="lab-hneg" x="${X(i)}" y="${180 - ref[i] * 320}" width="${bw / 2 - 4}" height="${ref[i] * 320}"/>
      <rect class="lab-hpos" x="${X(i) + bw / 2}" y="${180 - c * 320}" width="${bw / 2 - 4}" height="${c * 320}"/>
      <text class="lab-num" x="${X(i) + bw / 2}" y="${198}">${pct(c)}</text>
      <text class="lab-cap" x="${X(i) + bw / 2}" y="${222}">вклад ${fmt(parts[i], 3)}</text>`).join("");
    view.innerHTML = `<p class="lab-legend">серые — эталонный период по 25%, цветные — текущий; четвёртая корзина добирает до 100%</p><svg viewBox="0 0 ${W} 230" class="lab-svg" role="img" aria-label="Доли по корзинам: эталон и сейчас">
      <line class="lab-axis" x1="40" y1="180" x2="${W - 20}" y2="180"/>${bars}</svg>
      <p class="lab-kv"><span>PSI = Σ (факт − эталон) · ln(факт / эталон)</span><b class="${level[0]}">${fmt(psi, 3)} · ${level[1]}</b></p>
      <p class="lab-note">Пороги условные: до 0.1 обычно спокойно, с 0.25 тревога. Дрейф входа говорит, где проверить качество на свежей разметке, но само качество он не мерит.</p>`;
  }
  bindLab(el, st, draw);
  draw();
}

/* Base rate in natural frequencies */
const BR_PRESETS = {
  defect: { label: "дефект 1 из 1000", prev: 1, sens: 99, spec: 990 },
  disease: { label: "болезнь у 1%", prev: 10, sens: 99, spec: 950 },
  spam: { label: "спам у 30%", prev: 300, sens: 95, spec: 980 }
};

function labBaseRate(el) {
  const st = { preset: "defect", applied: "defect", prev: 1, sens: 99, spec: 990, tests: 1 };
  el.innerHTML = `
    <div class="lab-controls">
      ${segmented("preset", Object.entries(BR_PRESETS).map(([k, v]) => [k, v.label]), st.preset)}
      ${segmented("tests", [[1, "один тест"], [2, "два независимых"]], st.tests)}
    </div>
    <div class="lab-controls">
      ${range("Больных или дефектных на 1000", "prev", 1, 300, 1, st.prev)}
      ${range("Чувствительность", "sens", 50, 100, 1, st.sens, "%")}
      ${range("Специфичность", "spec", 800, 999, 1, st.spec)}
    </div>
    <div class="lab-stage" data-view></div>`;
  const view = el.querySelector("[data-view]");
  function draw() {
    if (st.preset && st.preset !== st.applied) {
      const p = BR_PRESETS[st.preset];
      Object.assign(st, { prev: p.prev, sens: p.sens, spec: p.spec, applied: st.preset });
      el.querySelectorAll("input[data-k]").forEach(i => { i.value = st[i.dataset.k]; });
    }
    const match = Object.keys(BR_PRESETS).find(k => ["prev", "sens", "spec"].every(f => BR_PRESETS[k][f] === st[f])) || null;
    st.preset = st.applied = match;
    el.querySelectorAll("[data-seg]").forEach(b => b.setAttribute("aria-pressed", String(String(st[b.dataset.seg]) === b.dataset.v)));
    syncOutputs(el, st, { sens: v => v + "%", spec: v => fmt(v / 10, 1) + "%" });
    const t = st.tests, se = (st.sens / 100) ** t, fpr = (1 - st.spec / 1000) ** t;
    const D = st.prev, TP = D * se, FP = (1000 - D) * fpr, prec = TP / (TP + FP);
    const tpN = Math.round(TP), fnN = D - tpN, fpN = Math.min(1000 - D, Math.round(FP));
    const cls = i => i < tpN ? "br-tp" : i < D ? "br-fn" : i < D + fpN ? "br-fp" : "br-tn";
    const cells = Array.from({ length: 1000 }, (_, i) =>
      `<rect class="${cls(i)}" x="${(i % 50) * 12}" y="${30 + Math.floor(i / 50) * 12}" width="10" height="10" rx="2"/>`).join("");
    const odds = x => x >= 1 ? `${fmt(x, x < 10 ? 1 : 0)} : 1` : `1 : ${fmt(1 / x, 1 / x < 10 ? 1 : 0)}`;
    const tone = prec >= 0.8 ? "ok" : prec >= 0.4 ? "warn" : "bad";
    view.innerHTML = `<p class="lab-legend">цветные — пойманные, контур — пропущенные, красные — ложные тревоги, серые — чистые без тревоги</p><svg viewBox="0 0 600 274" class="lab-svg" role="img" aria-label="Тысяча случаев: пойманные, пропущенные, ложные тревоги">

/* Random forest: correlation caps the gain */
function labForest(el) {
  const st = { rho: 30, k: 20 };
  const trees = v => Math.round(10 ** (v / 10));
  el.innerHTML = `
    <div class="lab-controls">
      ${range("Корреляция деревьев ρ", "rho", 0, 90, 5, st.rho)}
      ${range("Деревьев в лесу", "k", 0, 30, 1, st.k)}
    </div>
    <div class="lab-stage" data-view></div>`;
  const view = el.querySelector("[data-view]");
  function simulate(rho, n) {
    // tree_i = √ρ·c + √(1−ρ)·e_i; the mean of n independent e_i is drawn directly as N(0, 1/n)
    const r = rng(11 + n * 7 + Math.round(rho * 1000)), R = 5000, avgs = [];
    for (let j = 0; j < R; j++) avgs.push(Math.sqrt(rho) * gauss(r) + Math.sqrt(1 - rho) * gauss(r) / Math.sqrt(n));
    const m = avgs.reduce((a, b) => a + b, 0) / R;
    return avgs.reduce((a, b) => a + (b - m) ** 2, 0) / (R - 1);
  }
  function draw() {
    syncOutputs(el, st, { rho: v => fmt(v / 100, 2), k: v => String(trees(v)) });
    const rho = st.rho / 100, n = trees(st.k), f = k => rho + (1 - rho) / k;
    const W = 600, H = 230, X = lk => 50 + lk / 3 * (W - 80), Y = v => 20 + (1 - v) * (H - 60);
    const curve = g => Array.from({ length: 61 }, (_, i) => { const lk = i / 20; return `${fmt(X(lk), 1)},${fmt(Y(g(10 ** lk)), 1)}`; }).join(" ");
    const sim = simulate(rho, n);
    const yt = [0, 0.25, 0.5, 0.75, 1].map(v => `<line class="lab-axis" x1="50" y1="${Y(v)}" x2="${W - 30}" y2="${Y(v)}" opacity=".5"/><text class="lab-cap" x="42" y="${Y(v) + 4}" text-anchor="end">${pct(v)}</text>`).join("");
    const xt = [1, 10, 100, 1000].map(k => `<text class="lab-cap" x="${X(Math.log10(k))}" y="${H - 8}">${k}</text>`).join("");
    view.innerHTML = `<p class="lab-legend">разброс среднего в долях от одного дерева по числу деревьев (шкала логарифмическая): цветная — при ρ = ${fmt(rho, 2)}, серая — при независимых деревьях</p><svg viewBox="0 0 ${W} ${H}" class="lab-svg" role="img" aria-label="Разброс леса в зависимости от числа деревьев">
        ${yt}${xt}
        <polyline class="lab-path-muted" points="${curve(k => 1 / k)}"/>
        <line class="lab-thr" x1="50" y1="${Y(rho)}" x2="${W - 30}" y2="${Y(rho)}"/>
        <text class="lab-cap" x="${W - 30}" y="${Y(rho) - 6}" text-anchor="end">предел ρ</text>
        <polyline class="lab-path" points="${curve(f)}"/>
        <circle class="lab-best" cx="${X(Math.log10(n))}" cy="${Y(f(n))}" r="5"/>
</svg>
      <p class="lab-kv">
        <span>по формуле ρσ² + (1 − ρ)σ²/k</span><b>${pct(f(n), 1)}</b>
        <span>в симуляции 5000 лесов по ${n} деревьев</span><b>${pct(sim, 1)}</b>
        <span>предел при бесконечном числе деревьев</span><b>${pct(rho, 1)}</b>
      </p>
      <p class="lab-note">Деревья помогают, пока заметно второе слагаемое, дальше разброс упирается в ρ: при ρ = 0.3 сто и тысяча деревьев почти неотличимы. Поэтому борются с самой корреляцией: бутстреп и случайное подмножество признаков в каждой вершине делают деревья непохожими. Смещение леса равно смещению одного дерева, отсюда глубокие деревья. Переобучения от числа деревьев нет, есть только время обучения и инференса.</p>`;
  }
  bindLab(el, st, draw);
  draw();
}

/* Weight init: signal through 30 layers */
function labInit(el) {
  const st = { fn: "relu", init: "xavier" };
  const N = 64, B = 16, L = 30;
  const VAR = { small: () => 1e-4, xavier: n => 2 / (n + n), he: n => 2 / n, big: () => 1 };
  el.innerHTML = `
    <div class="lab-controls">
      ${segmented("fn", [["relu", "ReLU"], ["tanh", "tanh"]], st.fn)}
      ${segmented("init", [["small", "N(0, 0.01²)"], ["xavier", "Xavier"], ["he", "He"], ["big", "N(0, 1)"]], st.init)}
    </div>
    <div class="lab-stage" data-view></div>`;
  const view = el.querySelector("[data-view]");
  const std = a => { let s = 0, q = 0; for (const v of a) { s += v; q += v * v; } const m = s / a.length; return Math.sqrt(Math.max(0, q / a.length - m * m)); };
  function run() {
    const r = rng(42), sd = Math.sqrt(VAR[st.init](N)), relu = st.fn === "relu";
    let a = Float64Array.from({ length: B * N }, () => gauss(r));
    const Ws = [], Hs = [], fwd = [];
    for (let l = 0; l < L; l++) {
      const W = Float64Array.from({ length: N * N }, () => gauss(r) * sd), h = new Float64Array(B * N);
      for (let b = 0; b < B; b++) for (let i = 0; i < N; i++) { const ai = a[b * N + i]; if (!ai) continue; for (let j = 0; j < N; j++) h[b * N + j] += ai * W[i * N + j]; }
      Ws.push(W); Hs.push(h); fwd.push(std(h));
      a = h.map(v => relu ? Math.max(0, v) : Math.tanh(v));
    }
    const sat = relu ? null : a.filter(v => Math.abs(v) > 0.99).length / a.length;
    let g = Float64Array.from({ length: B * N }, () => gauss(r));
    const bwd = new Array(L);
    for (let l = L - 1; l >= 0; l--) {
      const h = Hs[l], W = Ws[l], gh = g.map((v, k) => v * (relu ? (h[k] > 0 ? 1 : 0) : 1 - Math.tanh(h[k]) ** 2));
      bwd[l] = std(gh);
      const gp = new Float64Array(B * N);
      for (let b = 0; b < B; b++) for (let j = 0; j < N; j++) { const v = gh[b * N + j]; if (!v) continue; for (let i = 0; i < N; i++) gp[b * N + i] += v * W[i * N + j]; }
      g = gp;
    }
    return { fwd, bwd, sat };
  }
  const SUP = { "-": "⁻", 0: "⁰", 1: "¹", 2: "²", 3: "³", 4: "⁴", 5: "⁵", 6: "⁶", 7: "⁷", 8: "⁸", 9: "⁹" };
  const sci = x => {
    if (!Number.isFinite(x)) return "—";
    if (x === 0) return "0";
    if (x >= 0.01 && x < 1000) return fmt(x, 2);
    const [m, e] = x.toExponential(1).split("e");
    return `${m}·10${[...String(Number(e))].map(c => SUP[c]).join("")}`;
  };
  function draw() {
    el.querySelectorAll("[data-seg]").forEach(b => b.setAttribute("aria-pressed", String(String(st[b.dataset.seg]) === b.dataset.v)));
    const { fwd, bwd, sat } = run();
    const W = 600, H = 236, X = l => 50 + l / (L - 1) * (W - 80), lg = v => Math.max(-8, Math.min(8, Math.log10(Math.max(v, 1e-300)))), Y = v => 14 + (8 - lg(v)) / 16 * (H - 54);
    const line = arr => arr.map((v, l) => `${fmt(X(l), 1)},${fmt(Y(v), 1)}`).join(" ");
    const yt = [-8, -4, 0, 4, 8].map(e => `<line class="lab-axis" x1="50" y1="${Y(10 ** e)}" x2="${W - 30}" y2="${Y(10 ** e)}" opacity=".5"/><text class="lab-cap" x="42" y="${Y(10 ** e) + 4}" text-anchor="end">${e === 0 ? "1" : "1e" + e}</text>`).join("");
    const ratio = fwd[L - 1] / fwd[0], gr = bwd[0] / bwd[L - 1];
    const verdict = ratio < 1e-2 ? ["bad", "сигнал затухает: последние слои получают почти нули"]
      : ratio > 1e2 ? ["bad", "сигнал взрывается: значения растут от слоя к слою"]
      : gr > 1e2 ? ["bad", `амплитуда держится за счёт насыщения, а градиент к первым слоям растёт в ${sci(gr)} раз: хаотический режим, обучение неустойчиво`]
      : gr < 1e-2 ? ["warn", "прямой проход держится, а градиент к первым слоям гаснет"]
      : ["ok", "сигнал и градиент держат масштаб"];
    view.innerHTML = `<p class="lab-legend">стандартное отклонение по слоям: цветная — прямой проход, серая — градиент</p><svg viewBox="0 0 ${W} ${H}" class="lab-svg" role="img" aria-label="Разброс сигнала и градиента по слоям">
        ${yt}
        <polyline class="lab-path-muted" points="${line(bwd)}"/>
        <polyline class="lab-path" points="${line(fwd)}"/>
        <text class="lab-cap" x="${X(0)}" y="${H - 6}" text-anchor="start">слой 1</text><text class="lab-cap" x="${X(L - 1)}" y="${H - 6}" text-anchor="end">слой ${L}</text></svg>
      <p class="lab-kv">
        <span>на первом слое</span><b>${sci(fwd[0])}</b>
        <span>на последнем слое</span><b>${sci(fwd[L - 1])}</b>
        <span>градиент у первого слоя</span><b>${sci(bwd[0])}</b>
        ${sat !== null ? `<span>насыщенных нейронов в конце</span><b>${pct(sat)}</b>` : ""}
        <span>итог</span><b class="${verdict[0]}">${verdict[1]}</b>
      </p>
      <p class="lab-note">Сеть ${L} слоёв по ${N} нейронов, честный прямой и обратный проход на случайном батче. Дисперсия выхода слоя примерно равна n_in · Var(w) · E[a²]. ReLU обнуляет половину входов, поэтому He берёт Var(w) = 2 / n_in; Xavier, 2 / (n_in + n_out), выведена для симметричных активаций вроде tanh. Колебания в пределах нескольких раз даже при удачной схеме — шум конечной ширины; плохая инициализация видна по экспоненциальному тренду. Нормализация и остаточные связи делают сеть менее чувствительной к инициализации, но не отменяют её.</p>`;
  }
  bindLab(el, st, draw);
  draw();
}


/* ---------- interview mode ---------- */
const INTERVIEW = (DATA.interview && DATA.interview.items) || [];
const ivKey = it => "i" + hash(it.id);
const blockOrder = id => (QUIZ.blocks.find(b => b.id === id) || { order: 99 }).order;

function ivQueue(limit = 5) {
  const today = dayKey();
  const next = nextStep();
  const lim = next ? next.order : Infinity;
  const open = INTERVIEW.filter(it => blockOrder(it.block) <= lim || passed(it.block));
  const due = open.filter(it => { const e = state.study.srs[ivKey(it)]; return e && e.due <= today; });
  const fresh = open.filter(it => !state.study.srs[ivKey(it)]).sort((a, b) => blockOrder(a.block) - blockOrder(b.block));
  return due.concat(fresh).slice(0, limit);
}

function startInterview(items, back) {
  if (!items.length) return;
  state.session = null;
  state.cards = null;
  state.iv = { items, idx: 0, revealed: false, checks: new Set(), draft: "", results: [], back: back || state.mode };
  render();
  window.scrollTo({ top: 0 });
}

function revealIv() {
  const iv = state.iv;
  const ta = document.getElementById("iv-answer");
  iv.draft = ta ? ta.value : iv.draft;
  iv.revealed = true;
  renderIvItem();
}

function gradeIv() {
  const iv = state.iv;
  const it = iv.items[iv.idx];
  const cover = iv.checks.size / it.points.length;
  grade(ivKey(it), cover >= 0.7, cover >= 0.9 ? 4 : cover >= 0.7 ? 3 : 1);
  commit();
  iv.results.push({ it, cover, missed: it.points.filter((_, i) => !iv.checks.has(i)) });
  iv.idx += 1;
  iv.revealed = false;
  iv.checks = new Set();
  iv.draft = "";
  render();
  window.scrollTo({ top: 0 });
}

  const total = INTERVIEW.length;

/* complexity */
function labComplexity(el) {
  const st = { lg: 5 };
  el.innerHTML = `<div class="lab-controls">${range("Размер входа n = 10^", "lg", 2, 9, 1, st.lg)}</div><div class="lab-stage" data-view></div>`;
  const view = el.querySelector("[data-view]");
  const OPS = 1e8;
  const human = s => s < 1e-3 ? "< 1 мс" : s < 1 ? Math.round(s * 1000) + " мс" : s < 120 ? fmt(s, 1) + " с" : s < 7200 ? fmt(s / 60, 0) + " мин" : s < 172800 ? fmt(s / 3600, 0) + " ч" : s < 3.15e9 ? fmt(s / 86400, 0) + " дн" : "дольше века";
  function draw() {
    syncOutputs(el, st);
    const n = 10 ** st.lg;
    const rows = [["O(1)", "словарь, множество", 1], ["O(log n)", "бинарный поиск", Math.log2(n)], ["O(n)", "один проход, хеш вместо вложенного цикла", n], ["O(n log n)", "сортировка", n * Math.log2(n)], ["O(n²)", "вложенный цикл, «x in list» в цикле", n * n]];
    const maxL = Math.log10(Math.max(...rows.map(r => r[2])));
    view.innerHTML = `<div class="lab-ntable">${rows.map(([o, ex, ops]) => {
      const s = ops / OPS, w = Math.max(2, Math.log10(Math.max(ops, 1)) / Math.max(maxL, 1) * 100);
      return `<div class="lab-crow"><b>${o}</b><span class="lab-cap">${ex}</span><span class="lab-cbar"><span style="width:${w}%" class="${s > 60 ? "bad" : ""}"></span></span><code>${human(s)}</code></div>`;
    }).join("")}</div>
    <p class="lab-note">Оценка при 10⁸ простых операций в секунду, шкала полос логарифмическая. При n = 10^${st.lg} квадратичный алгоритм ${n * n / OPS > 60 ? "уже не укладывается в минуту" : "ещё терпим"}: именно поэтому первым делом ищут вложенный цикл, который заменяется словарём или множеством.</p>`;
  }
  bindLab(el, st, draw); draw();
}

/* SQL window functions */
const SQL_ROWS = [["A", "01.03", 0.81], ["A", "08.03", 0.84], ["A", "15.03", 0.83], ["B", "02.03", 0.77], ["B", "09.03", 0.79]];
function labWindow(el) {
  const st = { fn: "lag" };
  const FN = {
    rn: ["ROW_NUMBER() OVER (PARTITION BY model ORDER BY created_at DESC)", rows => { const c = {}; return rows.map((r, i) => i); }],
    lag: ["score − LAG(score) OVER (PARTITION BY model ORDER BY created_at)", null],
    sum: ["AVG(score) OVER (PARTITION BY model ORDER BY created_at ROWS BETWEEN 1 PRECEDING AND CURRENT ROW)", null],
    grp: ["AVG(score) … GROUP BY model", null]
  };
  el.innerHTML = `<div class="lab-controls">${segmented("fn", [["rn", "ROW_NUMBER"], ["lag", "LAG"], ["sum", "скользящее среднее"], ["grp", "GROUP BY"]], st.fn)}</div><div class="lab-stage" data-view></div>`;
  const view = el.querySelector("[data-view]");
  function draw() {
    el.querySelectorAll("[data-seg]").forEach(b => b.setAttribute("aria-pressed", String(String(st[b.dataset.seg]) === b.dataset.v)));
    let out, head;
    if (st.fn === "grp") {
      const g = {}; SQL_ROWS.forEach(([m, , s]) => { (g[m] = g[m] || []).push(s); });
      head = ["model", "avg"]; out = Object.entries(g).map(([m, a]) => [m, fmt(a.reduce((x, y) => x + y, 0) / a.length, 3)]);
    } else {
      head = ["model", "created_at", "score", st.fn === "rn" ? "rn" : st.fn === "lag" ? "delta" : "avg2"];
      out = SQL_ROWS.map((r, i) => {
        const same = SQL_ROWS.filter(x => x[0] === r[0]);
        const k = same.indexOf(r);
        let v;
        if (st.fn === "rn") v = same.length - k;
        if (st.fn === "lag") v = k ? fmt(r[2] - same[k - 1][2], 2) : "NULL";
        if (st.fn === "sum") v = fmt(k ? (r[2] + same[k - 1][2]) / 2 : r[2], 3);
        return [r[0], r[1], fmt(r[2], 2), v];
      });
    }
    view.innerHTML = `<pre tabindex="0"><code>SELECT model, ${st.fn === "grp" ? "" : "created_at, score, "}${FN[st.fn][0]}\nFROM runs</code></pre>
      <div class="table-scroll"><table><thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${out.map(r => `<tr class="${r[0] === "A" ? "" : "lab-alt"}">${r.map((c, i) => `<td class="${i === r.length - 1 ? "lab-hl" : ""}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
      <p class="lab-note">${st.fn === "grp" ? "GROUP BY сворачивает строки: от пяти прогонов осталось две строки, сравнить прогон с предыдущим уже нельзя." : "Оконная функция считает по окну, но строки не сворачивает: у каждого прогона остаётся своя строка, а окно задаёт PARTITION BY и ORDER BY."}</p>`;
  }
  bindLab(el, st, draw); draw();
}

/* BM25 vs TF-IDF */
const BM_DOCS = [
  "договор поставки номер ДП-17 оплата в течение десяти дней",
  "оплата оплата оплата оплата оплата счёт",
  "дополнительное соглашение к договору поставки ДП-17 о сроках оплаты и неустойке за просрочку поставки товара по договору",
  "акт сверки взаимных расчётов"
];
function labBm25(el) {
  const st = { k1: 12, b: 75, q: 0 };
  const queries = ["оплата ДП-17", "договор поставки", "неустойка"];
  el.innerHTML = `<div class="lab-controls">${segmented("q", queries.map((q, i) => [i, q]), st.q)}${range("k1 × 10 (насыщение)", "k1", 0, 30, 1, st.k1)}${range("b × 100 (нормировка длины)", "b", 0, 100, 5, st.b)}</div><div class="lab-stage" data-view></div>`;
  const view = el.querySelector("[data-view]");
  const tok = s => s.toLowerCase().split(/\s+/);
  function draw() {
    el.querySelectorAll("[data-seg]").forEach(b => b.setAttribute("aria-pressed", String(String(st[b.dataset.seg]) === b.dataset.v)));
    syncOutputs(el, st, { k1: v => fmt(v / 10, 1), b: v => fmt(v / 100, 2) });
    const docs = BM_DOCS.map(tok), N = docs.length, avg = docs.reduce((s, d) => s + d.length, 0) / N;
    const q = tok(queries[st.q]);
    const df = w => docs.filter(d => d.includes(w)).length;
    const k1 = st.k1 / 10, b = st.b / 100;
    const rows = docs.map((d, i) => {
      let bm = 0, ti = 0;
      q.forEach(w => {
        const f = d.filter(x => x === w).length; if (!f) return;
        const idf = Math.log(1 + (N - df(w) + 0.5) / (df(w) + 0.5));
        bm += idf * f * (k1 + 1) / (f + k1 * (1 - b + b * d.length / avg));
        ti += f * Math.log(N / df(w));
      });
      return [i, bm, ti, d.length];
    });
    const rank = key => [...rows].sort((a, c) => c[key] - a[key]).map(r => r[0]);
    const rb = rank(1), rt = rank(2);
    view.innerHTML = `<div class="table-scroll"><table><thead><tr><th>документ</th><th>слов</th><th>TF-IDF</th><th>BM25</th></tr></thead><tbody>${rows.map(([i, bm, ti, len]) =>
      `<tr><td>${esc(BM_DOCS[i])}</td><td>${len}</td><td class="${rt[0] === i ? "lab-hl" : ""}">${fmt(ti, 2)} · ${rt.indexOf(i) + 1}</td><td class="${rb[0] === i ? "lab-hl" : ""}">${fmt(bm, 2)} · ${rb.indexOf(i) + 1}</td></tr>`).join("")}</tbody></table></div>
      <p class="lab-note">После числа — место в выдаче. На запросе «оплата ДП-17» TF-IDF ставит наверх документ, где слово «оплата» повторено пять раз; BM25 при k1 около 1.2 гасит повторы насыщением, и выигрывает документ с обоими словами. Обнули k1 — частота перестанет влиять; подними b — длинное соглашение начнёт проигрывать коротким. Морфологию здесь никто не приводит: запрос «неустойка» не находит «неустойке», а «оплата» не совпадает с «оплаты», отсюда лемматизация перед индексом.</p>`;
  }
  bindLab(el, st, draw); draw();
}

/* judge position bias */
function labJudgeBias(el) {
  const st = { pa: 60, bias: 15 };
  el.innerHTML = `<div class="lab-controls">${range("Насколько A на деле лучше: доля побед, %", "pa", 30, 90, 1, st.pa)}${range("Тяга судьи к первому варианту, п.п.", "bias", 0, 35, 1, st.bias)}</div><div class="lab-stage" data-view></div>`;
  const view = el.querySelector("[data-view]");
  const clip = x => Math.max(0, Math.min(1, x));
  function draw() {
    syncOutputs(el, st);
    const p = st.pa / 100, b = st.bias / 100;
    const aFirst = clip(p + b), aSecond = clip(p - b);
    const both = (aFirst + aSecond) / 2;
    const agreeA = aFirst * aSecond, agreeB = (1 - aFirst) * (1 - aSecond), tie = 1 - agreeA - agreeB;
    const bars = [["A всегда первым", aFirst], ["B всегда первым", aSecond], ["оба порядка, среднее", both], ["только согласованные победы A", agreeA / Math.max(1e-9, agreeA + agreeB)]];
    view.innerHTML = `<div class="lab-ntable">${bars.map(([n, v]) => `<div class="lab-crow"><b>${n}</b><span></span><span class="lab-cbar"><span style="width:${v * 100}%"></span></span><code>${pct(v)}</code></div>`).join("")}</div>
      <p class="lab-kv"><span>истинная доля побед A</span><b>${pct(p)}</b><span>несогласованных пар (ничьи)</span><b>${pct(tie)}</b></p>
      <p class="lab-note">Если всегда ставить A первым, судья покажет ${pct(aFirst)} вместо ${pct(p)}. Прогон в обоих порядках возвращает честную оценку, а доля ничьих показывает, насколько судья вообще различает варианты: при ${pct(tie)} ничьих ${tie > 0.5 ? "сравнение почти ничего не говорит" : "сигнал есть"}.</p>`;
  }
  bindLab(el, st, draw); draw();
}

function celebrate() {
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  // pixel burst in the spirit of pixelfx: chunky pixels, a short palette, stepped 12 fps
  const PX = 6;
  const canvas = document.createElement("canvas");
  canvas.className = "confetti";
  canvas.setAttribute("aria-hidden", "true");
  const w = Math.ceil(window.innerWidth / PX), h = Math.ceil(window.innerHeight / PX);
  canvas.width = w;
  canvas.height = h;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext("2d");
  if (!ctx) { canvas.remove(); return; }
  const css = getComputedStyle(document.documentElement);
  const tone = v => css.getPropertyValue(v).trim() || "#0B6E63";
  const palette = [tone("--accent"), tone("--accent-ink"), tone("--ok"), tone("--ink")];
  const ox = Math.round(w / 2), oy = Math.round(h * 0.55);
  const r = rng(Date.now() % 100000);
  const parts = Array.from({ length: 64 }, () => {
    const a = r() * Math.PI * 2, sp = 1.2 + r() * 2.6;
    return { x: ox, y: oy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.6, life: 9 + Math.floor(r() * 7), s: r() < 0.25 ? 2 : 1 };
  });
  let frame = 0;
  function ring(radius, color) {
    ctx.fillStyle = color;
    for (let i = 0; i < 48; i++) {
      const a = i / 48 * Math.PI * 2;
      ctx.fillRect(Math.round(ox + Math.cos(a) * radius), Math.round(oy + Math.sin(a) * radius * 0.8), 1, 1);
    }
  }
  function step() {
    ctx.clearRect(0, 0, w, h);
    if (frame < 4) ring(2 + frame * 3, palette[frame % 2]);
    parts.forEach(p => {
      if (frame > p.life) return;
      p.x += p.vx; p.y += p.vy; p.vy += 0.35; p.vx *= 0.94;
      const k = frame / p.life;
      ctx.globalAlpha = k < 0.6 ? 1 : k < 0.85 ? 0.66 : 0.33;
      ctx.fillStyle = palette[k < 0.35 ? 0 : k < 0.7 ? 1 : 2];
      ctx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s);
    });
    ctx.globalAlpha = 1;
    frame += 1;
    if (frame < 18) setTimeout(step, 83);
    else canvas.remove();
  }
  step();
}

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = e.target && e.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  const onButton = tag === "BUTTON";
  const c = state.cards;
  if (c && c.idx < c.items.length) {
    if (!c.flipped && (e.code === "Space" || e.key === "Enter") && !onButton) { e.preventDefault(); flipCard(); }
    else if (c.flipped && ["Digit1", "Numpad1", "ArrowLeft"].includes(e.code)) { e.preventDefault(); gradeCard(false); }
    else if (c.flipped && ["Digit2", "Numpad2", "ArrowRight"].includes(e.code)) { e.preventDefault(); gradeCard(true); }
    return;
  }
  const iv = state.iv;
  if (iv && iv.idx < iv.items.length) {
    if (iv.revealed && (e.key === "Enter" && !onButton)) { e.preventDefault(); gradeIv(); }
    return;
  }
  const s = state.session;
  if (!s || s.idx >= s.items.length) return;
  if (s.picked === null) {
    const j = KEY_CODES.findIndex(codes => codes.includes(e.code));
    if (j >= 0 && j < s.perms[s.idx].length) { e.preventDefault(); pick(s.perms[s.idx][j]); }
  } else if ((e.key === "Enter" && !onButton) || e.key === "ArrowRight") {
    e.preventDefault();
    advance();
  }
});

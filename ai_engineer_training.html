<title>Тренажёр AI-инженера</title>
<style>
:root {
  --paper: #F3F3F6;
  --surface: #FDFDFE;
  --surface-2: #ECECF2;
  --ink: #191922;
  --ink-muted: #5C5C6E;
  --rule: #D8D8E2;
  --rule-strong: #B9B9C9;
  --stamp: #4A3FA0;
  --stamp-soft: #EDEBF9;
  --ok: #2E6F4E;
  --ok-soft: #E4F0E9;
  --bad: #B23B32;
  --bad-soft: #F8E8E6;
  --font-display: "PT Serif", Charter, "Bitstream Charter", Georgia, "Times New Roman", serif;
  --font-ui: "PT Sans", "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "PT Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131319;
    --surface: #1B1B24;
    --surface-2: #23232F;
    --ink: #E7E7EF;
    --ink-muted: #9A9AAE;
    --rule: #2E2E3C;
    --rule-strong: #434356;
    --stamp: #A79BFF;
    --stamp-soft: #24203A;
    --ok: #5FC08D;
    --ok-soft: #172A22;
    --bad: #F0796D;
    --bad-soft: #2E1B1B;
  }
}

:root[data-theme="dark"] {
  --paper: #131319;
  --surface: #1B1B24;
  --surface-2: #23232F;
  --ink: #E7E7EF;
  --ink-muted: #9A9AAE;
  --rule: #2E2E3C;
  --rule-strong: #434356;
  --stamp: #A79BFF;
  --stamp-soft: #24203A;
  --ok: #5FC08D;
  --ok-soft: #172A22;
  --bad: #F0796D;
  --bad-soft: #2E1B1B;
}

* {
  box-sizing: border-box;
}

body {
  min-width: 0;
  margin: 0;
  overflow-x: hidden;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.55;
}

button,
input,
summary {
  color: inherit;
  font: inherit;
}

button {
  appearance: none;
  cursor: pointer;
}

a {
  color: var(--stamp);
  text-underline-offset: 3px;
}

h1,
h2,
h3,
p,
ul {
  margin: 0;
}

ul {
  padding: 0;
}

[hidden] {
  display: none !important;
}

.page-shell {
  width: 100%;
  max-width: 1160px;
  min-width: 0;
  padding-inline: 24px;
  margin-inline: auto;
}

.site-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 32px;
  padding-block: 26px 20px;
  border-bottom: 1px solid var(--rule-strong);
}

.brand-block {
  display: grid;
  min-width: 0;
  gap: 5px;
}

.brand-title {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 700;
  line-height: 1.2;
  text-wrap: balance;
}

.brand-kicker,
.requisite,
.eyebrow,
.table-label,
.result-label,
.faq-count,
.toc-label,
.analysis-label,
.case-label,
.practice-label,
.pitfalls-label,
.error-label {
  color: var(--ink-muted);
  font-family: var(--font-mono);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  letter-spacing: .09em;
  line-height: 1.4;
  text-transform: uppercase;
}

.mode-switch {
  display: inline-flex;
  flex: 0 0 auto;
  overflow: visible;
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
}

.mode-segment {
  min-width: 118px;
  min-height: 40px;
  padding: 8px 16px;
  border: 0;
  background: var(--surface);
  color: var(--ink);
  font-size: 14px;
  font-weight: 700;
}

.mode-segment:first-child {
  border-radius: 1px 0 0 1px;
}

.mode-segment:last-child {
  border-radius: 0 1px 1px 0;
}

.mode-segment + .mode-segment {
  border-left: 1px solid var(--rule-strong);
}

.mode-segment.is-active {
  background: var(--ink);
  color: var(--paper);
}

.main-content {
  min-width: 0;
  padding-block: 34px 64px;
}

.start-screen,
.question-screen,
.result-sheet,
.faq-mode,
.faq-section,
.faq-section-copy,
.analysis-panel,
.case-panel,
.weakness-section,
.error-review,
.error-review-list,
.error-detail-body,
.practice-box,
.pitfalls-box {
  display: grid;
}

.start-screen,
.question-screen,
.faq-mode {
  gap: 28px;
}

.screen-heading,
.faq-heading,
.result-heading,
.subsection-heading {
  font-family: var(--font-display);
  font-weight: 700;
  line-height: 1.22;
  text-wrap: balance;
}

.screen-heading,
.faq-heading,
.result-heading {
  font-size: 26px;
}

.subsection-heading {
  font-size: 21px;
}

.intro-copy,
.result-copy,
.analysis-copy {
  max-width: 68ch;
  font-size: 16px;
}

.result-copy {
  font-variant-numeric: tabular-nums;
}

.resume-panel {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 0;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
}

.resume-copy {
  font-family: var(--font-mono);
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}

.resume-actions,
.question-actions,
.result-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}

.question-actions {
  justify-content: flex-end;
}

.action-button,
.text-button {
  min-height: 42px;
  border-radius: 2px;
  font-size: 14px;
  font-weight: 700;
}

.action-button {
  padding: 10px 16px;
  border: 1px solid var(--rule-strong);
  background: var(--surface);
  color: var(--ink);
}

.action-button.is-primary {
  border-color: var(--ink);
  background: var(--ink);
  color: var(--paper);
}

.action-button.is-large {
  min-height: 52px;
  padding: 13px 20px;
  font-size: 16px;
}

.text-button {
  padding: 8px 4px;
  border: 0;
  background: var(--paper);
  color: var(--stamp);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.block-table-shell,
.result-table-shell,
.term-table-shell {
  max-width: 100%;
  min-width: 0;
  overflow-x: auto;
  padding: 3px;
}

.block-table {
  min-width: 800px;
  border-top: 1px solid var(--rule-strong);
}

.block-table-head,
.block-row {
  display: grid;
  grid-template-columns: 72px minmax(320px, 1fr) 104px 104px 112px;
  align-items: stretch;
}

.level-panel {
  display: grid;
  gap: 8px;
}

.level-group {
  display: flex;
  flex-wrap: wrap;
  gap: 0;
  width: fit-content;
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
}

.level-segment {
  padding: 7px 16px;
  border: 0;
  border-right: 1px solid var(--rule-strong);
  background: none;
  color: var(--ink-muted);
  font-family: var(--font-mono);
  font-size: 13px;
  letter-spacing: .04em;
  cursor: pointer;
}

.level-segment:last-child {
  border-right: 0;
}

.level-segment.is-active {
  background: var(--ink);
  color: var(--paper);
}

.level-chip {
  padding: 3px 9px;
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  color: var(--ink-muted);
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: .06em;
  white-space: nowrap;
}

.level-chip-senior {
  border-color: var(--stamp);
  background: var(--stamp-soft);
  color: var(--stamp);
}

.block-table-head {
  background: var(--surface-2);
  border-bottom: 1px solid var(--rule-strong);
}

.block-row {
  width: 100%;
  padding: 0;
  border: 0;
  border-bottom: 1px solid var(--rule);
  background: var(--paper);
  color: var(--ink);
  cursor: pointer;
  text-align: left;
}

.block-row:focus-within {
  outline: 2px solid var(--stamp);
  outline-offset: 2px;
}

.block-cell {
  display: flex;
  min-width: 0;
  align-items: center;
  padding: 13px 12px;
}

.block-title-cell {
  display: grid;
  align-content: center;
  gap: 3px;
}

.block-id,
.block-count,
.block-start {
  font-family: var(--font-mono);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}

.block-id {
  font-size: 14px;
  font-weight: 700;
}

.block-name {
  font-size: 16px;
  font-weight: 700;
}

.block-note {
  max-width: 68ch;
  color: var(--ink-muted);
  font-size: 13px;
  line-height: 1.4;
}

.block-start {
  padding: 8px 0;
  border: 0;
  background: none;
  color: var(--stamp);
  font-weight: 700;
}

.question-meta {
  display: grid;
  gap: 10px;
}

.progress-track {
  width: 100%;
  height: 2px;
  overflow: hidden;
  background: var(--surface-2);
}

.progress-fill {
  width: 0;
  height: 100%;
  background: var(--stamp);
}

.question-text {
  max-width: 68ch;
  font-family: var(--font-display);
  font-size: 21px;
  font-weight: 700;
  line-height: 1.4;
  text-wrap: balance;
}

.option-list {
  display: grid;
  max-width: 920px;
}

.option-button {
  display: grid;
  grid-template-columns: 26px minmax(0, 1fr) 28px;
  align-items: center;
  gap: 14px;
  width: 100%;
  min-height: 58px;
  padding: 14px 8px;
  border: 0;
  border-bottom: 1px solid var(--rule);
  background: var(--paper);
  color: var(--ink);
  font-size: 16px;
  line-height: 1.45;
  text-align: left;
}

.option-letter {
  display: inline-flex;
  width: 26px;
  height: 26px;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--rule-strong);
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 700;
}

.option-copy {
  max-width: 68ch;
}

.option-mark {
  justify-self: center;
  font-family: var(--font-mono);
  font-size: 18px;
  font-weight: 700;
}

.option-button.is-selected-correct {
  border: 1px solid var(--ok);
  background: var(--ok-soft);
}

.option-button.is-selected-correct .option-letter,
.option-button.is-correct-answer .option-letter,
.option-button.is-correct-answer .option-mark {
  border-color: var(--ok);
  color: var(--ok);
}

.option-button.is-correct-answer {
  border: 1px solid var(--ok);
  background: var(--paper);
}

.option-button.is-selected-correct.is-correct-answer {
  background: var(--ok-soft);
}

.option-button.is-selected-wrong {
  border: 1px solid var(--bad);
  background: var(--bad-soft);
}

.option-button.is-selected-wrong .option-letter,
.option-button.is-selected-wrong .option-mark {
  border-color: var(--bad);
  color: var(--bad);
}

.option-button.is-dimmed {
  color: var(--ink-muted);
}

.option-button:disabled {
  cursor: default;
}

.analysis-panel {
  max-width: 920px;
  gap: 16px;
  padding-top: 20px;
  border-top: 1px solid var(--rule-strong);
}

.case-panel,
.practice-box {
  gap: 8px;
  padding: 16px 18px;
  border-left: 2px solid var(--stamp);
  background: var(--stamp-soft);
}

.case-copy,
.practice-copy,
.pitfall-copy {
  max-width: 68ch;
  font-size: 15px;
  line-height: 1.55;
}

.faq-jump {
  justify-self: start;
  font-size: 14px;
  font-weight: 700;
}

.result-sheet {
  position: relative;
  gap: 32px;
  padding: 32px;
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  background: var(--surface);
}

.result-summary {
  display: grid;
  min-height: 112px;
  align-content: start;
  gap: 12px;
  padding-right: 210px;
}

.result-stamp {
  position: absolute;
  top: 28px;
  right: 34px;
  display: grid;
  width: 158px;
  min-height: 94px;
  place-content: center;
  gap: 3px;
  padding: 14px 18px;
  border: 2px solid var(--stamp);
  background: none;
  color: var(--stamp);
  opacity: .82;
  transform: rotate(-7deg);
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  letter-spacing: .12em;
  line-height: 1;
  text-align: center;
  text-transform: uppercase;
}

.result-stamp::before {
  position: absolute;
  inset: 4px;
  border: 1px solid var(--stamp);
  content: "";
}

.stamp-percent {
  font-size: 34px;
  font-weight: 700;
}

.stamp-fraction {
  font-size: 13px;
  font-weight: 700;
}

.result-section {
  display: grid;
  gap: 14px;
}

.result-table,
.term-table {
  width: 100%;
  border-collapse: collapse;
}

.result-table {
  min-width: 660px;
}

.result-table th,
.term-table th {
  padding: 10px 12px;
  border-bottom: 1px solid var(--rule-strong);
  color: var(--ink-muted);
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .09em;
  text-align: left;
  text-transform: uppercase;
}

.result-table td {
  padding: 13px 12px;
  border-bottom: 1px solid var(--rule);
  font-size: 14px;
  vertical-align: middle;
}

.result-block-id,
.result-fraction {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
}

.metric-bar-track {
  width: 100%;
  min-width: 150px;
  height: 4px;
  overflow: hidden;
  background: var(--surface-2);
}

.metric-bar-fill {
  width: 0;
  height: 100%;
  background: var(--stamp);
}

.weakness-section,
.error-review,
.error-review-list {
  gap: 14px;
}

.weakness-list {
  display: grid;
  border-top: 1px solid var(--rule);
}

.weakness-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 0;
  border-bottom: 1px solid var(--rule);
  font-size: 14px;
}

.weakness-empty {
  max-width: 68ch;
  color: var(--ink-muted);
  font-size: 14px;
}

.error-detail {
  border-top: 1px solid var(--rule);
}

.error-detail:last-child {
  border-bottom: 1px solid var(--rule);
}

.error-summary {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 24px;
  align-items: center;
  gap: 16px;
  padding: 14px 0;
  cursor: pointer;
  list-style: none;
}

.error-summary::-webkit-details-marker {
  display: none;
}

.error-summary::after {
  color: var(--stamp);
  content: "+";
  font-family: var(--font-mono);
  font-size: 18px;
  text-align: center;
}

.error-detail[open] .error-summary::after {
  content: "−";
}

.error-question-group {
  display: grid;
  gap: 5px;
}

.error-question {
  max-width: 68ch;
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  line-height: 1.4;
  text-wrap: balance;
}

.error-detail-body {
  gap: 14px;
  padding: 4px 0 20px;
}

.error-answer-row {
  display: grid;
  max-width: 68ch;
  gap: 4px;
}

.error-answer-copy,
.error-why {
  font-size: 14px;
}

.error-why {
  max-width: 68ch;
  font-size: 16px;
}

.faq-search-panel {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 16px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--rule-strong);
}

.faq-search {
  width: 100%;
  min-height: 44px;
  padding: 9px 12px;
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  background: var(--surface);
  color: var(--ink);
  font-size: 16px;
}

.faq-search::placeholder {
  color: var(--ink-muted);
  opacity: 1;
}

.faq-count {
  white-space: nowrap;
  text-transform: lowercase;
}

.faq-layout {
  display: grid;
  grid-template-columns: 240px minmax(0, 1fr);
  align-items: start;
  gap: 42px;
  min-width: 0;
}

.faq-toc {
  position: sticky;
  top: 24px;
  display: grid;
  min-width: 0;
  gap: 12px;
}

.toc-list {
  display: grid;
  gap: 2px;
}

.toc-link {
  display: block;
  padding: 8px 9px;
  border-left: 1px solid var(--rule);
  color: var(--ink-muted);
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.35;
  text-decoration: none;
}

.faq-articles {
  display: grid;
  min-width: 0;
  gap: 28px;
}

.faq-section {
  min-width: 0;
  gap: 24px;
}

.faq-section + .faq-section {
  padding-top: 28px;
  border-top: 1px solid var(--rule-strong);
}

.faq-section-copy {
  gap: 8px;
}

.faq-lead {
  max-width: 68ch;
  color: var(--ink-muted);
  font-size: 17px;
  line-height: 1.5;
}

.term-table {
  min-width: 820px;
}

.term-table th:nth-child(1) {
  width: 21%;
}

.term-table th:nth-child(2) {
  width: 39%;
}

.term-table th:nth-child(3) {
  width: 40%;
}

.term-table td {
  padding: 14px 12px;
  border-bottom: 1px solid var(--rule);
  vertical-align: top;
}

.term-name {
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.45;
}

.term-definition,
.term-context {
  font-size: 15px;
  line-height: 1.55;
}

.term-context {
  color: var(--ink-muted);
}

.pitfalls-box {
  gap: 12px;
}

.pitfall-list {
  display: grid;
  gap: 9px;
  list-style: none;
}

.pitfall-item {
  display: grid;
  grid-template-columns: 16px minmax(0, 1fr);
  gap: 8px;
}

.pitfall-mark {
  color: var(--bad);
  font-family: var(--font-mono);
  font-size: 15px;
  font-weight: 700;
}

.inline-token {
  overflow-wrap: anywhere;
  font-family: var(--font-mono);
  font-size: inherit;
  font-variant-numeric: tabular-nums;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  padding: 0;
  border: 0;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
}

button:focus-visible,
a:focus-visible,
input:focus-visible,
summary:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--stamp);
  outline-offset: 2px;
}

@media (hover: hover) {
  .block-row:hover,
  .option-button:not(:disabled):hover,
  .action-button:not(.is-primary):hover,
  .toc-link:hover {
    background: var(--surface-2);
  }
}

@media (prefers-reduced-motion: no-preference) {
  .result-stamp {
    animation: stamp-in 220ms cubic-bezier(.2, .8, .3, 1) both;
  }

  @keyframes stamp-in {
    from {
      opacity: 0;
      transform: scale(1.35) rotate(-7deg);
    }

    to {
      opacity: .82;
      transform: scale(1) rotate(-7deg);
    }
  }
}

@media (max-width: 899px) {
  .faq-layout {
    grid-template-columns: minmax(0, 1fr);
    gap: 28px;
  }

  .faq-toc {
    position: static;
    display: flex;
    align-items: center;
    gap: 8px;
    overflow-x: auto;
    padding: 3px;
  }

  .toc-label {
    flex: 0 0 auto;
  }

  .toc-list {
    display: flex;
    flex: 0 0 auto;
    gap: 2px;
    width: max-content;
    min-width: 0;
  }

  .toc-link {
    white-space: nowrap;
  }
}

@media (max-width: 719px) {
  .page-shell {
    padding-inline: 18px;
  }

  .site-header {
    align-items: stretch;
    flex-direction: column;
    gap: 18px;
  }

  .mode-switch {
    display: flex;
    width: 100%;
  }

  .mode-segment {
    flex: 1 1 50%;
    min-width: 0;
  }

  .resume-panel,
  .weakness-row {
    align-items: flex-start;
    flex-direction: column;
  }

  .faq-search-panel {
    grid-template-columns: minmax(0, 1fr);
    gap: 10px;
  }

  .result-sheet {
    padding: 148px 20px 24px;
  }

  .result-summary {
    min-height: 0;
    padding-right: 0;
  }

  .result-stamp {
    top: 26px;
    right: 26px;

const STORAGE_KEY = "ai_eng_training_v1";

const app = document.getElementById("app");

const inlineTokenPattern = /([A-Za-z][A-Za-z0-9_.]*\([^)]*\)|dataset=<[^>]+>@<[^>]+>|code=<[^>]+>|\[['"][A-Za-z_][A-Za-z0-9_]*['"]\]|--[A-Za-z0-9-]+|[A-Za-z][A-Za-z0-9]*(?:_[A-Za-z0-9]+)+|[A-Za-z0-9_./-]+\.(?:py|json|jsonl|ya?ml|md|txt|csv|pdf|docx?|jpg|jpeg))/g;
let memoryProgress = null;

function createElement(tagName, className, text) {
  const node = document.createElement(tagName);
  if (className) {
    node.className = className;
  }
  if (text !== undefined) {
    node.textContent = text;
  }
  return node;
}

function focusById(id) {
  window.requestAnimationFrame(function () {
    const target = document.getElementById(id);
    if (target) {
      target.setAttribute("tabindex", "-1");
      target.focus({ preventScroll: true });
    }
  });
}

function focusQuestionContext() {
  window.requestAnimationFrame(function () {
    const nextButton = document.getElementById("next-question");
    const questionHeading = document.getElementById("current-question");
    if (nextButton) {
      nextButton.focus();
    } else if (questionHeading) {
      questionHeading.setAttribute("tabindex", "-1");
      questionHeading.focus({ preventScroll: true });
    }
  });
}

function appendRichText(node, text) {
  inlineTokenPattern.lastIndex = 0;
  let cursor = 0;
  let match = inlineTokenPattern.exec(text);
  while (match) {
    if (match.index > cursor) {
      node.append(document.createTextNode(text.slice(cursor, match.index)));
    }
    const token = createElement("span", "inline-token", match[0]);
    node.append(token);
    cursor = match.index + match[0].length;
    match = inlineTokenPattern.exec(text);
  }
  if (cursor < text.length) {
    node.append(document.createTextNode(text.slice(cursor)));
  }
}

function safeReadProgress() {
  try {
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      return memoryProgress;
    }
    const parsed = JSON.parse(raw);
    memoryProgress = parsed;
    return parsed;
  } catch (error) {
    return memoryProgress;
  }
}

function safeWriteProgress(payload) {
  memoryProgress = payload;
  try {
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  } catch (error) {
  }
}

function safeClearProgress() {
  memoryProgress = null;
  try {
    window.localStorage.removeItem(STORAGE_KEY);
  } catch (error) {
  }
}

function getBlock(blockId) {
  return QUIZ_DATA.blocks.find(function (block) {
    return block.id === blockId;
  });
}

function blockLevel(blockId) {
  const block = getBlock(blockId);
  return block ? block.level : "";
}

function getAttemptItems(selection) {
  return QUIZ_DATA.questions.reduce(function (items, question, index) {
    let take = false;
    if (selection.type === "all") {
      take = true;
    } else if (selection.type === "level") {
      take = blockLevel(question.block) === selection.level;
    } else {
      take = question.block === selection.blockId;
    }
    if (take) {
      items.push({ question: question, globalIndex: index });
    }
    return items;
  }, []);
}

function normalizeSelection(selection) {
  if (!selection || typeof selection !== "object") {
    return null;
  }
  if (selection.type === "all") {
    return { type: "all", blockId: null };
  }
  if (selection.type === "level" && LEVELS.indexOf(selection.level) > 0) {
    return { type: "level", blockId: null, level: selection.level };
  }
  if (selection.type === "block" && getBlock(selection.blockId)) {
    return { type: "block", blockId: selection.blockId };
  }
  return null;
}

function normalizeProgress(value) {
  if (!value || typeof value !== "object") {
    return null;
  }
  const selection = normalizeSelection(value.selection);
  if (!selection || !Number.isInteger(value.currentIndex) || !Array.isArray(value.answers)) {
    return null;
  }
  const items = getAttemptItems(selection);
  if (!items.length || value.currentIndex < 0 || value.currentIndex >= items.length) {
    return null;
  }
  const answers = items.map(function (item, index) {
    const answer = value.answers[index];
    if (answer === null || answer === undefined) {
      return null;
    }
    if (typeof answer !== "object" || answer.questionIndex !== item.globalIndex || !Number.isInteger(answer.selected)) {
      return null;
    }
    if (answer.selected < 0 || answer.selected >= item.question.options.length) {
      return null;
    }
    return {
      questionIndex: item.globalIndex,
      selected: answer.selected,
      correct: answer.selected === item.question.correct
    };
  });
  return {
    currentIndex: value.currentIndex,
    answers: answers,
    selection: selection,
    timestamp: value.timestamp
  };
}

const LEVELS = ["все", "мидл", "сеньор", "база"];

const state = {
  uiMode: "exam",
  examView: "start",
  attempt: null,
  savedProgress: normalizeProgress(safeReadProgress()),
  reviewVisible: false,
  searchQuery: "",
  levelFilter: "все"
};

function makeProgressPayload(attempt) {
  return {
    currentIndex: attempt.currentIndex,
    answers: attempt.answers,
    selection: attempt.selection,
    timestamp: Date.now()
  };
}

function persistAttempt() {
  if (!state.attempt) {
    return;
  }
  const payload = makeProgressPayload(state.attempt);
  state.savedProgress = payload;
  safeWriteProgress(payload);
}

function startAttempt(selection, progress) {
  const normalizedSelection = normalizeSelection(selection);
  if (!normalizedSelection) {
    return;
  }
  const items = getAttemptItems(normalizedSelection);
  if (!items.length) {
    return;
  }
  const answers = items.map(function () {
    return null;
  });
  let currentIndex = 0;
  if (progress) {
    currentIndex = progress.currentIndex;
    progress.answers.forEach(function (answer, index) {
      if (index < answers.length && answer) {
        answers[index] = answer;
      }
    });
  }
  state.attempt = {
    selection: normalizedSelection,
    items: items,
    currentIndex: currentIndex,
    answers: answers
  };
  state.examView = "question";
  state.reviewVisible = false;
  persistAttempt();
  renderExam();
  window.scrollTo(0, 0);
  focusQuestionContext();
}

function resumeAttempt() {
  const progress = normalizeProgress(state.savedProgress);
  if (!progress) {
    state.savedProgress = null;
    renderStart();
    return;
  }
  startAttempt(progress.selection, progress);
}

function answerQuestion(selectedIndex) {
  const attempt = state.attempt;
  if (!attempt || state.examView !== "question") {
    return;
  }
  const answerIndex = attempt.currentIndex;
  if (attempt.answers[answerIndex]) {
    return;
  }
  const item = attempt.items[answerIndex];
  attempt.answers[answerIndex] = {
    questionIndex: item.globalIndex,
    selected: selectedIndex,
    correct: selectedIndex === item.question.correct
  };
  persistAttempt();
  announcer.textContent = selectedIndex === item.question.correct ? "Верно." : "Неверно. Верный ответ: " + OPTION_LETTERS[item.question.correct] + ".";
  renderQuestion();
  const nextButton = document.getElementById("next-question");
  if (nextButton) {
    nextButton.focus();
  }
}

function advanceQuestion() {
  const attempt = state.attempt;
  if (!attempt || state.examView !== "question" || !attempt.answers[attempt.currentIndex]) {
    return;
  }
  if (attempt.currentIndex >= attempt.items.length - 1) {
    state.examView = "result";
    state.reviewVisible = false;
    state.savedProgress = null;
    safeClearProgress();
    renderResult();
    window.scrollTo(0, 0);
    focusById("result-heading");
    return;
  }
  attempt.currentIndex += 1;
  persistAttempt();
  renderQuestion();
  window.scrollTo(0, 0);
  focusQuestionContext();
}

function renderQuestion() {
  const attempt = state.attempt;
  if (!attempt || !attempt.items[attempt.currentIndex]) {
    state.examView = "start";
    renderStart();
    return;
  }
  const item = attempt.items[attempt.currentIndex];
  const question = item.question;
  const block = getBlock(question.block);
  const answer = attempt.answers[attempt.currentIndex];
  const section = createElement("section", "question-screen");
  section.setAttribute("aria-labelledby", "current-question");

  const meta = createElement("div", "question-meta");
  const currentNumber = String(attempt.currentIndex + 1).padStart(2, "0");
  const totalNumber = String(attempt.items.length).padStart(2, "0");
  const requisite = createElement("div", "requisite", "БЛОК " + block.id + " · " + block.title + " · ВОПРОС " + currentNumber + " / " + totalNumber);
  const progressTrack = createElement("div", "progress-track");
  progressTrack.setAttribute("role", "progressbar");
  progressTrack.setAttribute("aria-label", "Прогресс экзамена");
  progressTrack.setAttribute("aria-valuemin", "0");
  progressTrack.setAttribute("aria-valuemax", String(attempt.items.length));
  progressTrack.setAttribute("aria-valuenow", String(attempt.currentIndex + 1));
  const progressFill = createElement("div", "progress-fill");
  progressFill.style.width = ((attempt.currentIndex + 1) / attempt.items.length * 100) + "%";
  progressTrack.append(progressFill);
  meta.append(requisite, progressTrack);

  const questionText = createElement("h1", "question-text");
  questionText.id = "current-question";
  appendRichText(questionText, question.q);
  const options = createElement("div", "option-list");
  options.setAttribute("role", "group");
  options.setAttribute("aria-label", "Варианты ответа");

  question.options.forEach(function (option, index) {
    const button = createElement("button", "option-button");
    button.type = "button";
    button.setAttribute("aria-label", OPTION_LETTERS[index] + ". " + option);
    button.setAttribute("aria-pressed", answer && answer.selected === index ? "true" : "false");
    const letter = createElement("span", "option-letter", OPTION_LETTERS[index]);
    letter.setAttribute("aria-hidden", "true");
    const copy = createElement("span", "option-copy");
    appendRichText(copy, option);
    const mark = createElement("span", "option-mark");
    mark.setAttribute("aria-hidden", "true");
    if (answer) {
      button.disabled = true;
      if (index === question.correct) {
        button.classList.add("is-correct-answer");
        mark.textContent = "✓";
      }
      if (answer.selected === index && answer.correct) {
        button.classList.add("is-selected-correct");
      } else if (answer.selected === index && !answer.correct) {
        button.classList.add("is-selected-wrong");
        mark.textContent = "✕";
      } else if (index !== question.correct) {
        button.classList.add("is-dimmed");
      }
    } else {
      button.addEventListener("click", function () {
        answerQuestion(index);
      });
    }
    button.append(letter, copy, mark);
    options.append(button);
  });

  section.append(meta, questionText, options);

  if (answer) {
    const analysis = createElement("div", "analysis-panel");
    const label = createElement("div", "analysis-label", "РАЗБОР");
    const why = createElement("p", "analysis-copy");
    appendRichText(why, question.why);

}

function getResultData() {
  const attempt = state.attempt;
  const blockOrder = [];
  const byBlock = new Map();
  attempt.items.forEach(function (item, index) {
    const blockId = item.question.block;
    if (!byBlock.has(blockId)) {
      const block = getBlock(blockId);
      byBlock.set(blockId, { id: blockId, title: block.title, correct: 0, total: 0 });
      blockOrder.push(blockId);
    }
    const stats = byBlock.get(blockId);
    stats.total += 1;
    if (attempt.answers[index] && attempt.answers[index].correct) {
      stats.correct += 1;
    }
  });
  const blocks = blockOrder.map(function (blockId) {
    return byBlock.get(blockId);
  });
  const correct = attempt.answers.filter(function (answer) {
    return answer && answer.correct;
  }).length;
  const wrong = attempt.items.reduce(function (items, item, index) {
    const answer = attempt.answers[index];
    if (answer && !answer.correct) {
      items.push({ item: item, answer: answer, localIndex: index });
    }
    return items;
  }, []);
  return { correct: correct, total: attempt.items.length, blocks: blocks, wrong: wrong };
}

function applyFaqFilter() {
  const input = document.getElementById("faq-search");
  const counter = document.getElementById("faq-count");
  if (!input || !counter) {
    return;
  }
  const query = input.value.trim().toLocaleLowerCase("ru-RU");
  let termCount = 0;
  const sections = Array.from(document.querySelectorAll(".faq-section"));
  sections.forEach(function (section) {
    const termRows = Array.from(section.querySelectorAll(".term-row"));
    const pitfallItems = Array.from(section.querySelectorAll(".pitfall-item"));
    let visibleTerms = 0;
    let visiblePitfalls = 0;
    termRows.forEach(function (row) {
      const visible = !query || row.searchText.includes(query);
      row.hidden = !visible;
      if (visible) {
        visibleTerms += 1;
        termCount += 1;
      }
    });
    pitfallItems.forEach(function (item) {
      const visible = !query || item.searchText.includes(query);
      item.hidden = !visible;
      if (visible) {
        visiblePitfalls += 1;
      }
    });
    section.termTableShell.hidden = Boolean(query) && visibleTerms === 0;
    section.pitfallsBox.hidden = Boolean(query) && visiblePitfalls === 0;
    const sectionVisible = !query || visibleTerms > 0 || visiblePitfalls > 0;
    section.hidden = !sectionVisible;
    const tocLink = document.querySelector("[data-faq-link=\"" + section.id + "\"]");
    if (tocLink) {
      tocLink.hidden = !sectionVisible;
    }
  });
  counter.textContent = "найдено " + termCount + " терминов";
}

function renderFaq() {
  const root = createElement("section", "faq-mode");
  root.setAttribute("aria-label", "Справочник AI-инженера");
  const searchPanel = createElement("div", "faq-search-panel");
  const label = createElement("label", "visually-hidden", "Поиск по термину");
  label.htmlFor = "faq-search";
  const input = document.createElement("input");
  input.className = "faq-search";
  input.id = "faq-search";
  input.type = "search";
  input.placeholder = "Поиск по термину";
  input.value = state.searchQuery;
  const counter = createElement("div", "faq-count", "найдено 174 терминов");
  counter.id = "faq-count";
  counter.setAttribute("aria-live", "polite");
  searchPanel.append(label, input, counter);

  const layout = createElement("div", "faq-layout");
  const toc = createElement("aside", "faq-toc");
  const tocLabel = createElement("div", "toc-label", "ОГЛАВЛЕНИЕ");
  const nav = createElement("nav", "toc-list");
  nav.setAttribute("aria-label", "Разделы справочника");
  FAQ_DATA.sections.forEach(function (sectionData) {
    const link = createElement("a", "toc-link", sectionData.id + " · " + sectionData.title);
    link.href = "#faq-" + sectionData.id;
    link.setAttribute("data-faq-link", "faq-" + sectionData.id);
    nav.append(link);
  });
  toc.append(tocLabel, nav);

  const articles = createElement("div", "faq-articles");
  FAQ_DATA.sections.forEach(function (sectionData) {
    articles.append(createFaqSection(sectionData));
  });
  layout.append(toc, articles);
  root.append(searchPanel, layout);
  app.replaceChildren(root);
  input.addEventListener("input", function () {
    state.searchQuery = input.value;
    applyFaqFilter();
  });
  applyFaqFilter();
}

function updateModeControls() {
  const examActive = state.uiMode === "exam";
  modeExam.classList.toggle("is-active", examActive);
  modeFaq.classList.toggle("is-active", !examActive);
  modeExam.setAttribute("aria-pressed", examActive ? "true" : "false");
  modeFaq.setAttribute("aria-pressed", examActive ? "false" : "true");
}

function setMode(mode) {
  if (mode !== "exam" && mode !== "faq") {
    return;
  }
  state.uiMode = mode;
  updateModeControls();
  if (mode === "faq") {
    renderFaq();
  } else {
    renderExam();
  }
}

function openFaqSection(blockId) {
  state.searchQuery = "";
  setMode("faq");
  window.requestAnimationFrame(function () {
    const target = document.getElementById("faq-" + blockId);
    if (target) {
      target.setAttribute("tabindex", "-1");
      target.focus({ preventScroll: true });
      target.scrollIntoView({ block: "start" });
    }
  });
}

modeExam.addEventListener("click", function () {
  setMode("exam");
});

modeFaq.addEventListener("click", function () {
  setMode("faq");
});

document.addEventListener("keydown", function (event) {
  if (state.uiMode !== "exam" || state.examView !== "question" || !state.attempt) {
    return;
  }
  if (event.repeat) {
    event.preventDefault();
    return;
  }
  const target = event.target;
  if (target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement || target.isContentEditable) {
    return;
  }
  const answer = state.attempt.answers[state.attempt.currentIndex];
  const key = event.key.toLocaleLowerCase("ru-RU");
  const digitIndex = ["1", "2", "3", "4"].indexOf(key);
  const letterIndex = ["а", "б", "в", "г"].indexOf(key);
  const optionIndex = digitIndex >= 0 ? digitIndex : letterIndex;
  if (!answer && optionIndex >= 0) {
    event.preventDefault();
    answerQuestion(optionIndex);
    return;
  }
  const nativeActivation = Boolean(target) && (
    (target.tagName === "BUTTON" && (event.key === "Enter" || event.key === " ")) ||
    (target.tagName === "A" && event.key === "Enter") ||
    (target.tagName === "SUMMARY" && (event.key === "Enter" || event.key === " "))
  );
  if (answer && (event.key === "Enter" || event.key === "ArrowRight" || event.key === " ") && !nativeActivation) {
    event.preventDefault();
    advanceQuestion();
  }
});

updateModeControls();
renderExam();
</script>
